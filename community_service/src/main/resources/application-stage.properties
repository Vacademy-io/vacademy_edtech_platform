spring.application.name=community_service
## Database Connection
spring.datasource.url=${ASSESSMENT_SERVICE_DB_URL}
spring.datasource.read.url=${COMMUNITY_SERVICE_READ_DB_URL:${ASSESSMENT_SERVICE_DB_URL}}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=${DB_USERNAME}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
## Security
application.my.username=${APP_USERNAME}
application.my.password=${APP_PASSWORD}
spring.mvc.dispatch-options-request=true
auth.server.baseurl=${AUTH_SERVER_BASE_URL}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
logging.level.org.springframework.security=DEBUG
cloud.front.url=${CLOUD_FRONT_URL}
## Logging
org.springframework.boot.actuate.health.Logger=OFF
logging.level.org.springframework.boot.actuate.health=OFF

notification.server.baseurl=${NOTIFICATION_SERVER_BASE_URL}

# Service URLs for Diagnostics
ADMIN_CORE_SERVICE_BASE_URL=${ADMIN_CORE_SERVICE_BASE_URL:http://admin-core-service:8072}
MEDIA_SERVER_BASE_URL=${MEDIA_SERVER_BASE_URL:http://media-service:8075}
ASSESSMENT_SERVER_BASE_URL=${ASSESSMENT_SERVER_BASE_URL:http://assessment-service:8074}
AI_SERVICE_BASE_URL=${AI_SERVICE_BASE_URL:http://ai-service:8077}

# Redis Configuration for health checks
REDIS_HOST=${REDIS_HOST:redis}
REDIS_PORT=${REDIS_PORT:6379}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# BBB Health Check
bbb.healthcheck.notify-phones=${BBB_HEALTHCHECK_NOTIFY_PHONES:}
bbb.healthcheck.url=https://meet.vacademy.io/bigbluebutton/api
bbb.healthcheck.hostname=meet.vacademy.io
bbb.github.repo=${BBB_GITHUB_REPO:Vacademy-io/vacademy_edtech_platform}

# ============ Per-client deployment uptime monitor ============
# community_service runs on the shared Hetzner cluster; each client runs on its own
# separate infrastructure. This polls each client's PUBLIC API host from outside, so
# it exercises the same path a real user does (DNS -> LB -> ingress -> pod).
#
# Format: name|baseUrl|service,service,...   (multiple deployments separated by ';')
# Blank disables the monitor entirely, so dev/stage stay silent until opted in.
#
# Vet Education: only these four services are deployed on that cluster. Do NOT add
# community-service or assessment-service — they are not deployed there and would
# report a permanent false DOWN, which trains people to ignore the alert channel.
platform.healthcheck.targets=${VETED_PLATFORM_TARGETS:veted|https://api.letstalkvet.com|admin-core-service,auth-service,notification-service,media-service}

# Who gets paged. Set via the VETED_PLATFORM_NOTIFY_PHONES GitHub secret,
# same as BBB_HEALTHCHECK_NOTIFY_PHONES above — the default is deliberately EMPTY
# so personal phone numbers never enter git history, where they would be permanent
# and world-readable to anyone with repo access.
#
# Comma-separated, full international format, no '+' and no spaces
# (Meta rejects both). e.g. 91XXXXXXXXXX,91XXXXXXXXXX,61XXXXXXXXX
#
# If this is blank the monitor still probes and still logs, but pages nobody —
# sendWhatsApp() logs a WARN when it skips, so grep for "WhatsApp skipped" if
# alerts ever go quiet.
platform.healthcheck.notify-phones=${VETED_PLATFORM_NOTIFY_PHONES:}

# Every 5 minutes.
platform.healthcheck.cron=${VETED_PLATFORM_CRON:0 */5 * * * *}
# Consecutive failed probes before declaring DOWN. Crossing the public internet
# means transient DNS/TLS/LB blips are normal — paging on the first one trains
# people to ignore the channel. 2 means a real outage is caught within ~10 min.
platform.healthcheck.failure-threshold=${VETED_PLATFORM_FAILURE_THRESHOLD:2}
# Re-page interval while an outage is still ongoing.
platform.healthcheck.realert-minutes=${VETED_PLATFORM_REALERT_MINUTES:30}
# Debug only: page on every run regardless of state transitions.
platform.healthcheck.always-notify=${VETED_PLATFORM_ALWAYS_NOTIFY:false}

# Shared service-to-service secret for ai_service /ai-service/internal/** (live-session
# summaries via /internal/llm/v1/complete). Blank = summaries fall back to the direct
# OpenRouter call with a warning.
internal.service.token=${INTERNAL_SERVICE_TOKEN:}
