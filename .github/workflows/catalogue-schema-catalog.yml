name: AI schema catalog freshness

# The ai_service schema catalog (MCP website(schema / patterns), the page
# composer prompts) and the admin copy of the design patterns are generated by
# scripts/export-catalogue-schema-catalog.mjs from the editor templates, the
# learner design-pattern registry and the Brahm Varchas fixture. This fails
# when a change to an input was committed without regenerating the outputs.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/export-catalogue-schema-catalog.mjs"
      - "ai_service/app/data/catalogue_schema_catalog.json"
      - "frontend-admin-dashboard/src/routes/manage-pages/-utils/**"
      - "frontend-admin-dashboard/src/routes/manage-pages/-components/__fixtures__/brahm-varchas-site.json"
      - "frontend-learner-dashboard-app/src/routes/$tagName/-ai/**"
      - "frontend-learner-dashboard-app/src/routes/$tagName/-types/**"
      - "frontend-learner-dashboard-app/src/routes/$tagName/-utils/catalogue-palette.ts"
      - ".github/workflows/catalogue-schema-catalog.yml"
  push:
    paths:
      - "scripts/export-catalogue-schema-catalog.mjs"
      - "ai_service/app/data/catalogue_schema_catalog.json"
      - "frontend-admin-dashboard/src/routes/manage-pages/-utils/**"
      - "frontend-admin-dashboard/src/routes/manage-pages/-components/__fixtures__/brahm-varchas-site.json"
      - "frontend-learner-dashboard-app/src/routes/$tagName/-ai/**"
      - "frontend-learner-dashboard-app/src/routes/$tagName/-types/**"
      - "frontend-learner-dashboard-app/src/routes/$tagName/-utils/catalogue-palette.ts"
      - ".github/workflows/catalogue-schema-catalog.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Pinned like frontend-admin-dashboard/Dockerfile: newer pnpm ignores the
      # "pnpm" overrides in package.json and refuses the frozen lockfile.
      - name: Install pnpm
        run: npm install -g pnpm@9

      # The exporter bundles the admin templates with the admin app's own esbuild (via vite).
      # Not --frozen-lockfile: the admin lockfile's patchedDependencies/overrides are out of
      # step with package.json (a pre-existing repo issue), and this check only needs the
      # bundler, not an exact install. Scripts are skipped: nothing here needs them.
      - name: Install admin deps
        working-directory: ./frontend-admin-dashboard
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Check the generated catalog is fresh
        run: node scripts/export-catalogue-schema-catalog.mjs --check
