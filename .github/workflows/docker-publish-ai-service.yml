name: Deploy AI Service to LKE

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: main
      image_tag:
        description: "Image tag to push (use a UNIQUE tag for branch builds, e.g. the branch name, so you don't overwrite main's :latest)"
        required: true
        default: latest
  push:
    branches:
      - main
    paths:
      - "ai_service/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        working-directory: ./ai_service
        env:
          ECR_REGISTRY: public.ecr.aws/e0x1f4p4
          IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}
          REPOSITORY: ai-service/ai-service-repo
          GIT_SHA: ${{ github.sha }}
        run: |
          # Tag with BOTH the moving tag (:latest) and an IMMUTABLE :<sha> tag.
          # The deploy step below rolls out the immutable tag, which avoids the
          # ECR-public ':latest' CDN race where a same-tag rollout silently pulls a
          # stale cached image (the recurring "deployed but old code" problem).
          docker build \
            -t $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$REPOSITORY:$GIT_SHA .
          docker push $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$REPOSITORY:$GIT_SHA
          echo "Pushed $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG and :$GIT_SHA"

      - name: Connect to Hetzner k3s kubernetes cluster
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: connect-to-k8s-cluster
        uses: Azure/k8s-set-context@v4.0.0
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.VACADEMY_PROD_KUBECONFIG }}

      - name: Restart deployment if it exists
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          DEPLOYMENT_NAME: ai-service
          NAMESPACE: default
          ECR_REGISTRY: public.ecr.aws/e0x1f4p4
          REPOSITORY: ai-service/ai-service-repo
          GIT_SHA: ${{ github.sha }}
          # YouTube captions proxy + Supadata (services/youtube_captions). Passed via
          # env, not inlined, so proxy URLs / passwords with shell metacharacters
          # survive intact. All optional; applied below only when non-empty.
          YT_CAPTIONS_PROXY: ${{ secrets.YT_CAPTIONS_PROXY }}
          WEBSHARE_PROXY_USERNAME: ${{ secrets.WEBSHARE_PROXY_USERNAME }}
          WEBSHARE_PROXY_PASSWORD: ${{ secrets.WEBSHARE_PROXY_PASSWORD }}
          YT_CAPTIONS_PROXY_HTTP_URL: ${{ secrets.YT_CAPTIONS_PROXY_HTTP_URL }}
          YT_CAPTIONS_PROXY_HTTPS_URL: ${{ secrets.YT_CAPTIONS_PROXY_HTTPS_URL }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: |
          if kubectl get deployment "$DEPLOYMENT_NAME" --namespace "$NAMESPACE" >/dev/null 2>&1; then
            kubectl set env deployment/"$DEPLOYMENT_NAME" \
              --namespace "$NAMESPACE" \
              APP_ENV=stage \
              LLM_BASE_URL=https://openrouter.ai/api/v1/chat/completions \
              OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }} \
              ISOQUANT_API_KEY=${{ secrets.ISOQUANT_API_KEY }} \
              LLM_TIMEOUT_SECONDS=60.0 \
              S3_AWS_ACCESS_KEY=${{ secrets.S3_AWS_ACCESS_KEY }} \
              S3_AWS_ACCESS_SECRET=${{ secrets.S3_AWS_ACCESS_SECRET }} \
              S3_AWS_REGION=${{ secrets.S3_AWS_REGION }} \
              AWS_BUCKET_NAME=${{ secrets.AWS_S3_PUBLIC_BUCKET }} \
              GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
              YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }} \
              RUNPOD_API_KEY=${{ secrets.RUNPOD_API_KEY }} \
              RUNPOD_ENDPOINT_ID=${{ secrets.RUNPOD_ENDPOINT_ID }} \
              FAL_API_KEY=${{ secrets.FAL_API_KEY }} \
              LLM_DEFAULT_MODEL=z-ai/glm-5.3-flash \
              LLM_FALLBACK_MODEL=google/gemini-2.5-flash \
              DB_USERNAME=${{ secrets.DB_USERNAME }} \
              DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              ADMIN_CORE_SERVICE_DB_URL=jdbc:postgresql://pgbouncer:6432/admin_core_service \
              DB_HOST=pgbouncer \
              DB_PORT=6432 \
              GOOGLE_APPLICATION_CREDENTIALS_JSON='${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' \
              MATHPIX_APP_ID=${{ secrets.MATHPIX_APP_ID }} \
              MATHPIX_APP_KEY=${{ secrets.MATHPIX_APP_KEY }} \
              SARVAM_API_KEY=${{ secrets.SARVAM_API_KEY }} \
              RENDER_SERVER_URL=${{ secrets.RENDER_SERVER_URL }} \
              RENDER_SERVER_KEY=${{ secrets.RENDER_SERVER_KEY }} \
              AI_SERVICE_PUBLIC_URL=https://backend-stage.vacademy.io \
              PEXELS_API_KEYS=${{ secrets.PEXELS_API_KEYS }} \
              SERPER_API_KEYS=${{ secrets.SERPER_API_KEYS }} \
              GOOGLE_CLOUD_PROJECT=${{ secrets.GOOGLE_CLOUD_PROJECT }} \
              INTERNAL_SERVICE_TOKEN=${{ secrets.INTERNAL_SERVICE_TOKEN }}

            # Smallest.ai (Live AI Tutor voice + cloning). Set only when the GitHub
            # secret is present: the cluster's shared `vacademy-secrets` (envFrom)
            # also carries it, and an empty explicit env would override that with "".
            if [ -n "${{ secrets.SMALLEST_API_KEY }}" ]; then
              kubectl set env deployment/"$DEPLOYMENT_NAME" --namespace "$NAMESPACE" \
                SMALLEST_API_KEY=${{ secrets.SMALLEST_API_KEY }}
            fi

            # Spatius (premium teacher avatar). Same rule: only when the secret is
            # present; the feature stays dark without SPATIUS_API_KEY + SPATIUS_APP_ID.
            if [ -n "${{ secrets.SPATIUS_API_KEY }}" ] && [ -n "${{ secrets.SPATIUS_APP_ID }}" ]; then
              kubectl set env deployment/"$DEPLOYMENT_NAME" --namespace "$NAMESPACE" \
                SPATIUS_API_KEY=${{ secrets.SPATIUS_API_KEY }} SPATIUS_APP_ID=${{ secrets.SPATIUS_APP_ID }}
            fi

            # YouTube captions proxy + Supadata. Same rule: each one only when its GitHub
            # secret is non-empty, so an unset secret never blanks the value already in
            # `vacademy-secrets` (envFrom). Values are never echoed.
            yt_env=()
            for name in YT_CAPTIONS_PROXY WEBSHARE_PROXY_USERNAME WEBSHARE_PROXY_PASSWORD \
                        YT_CAPTIONS_PROXY_HTTP_URL YT_CAPTIONS_PROXY_HTTPS_URL SUPADATA_API_KEY; do
              if [ -n "${!name}" ]; then
                yt_env+=("$name=${!name}")
              fi
            done
            if [ "${#yt_env[@]}" -gt 0 ]; then
              echo "Applying ${#yt_env[@]} YouTube-caption env var(s) from GitHub secrets"
              kubectl set env deployment/"$DEPLOYMENT_NAME" --namespace "$NAMESPACE" "${yt_env[@]}" >/dev/null
            fi

            # Encryption key for the Claude key pool (llm_provider_keys). It lives in its
            # own k8s secret mounted only into ai-service, never in the shared
            # `vacademy-secrets`; without it the pool stays empty and calls use OpenRouter.
            if kubectl get secret ai-llm-key-encryption --namespace "$NAMESPACE" >/dev/null 2>&1; then
              kubectl set env deployment/"$DEPLOYMENT_NAME" --namespace "$NAMESPACE" \
                --from=secret/ai-llm-key-encryption --keys=LLM_KEY_ENCRYPTION_KEY
            fi

            # Apply resource limits from deployment YAML (helm upgrade not used in CI,
            # so patch directly to keep requests/limits in sync with the checked-in values).
            kubectl patch deployment "$DEPLOYMENT_NAME" --namespace "$NAMESPACE" --type=strategic \
              --patch '{
                "spec": {
                  "template": {
                    "spec": {
                      "containers": [{
                        "name": "ai-service",
                        "resources": {
                          "requests": { "cpu": "500m", "memory": "1Gi" },
                          "limits":   { "cpu": "1500m", "memory": "3Gi" }
                        }
                      }]
                    }
                  }
                }
              }'

            # Roll out the EXACT freshly-built image by its immutable :<sha> tag.
            # Because the tag is brand new it can't be served stale from the ECR
            # CDN cache, so the cluster deterministically pulls the new code (a
            # missing-tag pull self-heals via kubelet retries — far better than the
            # old `rollout restart` on :latest, which could silently pull stale).
            kubectl set image deployment/"$DEPLOYMENT_NAME" --namespace "$NAMESPACE" \
              ai-service=$ECR_REGISTRY/$REPOSITORY:$GIT_SHA
            kubectl rollout status deployment "$DEPLOYMENT_NAME" --namespace "$NAMESPACE" --timeout=300s || true
          else
            echo "Deployment $DEPLOYMENT_NAME not found in namespace $NAMESPACE. Skipping restart."
          fi
