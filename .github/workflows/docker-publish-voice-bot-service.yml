name: Deploy Voice Bot Service

# Vacademy AI Agent voice bot (voice_bot_service/) — mirrors the ai_service flow:
# build → push :latest + immutable :<sha> to ECR public → set env → roll out the
# :<sha> tag (avoids the ECR ':latest' CDN staleness race).
#
# ONE-TIME setup before the first run:
#   1. Create the ECR public repo: voice-bot-service/voice-bot-service-repo
#      (aws ecr-public create-repository --repository-name voice-bot-service/voice-bot-service-repo --region us-east-1)
#   2. Create the k8s Deployment once via helm (vacademy_devops/vacademy-services,
#      services.voice_bot_service.enabled=true) — this workflow only updates it.
#   3. GitHub secrets: VOICE_BOT_CLIENT_SECRET (must match the voice_bot_service
#      row seeded into admin_core's client_secret_key table) — SARVAM_API_KEY and
#      the AWS/kubeconfig secrets already exist. TTS engine keys, each optional
#      and each gating one engine: RUMIK_API_KEY (Rumik Silk Mulberry),
#      SMALLEST_API_KEY (Smallest.ai Lightning). Google Cloud TTS (Chirp3-HD)
#      needs NO key — it authenticates with the same Vertex service account as
#      the LLM. An absent key is safe: build_tts falls back to Sarvam rather
#      than serving a mute call.
#      NOTE: `gh secret set` is rejected on this org's repos (HTTP 400), so
#      these values go in through the GitHub UI:
#      Settings > Secrets and variables > Actions.
#   4. On admin_core: set VOICE_BOT_BASE_URL=https://backend-stage.vacademy.io/voice-bot-service

# Two pushes in quick succession used to race: on 2026-08-03 the older run died on
# a docker name conflict while the NEWER run reported SUCCESS after recreating the
# container with the OLDER run's image — a green tick on a deploy that shipped the
# wrong commit, which is the worst possible failure mode for a deploy signal.
# Serialise instead, and let the newer commit win: cancel-in-progress is safe here
# because every run is a full build-and-roll of a single mutable target, so an
# abandoned earlier run has nothing we need.
concurrency:
  group: deploy-voice-bot-service
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: main
      image_tag:
        description: "Image tag to push (use a UNIQUE tag for branch builds so you don't overwrite main's :latest)"
        required: true
        default: latest
  push:
    branches:
      - main
    paths:
      - "voice_bot_service/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # VERTEX_CREDENTIALS_JSON lives in the `voice-bot` ENVIRONMENT: the repo is
    # at GitHub's 100-secret limit (2026-09-29). Same service account the box
    # mounts at /etc/vertex-sa.json (voice-bot-vertex@vacademy-app). Without it
    # the conversation simulator fell back to a key with no Vertex access, got
    # 403 on every persona and printed "ok … turns 0" on every deploy.
    environment: voice-bot
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      # HARNESS GATE: the call-behavior + timeline suites encode every production
      # incident (docs/crm/VOICE_BOT_DEEP_REVIEW_2026-07-27.md). A red suite
      # blocks the build — no voice-bot image ships untested again.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run call-behavior test harness
        run: |
          cd voice_bot_service
          pip install -q -r requirements.txt pytest pytest-asyncio
          python -m pytest tests/ -q

      # CONVERSATION GATE (2026-09-12): twelve scripted callers — every one a real
      # caller we failed the week before — talk to the real prompt on the real
      # production LLM, with TTS/STT replaced by text. Costs LLM tokens only
      # (~Rs 6 a run). A hard rule failure (re-greet, not ending when asked,
      # spoken markup, invented price, wrong weekday…) blocks the deploy.
      # Skipped, not failed, when the Vertex secret is absent (forks).
      - name: Run conversation simulator
        env:
          # The repo has no VERTEX_CREDENTIALS_JSON secret (the deploy step's
          # copy is silently empty too); GOOGLE_APPLICATION_CREDENTIALS_JSON is
          # the service-account JSON the other workflows use.
          VERTEX_CREDENTIALS_JSON: ${{ secrets.VERTEX_CREDENTIALS_JSON || secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          VERTEX_PROJECT_ID: vacademy-app
          VERTEX_LOCATION: asia-south1
          LLM_PROVIDER: vertex
          SIM_OUT: sim_report.json
        run: |
          # Presence-checked in the shell: neither `secrets` nor a job-env flag is
          # usable in a step `if` (two skipped runs on 2026-09-12 proved it).
          if [ -z "${VERTEX_CREDENTIALS_JSON:-}" ]; then
            echo "VERTEX_CREDENTIALS_JSON not available — simulator skipped"; exit 0
          fi
          cd voice_bot_service
          # --ci fails only on the callers' hard rules; a credential/network
          # error is reported and skipped so a missing permission cannot block
          # every deploy (it is printed in the log and the report artifact).
          # REPORT-ONLY since 2026-09-29. With a working Vertex key the gate
          # finally ran for real: ~2 of 16 persona runs hit a hard rule on BOTH
          # main and the fix branch (restated answers, a bare "Right.") — Gemini
          # variance, not a regression. Blocking on it would fail most deploys at
          # random. It becomes a gate again once it runs the real Hindi agent with
          # repeated reps and a pass-rate threshold.
          python -m sim.run --model prod --soft-errors | tee sim_run.log
          if grep -q "^FAIL" sim_run.log; then
            echo "::warning title=Conversation simulator::$(grep -c '^FAIL' sim_run.log) persona run(s) hit a hard rule — see the log / sim_report.json"
          fi

      # TIMING GATE (2026-09-12): the real pipeline — gates, aggregator, VAD,
      # Smart Turn, watchdog — on a simulated line with real-speech clips and
      # stub STT/LLM/TTS. No credentials, no vendor cost. Barge-in, ducking,
      # held tails, farewell close, nudges: the class of bug the text
      # simulator cannot see. A failure blocks the deploy.
      - name: Run timing simulator
        env:
          HF_HOME: ${{ runner.temp }}/hf
        run: |
          cd voice_bot_service
          python -m sim.timing --ci --out sim_timing.json

      - name: Upload simulator report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sim-report
          path: |
            voice_bot_service/sim_report.json
            voice_bot_service/sim_timing.json
          if-no-files-found: ignore

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        working-directory: ./voice_bot_service
        env:
          ECR_REGISTRY: public.ecr.aws/e0x1f4p4
          IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}
          REPOSITORY: voice-bot-service/voice-bot-service-repo
          GIT_SHA: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$REPOSITORY:$GIT_SHA .
          docker push $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$REPOSITORY:$GIT_SHA
          echo "Pushed $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG and :$GIT_SHA"

      - name: Connect to Hetzner k3s kubernetes cluster
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: Azure/k8s-set-context@v4.0.0
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.VACADEMY_PROD_KUBECONFIG }}

      - name: Roll out new image if the deployment exists
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          DEPLOYMENT_NAME: voice-bot-service
          NAMESPACE: default
          ECR_REGISTRY: public.ecr.aws/e0x1f4p4
          REPOSITORY: voice-bot-service/voice-bot-service-repo
          GIT_SHA: ${{ github.sha }}
          # Google Cloud TTS (Chirp3-HD) + Vertex LLM auth. Same service account
          # JSON the Mumbai box mounts at /etc/vertex-sa.json. Without it the
          # k8s pods 502 on Google previews while the box serves them fine —
          # which is what the admin dashboard hits.
          VERTEX_CREDENTIALS_JSON: ${{ secrets.VERTEX_CREDENTIALS_JSON }}
          # Navana (Bodhi) TTS. Lives in the `voice-bot` ENVIRONMENT like the Vertex
          # key (the repo is at GitHub's 100-secret limit).
          NAVANA_API_KEY: ${{ secrets.NAVANA_API_KEY }}
        run: |
          if kubectl get deployment "$DEPLOYMENT_NAME" --namespace "$NAMESPACE" >/dev/null 2>&1; then
            # VOICE_BOT_CLIENT_NAME/SECRET must match a row in admin_core's
            # client_secret_key table (its allowlist of internal callers — the
            # bot itself has NO database). Two valid setups:
            #   a) reuse the existing 'admin_core_service' row: set the repo
            #      variable VOICE_BOT_CLIENT_NAME=admin_core_service and the
            #      secret VOICE_BOT_CLIENT_SECRET to that row's secret_key;
            #   b) dedicated identity: INSERT a 'voice_bot_service' row with a
            #      fresh random secret and store the same value in the secret.
            # Optional extras are appended only when non-empty. `kubectl set env
            # KEY=` with an empty value CLEARS the key, so listing an unset
            # secret inline would wipe a working credential on every deploy —
            # exactly how Google TTS previews broke once already.
            EXTRA_ENV=""
            if [ -n "${VERTEX_CREDENTIALS_JSON:-}" ]; then
              EXTRA_ENV="VERTEX_CREDENTIALS_JSON=$VERTEX_CREDENTIALS_JSON"
            fi
            NAVANA_ENV=""
            if [ -n "${NAVANA_API_KEY:-}" ]; then
              NAVANA_ENV="NAVANA_API_KEY=$NAVANA_API_KEY"
            fi

            kubectl set env deployment/"$DEPLOYMENT_NAME" \
              --namespace "$NAMESPACE" \
              ${EXTRA_ENV:+"$EXTRA_ENV"} \
              ${NAVANA_ENV:+"$NAVANA_ENV"} \
              PUBLIC_BASE=https://backend-stage.vacademy.io/voice-bot-service \
              ADMIN_CORE_BASE=https://backend-stage.vacademy.io \
              VOICE_BOT_CLIENT_NAME=${{ vars.VOICE_BOT_CLIENT_NAME || 'voice_bot_service' }} \
              VOICE_BOT_CLIENT_SECRET=${{ secrets.VOICE_BOT_CLIENT_SECRET }} \
              SARVAM_API_KEY=${{ secrets.SARVAM_API_KEY }} \
              RUMIK_API_KEY=${{ secrets.RUMIK_API_KEY }} \
              SMALLEST_API_KEY=${{ secrets.SMALLEST_API_KEY }} \
              LLM_PROVIDER=${{ vars.VOICE_BOT_LLM_PROVIDER || 'sarvam' }} \
              GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
              OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}

            # Roll out the EXACT freshly-built image by its immutable :<sha> tag
            # (same rationale as ai_service: ':latest' can be served stale by the
            # ECR public CDN; a brand-new tag can't).
            kubectl set image deployment/"$DEPLOYMENT_NAME" --namespace "$NAMESPACE" \
              voice-bot-service=$ECR_REGISTRY/$REPOSITORY:$GIT_SHA
            kubectl rollout status deployment "$DEPLOYMENT_NAME" --namespace "$NAMESPACE" --timeout=300s || true
          else
            echo "Deployment $DEPLOYMENT_NAME not found — create it once via helm (services.voice_bot_service.enabled=true). Skipping rollout."
          fi

      # Mumbai audio anchor (Linode ap-west): a standalone docker-compose box that
      # anchors the Plivo<->bot<->Sarvam audio path in-country (see
      # voice_bot_service/deploy/linode-mumbai/README.md). Enabled by setting the
      # repo variable VOICE_BOT_MUMBAI_HOST (the box's IP/hostname) + the secret
      # VOICE_BOT_MUMBAI_SSH_KEY (private key for root@host). Rolls the SAME
      # immutable :<sha> image by rewriting VOICE_BOT_IMAGE in /opt/voice-bot/.env.
      # `up -d` recreates the container, which ends every live call on it:
      # call a6849d85 (2026-09-30) started during the image build and was cut
      # 40 s in. So the new image is pulled first, then the roll WAITS for
      # /health's activeCalls to reach 0 (up to 30 min — a campaign has gaps
      # between calls) and restarts in the first idle moment.
      - name: Deploy to Mumbai anchor (Linode) over SSH
        if: vars.VOICE_BOT_MUMBAI_HOST != ''
        env:
          SSH_KEY: ${{ secrets.VOICE_BOT_MUMBAI_SSH_KEY }}
          RUMIK_API_KEY: ${{ secrets.RUMIK_API_KEY }}
          SMALLEST_API_KEY: ${{ secrets.SMALLEST_API_KEY }}
          NAVANA_API_KEY: ${{ secrets.NAVANA_API_KEY }}
          HOST: ${{ vars.VOICE_BOT_MUMBAI_HOST }}
          ECR_REGISTRY: public.ecr.aws/e0x1f4p4
          REPOSITORY: voice-bot-service/voice-bot-service-repo
          GIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "VOICE_BOT_MUMBAI_SSH_KEY secret not set — skipping Mumbai roll."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/mumbai && chmod 600 ~/.ssh/mumbai
          ssh -i ~/.ssh/mumbai -o StrictHostKeyChecking=accept-new "root@$HOST" \
            "set -e; cd /opt/voice-bot; \
             sed -i '/^VOICE_BOT_IMAGE=/d' .env; \
             echo 'VOICE_BOT_IMAGE=$ECR_REGISTRY/$REPOSITORY:$GIT_SHA' >> .env; \
             sed -i '/^RUMIK_API_KEY=/d' .env; \
             if [ -n '$RUMIK_API_KEY' ]; then echo 'RUMIK_API_KEY=$RUMIK_API_KEY' >> .env; fi; \
             if [ -n '$SMALLEST_API_KEY' ]; then \
               sed -i '/^SMALLEST_API_KEY=/d' .env; \
               echo 'SMALLEST_API_KEY=$SMALLEST_API_KEY' >> .env; \
             fi; \
             if [ -n '$NAVANA_API_KEY' ]; then \
               sed -i '/^NAVANA_API_KEY=/d' .env; \
               echo 'NAVANA_API_KEY=$NAVANA_API_KEY' >> .env; \
             fi; \
             docker compose pull -q voice-bot; \
             for i in \$(seq 1 120); do \
               n=\$(docker compose exec -T voice-bot python3 -c 'import json,urllib.request;print(json.load(urllib.request.urlopen(\"http://127.0.0.1:8090/voice-bot-service/health\",timeout=5))[\"activeCalls\"])' 2>/dev/null || echo 0); \
               [ \"\$n\" = 0 ] && break; \
               echo \"\$n live call(s) - waiting before the restart (\$i/120)\"; sleep 15; \
             done; \
             docker compose up -d; \
             docker image prune -af >/dev/null 2>&1 || true; \
             sleep 5; docker compose ps"
