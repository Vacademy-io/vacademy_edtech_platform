itors","description":"Polls, graded MCQs, speed quizzes, word clouds and real-time leaderboards embed directly into live-class slides, with every response scored the moment it arrives. Engage runs natively in the browser or layers on top of an existing Zoom, Google Meet or built-in classroom call, and pushes all scores into learner report cards automatically.","roles":["Admin","Teacher","Learner"],"platforms":["Engage Client","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Polls, MCQs and short answers as slide types","description":"Quick opinion polls, graded single and multi-select MCQs, one-word, numeric and short-answer questions live inside the deck, so lecture and assessment mix without breaking flow."},{"name":"Speed-quiz mode","description":"Time-boxed questions where answering faster earns bonus points."},{"name":"Per-question timers","description":"Mix quick speed rounds, longer thoughtful MCQs and untimed polls within a single deck."},{"name":"Real-time leaderboard","description":"Ranks update after every question with animated position changes; names can be hidden for privacy or shown for gamification, and standings can persist across the week or month."},{"name":"Word cloud and sentiment polls","description":"Open-text answers render as a live word cloud for recaps, brainstorms and sentiment checks."},{"name":"Auto-grading with report-card push","description":"In-class scores flow into learner report cards and analytics, and can trigger automations such as remedial content, top-performer cohorts or parent digests after class."},{"name":"Hand-raise and moderated chat","description":"Configurable raise-hand, public chat and a private mentor channel let moderators surface the best questions."},{"name":"Layer on Zoom, Meet or the built-in classroom","description":"Run slides and interactions on top of an existing video call — no platform migration needed."},{"name":"Reconnect-safe session state","description":"The current slide, timers and scores live on the server, so refreshes, network blips and mobile suspends lose nothing."}]},{"id":"interactive-whiteboard","name":"Interactive Whiteboard","tagline":"Sketch, annotate and teach together in real time","description":"A shared infinite canvas inside every live class for diagrams, math, brainstorms and slide annotation. Multiple participants can draw together with live cursors, the board survives disconnects, and the finished canvas can be saved straight back into the course for replay.","roles":["Teacher","Learner"],"platforms":["Engage Client","Learner Web"],"subFeatures":[{"name":"Infinite canvas toolkit","description":"Shapes, text, freehand pen, arrows, images, sticky notes, frames and group selection on an unbounded canvas."},{"name":"Multi-user drawing with presence","description":"Multiple participants draw with live cursors; choose teacher-only mode, full collaboration, or invite specific learners to the board."},{"name":"LaTeX and code blocks","description":"Live-rendered math formulas, syntax-highlighted code and chemistry diagrams — built for real subjects."},{"name":"Annotate any slide","description":"Drop the whiteboard layer onto any slide; replays show exactly what was drawn over what."},{"name":"Save back into the course","description":"One click converts the end-of-class canvas into a new slide attached to the chapter."},{"name":"Reconnect-safe server state","description":"Network blips, mobile suspends and refreshes reconnect everyone to the exact same canvas."}]},{"id":"in-app-class-experience","name":"In-App Class Experience","tagline":"Learners attend class inside your branded app","description":"Classes open embedded inside the learner app instead of bouncing learners to another website. YouTube streams play in a distraction-free player with institute-controlled playback rules, Zoom classes run in-browser without the Zoom app, and teachers can host Zoom right from the admin portal.","roles":["Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Embed or redirect, per class","description":"Choose whether each class opens inside the app or redirects to the meeting platform."},{"name":"Embedded YouTube live player","description":"YouTube live streams play in-app with institute-controlled restrictions — allow or block pausing and rewinding to keep everyone at the live edge."},{"name":"Zoom in-browser player for learners","description":"Learners join Zoom classes directly in the browser or app with no Zoom install, and the meeting passcode is handled automatically."},{"name":"Host Zoom from the admin portal","description":"Teachers start and run their Zoom class as host from a dedicated full-screen page inside the admin dashboard."},{"name":"Zoho embedded player and Google Meet launcher","description":"Zoho classes embed in-app, and Google Meet classes open through a streamlined launcher."},{"name":"Simulated live (pre-recorded) classes","description":"Schedule a pre-recorded video to 'go live' at a set time — learners experience it as a live class, with play, pause and rewind rules enforced by the institute."}]},{"id":"learner-live-class-hub","name":"Learner Live Class Hub","tagline":"Every class, recording and reminder in one place","description":"Learners get a dedicated live-class home showing today's and upcoming classes grouped by date, with times auto-converted to their timezone and one-tap join buttons that route them correctly to the waiting room, embedded player or external platform. Past classes appear in list and calendar views with recordings ready to replay, and public sessions welcome guests too.","roles":["Learner","Parent"],"platforms":["Learner Web","Learner Mobile App","Learner Desktop App","Public Web"],"subFeatures":[{"name":"Date-grouped schedule in local time","description":"What's live now and what's coming next, with class cards showing time, subject and thumbnail — times auto-converted to the learner's timezone."},{"name":"One-tap multi-provider join","description":"Join buttons route learners correctly — waiting room, embedded player or external platform — for Zoom, Google Meet, Zoho, YouTube live and the built-in classroom."},{"name":"Past classes with recordings","description":"Browse past sessions in a list or calendar view and replay their recordings in the in-app player."},{"name":"Default class link cards","description":"Recurring classes surface the day's default class card, so learners always know where today's class happens."},{"name":"Custom action buttons","description":"Institute-configured buttons — worksheets, WhatsApp groups and more — appear on class cards where enabled."},{"name":"Post-class feedback prompts","description":"After class, learners are guided to the feedback form when the institute has enabled it."},{"name":"Guest join links","description":"Non-enrolled guests join open sessions via public links, with an embed mode for external websites and their own waiting room."},{"name":"Public live-class registration pages","description":"Shareable registration pages for open live classes with a registration form, email verification and a session countdown — a lead-generation tool for webinars."},{"name":"Open classes for every enrolled learner","description":"An opt-in setting lists public classes that have no batch to every enrolled learner in the app, not only to people with the registration link."}]},{"id":"paid-live-classes","name":"Paid Live Classes & Smart Registration","tagline":"Sell seats to live classes and webinars","description":"Put a price on any public live class and registrants pay before they can join, then land straight in the class once payment clears. Registration accepts a phone number or email as identity, can require a one-time code by email or WhatsApp, and lets returning registrants get back in with one field from any device. Every registrant is captured as a CRM lead and can start your follow-up workflows automatically.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Public Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Ticketed live classes","description":"Set a price and currency on a public class; registrants pay through checkout before joining and receive an invoice, while unpaid visitors are held at the registration page."},{"name":"Payment gateway per class","description":"Choose which of the institute's active payment gateways collects payment for each class, or leave it on the institute default."},{"name":"Pay and go straight into class","description":"After a successful payment the learner is returned directly to the waiting room or class instead of a status page, with commerce wording that suits webinars rather than tuition fees."},{"name":"Phone or email as identity","description":"Registrations can be keyed on a mobile number or an email, so phone-first audiences can sign up without an email address on free classes."},{"name":"Optional OTP verification","description":"Switch on email or phone verification per class; registrants confirm a one-time code by email or WhatsApp, using the approved WhatsApp template you pick."},{"name":"Already registered? quick re-entry","description":"Returning registrants type just their phone or email to get back in, and a refreshed page or reopened link drops them straight into class — with a code check on a new device when verification is on."},{"name":"Hero cover image","description":"Upload a cover image that becomes the background of the public registration page and the waiting room, instead of a stretched logo."},{"name":"Registrants become CRM leads","description":"Every registrant, with their form answers, is saved automatically to a webinar lead list and, optionally, to any other lead lists you select for the class."},{"name":"Registration triggers workflows","description":"A new registration can start an automation workflow scoped to that class — for seat confirmations, reminders or counsellor follow-up."},{"name":"Class payments in the payment log","description":"Live-class payments appear alongside other payments in the institute payment log and can be filtered on their own."}]},{"id":"waiting-room","name":"Waiting Room & Pre-Join","tagline":"A branded countdown lobby before every class","description":"Learners who arrive early land in a branded waiting room with a live countdown, class details and background music, then flow into class the moment it opens. Institutes control how early the room opens, can set a last-entry cutoff, or switch to a direct pre-join mode that skips the lobby entirely.","roles":["Learner"],"platforms":["Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Configurable open time","description":"Set how many minutes before the start time the waiting room opens for each class."},{"name":"Live countdown timer","description":"A real-time countdown to class start keeps early arrivals informed and engaged."},{"name":"Background music","description":"Play an institute-selected background score in the waiting room; custom waiting-room media can be set per schedule."},{"name":"Waiting room or direct pre-join","description":"Choose between a classic waiting-room screen or a pre-join mode where learners enter the live class directly during the pre-class window."},{"name":"Last-entry cutoff","description":"Optionally set a last entry time after which late learners can no longer join the class."},{"name":"Attendance from the lobby","description":"Joining from the waiting room automatically marks the learner present and logs the join."},{"name":"Pre-class disclaimer video","description":"Require learners to watch a short institute video before joining; it appears once per class and stops once they are marked present."}]},{"id":"attendance-tracking","name":"Attendance Tracking & Reports","tagline":"Live classes record their own attendance","description":"Attendance is captured automatically the moment learners join, enriched with join and dwell data synced from Zoom, Zoho and the built-in classroom, and backed by manual and bulk marking for corrections. Rich reports break attendance down by session, batch and individual learner over any date range, and attendance events can trigger notifications and automations.","roles":["Admin","Teacher","Learner","Parent"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Automatic attendance on join","description":"Learners are marked present the moment they join a class from the app, including guests on public sessions."},{"name":"Sync from meeting platforms","description":"Zoom participant reports, Zoho session data and built-in classroom analytics are pulled automatically to record who attended and for how long."},{"name":"Threshold-based marking rules","description":"Grace periods, dwell time and join rules mark learners present, late or absent automatically, including across recurring cohorts."},{"name":"Manual and bulk marking by staff","description":"Teachers mark or correct attendance for individuals or whole lists in one action from an attendance-marking table."},{"name":"Per-occurrence attendance for recurring classes","description":"Recurring series can count attendance per occurrence, so every class day is tracked separately."},{"name":"Session-wise and batch-wise reports","description":"View attendance for one session or across a batch, with filters, pagination and date ranges."},{"name":"Individual learner report","description":"Pull one learner's attendance across a batch for any date range — ideal for parent conversations."},{"name":"Guest attendance tracking","description":"Public-session guests have their attendance recorded against their registration for follow-up."},{"name":"Attendance notifications and summaries","description":"Optionally notify learners and parents when attendance is marked, with customizable messages and branded WhatsApp, email or dashboard summaries — no exports needed."},{"name":"Attendance-triggered automations","description":"Fire WhatsApp nudges on missed-class streaks, alert mentors, unlock assessments at an attendance threshold, or start CRM workflows on drop-off."},{"name":"Audit-ready records","description":"Versioned attendance records with timestamps and device information support accreditations and compliance reviews."},{"name":"Verified minimum attendance","description":"Opt in to mark learners present only if the meeting roster shows they stayed for a set share of the class, measured to the second — clicking Join is no longer enough."},{"name":"Attendance emails that explain the verdict","description":"Learners are told how long they were in class — and, if marked absent, how much time was required — so disputed marks are easy to resolve."}]},{"id":"live-class-dashboard","name":"Live Class Dashboard","tagline":"How every class went, at a glance","description":"A dedicated dashboard shows what is live right now and how classes performed over any date range, broken down by teacher, batch and platform with comparisons to the previous period. Insights highlight the best-attended classes, empty ones and learners who keep missing class, and any class opens into a learner-by-learner breakdown. Views can be exported, printed or shared as a link that reopens the same filters.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Date presets and filters","description":"Pick today, the last 5, 7 or 30 days, the next 7 days or a custom range, and narrow by batch and teacher; data refreshes every minute."},{"name":"KPI cards with period comparison","description":"Classes held, attendance rate, average joined per class, average time in class, engagement and average rating, each with a change versus the previous equal period and a trend sparkline."},{"name":"Automatic insights","description":"Callouts for the best-attended class, the class that needs attention, the top-rated teacher, the busiest day and completed classes that nobody joined."},{"name":"Attendance trends and timing heatmap","description":"Daily expected-versus-present trends, an attendance breakdown chart and a weekday-by-start-time heatmap show when classes happen and when they are best attended."},{"name":"Teacher and batch roll-ups","description":"A teacher leaderboard and per-batch attendance table compare performance across your teaching team and cohorts."},{"name":"At-risk learners","description":"See learners who have missed several finished classes, with their current miss streak, so teachers can follow up before they drop off."},{"name":"Class drill-down","description":"Open any class to see every expected learner's status, time stayed, in-class engagement and written feedback, then call, WhatsApp or email them or export the list."},{"name":"Feedback wall","description":"The latest written feedback from learners across the selected range, in one scrolling view."},{"name":"Export, print and share","description":"Export the class table to CSV, print the dashboard to PDF, or copy a link that reopens the same date range and filters for a colleague."}]},{"id":"class-recordings-hub","name":"Class Recordings Hub","tagline":"Every class recorded, archived and replayable","description":"Recordings from Zoom, Google Meet, Zoho and the built-in classroom are collected automatically after each class and archived to the institute's secure cloud storage, safe from provider retention limits. Learners replay past classes from their app, while admins control retention, cleanup and re-sync.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Automatic recording sync","description":"Zoom cloud, Google Meet and Zoho recordings are pulled automatically on a schedule and attached to the right class occurrence."},{"name":"Archive to institute cloud storage","description":"Recordings are copied from the meeting provider into Vacademy's storage so they survive provider retention limits, with a manual sync-to-storage action available."},{"name":"Built-in classroom recording upload","description":"Recordings from the built-in classroom are processed and uploaded automatically after class ends."},{"name":"Learner replay","description":"Learners browse past sessions in list and calendar views and play recordings in an in-app player."},{"name":"Recording expiry and cleanup","description":"Per-recording expiry dates with automatic cleanup keep storage costs controlled."},{"name":"On-demand re-sync","description":"Admins trigger an immediate recordings sync for any class if a recording hasn't appeared yet."},{"name":"Auto-publish recordings to the course","description":"Pick course chapters for a class and each new recording is added there as a lesson automatically, with learners notified that it is ready."},{"name":"Google Meet recordings to your library","description":"Save a Google Meet recording into your library with one click once Drive access is granted, or upload it manually as a fallback."}]},{"id":"post-class-feedback","name":"Post-Class Feedback","tagline":"Structured learner feedback after every class","description":"Configure a feedback form per class and learners are prompted to rate the session the moment it ends. Institutes choose the questions, star scales and whether feedback is skippable, then review every response in a searchable inbox with statistics and CSV export.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Configurable feedback forms","description":"Enable feedback per class and compose questions — star ratings with custom scales and optional half-stars, plus text answers — each optional or mandatory."},{"name":"Compulsory or skippable","description":"Decide whether learners can skip the form or must submit feedback before moving on."},{"name":"Learner feedback page","description":"A clean, mobile-friendly form with star ratings and comments shown to learners after class."},{"name":"Feedback inbox with search and filters","description":"Browse all feedback with search, date-range presets, subject filters and multi-select filtering."},{"name":"Feedback statistics","description":"Per-session statistics summarize ratings so teaching-quality trends are visible at a glance."},{"name":"CSV export","description":"Export feedback data to CSV for further analysis or reporting."},{"name":"Institute-wide defaults","description":"Set default feedback questions and behavior once in settings; new classes inherit them."},{"name":"Low-rating filter and ratings-wise export","description":"Filter feedback to ratings below a chosen score and export results broken down by rating."},{"name":"Follow up on unhappy learners","description":"Open a learner straight from their feedback to call them and record remarks on their profile."}]},{"id":"live-class-settings","name":"Live Class Settings & Defaults","tagline":"Set your live-class policies once, apply everywhere","description":"An institute-level settings panel defines the rules every new live class inherits — allowed platforms, waiting-room and registration policy, Zoom and built-in classroom presets, recording and transcription behavior, reminder timings and notification channels. It also controls exactly which recording and material features learners see.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Allowed streaming platforms","description":"Control which platforms — Zoom, Google Meet, Zoho, YouTube embeds, the built-in classroom — teachers can schedule classes on."},{"name":"Waiting room and registration policy","description":"Choose always accept, manually approve, automatically approve or always deny guests — or require no registration at all."},{"name":"Scheduling and recurring defaults","description":"Defaults for weekly recurring schedules, per-day default class links, daily attendance counting and the class description field."},{"name":"Zoom presets","description":"Institute defaults for recording destination (cloud, local or off), audio mode, waiting room, join-before-host, required login, entry muting, video states, breakout rooms, focus mode, multi-device join and watermark."},{"name":"Built-in classroom presets","description":"Defaults for recording, auto-start recording, mute on join and host-only webcams."},{"name":"Recording transcription","description":"Automatically transcribe class recordings."},{"name":"Class reminder timing","description":"Pick reminder timing — 5, 10, 30 minutes or 1 hour before class, or none."},{"name":"Notification channel defaults","description":"Default channels (email, WhatsApp, push, in-app) and moments (on create, on live, on attendance) for class notifications."},{"name":"Feedback defaults","description":"Enable feedback forms and compulsory feedback by default, with institute-wide default questions."},{"name":"Default custom action button","description":"Add your own call-to-action button on the class screen by default, such as 'Download worksheet'."},{"name":"Learner display controls","description":"Toggle what learners see — the custom action button card, recording processing options, adding recordings to courses, and the class materials section."},{"name":"Class description and course connection","description":"Standardize class descriptions and connect live sessions to course content."},{"name":"Default timezone","description":"One institute timezone applied to all new live-class schedules."},{"name":"Role-based session visibility","description":"Decide per role whether staff see every class, only their own, or classes created by specific roles — custom roles included."},{"name":"Default recording destination","description":"Choose a course chapter where class recordings are published automatically by default; each class can override it."}]},{"id":"volt-public-site","name":"Volt Public Site & Self-Serve Signup","tagline":"Volt sells gative marking rank learners in real time. Show it to the room for energy, export to CSV, and let AI email each participant a personalized summary when you end."},{"screen":"learner","target":"l-video","title":"Class lives inside your app","text":"Learners join with one tap and stay in your branded app — a waiting room with countdown and music before class, then Zoom in-browser, embedded YouTube or the built-in classroom. No links pasted into WhatsApp."},{"screen":"learner","target":"l-classes","title":"Schedule, replays and worksheets","text":"Today's and upcoming classes show in the learner's own timezone, past classes carry auto-synced recordings archived to your storage, and custom action buttons put worksheets or group links right on the class card."},{"screen":"attendance","target":"att-table","title":"Attendance takes itself","text":"Join and dwell data sync back from Zoom, Zoho and the built-in classroom; threshold rules mark present, late or absent automatically. Correct in bulk, pull per-learner reports for parents, or trigger WhatsApp nudges on missed-class streaks."}]}},{"id":"crm","name":"CRM, Sales & Admissions","icon":"crm","color":"#0E7490","tagline":"Capture every lead, empower counsellors, convert admissions","description":"An education-native CRM that takes every enquiry from first click to enrolled student. Capture leads from your website, ads, forms, walk-ins and spreadsheets into one auto-scored, auto-routed pipeline; give counsellors a focused workbench with SLA clocks, follow-up queues and complete lead histories; and run enquiries, applications, admissions and bookings on the same platform that teaches your students. Built for institutes — parents and children, demo classes, batches and counsellor pools come standard, not as workarounds.","features":[{"id":"lead-capture-campaigns","name":"Lead Capture Campaigns & Forms","tagline":"Capture every lead from every source into one pipeline","description":"Build lead-capture campaigns with custom forms in minutes and share them anywhere — as public links, website embeds, QR-friendly pages or API endpoints. Leads from website forms, ad platforms, form vendors, walk-ins and staff entries all land in one pipeline, deduplicated automatically, with each campaign keeping its own response list. Confirmation emails and team notifications fire the moment a lead arrives.","roles":["Admin","Counsellor"],"platforms":["Admin Web","Public Web","API"],"subFeatures":[{"name":"Campaign builder","description":"Create campaigns with a name, type (Website, Google Ads, Social Media or custom), objective (lead generation, event registration, course inquiry, demo request, newsletter, webinar, contact-us or custom), start/end dates and status."},{"name":"Custom form fields","description":"Attach any set of custom fields to a campaign's form, rendered in your chosen order and grouping with required-field validation. Every field becomes a filterable column in the lead list."},{"name":"Shareable public form link","description":"Every active campaign has a no-login public form showing the campaign's name and context — ideal for ads, WhatsApp, QR codes and social bios. Submissions become leads instantly."},{"name":"Website embed widget","description":"Generate embed code as a customizable button-plus-popup (text, colors, border radius, popup title) or a direct iframe with configurable size, with live preview."},{"name":"API integration kit","description":"A built-in dialog generates ready-to-use API commands and documentation so Zapier, Make or custom apps can push leads into any campaign."},{"name":"Ad-platform and form-vendor intake","description":"Bring in leads from Meta (Facebook/Instagram) Lead Ads, Google Lead Form Extensions and third-party form tools alongside your own forms, so every source feeds the same pipeline."},{"name":"Lead deduplication","description":"Match incoming leads by phone or email — scoped to selected lead lists or institute-wide — so the same person never becomes two leads."},{"name":"Confirmation emails and team alerts","description":"Optionally auto-email each respondent a confirmation on submission and notify chosen staff whenever a response arrives."},{"name":"Add response on behalf","description":"Staff can fill and submit the campaign form for a walk-in or phone prospect without using the public link."},{"name":"Per-campaign lead table","description":"Each campaign has a detailed responses table with dynamic columns from its custom fields, fast pagination and CSV export."},{"name":"Quick automations","description":"From a campaign card, set an instant confirmation message or a follow-up that goes out N days later — and see which workflows are attached to the campaign — without opening the full workflow builder."},{"name":"Campaign lifecycle and search","description":"Campaigns move through Active, Paused, Completed and Archived states (only active campaigns accept leads), with search by name and filters by status and dates."},{"name":"Audience surveys","description":"Public survey pages with dynamic question sets collect structured responses from audiences and feed survey reports."},{"name":"Form appearance designer","description":"Restyle a campaign's public form — classic, hero or split layout, width, background, card style, accent colour, cover image, highlight bullets and footer note — with a live preview."},{"name":"Form heading and text","description":"Edit the page heading, form heading and sub-heading of any campaign form with rich text and left, centre or right alignment."},{"name":"Custom thank-you screen and redirect","description":"Replace the standard confirmation with your own message, up to four action buttons, a 'submit another' option, or a timed redirect — personalised with the respondent's name."},{"name":"Printable QR codes","description":"Download a non-expiring QR code for any campaign form as PNG or SVG, or print a ready-made sheet for posters and reception desks."},{"name":"Short links on every share surface","description":"Every campaign share dialog offers a compact short link alongside the full form URL."},{"name":"WhatsApp confirmations and follow-ups","description":"Campaign quick automations can send the confirmation and day-N follow-up over WhatsApp, email or both, using approved templates."},{"name":"Automatic lead capture","description":"Self sign-ups who haven't enrolled yet and public webinar registrants become leads automatically in their own lists, and webinars can push registrants into any list you choose."},{"name":"WhatsApp chatbot leads","description":"Chatbot flows can check whether a number is already a lead, ask questions tied to CRM fields, and save the conversation as a new or updated lead."},{"name":"Repeat-lead handling","description":"When a known person submits again, choose to reject the duplicate or let it through — keeping their counsellor, reassigning, or resetting their status to New."},{"name":"Facebook and Instagram campaign types","description":"Facebook and Instagram are built-in campaign types, and lead lists can be filtered by campaign type."},{"name":"OTP-verified form fields","description":"Require any form field — typically the phone number — to be verified by a WhatsApp one-time code before a campaign, enquiry, invite or checkout form can be submitted."}]},{"id":"website-lead-capture","name":"Website Lead Capture","tagline":"Turn website visitors into enquiries automatically","description":"Built-in lead collection on your course catalogue website: gate browsing behind a lead form or keep it optional, style it as a single page or multi-step wizard, and route every submission straight into your CRM. An enquiry mode lets visitors raise their hand for a course without paying first.","roles":["Admin","Counsellor"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"Site-wide lead collection form","description":"Enable a lead form across your site, choose whether it's mandatory before browsing, and connect it to an enrollment invite link so leads flow into the platform."},{"name":"Single-page or multi-step forms","description":"Choose a one-shot form or a multi-step wizard with a progress indicator (bar, dots or steps) and slide/fade transitions."},{"name":"Custom form fields","description":"Define exactly which fields the website form collects."},{"name":"Enquiry mode","description":"Let visitors submit an enquiry for a course instead of (or in addition to) paying — built for high-touch sales."},{"name":"Contact and newsletter widgets","description":"Drop-in contact forms with required-field control and newsletter signup sections anywhere on the site."},{"name":"Lead-focused hero sections","description":"Hero buttons can open the lead-collection form directly ('Talk to Us') alongside browse calls-to-action."},{"name":"Forms wired to campaigns","description":"Lead forms, contact and newsletter sections post straight into a chosen lead campaign, and a new campaign can be created inline from the picker."},{"name":"Any button opens a form","description":"Header and section buttons can open a lead form as a popup, so visitors enquire without leaving the page."},{"name":"WhatsApp click-to-chat","description":"Add a floating WhatsApp button or a WhatsApp button action that opens a chat with your team."},{"name":"Campaign health check","description":"See whether a site's campaign is receiving leads and send a test lead to confirm the form works end to end."}]},{"id":"gated-resources-freebies","name":"Gated Resources & Freebies","tagline":"Trade free study material for qualified leads","description":"Offer free PDFs, notes and sample material on your website as lead magnets. Ask for contact details before a download, and every resource a lead opens is recorded against them and collected into an automatic Freebies lead list. Counsellors see exactly which freebies a prospect downloaded before they call.","roles":["Admin","Counsellor"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"Resource cards","description":"Build resource sections with thumbnails, uploaded PDFs and drag-to-reorder cards."},{"name":"Email and lead gates","description":"Gate a single resource or the whole section behind an email or lead form before visitors can open it."},{"name":"Download tracking per lead","description":"Every resource a lead opens is recorded and shown on their lead profile and in the campaign list."},{"name":"Automatic Freebies list","description":"Visitors who download resources are collected into an auto-created Freebies lead list, ready for follow-up."}]},{"id":"bulk-lead-import","name":"Bulk Lead Import","tagline":"Upload hundreds of leads from a spreadsheet","description":"Import leads in bulk from a CSV file into any campaign. The importer generates a template from the campaign's own form fields, understands natural column names, and reports per-row results so you can fix and retry failures — nothing fails silently.","roles":["Admin","Counsellor"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"CSV template download","description":"Download a ready-made template whose columns match the campaign's custom fields, including optional Lead Owner and Lead Status columns."},{"name":"Smart column matching","description":"Column headers are matched flexibly — 'Counsellor', 'Lead Owner Email' or 'Status' all work — and email, phone and name are auto-extracted from mapped fields."},{"name":"Owner and stage on import","description":"Assign each imported lead to a counsellor and place it on a pipeline stage directly from columns in the file."},{"name":"Phone-only rows supported","description":"Rows without an email are still imported, so phone-first lead lists never lose records."},{"name":"Per-row results","description":"The import reports exactly which rows succeeded and which failed with reasons, so partial imports are always visible."}]},{"id":"multi-center-lead-attribution","name":"Multi-Center Lead Attribution","tagline":"Every captured lead stamped with the right branch","description":"For multi-center institutes: map each lead-capture connector to a physical center with defaults like center name and manager contact, so every lead arrives pre-attributed to the right branch alongside its campaign.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Connector-to-center mapping","description":"Assign center name, center manager name and manager mobile as default values on each lead connector."},{"name":"Multi-vendor support","description":"Works across Zoho Forms, Meta Lead Ads, Google Lead Ads, Google Forms and Microsoft Forms connectors."},{"name":"Campaign linkage","description":"Center defaults combine with campaign lists so lead attribution includes both campaign and center."}]},{"id":"lead-inbox","name":"Lead Inbox & Lead List","tagline":"Every lead, filterable, actionable, in one table","description":"A central workspace showing leads across all campaigns with rich filtering, bulk actions and one-click calling. Open any lead in a side panel to see their full profile, form answers, notes and journey without leaving the list — built to keep counsellors working leads, not switching tabs.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Powerful filters","description":"Filter by campaign, lead tier, pipeline status, assigned counsellor (including unassigned), converted state, active/deleted state, date presets or custom ranges, and by any custom form field's values."},{"name":"Action-deadline filters","description":"One click shows every lead whose first-contact or follow-up deadline is due or missed."},{"name":"Lead detail side panel","description":"Click a lead to open a full profile drawer — contact info, form responses, notes, status, score and timeline — without losing your place in the list."},{"name":"Bulk assign and unassign","description":"Select many leads and assign them to a counsellor, or remove the owner, in one action."},{"name":"Click-to-call and AI call","description":"Place a phone call or an AI agent call to a lead directly from its row (see the Voice & AI Calling pillar for the full calling suite)."},{"name":"Tier tagging","description":"Mark leads hot, warm or cold inline from the table."},{"name":"Quick notes","description":"Add a note to any lead straight from the table row."},{"name":"Soft delete and restore","description":"Remove leads from view without losing data and restore them later; both actions are recorded on the lead's timeline."},{"name":"Lead profile editing","description":"Edit a lead's profile details after capture, with every change logged."},{"name":"Configurable CSV export","description":"Export leads with a column picker, including an optional lead-journey column that flattens every status change, note and call into the export."},{"name":"Fast at any scale","description":"Server-side sorting and pagination keep the table responsive even with very large lead databases."},{"name":"Called and worked windows","description":"Find leads called, or worked in any way, within a rolling window or custom range, or filter by an exact number of call attempts."},{"name":"Sort by last activity","description":"Sort the whole lead list by when each lead was last worked or last called, not just the current page."},{"name":"Bulk status change","description":"Select many leads and move them to a new status in one action, with full history recorded for each lead."},{"name":"Exclude-status filter","description":"Flip the status filter to 'everything except' — for example, all leads that are not New — in one click."},{"name":"Configurable filter bar","description":"Admins can switch off built-in filters, hide statuses from the filter dropdown and choose which custom-field and campaign filters each list shows."},{"name":"Campaign and UTM filters","description":"Filter leads by UTM source, medium, campaign, content or term, and see the campaign type and UTM campaign as columns."},{"name":"Pinned sidebar views","description":"Point a custom sidebar tab at a filtered lead list — such as 'Untouched leads' — and its filters stay pinned when others are cleared."},{"name":"Hide converted leads","description":"Optionally keep converted leads out of the 'All leads' view while they stay reachable through their own filter."},{"name":"Reorderable saved columns","description":"Drag columns into your preferred order and show or hide them; the layout is remembered per user."},{"name":"Move leads between lists","description":"Move selected leads to another lead list and optionally run that list's automations for them."}]},{"id":"check-lead","name":"Check Lead (Duplicate Lookup)","tagline":"Is this person already ours? Know before you dial","description":"A focused lookup page where a counsellor types a phone number, email or name and instantly learns whether that person is already a lead — even one owned by a colleague they cannot otherwise see. The institute decides exactly which details the result reveals, so counsellors avoid duplicate calls without gaining access to the whole lead database. Opted-out contacts are always flagged so nobody calls them by mistake.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Search by phone, email or name","description":"Pick what to search by — a full phone number, an email address or, where the institute allows it, a full name — and get a single clear answer."},{"name":"Country-aware phone check","description":"The phone box carries a country picker defaulting to the institute's countries, and only lets a search run once the number is complete, so partial numbers never return false matches."},{"name":"Institute-chosen result fields","description":"Admins tick which details a match reveals — such as owner, status, source, campaign or course — and everything else stays hidden, starting from nothing shared."},{"name":"Opt-out warning","description":"Contacts who opted out of communication are called out in red on every match, so a counsellor never rings someone who asked not to be contacted."},{"name":"Off until switched on","description":"The page and its sidebar entry appear only after an admin enables Check Lead in lead settings; admins always see full details."}]},{"id":"lead-scoring","name":"Automatic Lead Scoring","tagline":"Know which leads deserve attention first","description":"Every lead gets a 0–100 score computed in real time from source quality, profile completeness, recency and engagement, plus a percentile rank refreshed every 15 minutes. Tune the weights to match how your institute sells, and override any score by hand when your team knows better.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Four-factor scoring","description":"Scores combine source quality (e.g. ad leads and walk-ins rank above manual entries), profile completeness, how recent the lead is, and how much activity it has generated."},{"name":"Configurable weights and decay","description":"Adjust how much each factor contributes and set a recency-decay factor so fresh engagement counts more."},{"name":"Percentile ranking","description":"Leads are ranked against each other so you always see the top slice of your pipeline, recalculated automatically every 15 minutes."},{"name":"Manual score override","description":"Set a score by hand; the old and new score, and who changed it, are recorded on the lead's timeline."},{"name":"Campaign-wide recalculation","description":"Recalculate scores for an entire campaign on demand."},{"name":"Score change history","description":"Every automatic or manual score update is logged as a journey event on the lead."},{"name":"Score badge visibility","description":"Choose whether lead-score badges are shown to the team."},{"name":"Custom interest levels","description":"Replace hot, warm and cold with your own named, coloured and ordered levels — derived from the lead score or set by hand."}]},{"id":"sales-pipeline","name":"Custom Sales Pipeline","tagline":"Your funnel, your stages, your labels","description":"Define your own pipeline stages — a sensible starter set is created automatically — and move leads through them from the lead list or in bulk. Every stage change is time-stamped and kept as history, powering funnel reports and the lead journey view. Conversion outcomes are tracked independently of the working stage.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Custom stage editor","description":"Create, rename, reorder and delete pipeline stages per institute; stages feed filters, reports and automations."},{"name":"One-click stage changes","description":"Set a lead's current stage straight from the lead table or detail drawer."},{"name":"Bulk stage updates","description":"Update the stage of many leads or enquiries at once."},{"name":"Full stage history","description":"Every from-to stage movement is stored and shown on the lead's journey timeline."},{"name":"Conversion tracking","description":"Converted and lost outcomes are tracked separately from the working stage, feeding conversion reports."},{"name":"Analytics definitions","description":"Set the report timezone and define which call statuses count as 'connected' and which lead statuses count as 'interested' in analytics."},{"name":"Drag-and-drop lead board","description":"A Kanban board with one column per pipeline status — drag a lead card to another column to change its status, with the same filters as the lead list."},{"name":"Your own CRM vocabulary","description":"Rename 'Tier', 'Lead status' and 'Campaign type' to your institute's words — such as 'Interest level' or 'Source' — everywhere they appear."},{"name":"Pipeline change audit","description":"Creating, editing and deleting lists, statuses, tiers, assignments and connectors is recorded in the activity log, filterable by person."}]},{"id":"lead-slas","name":"Lead Response SLAs & Alerts","tagline":"Never let a lead go cold again","description":"Set service-level rules for how fast your team must make first contact with a new lead and how quickly follow-ups must be completed. The platform reminds the right roles before deadlines hit and flags overdue leads across the CRM, so no enquiry sits unanswered.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"First-contact turnaround time","description":"Set a first-contact deadline in hours for every new lead, with multiple 'remind me N minutes before' warning windows."},{"name":"Follow-up SLA","description":"A separate deadline for completing follow-ups, with its own pre-deadline reminder window."},{"name":"Role-based notifications","description":"Choose which roles — counsellors, admins, managers — get notified for each SLA reminder."},{"name":"Overdue visibility everywhere","description":"Leads that missed first contact or follow-up are filterable in the lead list and surfaced on dashboards."},{"name":"Automation-ready events","description":"Reminder and overdue events can trigger notifications and workflows, so escalations run themselves."},{"name":"Working-hours deadlines","description":"Set working days and hours; leads arriving after closing or on a day off are due at a chosen time on the next working day."},{"name":"Minute-level turnaround","description":"Set first-contact and follow-up deadlines in hours and minutes, such as 1 hour 30 minutes."},{"name":"Admin deadline override","description":"Admins can set or reset a specific lead's first-contact deadline right from the lead table, and reminders re-arm automatically."},{"name":"Any real touch counts","description":"Notes, calls, meetings, status changes and assignments made by a person all count as a response, so the turnaround clock stops correctly."},{"name":"Sticky new-lead alerts","description":"A counsellor's new-lead alert stays up until they record a note, call or status change on that lead."}]},{"id":"follow-up-tasks","name":"Follow-up Task Management","tagline":"Today's call list, ready when you log in","description":"Counsellors schedule follow-ups against leads and land on a focused task view that buckets everything into Pending, Today, Upcoming and All. A calendar view shows the month's follow-up load, and managers can drill into any rep's queue.","roles":["Counsellor","Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Schedule follow-ups","description":"Create dated follow-up tasks on any lead; tasks move through pending, ongoing, overdue and completed states."},{"name":"Bucketed task view","description":"Stat tiles for Pending / Today / Upcoming / All drive the page, so a counsellor instantly sees today's workload."},{"name":"Calendar view","description":"Switch to a month calendar of follow-ups and click any day to see that day's list."},{"name":"Complete with outcome","description":"Close a follow-up in place with a completion note, optionally scheduling the next touch in the same step."},{"name":"My-queue by default","description":"Counsellors automatically see only their own assigned leads; admins can switch to any counsellor's queue."},{"name":"Quick actions inline","description":"Call, note, counsellor assignment and tier updates are available directly from each follow-up row."},{"name":"Structured follow-up outcomes","description":"Optionally record the student's response, how the follow-up happened and the next action from your own dropdown lists, so outcomes can be counted."},{"name":"Completed follow-ups","description":"A Completed view lists closed follow-ups with search, a date window and the outcomes counsellors recorded."},{"name":"Search and filters","description":"Search follow-ups by name, phone or email and filter by source, list, UTM campaign and due-date range."},{"name":"Full follow-up export","description":"Export every follow-up in the current view — with owner, status, interest level, notes, outcomes and all custom fields — not just the visible page."},{"name":"Due follow-up pop-ups","description":"A reminder pops up when a counsellor's follow-up is due or overdue, with mark-done and snooze options and a section in the notification bell."}]},{"id":"counsellor-pools","name":"Counsellor Pools & Auto-Assignment","tagline":"New leads route themselves to the right rep","description":"Group counsellors into pools attached to specific campaigns and let the system assign each incoming lead automatically — round-robin, by shift schedule, or by performance and load. Weekly shift rosters, per-rep monthly targets and safe deactivation with lead handover are built in, so every lead lands with the right person at the right time.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Pool management","description":"Create pools, attach one or more campaigns to each, and add or remove counsellors; changes apply all-or-nothing so pools never end up half-configured."},{"name":"Assignment modes","description":"Choose per pool: Manual (leads wait for a human), Round-Robin (rotate through members in order), or Time-Based (only reps currently on shift receive leads). New assignees are notified instantly."},{"name":"Advanced distribution strategies","description":"The routing engine also supports weighted rotation, performance-based routing (send leads to the best converter) and least-loaded routing (send to the rep with fewest active leads)."},{"name":"Rotation order control","description":"Drag to set the exact rotation order of counsellors — one order for all campaigns or a separate order per campaign."},{"name":"Weekly shift scheduler","description":"Author shifts per day or apply the same hours to all seven days, with multiple shift blocks per day; the system validates full coverage before saving so no lead ever arrives with nobody on duty."},{"name":"Monthly target matrix","description":"Set a monthly lead target per counsellor per campaign in a simple grid."},{"name":"Safe deactivation with handover","description":"Mark a rep inactive in one or many pools at once, name a backup, and optionally reassign their existing leads — every handover is logged with the right actor."},{"name":"Workflow triggers from pools","description":"Fire an automation workflow for pool events straight from the pool screen."},{"name":"AI-first assignment","description":"Per list, hold new leads unassigned so an AI agent calls them first; a counsellor is assigned only when the call qualifies the lead or retries run out."},{"name":"Pool visible on lead lists","description":"Each lead list and campaign card shows which counsellor pool it routes to."}]},{"id":"counsellor-workbench","name":"Counsellor Workbench","tagline":"Manage your sales team and their pipelines","description":"A team-management hub listing every counsellor with their open leads, activity, calls, performance and targets. Managers see their own reporting line; admins see the whole institute. Reassign entire books of leads between reps with a safe preview step before anything changes.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Counsellor roster","description":"Card or list view of all counsellors with open-lead counts, active status, rating badges and search; managers automatically see only the reps in their reporting line."},{"name":"Per-counsellor drawer","description":"Open any counsellor to tabs for their Leads, Activity feed, Calls, AI Coaching, Performance and Targets."},{"name":"Assign leads with preview","description":"Assign unowned leads to a counsellor, with a dry-run preview showing exactly what will change before you commit."},{"name":"Bulk reassign between reps","description":"Move some or all of one counsellor's leads to another — again with preview-then-apply."},{"name":"Lead transfer history","description":"Expand any lead to see its full chain of counsellor handovers, oldest first."},{"name":"Mark counsellor inactive","description":"Flip a counsellor to inactive (e.g. on leave) and hand their leads to a backup in the same step."},{"name":"Activity feed","description":"A per-counsellor feed of recent actions — status changes, notes, calls and assignments."},{"name":"Hierarchy-aware permissions","description":"What each manager can see and reassign is scoped by their team hierarchy; admins see institute-wide."}]},{"id":"counsellor-targets","name":"Counsellor Targets","tagline":"Set goals, track them live","description":"Give each counsellor measurable targets — conversions closed, leads handled or calls made — for a week, a month or a custom date range. Progress is computed live from actual CRM and call data and shown as target-vs-achieved everywhere the counsellor appears.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Three target metrics","description":"Target conversions closed, leads assigned, or calls made — each measured automatically from real activity."},{"name":"Flexible periods","description":"Recurring weekly or monthly targets that auto-apply to the current period, or one-off targets bound to a custom date range."},{"name":"Bulk apply to a team","description":"Set the same target across many counsellors in one action."},{"name":"Live progress tracking","description":"Target-vs-completed progress bars per counsellor, with a period selector to review past windows."}]},{"id":"counsellor-ratings","name":"Counsellor Ratings & Leaderboard","tagline":"Objective rep ratings, computed from results","description":"Each counsellor carries a rating computed automatically from their conversion ratio and how fast they convert, refreshed on a schedule. Pick a preset strategy or tune the formula, switch any rep to a manual rating when circumstances warrant, and rank the whole team on a leaderboard.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Auto-computed ratings","description":"A strategy-based score derived from each rep's conversion ratio and time-to-convert, refreshed on a schedule."},{"name":"Preset strategies","description":"One-click presets: Balanced, Reward closers, or Reward fast callers."},{"name":"Fine-grained tuning","description":"Set the conversion-vs-speed weighting, ideal and worst response-time thresholds, starting score, minimum activity before a rep is rated, and how many days of history the rating considers."},{"name":"Manual override","description":"Switch any counsellor to a hand-set rating when needed."},{"name":"Team leaderboard","description":"A ranked leaderboard of counsellors by rating, also surfaced as a widget on the sales dashboard."},{"name":"On-demand recompute","description":"Trigger a recalculation any time, in addition to the scheduled refresh."},{"name":"Rating badges","description":"Ratings appear as badges throughout the workbench and dashboards."}]},{"id":"lead-timeline","name":"Lead Timeline & Journey","tagline":"The complete story of every prospect","description":"Every lead carries a unified timeline mixing automatic lifecycle events with manual notes, call logs and meetings — from first form submission through assignment, stage changes, scoring, conversion, payment and enrollment. Notes can be pinned to the top, and the whole journey can be exported.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Automatic journey events","description":"System-logged milestones: lead submitted, duplicate merged, deleted/restored, counsellor assigned or unassigned, status changed, follow-up, outreach, score updated, converted, lost, payment received and enrollment completed."},{"name":"Manual activity logging","description":"Staff add notes, call logs, follow-ups and meeting records against any lead."},{"name":"Pinned notes","description":"Pin the most important note so it always appears first for the next person who opens the lead."},{"name":"Cross-stage timeline","description":"One continuous timeline follows the person across enquiry, application and enrollment — not just one stage."},{"name":"Latest-note previews","description":"Lead tables show each lead's most recent note and note count inline."},{"name":"Journey export","description":"Flatten a lead's entire journey — status changes, notes, calls — into an export column for offline analysis."}]},{"id":"communication-timeline","name":"Contact Communication Timeline","tagline":"Every message ever exchanged with a contact, in order","description":"Open any lead or learner and see a unified chronological timeline of every email, WhatsApp message, push notification and SMS — outbound and inbound — with per-message delivery status. Perfect for a counsellor resuming a conversation or support resolving a dispute.","roles":["Admin","Counsellor"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"All-channel timeline","description":"Email, WhatsApp, push and SMS for a contact merged into one time-ordered view, filterable by channel."},{"name":"Direction and status","description":"Each entry shows outbound/inbound direction and a chronological status trail — pending, sent, delivered, read, failed, bounced."},{"name":"Message preview and full body","description":"See a preview of each message inline and expand to the full content."},{"name":"Source attribution","description":"Every entry records which feature produced it — an announcement, chatbot flow, OTP or campaign — with a link back to the source."}]},{"id":"enquiry-management","name":"Enquiry Management","tagline":"Track every admission enquiry to a decision","description":"A structured enquiry desk for schools and institutes: capture enquiries with fee expectations, transport needs and parent details, score interest, work a checklist, and move each enquiry through stages from New to Admitted. Counsellors can be linked to enquiries for clear ownership.","roles":["Admin","Counsellor"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"Rich enquiry records","description":"Each enquiry captures reference source, mode, fee-range expectation, transport requirement, parent's relation to the child, interest score, notes and a tracking ID."},{"name":"Enquiry stages","description":"Move enquiries through New, Contacted, Not Eligible, Qualified, Follow up, Closed, Converted and Admitted."},{"name":"Built-in checklist","description":"A per-enquiry checklist tracks required steps — documents, visits, calls — toward admission."},{"name":"In-app entry and public link","description":"Front-desk staff create enquiries in-app, or share a public enquiry form link; a kiosk mode suits reception desks."},{"name":"Walk-in registration","description":"Register walk-in visitors as a lead plus an enquiry in a single submission."},{"name":"Counsellor linking","description":"Link a counsellor to an enquiry source so ownership and performance tracking are clear."},{"name":"Bulk status updates","description":"Update many enquiries' statuses in one action with per-item results."},{"name":"Filters and search","description":"Filter enquiries by date presets, status and source type, with name search."}]},{"id":"applications-pipeline","name":"Online Applications & Applicant Pipeline","tagline":"Online applications with a staged admissions workflow","description":"Accept applications through a public online form and move each applicant through configurable stages — Form, Payment, Test, Verification, Admission. Application fees can be collected online, parents and children stay linked, and bulk imports migrate existing applicant lists.","roles":["Admin","Counsellor","Parent"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"Public application form","description":"Prospective families submit applications online with child and parent details; a printable application template is generated."},{"name":"Configurable stage pipeline","description":"Define application stages of type Form, Payment, Test, Verification and Admission, and advance each applicant stage by stage."},{"name":"Application fee payment","description":"Initiate online payment for the application fee directly from the applicant record."},{"name":"Parent-child records","description":"One parent account can hold multiple child applicants, viewable together."},{"name":"Enquiry lookup and linking","description":"Search existing enquiries while creating an application so prior history carries over instead of duplicating the family."},{"name":"Bulk application import","description":"Import many applications from a file with per-row success and failure results."},{"name":"Applicant list with filters","description":"A filterable, paginated applicant list with a full applicant profile side panel."},{"name":"Staff-side onboarding","description":"Admins can onboard an applicant directly without the public form."}]},{"id":"admissions-desk","name":"Admissions Desk","tagline":"From application to enrolled student, end-to-end","description":"Process admissions through a guided form wizard or in bulk, review each admission with statuses like Under Review, Approved, Waitlisted or Rejected, and enroll approved students into their batch in one step. A full online-application workflow and a quick manual-admission workflow run in parallel and feed the same pipeline.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Admission form wizard","description":"A step-by-step wizard collects the complete admission form, with a printable admission template."},{"name":"Two admission workflows","description":"Online Application (application first, then admission) and Manual Admission (direct entry) both feed the same pipeline."},{"name":"Admission review statuses","description":"Each admission carries a status: Pending, Under Review, Approved, Rejected, Waitlisted or Cancelled."},{"name":"Bulk admission import","description":"Submit many admissions from a spreadsheet with row-level results."},{"name":"Responses list and detail","description":"Browse all admission submissions with filters and open a full detail view of any one."},{"name":"One-step enrollment","description":"Convert an approved admission into an enrolled student, with payment details, in a single step."},{"name":"Custom application stages","description":"Add and label the stages applications move through, with display text per stage."},{"name":"UPI payment collection","description":"Attach a payment QR code with payee name and UPI ID (VPA) to collect application fees."},{"name":"Counsellor auto-assignment","description":"Auto-assign counsellors to applications with a selectable assignment strategy and a chosen counsellor pool."}]},{"id":"onboarding-flows","name":"Onboarding Flows","tagline":"Guided checklists that turn a lead into a student","description":"Build step-by-step onboarding checklists — forms, document collection, course selection, account creation — and run one for each new admission. Each step decides which roles can see and fill it, so staff, parents and the learner each complete their own part, and a dashboard shows exactly where every person is stuck. Learners and parents finish their steps from their own portal before the regular dashboard opens. Opt-in per institute.","roles":["Admin","Counsellor","Learner","Parent"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Flow builder","description":"Create named flows of ordered form steps built from your own custom fields, mark steps optional, and keep flows as draft, active or archived."},{"name":"Role-based step access","description":"Per step and per field, choose which roles — admin, counsellor or any custom role, parent or learner — can view or edit, so each party fills only their part."},{"name":"Enrol from a step","description":"A step can create the student account, send login credentials and enrol them in a course picked from a curated course pool — or complete itself if they are already enrolled."},{"name":"Start from the lead or student panel","description":"Staff start onboarding from the side panel on any lead or student, then complete, skip or partially save steps and review submitted forms."},{"name":"Onboarding dashboard","description":"One institute-wide list of every onboarding in progress, filterable by flow and status, showing who is on which step."},{"name":"Learner and parent self-service","description":"Learners complete their steps from their profile, and parents with their own login complete each linked child's steps, with a card per child."},{"name":"Dashboard gate","description":"While a learner has a step they can act on, their dashboard shows that step first, so required details are never skipped."},{"name":"Review what was submitted","description":"Learners can revisit everything they provided, and uploaded files open directly for both learners and staff."},{"name":"Workflow hooks","description":"Steps can fire your existing automation workflows, so welcome messages and internal tasks run as onboarding progresses."}]},{"id":"enrollment-invites","name":"Enrollment Invites & Self-Registration","tagline":"One link that sells, collects payment, and enrolls","description":"Create shareable enrollment links for any course batch that carry the enrollment form, pricing and payment options, and optional referral rewards. Prospects open the link, see a course preview, fill the form, pay and get enrolled — no staff involvement required. Open self-signup and partner registration wizards cover every other path onboard.","roles":["Admin","Learner","Parent","Counsellor"],"platforms":["Admin Web","Public Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Invite link builder","description":"Create invites tied to one or more course batches, with validity dates, currency, learner access duration and a short URL for sharing."},{"name":"Payment options per batch","description":"Attach one or several payment plans to each batch on the invite so the prospect chooses how to pay."},{"name":"Custom enrollment form","description":"Configure the fields prospects fill during enrollment; submissions are stored with the enrollee."},{"name":"Course preview page","description":"The invite renders a public course preview so prospects see what they're buying before enrolling."},{"name":"Referral rewards on invites","description":"Link referral programs to an invite's payment plans so enrollees can earn or give referral benefits."},{"name":"Bundled course invites","description":"One invite can cover a bundle of multiple batches or courses."},{"name":"Default invite per batch","description":"Each batch keeps a default enrollment invite whose configuration can be updated centrally."},{"name":"Invite management","description":"Search, filter, update and delete invites; look up invites by learner or payment plan."},{"name":"Open self-signup","description":"Open registration pages let new learners create accounts directly, with institute-defined registration questions rendered dynamically; invitees land in the right batch automatically."},{"name":"Partner (sub-organization) registration wizard","description":"A reusable open link takes partner organizations through a multi-step wizard — details, custom fields, OTP verification, KYC, terms acceptance and payment — and mints a new sub-organization with its own admin and learner invites."},{"name":"Enrollment availability window","description":"Accept enrollments on an invite link only between chosen dates, and show your own message to anyone who opens it outside that window."},{"name":"Team alerts on invite sign-ups","description":"Listed team members get an email with the learner's answers whenever someone fills an invite form."},{"name":"Invite links manager","description":"Each course lists its invite links with search, creator and date, plus one-click short link, QR code, UTM link, edit, delete and make-default — every change is logged."}]},{"id":"bookings-appointments","name":"Bookings & Appointments","tagline":"Schedule visits, demos and counselling on a calendar","description":"Define your own booking types — school visits, counselling sessions, demo classes, enquiry meetings — and manage bookings in list or calendar view. Each booking carries a schedule, participants, an optional meeting link and recurrence, with availability checks that prevent double-booking staff.","roles":["Admin","Counsellor","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Custom booking types","description":"Use global defaults like School Visit or Enquiry Meeting, or create institute-specific types with a name, unique code and description."},{"name":"Create bookings","description":"Schedule an event with title, subject, rich description, date, start/end times, timezone, recurrence and an optional meeting link."},{"name":"Participants and attendees","description":"Add individual users — leads, parents, learners — or whole batches as participants on a booking."},{"name":"Availability check","description":"Check whether a time slot is free before confirming, avoiding double-booked staff."},{"name":"Reschedule and cancel","description":"Move a booking to a new time or cancel it, with status tracking through draft, live, completed and cancelled."},{"name":"Calendar and list views","description":"Browse bookings on a month calendar with day drill-down, or as a filterable list of upcoming, live and past events."},{"name":"Linked pipeline records","description":"Bookings can reference a source record — a lead or enquiry — so appointments stay connected to the pipeline."}]},{"id":"booking-pages-meetings","name":"Booking Pages & Meetings","tagline":"Let prospects book a counselling slot themselves","description":"Calendly-style public booking pages let prospects, parents and learners pick a free slot with a counsellor or host and book it without logging in. Hosts set their weekly hours, buffers and session lengths; the platform blocks double-booking and the host's own live classes, sends branded confirmations, and can drop every booking straight into a lead list. Hosts and managers see every meeting on a personal or team schedule.","roles":["Admin","Counsellor","Teacher","Learner","Parent"],"platforms":["Admin Web","Public Web","Learner Web"],"subFeatures":[{"name":"Shareable booking pages","description":"Create a public booking link with a host, duration, weekly hours, slot interval, buffers, minimum notice, booking horizon, timezone and an auto-generated video meeting or custom location."},{"name":"Multiple session types","description":"Offer several options on one page — say a 15-minute chat and a 60-minute deep dive — and available slots adjust to the length chosen."},{"name":"Custom intake questions","description":"Ask invitees your own questions — text, dropdown, number, email or phone, required or optional — when they book."},{"name":"Optional approval","description":"Require host approval so new bookings start as pending until confirmed."},{"name":"Self-serve cancel and reschedule","description":"Invitees receive a private link to cancel or move their booking themselves, with no staff involvement."},{"name":"No double-booking","description":"A slot can only be taken once, and the host's scheduled live classes automatically count as busy time."},{"name":"Branded confirmations","description":"Invitee and host get an institute-branded confirmation email, and an approved WhatsApp template with booking details can be sent too."},{"name":"Calendar sync","description":"Confirmed bookings are pushed to the host's and invitee's Google Calendar and removed on cancel or reschedule."},{"name":"Bookings become leads","description":"Attach a booking page to a lead list so every booking creates a lead with its answers, and see each lead's meetings on its profile."},{"name":"My Schedule and Team Meetings","description":"Hosts see their own upcoming meetings and managers see their team's, in list or month-calendar view."}]},{"id":"contacts-directory","name":"Contacts Directory","tagline":"Everyone you know, in one searchable place","description":"A unified directory combining enrolled users and campaign respondents into one contact list. Search by name; filter by campaign, region, gender, enrollment status, batch or payment status; and see each contact's custom-field data at a glance.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Unified contact list","description":"Toggle inclusion of institute users and lead-form respondents to see students, prospects or both in one table."},{"name":"Rich filtering","description":"Filter by campaign, campaign status/type/dates, email, phone, region, gender, enrollment status, batch, payment status and organization type."},{"name":"Search and sort","description":"Name search with server-side sorting and pagination for large databases."},{"name":"Custom fields on contacts","description":"Each contact row carries its captured custom-field values and flags whether the person is an enrolled user, a lead respondent, or both."},{"name":"Totals and column manager","description":"See the total matching contacts at a glance, and hide or drag columns into order, remembered per browser."}]},{"id":"tags-segmentation","name":"User Tags & Segmentation","tagline":"Label anyone, then act on the whole segment","description":"Create tags and apply them to any set of users — by picking users, pasting IDs or uploading a CSV. Tags power segmentation across the platform: count and list tagged users, feed messaging and workflows, and even bulk-assign courses to everyone carrying selected tags.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Tag library","description":"Create institute tags with name and description alongside platform defaults; deactivate tags you no longer need."},{"name":"Bulk tagging","description":"Add one or many tags to many users at once — by user list, by tag name (missing tags are auto-created), or by CSV upload with validation and a failed-rows download."},{"name":"Tag statistics","description":"See user counts per tag and pull detailed lists of users carrying any tag combination."},{"name":"Untagging","description":"Deactivate tags on selected users without deleting history."},{"name":"Courses by tag","description":"A wizard assigns course batches to every user holding selected tags — select courses, configure enrollment, preview, then apply with results."},{"name":"Segments for automation","description":"Fetch all users behind a tag or tag set to power downstream messaging and workflows."}]}],"demo":{"intro":"Follow an enquiry from the moment it lands in the lead inbox to the funnel report that shows it converting — through a counsellor's workbench and a complete lead timeline.","screens":[{"id":"inbox","device":"desktop","title":"Lead Inbox","nav":["Dashboard","Leads*","Campaigns","Counsellors","Admissions","Reports","Settings"],"widgets":[{"type":"header","id":"in-head","title":"Lead Inbox","subtitle":"1,248 leads · 6 campaigns","actions":["+ Add Lead","Import CSV"]},{"type":"stats","id":"in-stats","items":[{"label":"New today","value":"34","delta":"+12 vs yesterday"},{"label":"First contact due","value":"18"},{"label":"Follow-ups overdue","value":"5"},{"label":"Converted this month","value":"62","delta":"₹9.4L collected"}]},{"type":"filters","id":"inbox-filters","search":"Search by name, phone, email…","chips":["Source","Stage","Owner","Course","Score"]},{"type":"table","id":"in-table","columns":["Lead","Course","Source","Score","Stage","Owner"],"rows":[["Aarav Mehta","NEET 2027 Batch A","Meta Lead Ads","87",{"chip":"Demo Booked","tone":"blue"},"Priya Nair"],["Ananya Iyer","JEE Advanced Crash","Website form","81",{"chip":"Contacted","tone":"purple"},"Rohan Gupta"],["Sneha Kulkarni","IELTS Band 8","Google Lead Form","74",{"chip":"New","tone":"green"},"Unassigned"],["Kabir Shah","Class 10 Foundation","Walk-in","69",{"chip":"Negotiation","tone":"orange"},"Priya Nair"],["Ishita Verma","NEET 2027 Batch A","CSV import","52",{"chip":"Contacted","tone":"purple"},"Rohan Gupta"]]}],"module":"crm"},{"id":"workbench","device":"desktop","title":"Counsellor Workbench — Priya Nair","nav":["Dashboard","Leads","Campaigns","Counsellors*","Admissions","Reports","Settings"],"widgets":[{"type":"header","id":"wb-head","title":"My Pipeline","subtitle":"Priya Nair · 46 open leads · Rating 4.7","actions":["Reassign leads"]},{"type":"kanban","id":"wb-kanban","columns":[{"title":"New","cards":[{"title":"Sneha Kulkarni","sub":"IELTS Band 8 · Score 74"},{"title":"Devansh Rao","sub":"NEET 2027 · Score 66"}]},{"title":"Contacted","cards":[{"title":"Ananya Iyer","sub":"JEE Advanced · Score 81"},{"title":"Ishita Verma","sub":"NEET 2027 · Score 52"}]},{"title":"Demo Booked","cards":[{"title":"Aarav Mehta","sub":"Demo class Sat 11 AM"}]},{"title":"Negotiation","cards":[{"title":"Kabir Shah","sub":"Quoted ₹45,000 · parent call"}]}]},{"type":"list","id":"wb-followups","items":[{"title":"Call Aarav's father before demo","sub":"NEET 2027 Batch A · +91 98201 44317","chip":"Today","tone":"blue"},{"title":"Send fee breakup to Kabir","sub":"Class 10 Foundation · quoted ₹45,000","chip":"Today","tone":"blue"},{"title":"Second follow-up: Ananya","sub":"Missed SLA by 2 hrs","chip":"Overdue","tone":"red"},{"title":"IELTS webinar invitees (12)","sub":"Batch follow-up","right":"Tomorrow"}]}],"module":"crm"},{"id":"lead-detail","device":"desktop","title":"Lead — Aarav Mehta","nav":["Dashboard","Leads*","Campaigns","Counsellors","Admissions","Reports","Settings"],"widgets":[{"type":"header","id":"ld-head","title":"Aarav Mehta","subtitle":"NEET 2027 Batch A · Score 87 · Hot · Owner: Priya Nair","actions":["Change stage","Add note"]},{"cols":[{"type":"list","id":"ld-timeline","items":[{"title":"Pinned note","sub":"Father decides; prefers evening calls after 7 PM","chip":"Pinned","tone":"orange"},{"title":"Demo class booked — Sat 11 AM","sub":"Booking linked to this lead · Physics demo","chip":"Booking","tone":"blue"},{"title":"Stage: Contacted → Dem
