el":"Set as institute default plan","value":"on","type":"toggle"}],"submit":"Send for Approval"}],"module":"crm"},{"id":"invoice","device":"desktop","title":"Invoice — INV-2026-0412","nav":["Dashboard","Study Library","Learners","Finance*","Marketing","Reports","Settings"],"widgets":[{"type":"header","id":"inv-head","title":"Invoice INV-2026-0412","subtitle":"Priya Sharma · Class 10 Foundation · due 20 Jul 2026","actions":["Copy Payment Link","Send Reminder"]},{"cols":[{"type":"invoice","id":"inv-doc","no":"INV-2026-0412","to":"Mrs. Sunita Sharma (parent of Priya Sharma), 14 MG Road, Indore, MP","rows":[{"desc":"Tuition — Term 2, Class 10 Foundation","amt":"₹18,000"},{"desc":"Transport — Quarter 2","amt":"₹4,500"},{"desc":"CGST 9% + SGST 9%","amt":"₹4,050"}],"total":"₹26,550"},{"type":"form","id":"inv-send","title":"Send & collect","fields":[{"label":"Payment link","value":"pay.vacademy.io/i/8f2k1x","type":"text"},{"label":"Deliver via","value":"Email + WhatsApp to +91 98267 44310","type":"select"},{"label":"Apply GST on this invoice","value":"on","type":"toggle"}],"submit":"Send Invoice"}]}],"module":"crm"},{"id":"checkout","device":"phone","title":"Learner App — Pay Fees","nav":["Home","Courses","Payments*","Doubts","Profile"],"widgets":[{"type":"header","id":"pay-head","title":"My Dues","subtitle":"Priya Sharma · Class 10 Foundation"},{"type":"list","id":"pay-dues","items":[{"title":"Tuition — Term 2","sub":"Installment 2 of 4 · due 20 Jul","right":"₹18,000","chip":"Due","tone":"orange"},{"title":"Transport — Q2","sub":"Due 12 Jul · 2% late penalty applies","right":"₹4,500","chip":"Overdue","tone":"red"},{"title":"GST (CGST 9% + SGST 9%)","sub":"Calculated on payable amount","right":"₹4,050"}]},{"type":"form","id":"pay-method","title":"Pay ₹26,550","fields":[{"label":"Payment method","value":"UPI — via Razorpay","type":"select"},{"label":"Coupon code","value":"SIBLING10","type":"text"}],"submit":"Pay Securely"},{"type":"stats","id":"pay-done","items":[{"label":"Payment","value":"Success ✅"},{"label":"Receipt","value":"#RCPT-8841"},{"label":"Balance due","value":"₹0"}]}]}],"steps":[{"screen":"collections","target":null,"title":"Every rupee, one dashboard","text":"Online course sales, school-style installments and front-office cash all land in one finance view. Money settles directly into your own gateway account — Stripe, Razorpay, PhonePe, Cashfree, eWAY or PayPal — never Vacademy's."},{"screen":"collections","target":"col-funnel","title":"Know exactly who hasn't paid","text":"The student fee ledger flags everyone Paid, Partial, Pending or Overdue with a collection progress bar. Filter by course, fee plan or status and drill into any student's full installment schedule."},{"screen":"collections","target":"col-recent","title":"A real counter for offline payments","text":"The Fee Collection Desk is a guided four-step counter flow: find the student, pick installments, record cash, cheque, UPI or card — and a receipt is generated on the spot with a download link."},{"screen":"fee-plans","target":"plan-table","title":"School fees the way schools work","text":"Model fee heads like Tuition, Admission, Transport or Hostel — each with its own installment schedule, late-payment penalty percentage, refundable flag and built-in discounts. Templates cover Monthly, Quarterly, Term-wise and Annual."},{"screen":"fee-plans","target":"plan-attach","title":"Maker-checker, then auto-inherit","text":"Structures need a separate approver before going live, and every concession or penalty later runs through the same audited approval queue. Attach the plan to batches so each new admission inherits the right fees automatically."},{"screen":"invoice","target":"inv-doc","title":"Tax-compliant invoices, your brand","text":"Every online payment can auto-generate a branded PDF invoice, or raise one manually — even in bulk — with a pixel-accurate preview. GST splits like CGST 9% + SGST 9% render as a proper tax table with your GSTIN and place of supply."},{"screen":"invoice","target":"inv-send","title":"A payment link on every invoice","text":"Each invoice carries a shareable public payment page — no login needed to pay. Send it by email or WhatsApp, fire one-click reminders for unpaid invoices, and mark offline settlements paid so books stay accurate."},{"screen":"checkout","target":"pay-dues","title":"Parents see dues, not spreadsheets","text":"Learners and parents check pending and overdue installments across all fee heads right in the app — with amounts, due dates and past receipts — and pay online without visiting the office."},{"screen":"checkout","target":"pay-method","title":"Checkout that matches your gateway","text":"The pay flow adapts to your configured gateway — UPI, cards, netbanking and wallets via Razorpay or PhonePe, international cards via Stripe. Coupon codes like SIBLING10 validate live and adjust the payable amount instantly."},{"screen":"checkout","target":"pay-done","title":"Confirmed, receipted, reconciled","text":"The app polls the gateway for the true payment status — no manual refresh — then issues the receipt and emails the invoice automatically. Webhooks are signature-verified, so no payment is ever lost or double-counted."}]}},{"id":"erp","name":"Institute ERP, HR & Operations","icon":"erp","color":"#4338CA","tagline":"Enrollment, batches, branches, staff and payroll — run the institute","description":"Run the entire institute — not just the teaching — from one platform. This pillar covers the operational backbone: a complete learner directory with every enrollment tool from single admissions to 10,000-row bulk imports, batch and session structures with live seat inventory, automated renewals, branch and franchise management, parent engagement, and a full HR suite spanning staff attendance, leave, approvals and payroll. Everything your registrar, HR team and branch managers do daily, unified with your academics.","features":[{"id":"learner-directory","name":"Learner Directory & Profiles","tagline":"Every learner — searchable, filterable, fully profiled","description":"A central directory of every learner in the institute with fast search, deep filtering and a detailed profile panel for each person. Admins see enrollment details, contact and guardian info, custom fields, payment status and learning progress in one place, and can export any view to CSV.","roles":["Admin","Teacher","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Server-side search with auto-suggest","description":"Paginated learner table with name search and type-ahead suggestions, scoped to your institute and academic session."},{"name":"Rich filtering","description":"Filter by batch, status (active, inactive, invited, pending approval), gender, session expiry window, payment status, approval status, abandoned cart, sub-organization, sub-org role and any custom field."},{"name":"Side-panel profile","description":"Open any learner's full profile — personal details, batch memberships, custom fields, payment plan and enrollment history — without leaving the list."},{"name":"Learning progress drill-down","description":"See study progress per subject, module, chapter and slide, including video watch percentage, pages read, quiz and assignment completion, and last activity."},{"name":"Custom field values per learner","description":"View and edit institute-defined custom fields captured at enrollment for each learner."},{"name":"Edit learner details","description":"Update a learner's name, contact, address, guardian details and other profile fields at any time."},{"name":"CSV export","description":"Export the full filtered list or a basic-details version to CSV, including an account-credentials export for offline distribution."},{"name":"Learner statistics","description":"Aggregate headcounts by status, batch and user type for instant reporting."},{"name":"Multi-course memberships view","description":"See every course and batch a learner is enrolled in, with expiry date and status per enrollment."},{"name":"Trial and paid filters","description":"A Trial or Paid badge on each learner and filters for membership type and joining month show who is on a free trial and which intake they belong to."},{"name":"Edit login credentials","description":"Admins can change a learner's username or password from their profile, and the new credentials are kept in sync across the platform."}]},{"id":"enrollment-invite-links","name":"Enrollment Invite Links","tagline":"Shareable enrollment pages with forms and payment built in","description":"Create branded invite links that let learners self-enroll into chosen courses and batches. Each invite carries its own registration form, payment plans, discounts and referral programs, and every response is tracked, reviewed and approved before or after enrollment.","roles":["Admin","Learner"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"Invite builder","description":"Pick the courses, sessions, levels and batches an invite covers; optionally let the learner choose from allowed options via dropdowns."},{"name":"Custom registration form","description":"Add your custom fields to each invite's form to capture exactly the data you need; a sensible default form is generated automatically."},{"name":"Payment plans on invites","description":"Attach free, one-time, subscription or donation payment plans with pricing per invite."},{"name":"Discounts","description":"Configure discounts on invite pricing through a dedicated discount setup."},{"name":"Referral programs","description":"Attach referral reward programs so existing learners bring in new ones through the same link."},{"name":"Invite lifecycle management","description":"List, edit, preview, copy and activate or close invites — closed links stop accepting registrations."},{"name":"Response review queue","description":"Every submission is stored with status; browse, filter and accept or reject registrations individually or in bulk."},{"name":"Automatic registrant emails","description":"Invitation and status update emails are sent to registrants automatically."},{"name":"Default invite resolution","description":"Bulk operations and enrollments can resolve a batch's default invite automatically, keeping pricing and forms consistent everywhere."}]},{"id":"manual-assisted-enrollment","name":"Manual & Assisted Enrollment","tagline":"Enroll a learner in seconds, with or without payment","description":"Multiple ways to get learners into courses: a step-by-step enrollment wizard, direct admin enrollment into any batch, and enrollment on a learner's behalf with recorded offline payment. Enrollment automatically sends welcome messages with login credentials.","roles":["Admin","Counsellor","Learner"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"Enrollment wizard","description":"Guided form to add a single learner with personal details, guardian info, batch selection, expiry and custom fields."},{"name":"Direct admin enrollment","description":"Enroll an existing or new user straight into a batch, optionally attaching a payment plan and recording an offline payment amount and mode."},{"name":"Add to more batches","description":"Attach additional course batches to an existing learner without re-entering their details."},{"name":"Automatic welcome messages","description":"Send the learner their username and password by email or WhatsApp the moment they are enrolled."},{"name":"Self-enrollment","description":"Learners can join through institute pages and catalog checkout, feeding the same directory."},{"name":"Re-enroll inactive learners","description":"One click restores access for a learner whose registration ended."},{"name":"Enrollment audit trail","description":"Every learner add and update is captured in the admin activity log automatically."}]},{"id":"bulk-learner-import","name":"Bulk Learner Import (CSV)","tagline":"Onboard hundreds of learners from one spreadsheet","description":"Upload a CSV to enroll whole batches at once. You control exactly which columns appear in the template — address, guardian details, expiry, status — and can auto-generate usernames, passwords and enrollment IDs so learners are login-ready immediately.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Configurable CSV template","description":"Choose optional columns (address, city, region, pincode, parent name, parent mobile/email, linked institute, expiry days, status) before download so the sheet matches your data."},{"name":"Auto-generated credentials","description":"Toggle auto-generation of usernames, passwords and enrollment IDs during import."},{"name":"Row-level validation","description":"Uploads are validated with per-row results so bad rows can be fixed and re-uploaded."},{"name":"Default expiry and status","description":"Apply a default access expiry and enrollment status to every imported learner."},{"name":"Credential distribution","description":"Send imported learners their login credentials in bulk after import."}]},{"id":"bulk-assign-deassign","name":"Bulk Assign & De-assign","tagline":"Move thousands of learners between courses, safely","description":"A bulk engine that assigns existing users, brand-new users or a filtered audience into one or more batches — or removes them — in a single operation. A dry-run preview shows exactly what will happen before you commit, with duplicate handling, offline payment capture and optional notifications.","roles":["Admin"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Assign by list, new users or filter","description":"Target explicit users, freshly created users with full profiles including guardian data, or a saved user filter — all in one operation."},{"name":"Multiple destination batches","description":"Each assignment specifies its batch, invite link, payment option, plan and access days, with per-assignment custom field values."},{"name":"Dry-run preview","description":"Simulate the whole operation and see the per-user outcome before committing anything."},{"name":"Duplicate handling","description":"Choose how already-enrolled users are treated (for example, skip) so re-runs are always safe."},{"name":"Offline payment capture","description":"Record a payment amount, mode, transaction ID and date against each bulk enrollment for fee reconciliation."},{"name":"Installment overrides","description":"Override installment schedules for bulk-enrolled users where payment plans apply."},{"name":"Soft or hard de-assign","description":"Remove learners from batches in recoverable soft mode or permanent hard mode, with optional notification and its own dry-run."},{"name":"Optional notifications and credentials","description":"Decide whether learners are notified and whether login credentials are sent as part of the bulk action."}]},{"id":"enrollment-approvals","name":"Enrollment Requests & Approvals","tagline":"Review and approve who joins, one by one or in bulk","description":"A dedicated inbox of learners whose enrollment is pending approval or who were invited but not yet confirmed. Filter by gender, preferred batch, payment status and payment option, then accept or decline individually or across a whole selection.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Pending-request inbox","description":"See every learner awaiting approval or confirmation, with their requested batch and payment details."},{"name":"Accept / decline actions","description":"Approve or reject a request in one click, with bulk accept and bulk decline across selections."},{"name":"Approval with batch placement","description":"Approving a request enrolls the learner into their requested batch immediately."},{"name":"Triage filters","description":"Filter requests by gender, preferred batch, payment status, approval status and payment option."},{"name":"Outreach from the inbox","description":"Share credentials or send WhatsApp and email to requestors without leaving the screen."}]},{"id":"learner-lifecycle-actions","name":"Learner Lifecycle Actions","tagline":"Change batch, extend, renew, terminate — solo or in bulk","description":"Day-to-day registrar actions available on any learner or any multi-select of learners: batch transfers, access extensions, next-session re-registration, termination and deletion, plus outbound actions like credential sharing, WhatsApp and email blasts, and certificate creation.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Change batch","description":"Move one or many learners to a different course, session and level in one dialog."},{"name":"Extend access","description":"Push out session expiry dates individually or in bulk."},{"name":"Re-register for next session","description":"Roll learners into the next academic session with target packages and access days; study material can carry over from the previous session."},{"name":"Terminate registration","description":"End a learner's enrollment, optionally triggering a configured off-boarding workflow."},{"name":"Re-enroll","description":"Restore an inactive learner's access with a single click."},{"name":"Delete learner","description":"Remove learner records entirely, with confirmation and bulk support."},{"name":"Share credentials","description":"Send usernames and passwords to selected learners via your configured channels."},{"name":"Bulk WhatsApp & email","description":"Message any selection of learners straight from the list."},{"name":"Create certificates","description":"Generate course-completion certificates for selected learners from the same bulk menu."},{"name":"Manage access days with history","description":"Extend, shorten, set, make unlimited or revoke course access for one or many learners, with a timeline of every access change kept per learner."},{"name":"Last-access date on soft removal","description":"When removing a learner softly, pick the date their access ends; hard removal ends it now and triggers the termination workflow."}]},{"id":"batch-session-management","name":"Batch & Academic Session Management","tagline":"Structure courses into sessions, levels and batches","description":"Manage the institute's academic structure end to end: create academic sessions, levels and batches through guided steps, organize cohorts into hierarchies, and administer everything from one screen with learner counts always in view.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Create batch wizard","description":"A step-by-step dialog creates the course, level and session in sequence, producing a ready-to-enroll batch."},{"name":"Academic session administration","description":"Add, edit and delete academic sessions, with guards against destructive deletes."},{"name":"Batch listing & summary","description":"Paginated batch lists per session with learner counts, start times, status, and search."},{"name":"Parent-child batch hierarchies","description":"Link parent batches to child batches for cohort hierarchies and franchise structures."},{"name":"Sub-org association","description":"Assign batches to sub-organizations so each branch sees only its own cohorts."},{"name":"Learner grouping","description":"Tie batches to named groups for organizing cohorts within a course."},{"name":"Bulk batch lookup","description":"Look up many batches at once for reporting or integration scenarios."},{"name":"Safe deletion","description":"Remove batches that are no longer needed, individually or in bulk, with confirmation."},{"name":"Batch board","description":"Browse batches grouped by course as cards or a list, search by name or invite code, sort, filter by status and start date, and enroll or open a batch directly."}]},{"id":"seat-inventory","name":"Seat Inventory Management","tagline":"Cap seats per batch and watch availability live","description":"Set maximum seats for any batch and monitor capacity across the institute in real time. Seats are reserved and released automatically during enrollment, and dashboards flag batches that are nearly full — so sales can push urgency or admins can add capacity.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Per-batch capacity","description":"Set maximum seats and available slots for each batch, or mark it unlimited."},{"name":"Automatic reservations","description":"Seats are reserved and released automatically as learners move through enrollment flows — no overselling."},{"name":"Capacity stat cards","description":"At-a-glance totals: total batches, limited vs unlimited, total capacity, seats remaining, and low-availability and critical batches."},{"name":"Availability checks & filters","description":"Check availability for one batch or many at once, and filter inventory by course, level, session, search text and availability status."},{"name":"Table and card views","description":"Switch between a dense table and visual cards over the same inventory data."},{"name":"Quick capacity updates","description":"Update seat counts from a dialog without leaving the inventory screen."}]},{"id":"renewal-automation","name":"Enrollment & Renewal Automation","tagline":"Expiries, reminders and renewals that run themselves","description":"Define per-batch policies for everything around expiry: automated email, WhatsApp and push reminders before and on expiry, waiting periods, automatic renewal charges for saved payment methods, and re-enrollment rules. The scheduler executes these policies continuously without staff involvement.","roles":["Admin","Learner"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Pre-expiry and on-expiry notifications","description":"Configure templated reminders per channel (email, WhatsApp, push) triggered before expiry or the moment it arrives."},{"name":"Expiry processing pipeline","description":"Automated processing moves learners correctly through pre-expiry, waiting period and final expiry stages."},{"name":"Automatic renewal charging","description":"Subscription renewals are charged automatically, and the success or failure drives the learner's status."},{"name":"Re-enrollment rules","description":"Set re-enrollment gap validation and upgrade options, with invite links shown to expired learners."},{"name":"Repurchase behavior","description":"Choose whether a repurchase while still active stacks onto remaining time or overwrites it."},{"name":"Workflow hooks & learner actions","description":"Attach workflows and interactive elements — such as WhatsApp buttons — to each lifecycle stage."},{"name":"Sub-org payment routing","description":"The policy engine recognizes sub-organization-paid enrollments and routes renewal charges accordingly."}]},{"id":"sub-organization-management","name":"Sub-Organization (Branch & Franchise) Management","tagline":"Run branches, franchises and partner orgs under one roof","description":"Create and manage sub-organizations — branches, franchise partners or client companies — each with its own team, seat allocation and finances. Parent-institute admins see seat usage, a full financial ledger and subscription status per sub-org, while partners manage their own learner rosters without needing admin-portal access.","roles":["Admin","Counsellor"],"platforms":["Admin Web","Learner Web"],"subFeatures":[{"name":"Create sub-orgs","description":"Spin up a sub-organization directly, or create one bundled with a subscription — seats, validity and courses — in one step."},{"name":"Seat usage tracking","description":"Monitor seats consumed versus purchased for each sub-org subscription."},{"name":"Financial ledger","description":"Per-sub-org ledger with invoice, payment, waiver, adjustment and penalty entries; record payments and mark invoices paid from the UI."},{"name":"Subscription status","description":"See each sub-org's subscription state and pending installments at a glance."},{"name":"Team roster","description":"Add or remove sub-org team members, list them with filters, and view each member's installment history."},{"name":"Scoped invite links","description":"Enrollment invites can be scoped to a sub-org so its learners register under the right branch."},{"name":"Analytics panel","description":"Per-sub-org dashboard covering admin payments, invoices, member courses and learner lists."},{"name":"Learner-to-sub-org linking","description":"Learners link to sub-orgs as direct, inherited or partnership members, and the main directory filters by sub-org."},{"name":"Member outstanding balances","description":"Per-member financial summary of total accrued, paid, balance and overdue amounts in the sub-org's currency."},{"name":"Partner self-serve roster","description":"Partners get their own in-app screen to view their member roster, add learners individually with custom fields, or bulk upload many at once."},{"name":"Partner member removal","description":"Partners can select and terminate members from their own organization directly."},{"name":"Partner list with seats and status","description":"The sub-org list shows admin contact, plan status and seats used versus total, with search, status and location filters and CSV export."},{"name":"Share partner admin credentials","description":"Send a sub-org admin their login details again straight from the partner list."},{"name":"Sub-org step in enrollment","description":"When enrolling into a partner-linked batch, pick or create the sub-org, confirm its admins and choose the member's role in one step."},{"name":"Soft or hard member removal","description":"Remove a sub-org member immediately, or keep them active until a chosen last-access date."},{"name":"Sub-org scoped staff access","description":"Assign specific sub-orgs to a staff member or custom role so they only see those partners' learners and data."},{"name":"Partner network dashboard widgets","description":"Home-dashboard widgets show partners by location, top partners by seats, plan and seat insights and collection trends, while sub-org admins see their own seats, dues and collections."},{"name":"Your own name for sub-orgs","description":"Rename 'sub-org' to the term your network uses — branch, centre, partner — and the admin screens follow it."}]},{"id":"sub-org-self-registration","name":"Sub-Org Self-Registration","tagline":"Partners onboard themselves through a public link","description":"Publish a registration link that lets a new branch or partner organization sign itself up end to end: fill a custom form, accept terms, verify by OTP, complete KYC, pay online and receive a ready-made workspace with admin access — with optional manual approval by the parent institute.","roles":["Admin"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"Registration templates","description":"Design reusable templates defining form steps, custom fields, terms document and consent items, seat count, validity, allowed team roles, admin permissions and included courses."},{"name":"Public multi-step flow","description":"Applicants save their details, verify email or phone by OTP with resend, and can resume an interrupted registration later."},{"name":"Built-in payments","description":"Collect registration payment online with retry support and a configurable vendor and currency."},{"name":"KYC verification","description":"Integrated identity verification with a document checklist and live status updates."},{"name":"Approval gate & caps","description":"Optionally require parent-institute approval, and cap total registrations per link."},{"name":"Completion experience","description":"Custom completion message, button label and redirect so new partners land exactly where you want them."},{"name":"Registrations pipeline","description":"List every registration with status — including KYC status — and manage templates centrally."}]},{"id":"staff-team-management","name":"Staff, Teams & Org Chart","tagline":"Your whole staff, their teams, and who reports to whom","description":"Manage every staff account centrally — invite by email with pre-assigned roles, create users in bulk, distribute credentials and reset passwords. Model your real organization with departments, nested teams, team heads and reporting lines, all visualized on an interactive org chart.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Institute users view","description":"List all staff with role and status filters, enable or disable accounts, and edit roles in place."},{"name":"Email invitations with roles","description":"Invite admins, teachers, course creators, assessment creators and evaluators with roles pre-assigned; resend or edit pending invitations before acceptance."},{"name":"Bulk user creation","description":"Create many users in one operation — onboard an entire teaching staff at once."},{"name":"Credentials & passwords","description":"Send login credentials individually or in batches, and update or reset passwords when someone is locked out."},{"name":"Search & profile management","description":"Type-ahead search across all users, with editable profiles — name, email, mobile, photo — reflected across every app."},{"name":"Teams & sub-teams","description":"Create named teams, nest them under parent teams, order them for display, and manage each member's access."},{"name":"Team heads & member roles","description":"Designate a head for each team and give every member a role label, such as 'Senior Counsellor'."},{"name":"Reporting lines & org chart","description":"Link each member to the person they report to, and see the whole hierarchy on a visual, drag-and-drop org chart with permission-controlled visibility."},{"name":"Hierarchy lookups","description":"Trace any member's full chain of managers upward, everyone beneath them, and every team they belong to."},{"name":"Sub-org scoped team views","description":"Filter users by sub-org and view a per-sub-org team page with its own analytics."},{"name":"Inactive-user export","description":"Export a CSV of users inactive for a chosen number of days to drive re-engagement."},{"name":"Bulk team import and export","description":"Invite up to 500 people from a CSV with every row validated first and a results file with login details, and export members or pending invites with current filters."},{"name":"Redesigned Teams workspace","description":"Summary cards for members, active, disabled and pending invites double as filters, with a multi-role invite flow and a member drawer for quick edits."}]},{"id":"roles-permissions","name":"Roles & Granular Permissions","tagline":"Decide exactly what each role sees and can do","description":"Access is governed by roles — Admin, Teacher, Evaluator and Learner out of the box — plus unlimited custom roles you define yourself. Configure each role's entire portal experience: which sidebar sections, tabs, columns and dashboard widgets appear, and which sensitive actions are allowed.","roles":["Admin"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Built-in role set","description":"Admin, Teacher and Evaluator roles for staff plus the Learner role for students, each unlocking the right screens and actions."},{"name":"Custom roles","description":"Create, rename and delete institute-specific roles — such as 'Front Desk' or 'Lead Manager' — each with its own permission set and configuration screen."},{"name":"Per-institute role scoping","description":"The same person can be an Admin in one institute and a Teacher in another — roles are scoped to each workspace."},{"name":"Role lifecycle management","description":"Add or remove roles on users, view counts per role, filter by status (invited, active, disabled), and disable access without deleting the account."},{"name":"Per-user permission grants","description":"Grant individual users named permissions on specific resources, on top of what their roles provide."},{"name":"Layout & navigation control","description":"Toggle sidebar sections per role, and add custom tabs and sub-tabs — for example, links out to your own tools."},{"name":"Course & slide permissions","description":"Control access to All Courses, Authored Courses, Courses In Review and Course Approval, plus slide-level rights: copy, move, delete, download and read-only viewing."},{"name":"Learner profile tab control","description":"Show or hide each learner-profile tab per role — Overview, Progress, Tests, Membership, Payment History, Guardian, Enquiry, Lead Profile, Files, Badges, Reports and more."},{"name":"Sensitive account permissions","description":"Per-role switches for viewing learner passwords, sending password resets, accessing the learner portal on a learner's behalf, and editing institute details."},{"name":"Audience & campaign access modes","description":"Restrict a role to specific audience lists — ideal for counsellor teams working separate campaigns."},{"name":"Column & filter pickers","description":"Choose which learner-list columns and which lead-filter custom fields each role sees."},{"name":"Concurrent login limit","description":"Cap active sessions per account to prevent account sharing."},{"name":"Role display names","description":"Role labels shown across the portal respect your institute-configured display names."}]},{"id":"faculty-assignment","name":"Faculty & Teaching Assignment","tagline":"Map every teacher to their subjects and batches","description":"Assign teachers to the exact subjects and batches they teach, update assignments as timetables change, and browse the whole faculty with filters. Fine-grained access grants control what else each staff member can reach.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Assign subjects & batches","description":"Attach a teacher — existing or newly created — to one or more batches with specific subjects per batch."},{"name":"Update assignments","description":"Revise a teacher's batch-subject mapping at any time as timetables change."},{"name":"Faculty directory","description":"Search and filter all faculty with their statuses and assignments; a flat batch-subject view supports auditing."},{"name":"Course-creator lookup","description":"Quickly list faculty who create content, for authoring workflows."},{"name":"Per-user access grants","description":"Grant staff named access to specific resources with a chosen permission level, viewable per user."}]},{"id":"parent-guardian-linking","name":"Parent & Guardian Linking","tagline":"Connect parents to their children's learning accounts","description":"Link parent and guardian accounts to learners so families stay connected to progress, fees and communication. Link existing accounts or create new ones on the spot, in either direction, and backfill guardian links and portal credentials from historical records in bulk.","roles":["Admin","Parent","Learner"],"platforms":["Admin Web","Learner Mobile App","API"],"subFeatures":[{"name":"Link existing or create new","description":"Connect two existing accounts, or create a new guardian or student account on the spot with name, email and mobile."},{"name":"Bidirectional linking","description":"Works from either side — a parent adding their student or a student adding their parent — and supports multiple children per parent."},{"name":"Family relations lookup","description":"Look up a learner's parents or a parent's children from any profile, powering dashboards, notifications and fee communication."},{"name":"Parent lookup by mobile","description":"Find or match a parent account by phone number during admissions or messaging."},{"name":"Bulk guardian backfill","description":"Detect learners whose records contain parent details but no linked guardian account — including from leads — and create the links in one run."},{"name":"Credential backfill","description":"Send portal credentials to guardians of all existing students in one action, choosing who receives the notification."},{"name":"Parent experience settings","description":"Institute-level settings control how guardian details are collected and what parents can access."},{"name":"Share guardian credentials","description":"Email a guardian their portal login from the learner's Guardian tab, with a warning when no real email is on file."},{"name":"Export guardian credentials","description":"Download a CSV of guardian logins with their linked children, available only to roles allowed to view passwords."}]},{"id":"parent-portal","name":"Parent Portal","tagline":"A dedicated portal for parents, from admission to results","description":"Parents get their own portal — with a child selector for multi-child families — covering the entire journey: admission applications, interview and test scheduling, document verification, fee payments, attendance, progress and upcoming schedules. Ideal for schools running structured admission cycles and for keeping families engaged after enrollment.","roles":["Parent","Admin","Teacher"],"platforms":["Learner Web","Learner Mobile App","Public Web"],"subFeatures":[{"name":"Multi-child support","description":"All children under one login, with one-tap switching between child profiles."},{"name":"Parent dashboard","description":"An overview per child of admission progress, attendance, scores, completion, certificates, payment status, schedule and pending actions."},{"name":"Digital application form","description":"Parents fill and submit the admission application online."},{"name":"Interview & tests module","description":"View and track scheduled interviews and entrance assessments."},{"name":"Admission tracker","description":"A step-by-step status tracker showing exactly where the child is in the admission pipeline."},{"name":"Document verification","description":"Upload required documents and track them through verification."},{"name":"Fee payments","description":"Pay admission and course fees online, with a clear breakdown of what is due."},{"name":"Schedule view","description":"The child's upcoming sessions and events, visible to parents."},{"name":"Branded parent mobile app","description":"A native mobile experience under the institute's own brand, with push notifications."},{"name":"Structured faculty messaging","description":"Parent-to-faculty messages routed through the platform, keeping staff personal numbers private."},{"name":"Progress digests & alerts","description":"Automatic progress digests and alerts delivered over WhatsApp, email and push."},{"name":"Multi-language interface","description":"Parents choose their preferred language for the portal."},{"name":"My Child monitoring hub","description":"After enrollment, parents get a per-child home with progress, attendance, tests, live classes, fees and rewards modules, plus items that need their attention."},{"name":"AI parent assistant","description":"Parents ask questions about their child in their own words — typed or spoken — and get answers drawn only from that child's data, in the language they asked in, with a listen option."},{"name":"View as my child","description":"When the institute allows it, a parent can switch into their child's learner view, with a clear banner and one tap to return."},{"name":"Rewards and points","description":"A rewards screen shows the child's points, institute rank, badges and certificates earned."},{"name":"Guided tour and quick search","description":"A first-time tour walks parents through the portal, and quick search jumps straight to any module."}]},{"id":"learner-attendance","name":"Learner Attendance Reports","tagline":"Learners and parents always know the attendance picture","description":"Attendance captured in live classes rolls up into learner- and parent-facing reports. A weekly widget shows day-by-day status on the dashboard, and a full report page lets families review attendance history across batches.","roles":["Learner","Parent"],"platforms":["Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Weekly attendance widget","description":"A day-by-day present, absent or pending view of the current week, right on the dashboard."},{"name":"Attendance report page","description":"Detailed attendance history with session-level records across batches."},{"name":"Attendance-driven stats","description":"Attendance percentages feed dashboard stats and achievement badges."}]},{"id":"planning-diary-logs","name":"Teacher Planning & Diary Logs","tagline":"Lesson plans and daily diaries, shareable with students","description":"Teachers record lesson plans and diary logs against a batch and subject for any interval — daily, weekly, monthly or yearly. Entries are rich documents with attachments, browsable as a table or timeline, and can be shared so learners and parents see what was planned versus what was done.","roles":["Teacher","Admin","Learner","Parent"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Plans and diaries","description":"Create forward-looking planning entries or retrospective diary logs — two distinct record types."},{"name":"Interval-based organization","description":"Attach logs to daily, weekly, monthly or yearly periods, with quick pickers for today, tomorrow, this week, next month and more."},{"name":"Rich content editor","description":"Write plans in a rich-text editor with an automatic title generator and file attachments."},{"name":"Batch & subject scoping","description":"Every entry ties to a specific batch and subject so records line up with the timetable."},{"name":"Share with students","description":"Toggle any plan to be visible to learners."},{"name":"Table & timeline views","description":"Browse logs as a filterable table or a chronological timeline, and edit entries in place."},{"name":"Learner-side today's plan","description":"Learners see the current day's plan highlighted on their planning page for quick action."},{"name":"Learner activity timeline","description":"Learners and parents browse planning and activity logs on a timeline, filter by period and type, and open attachments on each entry."}]},{"id":"custom-fields","name":"Custom Fields & Data Model Builder","tagline":"Capture exactly the data your institute needs","description":"Define your own data fields — text, dropdowns, dates, files, multi-selects and more — and attach them to enrollment forms, live-session and assessment registrations, audience campaigns or institute-wide learner records. Map custom fields to built-in system fields and keep both in sync automatically.","roles":["Admin","Counsellor"],"platforms":["Admin Web","Public Web","API"],"subFeatures":[{"name":"12 field types","description":"Text, textarea, email, URL, number, date, phone, dropdown, radio, checkbox, file upload and multi-select — dropdown-style fields carry their own configurable option lists."},{"name":"Attach fields anywhere","description":"Scope fields institute-wide or per enrollment invite, live session, assessment or audience form — each context gets its own tailored set."},{"name":"Reusable field library","description":"Create fields once and reuse them across enrollment invites, audience forms and learner profiles."},{"name":"Field groups & ordering","description":"Organize fields into groups and control their order on forms."},{"name":"File-upload answers","description":"Forms can collect document and image uploads as answers to custom fields."},{"name":"System-field mapping & sync","description":"Map custom fields to built-in fields on students, users or enquiries, and sync values automatically in either direction."},{"name":"Usage tracking & safe deletion","description":"See everywhere a field is used before deleting; deletions are soft and can be done in bulk."},{"name":"Custom fields in filters & columns","description":"Expose chosen custom fields as lead filters and learner-list columns per role, and render them on public enrollment and enquiry pages."}]},{"id":"catalog-operations-console","name":"Catalog Operations Console","tagline":"Administer every course, price and batch from one table","description":"A power-admin console over the entire course catalog. See every course and batch combination in a filterable table, edit course details, sessions, payment options and invites inline, and manage pricing at scale — including bulk offers and CSV-driven course creation.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Catalog table with filters","description":"A filterable, paginated table of all courses and their batch variants, with a detail sidebar per batch."},{"name":"Inline edit dialogs","description":"Edit a course, its session, its payment option or its enrollment invite directly from the table row."},{"name":"Bulk offer pricing","description":"Select eligible batches by session, level and status and apply an offer price across all of them at once, with per-row eligibility reasons, a results summary and a reset-to-original option."},{"name":"Bulk course creation from CSV","description":"Import many courses at once — with type, tags, batches, seat inventory and payment configuration per row — including similar-course detection, preview and global defaults."},{"name":"Payment configuration at scale","description":"Set free, one-time, subscription or donation pricing, currency, validity days, strike-through price and approval requirements during bulk creation."},{"name":"Publishing control","description":"Choose per course whether it appears in the public catalogue."}]},{"id":"student-terms-conditions","name":"Student Terms & Conditions","tagline":"Digital T&C signing built into enrollment","description":"Upload your institute's terms and conditions as a PDF and have learners sign digitally with their name during enrollment. Chosen staff are notified by email every time a learner signs.","roles":["Admin","Learner"],"platforms":["Admin Web","Learner Web"],"subFeatures":[{"name":"T&C PDF upload","description":"Upload the terms document learners must accept."},{"name":"Named signature","description":"Require the learner's name on the signature for a stronger record."},{"name":"Sign notifications","description":"Notify chosen email recipients whenever a learner signs."}]},{"id":"hr-employee-records","name":"HR: Employee Records","tagline":"A proper HRIS for your staff, inside the platform","description":"Maintain complete employee records for all staff: profiles, departments, designations, employment type and status, bank accounts for salary and a document vault. Employee state changes — probation, notice period, relieved — are tracked formally. Everything is managed from an opt-in ERP section of the admin portal, restricted to HR roles, and is also available by API.","roles":["Admin"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Employee profiles","description":"Create and update employee profiles with filtering and search across the workforce."},{"name":"Departments & designations","description":"Define departments and designations and organize employees under them."},{"name":"Employment types & statuses","description":"Track full-time, part-time and contract staff through statuses: active, probation, notice period, relieved, terminated."},{"name":"Bank details","description":"Store one or more bank accounts per employee for salary payout, editable over time."},{"name":"Document vault","description":"Upload and manage employee documents — offer letters, appointment letters, ID proofs, PAN, Aadhaar, passport, degrees, experience and relieving letters."},{"name":"Reporting-line view","description":"See any employee's position in the org chart — their manager and their reports."},{"name":"Bring existing staff into HR","description":"See every team member and whether they have an HR profile, and create one from their existing account in one click — no new user or invitation."},{"name":"Employee workspace","description":"Each employee has a detail page with profile, employment and salary tabs, and a guided dialog for status changes such as probation or notice period."},{"name":"Probation and document reminders","description":"HR is emailed a week before an employee's probation ends, and 30 and 7 days before documents such as visas or contracts expire."}]},{"id":"hr-staff-attendance","name":"HR: Staff Attendance & Shifts","tagline":"Check-ins, shifts, holidays and regularization","description":"Track staff attendance with self check-in and check-out or admin bulk marking, sourced manually, from biometric devices or by geo-location. Define shifts and assign them to employees, maintain the holiday calendar, and let staff request regularization of missed punches with approval.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Check-in / check-out","description":"Employees punch in and out; records capture the source — manual, biometric device or geo-location — and mode."},{"name":"Bulk attendance marking","description":"Mark attendance for many employees at once with statuses: present, absent, half day, on leave, holiday, weekend."},{"name":"Records & summaries","description":"Query attendance history and per-period summaries for one employee or across the institute."},{"name":"Attendance configuration","description":"Institute-level attendance settings, including the time-tracking mode."},{"name":"Regularization requests","description":"Staff raise requests for missed or incorrect punches; approvers act on them through the approval workflow."},{"name":"Shift management","description":"Create shifts, edit timings and assign shifts to employees."},{"name":"Holiday calendar","description":"Maintain holidays individually or via bulk upload, with edit and delete."},{"name":"Daily attendance board","description":"See everyone active on a given day, including those with no record yet, and mark selected employees present, absent, half day or on leave in one go."},{"name":"Time-tracking or day-level mode","description":"Choose check-in based tracking with hour thresholds for full and half days, or simple day-level marking, plus weekly off-days and the institute time zone."},{"name":"Auto checkout and auto absent","description":"Open check-ins can be closed automatically at a set time, and working days with no record or approved leave are marked absent so payroll is never overpaid."},{"name":"Month freeze after payroll","description":"Attendance and leave for a month lock once its payroll is processed, so paid figures cannot change unless the run is rejected first."}]},{"id":"hr-leave-management","name":"HR: Leave Management","tagline":"Policies, balances, approvals and comp-offs, automated","description":"A full leave system: define leave types and policies with monthly or yearly accrual, let staff apply — including half days — route approvals, and keep balances accurate with adjustments, scheduled accrual runs and year-end carry-forward processing. Compensatory off is supported end to end.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Leave types & policies","description":"Create leave types and policy rules with monthly or yearly accrual, and update them as HR rules evolve."},{"name":"Apply & track","description":"Employees apply for full or half-day leave, follow the status — pending, approved, rejected, cancelled — and cancel when needed."},{"name":"Approval queue","description":"Managers see pending applications and approve or reject in one action."},{"name":"Leave balances","description":"Per-employee balances with manual adjustment for corrections."},{"name":"Accrual & year-end runs","description":"Run accrual processing and year-end carry-forward or lapse processing across the institute."},{"name":"Compensatory off","description":"Grant comp-off for extra days worked, approve or reject requests, and keep full comp-off history."},{"name":"Automatic accrual and comp-off expiry","description":"Leave accrues on schedule and unused compensatory offs expire automatically, with joiners and leavers prorated."},{"name":"Decision emails","description":"Employees are emailed as soon as their leave, comp-off or regularization request is approved or rejected."}]},{"id":"hr-approval-workflows","name":"HR: Approval Workflows","tagline":"Multi-step approval chains for every HR request","description":"Configure who approves what: build approval chains where each step is the reporting manager, department head or HR admin. Chains govern leave applications, attendance regularizations, reimbursements and loans, with a unified pending queue and a complete history.","roles":["Admin"],"platforms":["API"],"subFeatures":[{"name":"Approval chain builder","description":"Define ordered approver steps by type: reporting manager, department head or HR admin."},{"name":"Broad coverage","description":"Chains apply to leave applications, attendance regularization, reimbursements and loans."},{"name":"Unified pending queue","description":"Approvers see everything awaiting them in one place and approve or reject per request."},{"name":"Approval history","description":"A complete audit trail of who approved what, and when."}]},{"id":"hr-payroll","name":"HR: Payroll, Payslips & Disbursement","tagline":"Salary runs from calculation to paid, with holds","description":"Run monthly payroll end to end: create a run, auto-calculate every employee's entry from their salary structure, review component-level breakdowns, hold or release individual payouts, then approve and mark the run paid. Loans, salary advances and expense reimbursements flow into the same run, and payslips and bank-transfer files come out the other side.","roles":["Admin"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Payroll runs","description":"Create, process, approve, mark paid or delete runs; statuses move through draft, processing, processed, approved and paid."},{"name":"Entry-level detail","description":"Inspect each employee's payroll entry and every earning and deduction component behind it."},{"name":"Hold & release","description":"Put any employee's payout on hold within a run and release it later."},{"name":"Loans & salary advances","description":"Issue salary advances or personal loans, approve them, and track repayments that auto-deduct through payroll."},{"name":"Reimbursements","description":"Staff claim travel, medical, food, phone or internet expenses; approved amounts pay out through payroll."},{"name":"Payslip generation","description":"Generate payslips in bulk for a run, retrievable individually per employee."},{"name":"Bank export files","description":"Produce bank-ready disbursement exports for salary transfer, with a log of every export."},{"name":"Payroll summary reports","description":"Aggregate payroll cost reporting across periods for management and finance."},{"name":"Off-cycle, bonus and full-and-final runs","description":"Alongside the regular monthly run, create runs that pay only pending off-cycle items, bonuses, or the final dues of employees leaving that month."},{"name":"Payslip PDFs by email","description":"Generate a PDF payslip per employee and email each person their own copy when you choose, with held employees skipped."},{"name":"Bank-ready files","description":"Download salary transfer files as CSV, a formatted workbook, or NEFT layouts for HDFC, ICICI and SBI, restricted to HR admins."},{"name":"Errors without failed runs","description":"Employees whose pay cannot be computed are listed on an Errors tab instead of failing the whole run."},{"name":"Reject and unwind","description":"Rejecting a processed or approved run reverses loan deductions, reimbursements and journal postings so the month can be corrected and re-run."}]},{"id":"hr-salary-structures-tax","name":"HR: Salary Structures & Employee Tax","tagline":"Reusable salary templates with India-ready tax handling","description":"Model compensation with earning and deduction components calculated as flat amounts or percentages of basic, CTC or gross. Combine components into reusable templates, assign structures per employee with overrides, and handle Indian income tax — investment declarations and old-versus-new regime computation — inside payroll so TDS deductions are correct.","roles":["Admin"],"platforms":["API"],"subFeatures":[{"name":"Salary components","description":"Define earning and deduction components as a fixed amount or a percentage of basic, CTC or gross, categorized fixed or variable."},{"name":"Salary templates","description":"Bundle components into templates for common pay grades, editable centrally."},{"name":"Employee structures with overrides","description":"Assign a structure to each employee with component-level overrides where needed."},{"name":"Revision history","description":"Every salary revision is recorded and listable for audits and increment cycles."},{"name":"Tax configuration","description":"Institute-level tax setup covering financial-year parameters."},{"name":"Investment declarations","description":"Employees submit and update declarations, and HR verifies them before they affect tax."},{"name":"Regime-aware tax computation","description":"A built-in engine computes each employee's liability under India's old or new tax regime, keeping TDS deductions accurate."},{"name":"Statutory deductions built in","description":"Provident Fund, ESI and Professional Tax are calculated automatically as part of every payroll run."},{"name":"Current-year tax rules","description":"Tax is computed under the current financial year's rules for both regimes, including rebate, HRA exemption, surcharge and cess, with year-to-date true-up."},{"name":"Formula components and effective dates","description":"Define components with formulas, date salary revisions from when they take effect, and prorate pay for mid-month joiners and leavers."},{"name":"Gulf payroll support","description":"Run payroll for the UAE and Saudi Arabia with local social-security contributions and end-of-service benefit accrual."}]},{"id":"hr-statutory-compliance","name":"HR: Statutory Compliance & Provisions","tagline":"Statutory returns and provisions straight from payroll","description":"Generate the statutory files your institute must submit, built directly from approved payroll runs. A filings hub shows only the returns that apply to your country — India or the Gulf — with a preview of what each contains and what is missing before you download. Long-service and bonus provisions are computed for the books, and a statutory bonus can be pushed into payroll in one step.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Country-aware filings hub","description":"Only the returns relevant to your institute's country appear, each with a lazy preview listing contents and gaps before you download the file."},{"name":"Provident Fund ECR","description":"Produce the monthly electronic challan-cum-return file for upload to the EPFO employer portal, with employees missing a UAN flagged."},{"name":"ESI and Professional Tax returns","description":"Generate the monthly ESIC contribution return and the state professional-tax return, slab-wise, from the month's payroll."},{"name":"Form 24Q quarterly TDS","description":"Prepare the quarterly salary-TDS return, reconciled against your recorded tax deposits so any mismatch is highlighted before filing."},{"name":"Form 16 for employees","description":"Produce each employee's annual salary and TDS statement (Part B) as a PDF, ready to pair with Part A from the tax portal."},{"name":"TDS challan register","description":"Record every tax deposit made against salary withholding by financial year and quarter, feeding the Form 24Q reconciliation."},{"name":"Gratuity provision","description":"Compute what the institute would owe staff for long service as of any date, applying statutory vesting rules and caps, and download the report."},{"name":"Statutory bonus","description":"Calculate the annual statutory bonus at a rate you choose within the legal range, then create bonus entries for a bonus payroll run in one click."},{"name":"Gulf payroll compliance","description":"Generate Wage Protection System salary files for the UAE and Saudi Arabia and an end-of-service benefit provision split between statutory liability and accounting accrual."}]},{"id":"hr-variable-pay","name":"HR: Variable Pay, Teaching Pay & Incentives","tagline":"Pay teachers for classes and counsellors for sales","description":"Add one-off earnings and deductions to any month's payroll, and turn real platform activity into pay. Teaching pay is priced from the live classes each teacher actually took, and counsellor incentives are computed from fees actually collected on leads they converted. Everything is previewed first and only paid when a payroll run picks it up, so nothing moves money on its own.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"One-off adjustments","description":"Record incentives, arrears, recoveries and other one-off earnings or deductions for a month; each waits for the matching payroll run and locks once paid."},{"name":"Teaching pay from live classes","description":"See what each teacher taught in the month and price it from a per-session or per-hour rate on their employee record."},{"name":"Teaching days to attendance","description":"Mark every day a teacher took a class as present in staff attendance, leaving days already marked present or on leave untouched."},{"name":"Counsellor sales incentives","description":"Compute each counsellor's incentive from revenue collected on leads they converted, using a commission percentage, a fixed amount per conversion, or both."},{"name":"Choose the payout month","description":"Earn incentives in one month and pay them in a later month's payroll run, with a warning if both months are the same by mistake."},{"name":"Preview, then pay safely","description":"Every calculation is previewed before anything is written, and creating the payroll entries twice for the same month never doubles a payment."},{"name":"Unlinked staff flagged","description":"Teachers or counsellors without an HR profile are listed separately so you can fix their records rather than silently missing their pay."}]},{"id":"hr-self-service","name":"HR: Employee Self-Service (My HR)","tagline":"Staff manage their own HR tasks in one place","description":"Every staff member with an employee profile gets a My HR area inside the admin portal. They can check in and out, apply for leave, claim expenses, download payslips and declare tax-saving investments without chasing the HR team. Their details stay maintained by HR, and every request flows into the same approval queues admins already use.","roles":["Admin","Teacher","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"My HR overview","description":"One page with the employee's profile, this month's attendance, leave balances and latest payslip, with sensitive ID numbers partly masked."},{"name":"Check in and check out","description":"Staff punch in and out from a simple card, with the day's status visible immediately."},{"name":"Apply for leave","description":"Request full or half-day leave against available balances, follow each request's status and cancel when plans change."},{"name":"Expense claims","description":"Submit travel, medical, food, phone or internet reimbursements and track them through approval to payout in payroll."},{"name":"My payslips","description":"View and download every payslip by year as a PDF, as soon as payroll has been run for the month."},{"name":"Tax declarations","description":"Choose the tax regime and declare planned investments and rent so monthly tax deductions match what the employee will actually owe; declarations lock once HR verifies them."}]},{"id":"erp-finance-journal","name":"ERP Finance: Payroll Journal & P&L Snapshot","tagline":"Payroll lands in your books automatically","description":"Approving a payroll run automatically posts a balanced double-entry salary journal, and rejecting it reverses the entries, so the books always match payroll. Export journals to your accounting software, and see a monthly P&L snapshot comparing fee revenue actually collected with what payroll cost — overall and by department.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Automatic salary journal","description":"Approving a payroll run posts salary expense, statutory liabilities and net pay payable as one balanced journal entry, with no manual bookkeeping."},{"name":"Automatic reversals","description":"Rejecting or cancelling an approved run writes the reversing entries, so corrections never leave the ledger out of step."},{"name":"Ledger account mapping","description":"Map each salary component to a ledger account code so postings land in the right accounts of your chart."},{"name":"Monthly journal view","description":"Browse every posting for a month, newest first, with debit and credit lines shown for each entry."},{"name":"Accounting export","description":"Download a month's journal as a voucher batch that imports into Tally or Zoho Books."},{"name":"P&L snapshot","description":"Compare collected fee revenue with total payroll cost for a month, with margin and cost-to-revenue ratio, and download it as CSV."},{"name":"Payroll cost by department","description":"See headcount, employer cost and share of total payroll for each department, including employer statutory contributions."}]}],"demo":{"intro":"Run the whole institute from one place — follow a registrar's day from the learner directory through bulk enrollment, batches and branches, to payroll.","screens":[{"id":"directory","device":"desktop","title":"Learner Directory","nav":["Dashboard","Learners*","Batches","Sub-Orgs","HR","Reports","Settings"],"widgets":[{"type":"header","id":"dir-head","title":"Learners","subtitle":"2,318 across 4 sessions","actions":["+ Enroll Learner","CSV Import","Export"]},{"type":"stats","id":"dir-stats","items":[{"label":"Active","value":"2,046","delta":"+184 this month"},{"label":"Pending approval","value":"37"},{"label":" ,"tone":"orange"}],["Kavya Menon","Maths Faculty","₹71,300",{"chip":"Pending","tone":"gray"},{"chip":"—","tone":"gray"}]]}],"module":"crm"}],"steps":[{"screen":"directory","target":null,"title":"Every learner, one directory","text":"Search 2,000+ learners with type-ahead, filter by batch, status, payment, session-expiry window or any custom field, and export any view to CSV — including a credentials export for offline distribution."},{"screen":"directory","target":"dir-stats","title":"Registrar problems surface themselves","text":"Live headcounts flag what needs action today: pending approvals to accept or decline, enrollments expiring within 30 days, and overdue payments — before parents call to complain."},{"screen":"directory","target":"dir-table","title":"Act on any row, or any selection","text":"Open a side-panel profile — guardian info, batch memberships, per-chapter progress — or multi-select to change batch, extend access, re-register for the next session, or blast WhatsApp and email."},{"screen":"bulk-ops","target":"bulk-form","title":"Move thousands of learners at once","text":"Bulk-assign a CSV of new users, an explicit list, or a saved filter into one or more batches — with access days, offline payment capture (amount, mode, transaction ID) and optional credential delivery."},{"screen":"bulk-ops","target":"bulk-preview","title":"Dry-run before you commit","text":"A simulation shows the per-learner outcome first: who gets enrolled, who's skipped by the duplicate rule, and which rows need fixes. Re-runs are always safe — nothing changes until you commit."},{"screen":"batches","target":"seat-stats","title":"Seat inventory, live","text":"Cap seats per batch and watch capacity institute-wide. Seats reserve and release automatically during enrollment — no overselling — and nearly-full batches are flagged so you add capacity or push urgency."},{"screen":"batches","target":"batch-cards","title":"Sessions, levels and batches","text":"A guided wizard creates course, level and academic session in sequence, producing a ready-to-enroll batch. Parent-child hierarchies and learner groups keep large cohorts organized."},{"screen":"batches","target":"suborg-list","title":"Branches and franchises under one roof","text":"Each sub-org gets its own team, seat allocation and financial ledger — invoices, payments, waivers, penalties. Partners manage their own rosters through a self-serve screen, even by public self-registration link."},{"screen":"hr","target":"hr-stats","title":"A real HR suite, built in","text":"Staff check in manually, by biometric device or geo-location; leave policies accrue monthly or yearly; and regularizations, leave and reimbursements route through multi-step approval chains."},{"screen":"hr","target":"payroll-table","title":"Payroll from calculation to paid","text":"Monthly runs auto-calculate every entry from salary structures with regime-aware Indian tax. Hold or release individual payouts, generate payslips in bulk, and export bank-ready transfer files."}]}},{"id":"analytics","name":"Analytics & Reports","icon":"rpt","color":"#0891B2","tagline":"Dashboards and reports for learning, sales, fees and engagement","description":"Every part of Vacademy — learning, sales, finance, communication and operations — feeds into a connected reporting layer, so leadership runs the institute on live data instead of end-of-month spreadsheets. Role-aware dashboards surface what matters to each team, AI turns raw activity into readable report cards for students and parents, and every report exports as branded PDFs or CSVs under your own letterhead.","features":[{"id":"ai-student-report-cards","name":"AI Student Report Cards","tagline":"A complete AI-written report on any student, on demand","description":"Generate a comprehensive report card for any learner that pulls together everything the platform knows — attendance, marks, course progress, assignments, live-class participation, doubts asked, login habits, achievements and certificates — and adds an AI-written narrative with insights and topic-level confidence. Export it as a polished PDF or email it straight to parents, and let learners open their own reports in the app.","roles":["Admin","Teacher","Learner","Parent"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"One-click report generation","description":"Kick off an AI analysis for any student and track the run until the finished report is ready."},{"name":"Comprehensive data sections","description":"Overview, identity, attendance, academics and subject marks, course progress, assignments, live classes, doubts and engagement, study habits, login activity, achievements and certificates — all aggregated automatically."},{"name":"AI narrative and insights","description":"A readable, teacher-quality narrative plus AI insights and per-topic confidence ratings that explain how the student is really doing."},{"name":"PDF export","description":"Download any report as a polished, branded PDF report card."},{"name":"Email delivery to parents","description":"Send the report card by formatted email — ideal for keeping parents in the loop."},{"name":"External data enrichment","description":"Attach records from outside the platform to a student's profile so they are woven into future reports."},{"name":"Learner reports hub","description":"Learners and parents open every institute-generated report card from a dedicated 'My Reports' area, with report status per run."},{"name":"Printable report view","description":"Report cards render in a clean, print-friendly layout for sharing and filing."}]},{"id":"admin-home-dashboard","name":"Admin Home Dashboard","tagline":"A role-aware command center with live KPIs","description":"The landing dashboard adapts to each staff member's role — admins see institute-wide KPIs and finance, teachers see today's classes and their courses. Widgets cover enrollments, live classes, doubts, notifications, payments and real-time user analytics, with one-click quick actions for the most common tasks.","roles":["Admin","Teacher","Evaluator"],"platforms":["Admin Web"],"subFeatures":[{"name":"Role-based widget bundles","description":"Admins, teachers, course creators, assessment creators and evaluators each get a curated default widget set, adjustable through display settings."},{"name":"KPI band with deltas","description":"Headline institute KPIs with change-over-period deltas so trends are obvious at a glance."},{"name":"Quick actions strip","description":"Role-relevant one-click actions: add student, new batch, announcement, payments, reports, today's classes, my courses, new course, assessments and evaluations."},{"name":"Operational widgets","description":"Widgets for enrolling learners, live classes with editable class links, unresolved doubts, recent notifications, pending actions, the learning center and the assessment center."},{"name":"Finance widgets","description":"A finance summary and recent transactions right on the home screen."},{"name":"Real-time usage widgets","description":"Live tiles for currently active users, hourly activity, daily trends, most active users, device usage and service usage."},{"name":"User management tabs","description":"Manage institute users, send invites and view learners without leaving the dashboard."},{"name":"Guided onboarding tracker","description":"New institutes see a step-by-step onboarding tracker that walks them through setting up their workspace."},{"name":"Admin profile editing","description":"Edit your own profile and account details directly from the dashboard."},{"name":"Amount-collected trend","description":"A chart of fees collected over the last few days or all time, with the total and number of payments for the period."},{"name":"Partner network widgets","description":"Institutes running branches or partners see a network snapshot, plan status, seat utilisation, top partners by seats used and a location map by state, ght notable movements in your numbers."},{"name":"Team and date scoping","description":"7/30/90-day presets or custom ranges plus a team picker; permissions control whether a manager sees their team or the whole institute."}]},{"id":"live-activity-feed","name":"Live Business Activity Feed","tagline":"Leads, enrolments, calls and payments as they happen","description":"A live, institute-wide stream of business activity: prospects moving through enrolment forms, leads arriving from any source, counsellors on calls and payments succeeding or failing. Each person appears as a single row that updates in place, so you see that someone is stuck at payment rather than a pile of separate events. A built-in dashboard adds KPIs, the enrolment funnel and team activity, and the tab is opt-in per role.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Real-time streaming feed","description":"New activity appears instantly without refreshing, with recent history loaded first and missed events replayed after a reconnect."},{"name":"One row per person","description":"Each prospect's enrolment journey collapses into one live row showing their current stage, so payment drop-offs and stuck applicants stand out."},{"name":"Category tabs","description":"Switch between invite-form progress, lead forms, calls, payments and counsellor activity, or view everything together."},{"name":"KPI tiles with trends","description":"Leads, enrolments, revenue, call connect rate and a needs-attention count, each compared with the previous period."},{"name":"Enrolment funnel and charts","description":"See where prospects stop in the enrolment funnel, activity by hour, lead sources, counsellor activity and call outcomes."},{"name":"Needs-attention list","description":"Abandoned checkouts are surfaced from their live status and clear themselves automatically once the person pays."},{"name":"Pause on hover","description":"Hovering over the feed holds new rows back so you can ce report","description":"AI-assisted intelligence summaries of CRM performance when call intelligence is enabled."},{"name":"Center heatmap","description":"Center-level heatmap analytics of lead activity across locations."},{"name":"Shared filter bar and deep links","description":"Date presets or custom ranges, team scope and counsellor scope apply across every tab; the active tab lives in the URL for shareable deep links."},{"name":"Campaigns (UTM) report","description":"How many people each campaign source, medium and channel brought in, how many enrolled and the daily trend, with every row drilling through to the matching leads."},{"name":"Lead calls report","description":"Attempts and outcomes per lead — connected, callback, not picked up — plus a list of new leads that have never been called."},{"name":"Current status by counsellor","description":"A matrix of each counsellor's leads by their current status for the selected period, exportable to CSV."}]},{"id":"admission-pipeline-dashboard","name":"Admission Pipeline Dashboard","tagline":"Your enquiry-to-admission funnel at a glance","description":"A dedicated dashboard showing total enquiries, applications and admissions with conversion rates at every step — including how many admissions came from enquiries, from applications only, or arrived directly. Filter by batch and academic session, then drill into the actual people at each stage.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Funnel metrics","description":"Totals for enquiries, applications and admissions plus enquiry-to-application, application-to-admission and overall conversion rates."},{"name":"Admission origin split","description":"See how many admissions started as an enquiry, came from an application only, or were direct admissions."},{"name":"Batch and session filter","description":"Scope the whole dashboard to a specific batch and academic session, or view institute-wide."},{"name":"Pipeline people table","description":"A drill-down table of the actual people sitting at each stage of the pipeline."}]},{"id":"learner-progress-reports","name":"Learner Progress Reports & Email Digests","tagline":"Automatic daily, weekly and monthly progress reports","description":"Track every learner's study progress subject by subject, chapter by chapter and slide by slide — for individuals or whole batches — and export any view as a PDF. Automated daily, weekly and monthly email digests keep learners and parents informed without anyone lifting a finger, and the same reports are available in context right inside the study library.","roles":["Admin","Teacher","Learner","Parent"],"platforms":["Admin Web","Learner Web"],"subFeatures":[{"name":"Learner progress drill-down","description":"Subject-wise, chapter-wise and slide-wise (date-wise) progress views per learner, including average daily time spent."},{"name":"Batch reports and leaderboard","description":"Batch-level subject and chapter progress plus a leaderboard ranking learners to drive healthy competition."},{"name":"Scheduled email digests","description":"Daily, weekly and monthly progress report emails, generated and sent automatically on schedule."},{"name":"Institute and per-learner settings","description":"Admins set the institute-wide report policy; individual learners can carry their own digest settings."},{"name":"PDF exports","description":"Export batch reports, learner reports, subject-wise reports, module progress reports and chapter-wise batch or learner reports as PDFs."},{"name":"In-context study library reports","description":"Batch, individual-learner and leaderboard views open directly inside the study library, so teachers spot who is falling behind without leaving the content area."},{"name":"Course Reports tab","description":"Batch, learner, timeline and leaderboard reports open directly inside each course, so teachers review progress without leaving the course."},{"name":"Per-learner course progress","description":"A dedicated
