tab breaks down any learner's progress through a course, with details in a side drawer."},{"name":"Multi-batch reports and CSV export","description":"Select several batches at once for progress and AI analysis reports, and export the results to CSV."},{"name":"Quiz Results tab","description":"See how a batch performed on every quiz in a course: participation, average score, score distribution and who has not attempted yet."},{"name":"Question-level quiz insights","description":"For each quiz question, see what share of the class got it wrong and which wrong option pulled them there."}]},{"id":"scheduled-email-reports","name":"Scheduled Email Reports","tagline":"Institute insights delivered to your team's inbox","description":"Instead of waiting for someone to log in and look, the platform emails your team a digest of what happened — daily, weekly or monthly. Choose the sections, the scope (whole institute, per batch, per subject or per faculty) and the roles who receive it, preview exactly what each person will get, and optionally add an AI analysis that says what to do next. Every delivery is logged so you always know who received which report.","roles":["Admin","Teacher","Evaluator"],"platforms":["Admin Web"],"subFeatures":[{"name":"Daily, weekly and monthly digests","description":"Set up any number of schedules with their own day and hour, worked out in the institute's own timezone."},{"name":"Report sections","description":"Pick from inactive learners, learner engagement, live-class attendance, assessments, doubts, payments, admissions pipeline, calling activity, session feedback and AI usage."},{"name":"Only sections with data","description":"Sections are offered only where your institute actually has data, and the reason is shown for any section that is unavailable."},{"name":"Scoped fan-out","description":"Send one institute report or a separate report per batch, subject or faculty, with a plain-language count of how many reports each run will produce."},{"name":"Role-based recipients","description":"Send to everyone holding a role such as admin, teacher or evaluator; teachers automatically receive only their own batches."},{"name":"Preview and send now","description":"See the report exactly as you would receive it before saving, or send it immediately to test a schedule."},{"name":"Optional AI analysis","description":"Add an AI-written section that reads the numbers and recommends who to reach and what to fix, with a per-run credit cap."},{"name":"Skip quiet periods","description":"Optionally skip sending when there is nothing to report, so empty digests never reach anyone."},{"name":"Delivery history","description":"A log of every run with its status, recipients and how many learners were named, plus a who-received-it view per run."}]},{"id":"learner-activity-analytics","name":"Learner Activity & Usage Analytics","tagline":"Real-time visibility into who is learning right now","description":"Live and historical analytics on learner behavior across the institute: who is online this minute, daily and hourly activity patterns, your most engaged learners, and which devices and platform areas they use most. Perfect for spotting engagement drops before they become dropouts.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Real-time active users","description":"A live counter of learners on the platform right now, with a list of exactly who is online."},{"name":"Daily and hourly activity patterns","description":"Day-by-day trend charts and hour-of-day heat views reveal when your learners actually study."},{"name":"Engagement trends over time","description":"Activity summaries and trends over configurable time ranges — including a same-day snapshot — to spot momentum or drop-off."},{"name":"Most active learners leaderboard","description":"Rank learners by activity to identify champions and at-risk students."},{"name":"Device usage breakdown","description":"See the split of learners across web, mobile and desktop."},{"name":"Feature usage breakdown","description":"Which parts of the platform — learning, assessments, live classes and more — get used most."},{"name":"Student login statistics","description":"Login frequency and recency per student, feeding attendance-style regularity reports."},{"name":"Completion threshold","description":"Choose the progress percentage at which a slide or chapter shows as completed in the learner app."},{"name":"Honest reading time","description":"Set the minimum time per document page or interactive step, and require time proportional to length before long pages count as read."},{"name":"Idle detection","description":"An 'are you still there?' check and an automatic pause stop idle time from being counted as study time, with configurable delays."},{"name":"Video focus check","description":"An optional prompt during video lessons asks learners to tap a highlighted number at random intervals, feeding a concentration score."}]},{"id":"live-learning-pulse","name":"Live Learning Pulse","tagline":"See what every learner is doing, right now","description":"A real-time window into learning as it happens, for a single course or the whole institute. See who is studying, which slide they are on and who looks stuck, which classes are on air with live turnout, and which assessments are in progress with at-risk attempts flagged. A live feed of submissions, answers and class joins ties it all together, so teachers can step in while it still matters.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Course Pulse roster","description":"A live roster for any batch showing each learner as active, idle or needing help, with the slide they are on and how long they have been there."},{"name":"Content map","description":"A subject-to-slide tree of only the parts of the course learners are in right now, with head counts rolled up so you see where the class actually is."},{"name":"Live activity feed","description":"A rolling feed of recent submissions, quiz answers and class joins, newest first, for a course or across the institute."},{"name":"Institute Pulse overview","description":"One page that shows learning activity across every course, class and assessment in the institute at once, with headline counts that refresh automatically."},{"name":"Classes on air","description":"Live sessions currently running with real turnout against invited learners, plus what is scheduled to start in the next hour."},{"name":"Assessments in flight","description":"A live funnel of in-progress attempts, a risk list of stalled or struggling attempts, recent submissions and a results pipeline for assessments that just ended."},{"name":"Batch filter","description":"Narrow the whole institute view to one batch, with totals recalculated for that batch rather than filtered on screen."},{"name":"Role-based visibility","description":"Course Pulse and Institute Pulse appear for admins and teachers by default and can be switched on or off per role from Display Settings."}]},{"id":"assessment-analytics","name":"Assessment Analytics & Results","tagline":"Leaderboards, question insights and AI performance reports","description":"Every assessment gets a full analytics suite for staff — overview dashboard, ranked leaderboard, marks-vs-rank curve and question-level insights — with CSV and PDF export throughout. Learners get their own detailed results: score breakdowns, question-wise review, peer comparison and an AI-written performance report in plain language.","roles":["Admin","Teacher","Learner","Parent"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Overview dashboard","description":"At-a-glance participation, completion and score statistics per assessment, plus institute-wide assessment counts."},{"name":"Leaderboard","description":"A ranked list of all participants by score, exportable to CSV and PDF."},{"name":"Marks-vs-rank analysis","description":"A graph and table mapping marks to ranks, exportable to CSV and PDF."},{"name":"Question insights","description":"Per-question charts of correct, incorrect, partially-correct and skipped responses to spot weak topics or bad questions, with PDF export."},{"name":"Individual student report","description":"Drill into any learner's attempt with question-wise performance, exportable as PDF."},{"name":"Participant exports","description":"Export registered-participant and respondent lists as CSV or PDF."},{"name":"Learner attempt report","description":"Learners see a score summary, marks obtained, accuracy and time-spent breakdown for each attempt, with a question-wise review of their response versus the correct answer."},{"name":"Peer comparison","description":"Learners see how their attempt compares to batch peers — ranks, percentiles and score distributions."},{"name":"AI performance report card","description":"An AI-generated narrative highlighting strengths, weak topics and recommended next steps, presented as a consolidated printable report card."}]},{"id":"challenge-campaign-analytics","name":"Challenge & Campaign Analytics","tagline":"Measure campaigns from first touch to completion","description":"A dedicated analytics suite tracks engagement challenges and messaging campaigns end to end: daily participation, engagement leaderboards, completion cohorts, churn, referrals, centre-wise heatmaps and lead funnels from ad to conversion. Filters slice everything by date range, campaign and centre.","roles":["Admin","Counsellor"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"KPI overview","description":"Headline cards summarising participation, engagement and completion across the selected period."},{"name":"Daily participation reports","description":"Day-by-day view of active participants and who engaged with which message templates, with incoming/outgoing metrics and per-user drill-down including custom profile fields."},{"name":"Engagement leaderboard","description":"Rank participants by engagement over any date range to spot champions — ideal for gamified challenge campaigns."},{"name":"Completion cohorts","description":"Cohort analysis showing how far each intake progressed and exactly who completed a multi-day programme."},{"name":"Churn analysis","description":"Identify where and when participants drop off."},{"name":"Centre heatmap and distribution","description":"Compare performance across physical centres with heatmaps and distribution charts."},{"name":"Referral tracking","description":"Measure participant-driven referrals and their conversion."},{"name":"Lead funnels","description":"A daily funnel of Facebook ad leads flowing into the challenge, plus lead-journey funnels tracing prospects through sequential message touchpoints to spot drop-off."},{"name":"Message template performance","description":"Per-template outgoing metrics and template-to-day mapping so multi-day programmes can be measured stage by stage."},{"name":"Flexible filters","description":"Slice every view by date range, campaign and centre."}]},{"id":"communication-analytics","name":"Communication Analytics Hub","tagline":"Know who saw it, who clicked, who replied","description":"One hub for the health and performance of every communication channel. See whether email and WhatsApp are set up and working, track each announcement's delivery down to the individual recipient, and follow every email through sent, delivered, opened, clicked or bounced — with exact timestamps and the specific link clicked.","roles":["Admin","Teacher","Counsellor","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","API"],"subFeatures":[{"name":"Channel setup status","description":"At-a-glance indicators for whether outbound email, inbound email and WhatsApp are configured and working."},{"name":"Email funnel stats","description":"Sent, delivered, opened, clicked, bounced, complained and inbound email counts for any chosen time window."},{"name":"WhatsApp volume stats","description":"Outgoing and incoming WhatsApp message counts for the selected window."},{"name":"Announcement delivery statistics","description":"Per-announcement stats covering pending, sent, delivered, failed and read counts across channels."},{"name":"Recipient-level tracking","description":"Drill into an announcement's full recipient list and see each person's delivery and read status."},{"name":"Interactions and threaded replies","description":"Read, dismissed, clicked, liked and shared interactions are captured per user per message; recipients can reply in nested threads that senders can browse and moderate."},{"name":"Per-email event timeline","description":"Each email shows a chronological history of delivered, opened, clicked, bounced, complaint and pending events with exact timestamps in the viewer's timezone."},{"name":"Click and bounce detail","description":"Click events record the specific link, device and browser; bounces carry type and sub-type so hard failures are distinguished from temporary ones."},{"name":"Lookup and source attribution","description":"Retrieve the complete email history of any user or address, search across all tracked emails, and trace every message back to the feature that sent it — announcement, campaign or automation."},{"name":"Bulk send monitoring","description":"Watch active and recently completed bulk send batches with per-batch status, alongside a live recent-activity feed across channels."}]},{"id":"fee-collection-dashboard","name":"Fee Collection Dashboard","tagline":"A live picture of expected vs collected fees","description":"A visual dashboard that shows how fee collection is tracking across the institute: total expected, collected, due and overdue, a collection-rate gauge, a pipeline chart and class-wise breakdowns. Filter by batch, plan or period to find exactly where collections are slipping.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Summary cards","description":"At-a-glance totals for expected fees, amount collected, outstanding dues and overdue amounts."},{"name":"Collection rate gauge","description":"A live gauge showing the percentage of expected fees actually collected."},{"name":"Collection pipeline chart","description":"Visualizes fees moving from upcoming to due to paid, making cash flow predictable."},{"name":"Class-wise collection table","description":"Breaks collections down by class and batch to spot which groups are behind."},{"name":"Payment mode insights","description":"See the split of collections across cash, cheque, UPI, card and online gateway payments."},{"name":"Flexible filters","description":"Slice the whole dashboard by batch, fee plan and date range."}]},{"id":"payment-logs","name":"Payment Logs & Reconciliation","tagline":"Every transaction tracked, filterable and reconciled","description":"Manage Payments records every payment attempt across all gateways and invoices with its live, reconciled status. Search by learner, invoice or plan, filter by date, status, plan, batch and source, and see collection summaries at the top. Drill into any transaction, preview its invoice, export to CSV, and void or remove mistaken entries.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Revenue statistics","description":"Instant totals for payment count, successful payments, failed payments and total revenue for the current filter."},{"name":"Quick time filters","description":"One-click views for the last hour, today, 7/30/90 days or all time, plus a custom date-time range."},{"name":"Status filters","description":"Filter by payment status (paid, failed, pending) and by learner plan status (active, payment failed, expired, inactive)."},{"name":"Rich transaction rows","description":"Each row shows date, payer name and email, amount, color-coded status, payment method and vendor, plan status, course or membership, transaction ID and plan validity."},{"name":"Reconciled status logic","description":"Displayed status is derived from gateway confirmations, not just the initial attempt, so the table reflects reality."},{"name":"Tracking updates","description":"Payment records can be annotated with tracking information as follow-ups happen."},{"name":"Built for scale","description":"Configurable page sizes with newest-first sorting keep large institutes' logs fast to work through."},{"name":"Search by learner, invoice or plan","description":"Find payments by the payer's name, email or phone, the amount, the invoice number or the payment plan name, across the whole log."},{"name":"Invoice column with preview","description":"See the invoice number issued for each payment and open the actual invoice PDF without leaving the table."},{"name":"More filters","description":"Narrow the log by payment type, payment plan, payment source, batch and course alongside a single date-range control."},{"name":"Pending versus abandoned checkouts","description":"Checkouts that can still complete are shown as pending, while ones left unfinished for over a day are marked abandoned — a ready list for follow-up."},{"name":"Custom columns and CSV export","description":"Show, hide and drag columns into your preferred order, add enrollment and next-due dates, and export the filtered log to CSV."},{"name":"Void and delete payments","description":"Void a mistaken offline payment to restore instalments, invoices and ledger, or permanently delete it where an admin-controlled permission allows."}]},{"id":"membership-analytics","name":"Membership Analytics & Expiry Tracking","tagline":"Know who's new, who's renewing, who's about to lapse","description":"Two dedicated dashboards track membership health: one analyzes new joiners versus retained members over time, the other surfaces memberships that have ended or are about to end — so your team drives renewals before revenue walks out the door.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"New vs retained analysis","description":"Membership stats split members into new users and retainers, with daily and weekly trend charts and filterable stat cards."},{"name":"Expiring-soon pipeline","description":"See memberships expiring in the next 30 days with member-level detail for proactive renewal outreach."},{"name":"Recently expired list","description":"Track memberships that ended in the last 30 days to run win-back campaigns."},{"name":"Filterable member tables","description":"Both dashboards include member tables with date-range, user-type and status filters."},{"name":"Expiry trend charts","description":"Expiry volume charted over time so leadership can spot churn spikes early."}]},{"id":"audit-log","name":"Admin Activity Audit Log","tagline":"Every admin action recorded, searchable and exportable","description":"A complete audit trail of administrative actions across the platform — enrollments, settings changes, certificate updates, live-class edits, parent links and more. Compliance teams can filter the log, inspect exactly what changed with sensitive data automatically redacted, and export everything to CSV.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Filterable log viewer","description":"Filter logs by actor, action, entity and time range in a dedicated screen."},{"name":"Payload inspection","description":"Open any entry to see the full details of what changed, with sensitive fields automatically redacted."},{"name":"CSV export","description":"Export filtered audit logs as CSV for external compliance archives."},{"name":"Automatic capture","description":"Actions across enrollment, settings, certificates, live sessions, bookings, courses and parent-link operations are logged asynchronously, without slowing the app."},{"name":"Retention management","description":"A retention policy automatically prunes old logs on your configured schedule."},{"name":"CRM activity coverage","description":"Lead lists, lead deletions, status changes, counsellor assignments, follow-ups, tags, lead connectors and calling settings are all recorded, with names resolved for readability."},{"name":"Wider product coverage","description":"Assessment edits, invite links, payment plans, progress reports, class materials, mentorship, bookings and HR and payroll actions are captured too."},{"name":"Filter by person","description":"Filter by one or more team members chosen by name, alongside multi-select resource and action filters."}]},{"id":"report-branding","name":"Report Branding","tagline":"Every exported report carries your letterhead","description":"Brand the PDF reports your institute sends out: logo and letterhead, custom header and footer with full HTML control, report colors, and an optional watermark — with a live preview as you edit.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Logo and letterhead","description":"Upload the logo and letterhead used across all generated reports."},{"name":"Header and footer","description":"Set footer text, or take full control with custom header and footer HTML."},{"name":"Report colors","description":"Primary and secondary brand colors applied to report styling."},{"name":"Watermark","description":"Optional watermark text across report pages."},{"name":"Live preview","description":"See the branded report layout before saving."}]}],"demo":{"intro":"Run the institute on live data — from the admin command center through sales and learner analytics, down to an AI-written report card on a student's phone.","screens":[{"id":"home","device":"desktop","title":"Admin Home Dashboard","nav":["Dashboard*","Study Library","Learners","CRM","Assessments","Reports","Settings"],"widgets":[{"type":"header","id":"home-head","title":"Good morning, Vikram","subtitle":"Sunrise Career Academy · Admin view","actions":["+ Add Student","New Announcement"]},{"type":"stats","id":"home-kpis","items":[{"label":"Active learners","value":"2,314","delta":"+184 this month"},{"label":"Fees collected (Jul)","value":"₹18.4L","delta":"+₹2.1L vs Jun"},{"label":"Online right now","value":"142"},{"label":"Unresolved doubts","value":"23","delta":"-9 this week"}]},{"cols":[{"type":"chart","id":"home-activity","kind":"bars","label":"Learner activity by hour — today","values":[12,18,34,52,61,78,96,142,121,88,64,41]},{"type":"list","id":"home-finance","items":[{"title":"Ananya Iyer — ₹42,000","sub":"NEET 2027 Batch A · UPI","chip":"Paid","tone":"green"},{"title":"Rohan Mehta — ₹15,500","sub":"Class 10 Foundation · Card","chip":"Failed","tone":"red"},{"title":"Kabir Singh — ₹28,000","sub":"JEE Advanced · Razorpay","chip":"Paid","tone":"green"}]}]}],"module":"crm"},{"id":"crm-reports","device":"desktop","title":"CRM Reports Center","nav":["Dashboard","Study Library","Learners","CRM*","Assessments","Reports","Settings"],"widgets":[{"type":"header","id":"crm-head","title":"CRM Reports","subtitle":"Jul 1 – Jul 16 · Team: Admissions · All counsellors","actions":["Export CSV","Copy report link"]},{"type":"wizard","id":"crm-tabs","steps":["Overview","Sources","Funnel","Revenue","Cohorts","Forecast"],"active":2},{"cols":[{"type":"funnel","id":"crm-funnel","stages":[{"label":"Leads","value":1240},{"label":"Contacted","value":986},{"label":"Demo booked","value":412},{"label":"Application","value":263},{"label":"Admission","value":148}]},{"type":"table","id":"crm-revenue","columns":["Source","Leads","Admissions","Revenue"],"rows":[["Meta Ads","512","61","₹9.2L"],["Google","306","38","₹5.6L"],["Website","241","27","₹4.1L"],["Walk-in","181","22","₹3.3L"]]}]}],"module":"crm"},{"id":"learner-insights","device":"desktop","title":"Learner Activity & Progress","nav":["Dashboard","Study Library","Learners*","CRM","Assessments","Reports","Settings"],"widgets":[{"type":"header","id":"li-head","title":"NEET 2027 Batch A","subtitle":"96 learners · Avg 48 min/day study time","actions":["Export PDF","Email digest settings"]},{"type":"chart","id":"li-trend","kind":"line","label":"Daily active learners — last 30 days","values":[61,64,58,66,72,69,74,71,63,55,52,58,67,73,76]},{"type":"list","id":"li-atrisk","items":[{"title":"Rohan Mehta","sub":"Last login 9 days ago · 12% chapter progress","chip":"At risk","tone":"red"},{"title":"Priya Sharma","sub":"Study time down 74 → 22 min/day","chip":"Watch","tone":"orange"},{"title":"Aarav Nair","sub":"#1 on batch leaderboard · 21-day streak","chip":"Champion","tone":"green"},{"title":"Ishita Rao","sub":"Physics 82% done · Chemistry 34% done","chip":"On track","tone":"blue"}]}],"module":"crm"},{"id":"report-card","device":"phone","title":"My Reports","nav":["Home","Courses","Tests","Reports*","Profile"],"widgets":[{"type":"header","id":"rc-head","title":"Report Card — Rohan Mehta","subtitle":"June 2026 · Generated by AI · NEET 2027 Batch A"},{"type":"stats","id":"rc-stats","items":[{"label":"Attendance","value":"68%"},{"label":"Avg test score","value":"54%","delta":"-6% vs May"},{"label":"Study time","value":"6.2 hr/wk"}]},{"type":"chart","id":"rc-marks","kind":"bars","label":"Subject scores — June tests","values":[42,58,61,55]},{"type":"list","id":"rc-insights","items":[{"title":"Kinematics needs attention","sub":"AI confidence: Low · 3 of 5 quiz checkpoints missed","chip":"Focus","tone":"red"},{"title":"Organic Chemistry is a strength","sub":"AI confidence: High · 87% accuracy across tests","chip":"Strong","tone":"green"},{"title":"Login regularity slipping","sub":"4 logins last week vs 11 in May","chip":"Habit","tone":"orange"}]}]}],"steps":[{"screen":"home","target":null,"title":"One command center, live all day","text":"The home dashboard adapts to each role — admins see institute-wide KPIs and finance, teachers see today's classes. Payments, doubts, live classes and real-time usage all land on one screen."},{"screen":"home","target":"home-kpis","title":"KPIs with deltas, not spreadsheets","text":"Enrollments, fee collection, learners online this minute and unresolved doubts — every headline number carries its change over the period, so trends are obvious without opening a report."},{"screen":"home","target":"home-activity","title":"See when your learners actually study","text":"Real-time usage widgets chart hourly and daily activity, most active learners and the web/mobile/desktop device split — so you schedule live classes when students are genuinely online."},{"screen":"crm-reports","target":"crm-tabs","title":"A dozen sales reports, one filter bar","text":"Overview, sources, funnel, revenue, cohorts and forecast tabs share the same date, team and counsellor filters. The active tab lives in the URL, so any view is a shareable deep link."},{"screen":"crm-reports","target":"crm-funnel","title":"Know exactly where leads drop off","text":"The funnel report tracks every stage from first enquiry to admission. Here, 412 demo bookings became 148 admissions — the drop after application is where counsellors should focus."},{"screen":"crm-reports","target":"crm-revenue","title":"Revenue attributed to every source","text":"Meta, Google, website and walk-in leads are compared on volume, admissions and actual ₹ revenue. Every tab exports to CSV, and PDF reports go out under your own letterhead."},{"screen":"learner-insights","target":"li-trend","title":"Spot engagement dips before dropouts","text":"Daily activity trends per batch reveal momentum or drop-off early — like this mid-month slump. Drill from batch to subject, chapter and even slide-level progress per learner."},{"screen":"learner-insights","target":"li-atrisk","title":"At-risk learners flag themselves","text":"Login recency, study-time trends and leaderboard ranks combine into per-learner flags. Daily, weekly and monthly email digests then keep parents informed automatically — no one lifts a finger."},{"screen":"report-card","target":"rc-stats","title":"An AI report card, one click away","text":"For any student, AI pulls attendance, marks, course progress, assignments, live-class participation, doubts and login habits into one report — readable in the app or emailed to parents as a branded PDF."},{"screen":"report-card","target":"rc-insights","title":"Insights a teacher would write","text":"The AI adds a plain-language narrative with per-topic confidence ratings — what's strong, what needs work, and the habits behind the numbers. Learners open every report from their own 'My Reports' hub."}]}},{"id":"community","name":"Community & Gamification","icon":"cmty","color":"#65A30D","tagline":"Shared question banks, leaderboards, XP and badges","description":"Community & Gamification turns your institute into a place learners want to show up to every day. Built-in chat with a full safety toolkit keeps every conversation on-platform, while XP, streaks, badges and leaderboards convert study time into friendly competition. A network-wide community library of question papers, ratings and reviews rounds it out — so your teachers reuse the best content and your learners broadcast the social proof.","features":[{"id":"in-app-chat","name":"In-App Chat & Messaging","tagline":"DMs, batch groups and community chat — no phone numbers shared","description":"A built-in messenger connects admins, teachers and learners without anyone exchanging phone numbers. It covers one-to-one direct messages, automatic per-batch group chats and an institute-wide community channel, with text, image and file messages delivered in real time. Read receipts, unread counts and offline push notifications keep every conversation current, and a role-based permission matrix puts the institute in full control of who can message whom.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Direct messages","description":"Start one-to-one conversations with anyone the institute's role matrix permits; a people search finds members by name or role."},{"name":"Batch group chats","description":"Every batch gets its own group conversation whose membership syncs automatically with enrollment, plus a searchable batch directory for admins."},{"name":"Community channel","description":"An institute-wide channel for all members that the institute can enable or hide."},{"name":"Text, image and file messages","description":"Send text, images and file attachments, with attachment permissions configurable per institute."},{"name":"Read receipts and unread counts","description":"Per-conversation mark-as-read with unread counters across the conversation list."},{"name":"Real-time delivery with offline push","description":"Messages reach online members instantly; offline members get a push notification so nothing is missed."},{"name":"Role-based permission matrix","description":"Control exactly which role may message which role — student-to-teacher, student-to-student and more — plus who may post in batch groups and the community channel."},{"name":"Message deletion","description":"Senders and moderators can remove messages from a conversation."},{"name":"Member, Moderator and Owner roles","description":"Conversations distinguish members, moderators and owners for management actions."},{"name":"Per-institute opt-in","description":"Chat is off by default and switched on per institute, so every school adopts messaging on its own terms."},{"name":"Message editing","description":"Members edit their own messages with an edited marker, and institutes choose whether students may edit or delete their own messages."},{"name":"Unread badge and smarter push","description":"An unread counter sits on the Messages menu item, and push alerts reach anyone not currently viewing that conversation, including on iPhone."}]},{"id":"mentorship","name":"Mentorship Programs","tagline":"Pair every learner with a mentor who checks in","description":"Run a structured mentorship programme inside the platform. Make team members or invited experts into mentors, pair them with learners by hand or in an even round-robin, or let learners browse a mentor directory and request one. Learners book one-to-one sessions on their mentor's own calendar, mentors record outcomes and keep notes, learners rate every session, and admins watch workload, sessions and requests from one dashboard. The module is opt-in per institute.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Mentor profiles and invitations","description":"Promote a team member or invite an outside expert by email, with photo, title, bio, expertise tags, an optional cap on mentees and a choice to appear in the directory."},{"name":"Manual and round-robin assignment","description":"Pair chosen learners with a mentor, or spread a filtered group of learners evenly across several mentors while respecting each mentor's capacity."},{"name":"Mentor directory and requests","description":"Learners browse discoverable mentors by expertise and request one, or any available mentor; admins approve or decline from a requests queue."},{"name":"Availability and one-to-one booking","description":"Each mentor sets weekly hours, time off, session types and lengths, and a Google Meet or custom meeting link; learners book open slots with double-booking prevented."},{"name":"Calendar sync per mentor","description":"Mentors connect their own Google account so every booked session lands on their calendar with its own meeting link."},{"name":"Staff scheduling, cancel and reschedule","description":"Admins and mentors can book sessions on a learner's behalf, and anyone involved can cancel or reschedule, with calendars and reminders updated automatically."},{"name":"Session outcomes and learner ratings","description":"Mentors mark each session completed or no-show with topic and notes, and learners rate sessions out of five so admins can see each mentor's feedback."},{"name":"Mentor workspace and mentee profile","description":"Mentors get a My Mentorship home with mentees, upcoming sessions and their booking link, plus a mentee panel showing course progress, notes and past calls."},{"name":"Admin overview and dashboard widgets","description":"An overview with workload, outcomes and items needing attention, a filterable sessions table, and home-page widgets for both admins and learners."},{"name":"Reminders and notifications on every channel","description":"Assignment, booking, cancellation, reminder, request and optional inactivity check-in messages go out by email, in-app, push and WhatsApp, each switchable in settings."}]},{"id":"chat-moderation-safety","name":"Chat Moderation & Safety","tagline":"Rules, filters and reporting keep student conversations safe","description":"Community and group chats ship with a complete safety toolkit built for education. Publish channel guidelines that members must acknowledge, calm busy channels with slow mode, restrict links and attachments, and hold new joiners read-only. Banned-keyword filters and a report-and-review workflow give moderators everything they need to act fast on problem messages.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Channel rules and guidelines","description":"Publish titled guideline lists per channel; institutes set defaults and individual channels can override them."},{"name":"Mandatory acknowledgement","description":"Optionally require members to acknowledge the rules before they can post."},{"name":"Slow mode","description":"Enforce a minimum number of seconds between posts per member to calm busy channels."},{"name":"Link and attachment controls","description":"Allow or block links and attachments on a per-channel basis."},{"name":"New-member read-only period","description":"Keep new joiners read-only for a configurable number of minutes before they can post."},{"name":"Banned-keyword filters","description":"Maintain a banned-keyword list per channel and choose the action: block the message outright or flag it for review."},{"name":"Message reporting","description":"Members report messages for spam, abuse, harassment or inappropriate content; auto-moderation flags create reports too."},{"name":"Moderation review queue","description":"Admins work an Open, Reviewing, Actioned or Dismissed queue of reports from a dedicated review screen."}]},{"id":"gamification-xp-streaks-badges","name":"Gamification: XP, Streaks & Badges","tagline":"XP, levels, streaks and badges make studying addictive","description":"Learners earn experience points for studying, attending live classes and scoring well on assessments, and XP rolls up into levels with visible progress. Daily streaks reward consistency, while achievement badges unlock automatically from configurable triggers or are awarded manually by admins. Institutes design their own badges and scoring rules — or switch the whole system off with one toggle.","roles":["Admin","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"XP and levels","description":"Points earned across learning activities roll into levels, with an XP-to-next-level progress display and a breakdown of where every point came from."},{"name":"Daily streaks","description":"A streak counter rewards consecutive days of learning activity."},{"name":"Achievement badges","description":"Badges unlock automatically from configurable triggers — course progress, assessment scores, live-class attendance — and admins can also award them manually."},{"name":"Custom badge designer","description":"Create your own badges with a name, an icon from a built-in library and a description, then edit or retire them as your program evolves."},{"name":"Configurable unlock criteria","description":"Choose the activity- or achievement-based rule that unlocks each badge."},{"name":"Institute-controlled scoring","description":"Institutes define the badge and scoring rules, and a master toggle disables badges entirely when they are not wanted."},{"name":"Play theme","description":"A gamified, kid-friendly dashboard theme with progress rings, XP pills and badge showcases."},{"name":"Staff-awarded badges","description":"Teachers and admins award badges by hand from a learner's profile, with an optional note, and can create new badges on the spot."},{"name":"Bulk badge awards","description":"Award a badge to many learners at once from any student list, with progress and a results summary."},{"name":"Hidden-until-earned badges","description":"Keep surprise badges invisible to learners until the moment they earn them."},{"name":"Ready-made badge artwork","description":"Pick from a library of playful tiered badge artwork instead of designing icons from scratch."},{"name":"Achievements popup and celebrations","description":"Learners open an achievements view from the header and get a celebration whenever a new badge arrives."},{"name":"Server-tracked streaks and points","description":"Streaks and points are kept on the server in the institute's timezone, so learners see the same totals on every device."}]},{"id":"leaderboards","name":"Leaderboards","tagline":"Friendly competition that keeps learners coming back","description":"Leaderboards rank learners everywhere they compete: within their batch, across the whole institute, and live during quiz sessions. Learning-activity leaderboards are driven by study time, attendance and badges earned, while live-session leaderboards score every answer in real time with configurable points, optional negative marking and speed-aware ranking. Standings can be shared publicly and exported for prize-giving.","roles":["Admin","Teacher","Learner","Parent"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App","Engage Client","Public Web"],"subFeatures":[{"name":"Batch leaderboard","description":"Rankings within a learner's batch, driven by real learning activity such as study time, live-class attendance and badges earned."},{"name":"Institute leaderboard","description":"An institute-wide leaderboard that ranks learners across all batches."},{"name":"Public shareable leaderboard","description":"A public leaderboard view that can be shared outside the app for recognition and marketing."},{"name":"My rank card","description":"Each learner sees their own rank and badge summary on their profile."},{"name":"Live session leaderboard","description":"Every live quiz session ranks the whole audience in real time; both the presenter and participants can view the standings, with results revealed on the final slide."},{"name":"Configurable scoring with negative marking","description":"Set the points each correct answer is worth when creating a session, and optionally deduct a chosen number of marks per wrong answer."},{"name":"Speed-aware ranking","description":"Total response time is recorded alongside score, so faster correct answers rank higher among ties."},{"name":"Full performance breakdown","description":"Each leaderboard row shows rank, name, total score, total time, correct, wrong and unanswered counts, and total questions."},{"name":"CSV export","description":"Download the complete session leaderboard as a spreadsheet for records or prize distribution."},{"name":"Badges on every leaderboard","description":"Leaderboards show earned badges prominently, and tapping a learner opens their full badge collection."}]},{"id":"ratings-reviews","name":"Course Ratings & Reviews","tagline":"Learner reviews that become your best social proof","description":"Learners rate and review courses and batches with a star score and text, and ratings roll up into averages and distributions shown on course pages, library cards and the public catalogue. Readers can mark reviews helpful so the best feedback rises to the top, and admins get a filterable console over every review for moderation and insight.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Public Web"],"subFeatures":[{"name":"Submit and edit reviews","description":"Learners leave a star rating with text for a course or a specific batch, and can update it later."},{"name":"Rating summaries","description":"Aggregate star ratings and rating distributions per course and per batch, ready for display anywhere."},{"name":"Review feed","description":"Read individual reviews with reviewer name, photo, date, star score, text and like counts."},{"name":"Ratings on cards and public catalogues","description":"Star ratings appear on library course cards and public catalogue listings, so prospective students see social proof before enrolling."},{"name":"Like / dislike on reviews","description":"Readers mark a review helpful or not — or withdraw their reaction — surfacing the best feedback first."},{"name":"Admin review console","description":"Browse all ratings for any course or batch with filters, for moderation and insight."}]},{"id":"community-question-paper-library","name":"Community Question Paper Library","tagline":"A shared library of ready-made question papers and practice content","description":"A community hub inside the admin portal where teachers browse question papers and practice resources shared across the Vacademy network. Content is presented as a visual card gallery with instant search, academic filters and topic tags, and any paper can be previewed question by question — with answers toggled on or off — before you adopt it. It turns every institute's best assessments into a reusable, network-wide resource pool.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Browse card gallery","description":"Scroll a paginated grid of community question papers presented as visual cards; click any card to open the full paper."},{"name":"Instant search","description":"Search question papers by name from the hub header, with results refreshing as you type."},{"name":"Cascading academic filters","description":"Narrow the library by level or grade, then stream, then subject — each dropdown shows only options relevant to the previous choice."},{"name":"Difficulty and content-type filters","description":"Filter by Easy, Medium or Hard, and by resource kind — the library is built to hold questions, full question papers, PDFs, videos and PPTs."},{"name":"Topic tag chips","description":"One-click topic chips stack on top of the dropdown filters for precise discovery."},{"name":"Combined multi-filter results","description":"Search text, dropdown selections and tag chips all combine into a single filtered, paginated result set."},{"name":"Question paper preview","description":"Read every question in order with rich formatting, images and math rendered correctly."},{"name":"Show / hide answers toggle","description":"Reveal or hide the answer key with one click while previewing, to judge quality before adopting a paper."},{"name":"Paper detail sidebar","description":"Every paper shows its full tag set — level, stream, subject, topic and difficulty — so you know exactly what it covers."},{"name":"Share a paper","description":"A share action on each community paper lets you pass it along to colleagues."}]},{"id":"cross-institute-sharing","name":"Cross-Institute Content Sharing","tagline":"Publish your papers to the network, import theirs into yours","description":"Institutes share question papers with the wider Vacademy community and pull any public community paper into their own private question bank with one click. Imported papers become fully editable copies inside your institute, ready to use in your own assessments, while a public/private access setting keeps you in control of what leaves your walls.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Add to my Question Bank","description":"One button copies a public community question paper into your institute's private collection, confirmed the moment it lands."},{"name":"Publish to the community","description":"A Share-and-Explore publishing flow pushes your own papers into the community library for other institutes to discover."},{"name":"Public / private access control","description":"Every question paper carries an access setting, so only content deliberately marked public is visible to other institutes."},{"name":"Authorship and history preserved","description":"Shared papers keep their title, description, creator and creation dates, so provenance is always visible."}]},{"id":"academic-taxonomy-tagging","name":"Academic Taxonomy & Smart Tagging","tagline":"Every shared resource organized the way syllabi actually work","description":"A structured academic catalogue — Levels, Streams, Subjects, Chapters and Topics — underpins the community library, so every shared resource is findable by exactly where it fits in a curriculum. Content also carries free-form tags, difficulty ratings and type labels, and the taxonomy itself grows as new chapters and topics are added.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Five-level academic hierarchy","description":"Content is organized by Level → Stream → Subject → Chapter → Topic, mirroring how real syllabi are structured."},{"name":"Structured tag dimensions","description":"Resources are tagged across six dimensions: level, stream, subject, topic, difficulty and content type."},{"name":"Free-form tags","description":"Beyond the structured taxonomy, contributors attach custom tags to any question, paper, PDF, video or PPT."},{"name":"Tag lookup per resource","description":"View all tags attached to any resource — or a batch of resources — grouped by category, to understand its coverage at a glance."},{"name":"Growable curriculum catalogue","description":"Add new chapters under any subject and new topics under any chapter, including bulk additions, so the taxonomy keeps pace with new syllabi."},{"name":"Always-current filter options","description":"The community hub loads live filter options — levels, streams, subjects, difficulties, types and topics — so dropdowns always reflect the current catalogue."},{"name":"Rich-content questions","description":"Question text, options and explanations are stored as rich content, so shared questions keep images, tables and math notation intact."}]}],"demo":{"intro":"Borrow the network's best question papers, share your own, then see how XP, leaderboards and batch chat keep learners showing up daily.","screens":[{"id":"hub","device":"desktop","title":"Community Hub — Question Papers","nav":["Dashboard","Study Library","Community*","Assessments","Learners","Reports","Settings"],"widgets":[{"type":"header","id":"hub-head","title":"Community Question Papers","subtitle":"12,400+ papers shared across the Vacademy network","actions":["Share & Explore","My Question Bank"]},{"type":"form","id":"hub-filters","title":"Filters","fields":[{"label":"Level / Grade","value":"Class 12","type":"select"},{"label":"Stream","value":"Science (PCM)","type":"select"},{"label":"Subject","value":"Physics","type":"select"},{"label":"Difficulty","value":"Medium","type":"select"}],"submit":"Apply filters"},{"type":"table","id":"hub-table","columns":["Question Paper","Subject","Difficulty","Qs","Shared by"],"rows":[["Kinematics Mains Mock — Paper 7","Physics",{"chip":"Medium","tone":"orange"},"45","Prakash Career Institute, Indore"],["Rotational Motion Sprint Test","Physics",{"chip":"Hard","tone":"red"},"30","Dakshana Academy, Pune"],["Ray Optics Chapter Test","Physics",{"chip":"Easy","tone":"green"},"25","Sunrise Tutorials, Jaipur"],["Electrostatics PYQ Compilation","Physics",{"chip":"Medium","tone":"orange"},"60","Vidya Mandir Classes, Chennai"]]}],"module":"lms"},{"id":"paper","device":"desktop","title":"Paper Preview — Kinematics Mains Mock","nav":["Dashboard","Study Library","Community*","Assessments","Learners","Reports","Settings"],"widgets":[{"type":"header","id":"paper-head","title":"Kinematics Mains Mock — Paper 7","subtitle":"45 questions · Class 12 · PCM · Physics · Medium · by Prakash Career Institute","actions":["+ Add to My Question Bank","Share"]},{"type":"list","id":"paper-questions","items":[{"title":"Q1. A particle starts from rest with a = 2t m/s²…","sub":"MCQ · Topic: Non-uniform acceleration","chip":"Answer: B","tone":"green"},{"title":"Q2. A projectile is fired at 45° with speed 20 m/s…","sub":"Numeric · Topic: Projectile motion","chip":"Answer: 40 m","tone":"green"},{"title":"Q3. The velocity–time graph shown gives displacement…","sub":"MCQ with image · Topic: Graphs","right":"Show answer"}]},{"type":"form","id":"share-form","title":"Publish your own papers","fields":[{"label":"Paper","value":"JEE Physics Grand Test 4 (Ravi Sir)","type":"select"},{"label":"Access","value":"Public — visible to the community","type":"select"},{"label":"Keep authorship & history","value":"on","type":"toggle"}],"submit":"Publish to Community"}],"module":"lms"},{"id":"leaderboard","device":"phone","title":"Leaderboard","nav":["Home","Courses","Leaderboard*","Chat","Profile"],"widgets":[{"type":"header","id":"lb-head","title":"Leaderboard","subtitle":"NEET 2027 Batch A · July"},{"type":"stats","id":"lb-stats","items":[{"label":"Your rank","value":"#4","delta":"+3 this week"},{"label":"XP","value":"2,180"},{"label":"Day streak","value":"🔥 21"}]},{"type":"list","id":"lb-list","items":[{"title":"1. Ananya Sharma","sub":"12 badges · 26-day streak","right":"2,640 XP"},{"title":"2. Rohan Verma","sub":"9 badges · 18-day streak","right":"2,455 XP"},{"title":"3. Priya Nair","sub":"10 badges · 14-day streak","right":"2,310 XP"},{"title":"4. Aarav Gupta","sub":"8 badges · 21-day streak","chip":"You","tone":"blue","right":"2,180 XP"}]}]},{"id":"chat","device":"phone","title":"Batch Chat","nav":["Home","Courses","Leaderboard","Chat*","Profile"],"widgets":[{"type":"header","id":"chat-head","title":"NEET 2027 Batch A","subtitle":"64 members · Slow mode: 30s"},{"type":"chat","id":"batch-chat","messages":[{"from":"system","text":"Please read and acknowledge the channel rules before posting."},{"from":"agent","text":"Doubt-clearing at 6 PM today — bring your Kinematics mock corrections. — Meera Ma'am"},{"from":"user","text":"Ma'am, is Q12 from the mock inside the reduced syllabus?"},{"from":"agent","text":"Yes — projectile motion. I'll solve it on the whiteboard today. 📎 Q12_solution.pdf"}],"composer":"Message NEET 2027 Batch A…"}]}],"steps":[{"screen":"hub","target":null,"title":"A network-wide paper library","text":"The Community hub inside the admin portal pools question papers and practice content shared by institutes across the Vacademy network — with instant search that refreshes results as you type."},{"screen":"hub","target":"hub-filters","title":"Filters that mirror real syllabi","text":"Cascading dropdowns narrow by Level, then Stream, then Subject — each showing only relevant options. Stack on difficulty (Easy/Medium/Hard), content type and one-click topic chips for precise discovery."},{"screen":"hub","target":"hub-table","title":"Provenance on every paper","text":"Each paper keeps its creator, dates and full tag set — level, stream, subject, topic, difficulty — so you know exactly what it covers and who built it. Click any paper to open the full preview."},{"screen":"paper","target":"paper-questions","title":"Preview before you adopt","text":"Read every question in order with images, tables and math rendered correctly, then toggle the answer key on or off with one click — judge a paper's quality before it touches your question bank."},{"screen":"paper","target":"paper-head","title":"One click into your question bank","text":"'Add to My Question Bank' copies the paper into your institute's private collection as a fully editable copy, ready to drop into your own assessments — confirmed the moment it lands."},{"screen":"paper","target":"share-form","title":"Share yours, on your terms","text":"The Share & Explore flow publishes your papers to the network with authorship preserved. Every paper carries a public/private access setting, so nothing leaves your walls unless you mark it public."},{"screen":"leaderboard","target":"lb-stats","title":"XP and streaks make study a habit","text":"Learners earn XP for studying, attending live classes and scoring well on assessments, rolling up into levels. Daily streaks reward consistency, and badges unlock from triggers you configure — or design your own."},{"screen":"leaderboard","target":"lb-list","title":"Batch and institute leaderboards","text":"Rankings run inside each batch and across the whole institute, driven by real activity — study time, attendance, badges earned. Standings can be shared publicly and exported to CSV for prize day."},{"screen":"chat","target":"batch-chat","title":"Every batch gets its own group chat","text":"Membership syncs automatically with enrollment — no phone numbers exchanged. DMs, batch groups and an institute-wide channel carry text, images and files in real time, with push for offline members."},{"screen":"chat","target":"chat-head","title":"Safety tools built for education","text":"Slow mode, banned-keyword filters, link controls and a new-member read-only period keep channels calm. Reported messages land in an Open → Reviewing → Actioned moderation queue, and a role matrix decides who can message whom."}]}},{"id":"platform","name":"Platform, Apps & White-Label","icon":"plat","color":"#64748B","tagline":"Your brand, your domain, your apps — on enterprise-grade rails","description":"The foundation that makes Vacademy feel like your own product, not someone else's software. Run every portal on your own domains with your own branding, ship your own Android, iOS, Windows and Mac apps, rename the platform's vocabulary to match yours, and operate multiple brands or branches from one account. Underneath sits serious infrastructure — flexible sign-in, device security, cloud file storage, open APIs, data migration tooling and a support and status operation that keeps your institute running.","features":[{"id":"custom-domains-white-label","name":"Custom Domains & White-Label Portals","tagline":"Your domain, your brand — Vacademy invisible","description":"Run the learner, teacher and admin portals on your own domains (e.g. learn.myschool.com) with zero Vacademy branding. A guided setup wizard provisions domains automatically — DNS and SSL included — and every domain carries its own logo, colors, fonts, browser-tab identity, sign-in rules and legal links, so learners only ever see your brand.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Public Web"],"subFeatures":[{"name":"One-click domain setup","description":"A setup wizard creates DNS records and SSL certificates automatically and wires the domains to your institute. For domains you host elsewhere, it surfaces the exact CNAME record to add and reports live provisioning status."},{"name":"Separate domains per portal","description":"Attach distinct domains or subdomains for the learner, teacher and admin portals. Multiple domains can serve the same portal, with one marked primary."},{"name":"Per-domain branding","description":"Each domain sets its own theme color, font family, logo dimensions, browser tab title and tab icon — and can hide the institute name entirely when the logo already carries it."},{"name":"Per-domain login rules","description":"Choose which sign-in methods (password, email OTP, phone, Google, GitHub) are available on each domain, and whether open self-signup is allowed or access stays invite-only."},{"name":"Navigation, redirects & legal links","description":"Set the after-login landing route, after-logout route and home-icon destination per domain, and point privacy policy and terms & conditions links to your own pages."},{"name":"App download links","description":"Attach your Play Store, App Store, Windows and Mac app links so each branded portal promotes your own apps."},{"name":"Sub-organization branded domains","description":"Bind a domain to a specific sub-organization so each branch or partner brand gets its own branded login and signup entry point."},{"name":"Regional & terminology preferences","description":"Set preferred country lists for phone-number inputs per domain, and choose whether your custom naming terminology applies on each white-labeled domain."},{"name":"White-label status dashboard","description":"See at a glance which portals are configured, their URLs, domain types and provisioning state — verify what is live at any time."},{"name":"Branded Google sign-in","description":"Use your own Google sign-in identity so learners see your brand, not the platform's, on the 'Continue with Google' screen — with a step-by-step setup guide."},{"name":"Branded short links","description":"The setup screen provides the DNS record that lets short links for campaigns and shares run on your own domain."},{"name":"Location-aware phone codes","description":"Choose per portal whether phone fields default to your institute's country, the visitor's detected region, or your country only."}]},{"id":"branded-mobile-desktop-apps","name":"Branded Mobile & Desktop Apps","tagline":"Your own Android, iOS, Windows and Mac apps","description":"The learner experience ships as installable apps for Android, iOS, Windows and Mac — each buildable as a fully branded app published under your institute's own name, icon and store listing. Mobile-native touches like push notifications, privacy screens and offline handling make it feel truly native, and admins get a companion mobile app to run the institute on the go.","roles":["Admin","Learner","Parent"],"platforms":["Learner Mobile App","Learner Desktop App","Admin Web"],"subFeatures":[{"name":"White-label Android & iOS apps","description":"Tenant-specific builds carry your institute's own app name, icon, theme and app-store listing, published under your developer account."},{"name":"Windows & Mac desktop apps","description":"Desktop builds of the learner app for exam centers, office-based training and distraction-free home study."},{"name":"Admin mobile app","description":"A mobile flavor of the admin dashboard so owners and staff can manage the institute from their phone."},{"name":"Native social sign-in","description":"Apps include native Sign in with Apple on iOS and Google sign-in, meeting app-store sign-in requirements."},{"name":"White-label push notifications","description":"Each institute can plug in its own Firebase project so push notifications are delivered under the institute's own app identity."},{"name":"Privacy screen protection","description":"Blocks screenshots and screen recording of protected content on mobile."},{"name":"Offline resilience","description":"Network status detection, offline message queuing and cached preferences keep the app usable on poor connections."},{"name":"Mobile-native UX","description":"Pull-to-refresh, in-app browser, network awareness and mobile-first layouts throughout — no cut-down web wrapper."},{"name":"iOS purchase compliance","description":"Purchase flows automatically adapt on iOS to meet App Store rules."},{"name":"App status tracker","description":"See each branded app's live store status on Android, iOS, Windows and Mac, any pending update, the latest over-the-air update and the reason if a store rejected it."},{"name":"Mac App Store distribution","description":"The branded Mac app can be published on the Mac App Store alongside the Microsoft Store listing for Windows."},{"name":"App download links in the portal","description":"Your Android, iOS, Windows and Mac download links appear inside the learner portal, including on desktop, so learners find your apps."}]},{"id":"ota-app-updates","name":"Over-the-Air App Updates","tagline":"Ship app fixes instantly — no app-store wait","description":"Push new versions of the mobile app straight to users' devices, skipping app-store review for content and UI updates. Releases can target specific institutes' branded apps, be marked as forced updates for critical fixes, and be rolled back instantly if something goes wrong.","roles":["Admin","Learner"],"platforms":["Admin Web","Learner Mobile App","API"],"subFeatures":[{"name":"Instant OTA releases","description":"Publish a new app bundle with version, release notes and integrity checksum; devices pick it up on their next update check via an in-app update banner."},{"name":"Targeted rollouts","description":"Aim a release at specific branded apps, specific platforms, or every app at once."},{"name":"Forced updates","description":"Mark a release as mandatory so devices must update before continuing — critical for security fixes."},{"name":"Native-version gating","description":"Each bundle declares the minimum native app version it supports, so older installs are never broken by an incompatible update."},{"name":"One-click rollback","description":"Deactivate a bad release and reactivate a previous one; devices revert on their next check."},{"name":"Release history","description":"A full log of every published version with size, publisher, notes and active status."}]},{"id":"multi-tenant-workspaces","name":"Multi-Tenant Institute Workspaces","tagline":"Isolated, branded workspaces for every institute and sub-org","description":"Every institute runs in its own secure workspace with its own users, roles, settings, branding and data — fully separated from every other tenant. Larger organizations operate sub-organizations (branches, franchises, partner academies) under one umbrella, each with its own branded entry point, while people who belong to several institutes switch between them from a single account.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App","API"],"subFeatures":[{"name":"Isolated institute workspaces","description":"Each institute's data, users and settings are fully separated from every other tenant on the platform."},{"name":"Sub-organizations & multi-brand operations","description":"Run branches or franchise partners as sub-orgs under a parent institute, each with its own domain routing, branding and self-registration entry points."},{"name":"Multi-institute membership","description":"One person can belong to several institutes with different roles in each, choosing the workspace at login and switching anytime — branding, terminology and content reload instantly without re-login."},{"name":"Batch selection for learners","description":"Learners enrolled in multiple batches choose which one to enter after login."},{"name":"Per-institute security settings","description":"Institute-level controls, such as the maximum concurrent sessions per learner, are configured per workspace."},{"name":"Instant workspace signup","description":"New organizations sign up and get a workspace with an owner account created immediately — including via Google or GitHub signup."}]},{"id":"naming-settings","name":"Naming Settings — Custom Terminology","tagline":"The whole platform speaks your institute's language","description":"Rename every user-facing term per institute, with independent singular and plural forms. Call a Course a 'Program', a Batch a 'Cohort', a Learner a 'Student' or 'Trainee' — and the change flows through menus, buttons, page titles, dialogs and reports everywhere, including your white-labeled domains. Ideal for schools, coaching institutes and corporate academies that each have their own vocabulary.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Content & structure terms","description":"Rename Course, Level, Session, Subject, Module, Chapter, Slide, Live Session, Batch, Package and the 'Popular' tag — 16+ configurable terms in total."},{"name":"Role terms","description":"Rename user roles — Admin, Teacher, Course Creator, Assessment Creator, Evaluator and Learner (e.g. 'Learner' becomes 'Student' or 'Trainee')."},{"name":"Other terms","description":"Rename Audience List (campaigns), Invite (enrollment links) and Inventory to match how your team talks."},{"name":"True singular and plural forms","description":"Configure each term's singular and plural independently — 'Faculty/Faculty', 'Child/Children' — not naive 's' appending."},{"name":"Plain-language explanations","description":"Each term shows a description of what it means in the platform, so admins rename with confidence."},{"name":"Applies across the product","description":"Custom names appear in sidebars, tabs, dialogs, table headers, toasts and page titles across admin and learner apps, and can apply on white-labeled domains and per-domain overrides."},{"name":"Session vs Batch taxonomy","description":"Distinguishes academic Session (semester or year) from Batch (learner group), so schools and corporate L&D both get natural language."}]},{"id":"multi-language-localization","name":"Multi-Language Interface & Course Translation","tagline":"Run your institute in your learners' language","description":"The admin dashboard and learner app are available in English, Hindi, French and Arabic, and each institute chooses its default language and which languages users can switch between. Courses can be translated into another language with AI, reviewed line by line and published, so learners see course content in the language they picked. Your custom terminology carries through in every language.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Translated admin and learner apps","description":"Menus, screens, dialogs and messages across the admin dashboard and learner app are available in English, Hindi, French and Arabic."},{"name":"Institute language settings","description":"Set the default language users see first, the languages offered in the switcher, the language your content is written in and the institute timezone."},{"name":"In-app language switcher","description":"Staff and learners switch language from the top bar whenever more than one language is enabled, and the change applies instantly."},{"name":"AI course translation","description":"Translate a whole course into another enabled language with AI, with the credit cost shown up front against your balance before you confirm."},{"name":"Review before publishing","description":"Choose to publish translations automatically or hold them as drafts, then approve or reject each translated item side by side with the original."},{"name":"Learners see their language","description":"Learners automatically get published course translations in the language they chose, while the original content is never altered."},{"name":"Terminology in every language","description":"Your custom names for courses, batches, learners and more are applied consistently, whichever interface language is in use."},{"name":"Worldwide timezones","description":"Institute and class-scheduling timezone pickers cover dozens of zones across every region, so schedules and reports line up wherever you operate."}]},{"id":"flexible-login-sso","name":"Flexible Login & Single Sign-On","tagline":"Every sign-in method your learners and staff prefer","description":"Learners and staff sign in the way that suits them — password, one-time codes by email or WhatsApp, phone number, or one-tap social sign-in with Google, GitHub and Apple. Institutes choose exactly which methods are enabled on each portal, first-time social sign-ins are registered automatically, and sessions renew silently so users stay signed in without interruption.","roles":["Admin","Teacher","Counsellor","Evaluator","Learner","Parent"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App","Public Web"],"subFeatures":[{"name":"Email / username + password login","description":"Classic sign-in for both admin and learner portals, with optional automatic lowercase normalization of usernames to avoid typo lockouts."},{"name":"Email OTP login","description":"Passwordless sign-in with a one-time code sent to the user's email — no password to remember or reset."},{"name":"WhatsApp & phone OTP login","description":"One-time codes delivered on WhatsApp for phone-first audiences, including a verify-only flow for confirming phone numbers and a verify-and-login flow."},{"name":"Extended 10-day OTP session","description":"A special OTP login keeps the learner signed in for ten days — ideal for exam-prep apps where daily re-login kills engagement."},{"name":"Social sign-in (Google, GitHub, Apple)","description":"One-tap Google and GitHub OAuth login for admin and learner portals, plus native Sign in with Apple on the learner iOS app."},{"name":"WordPress single sign-on","description":"A secure webhook logs users who sign in on your WordPress website straight into their learner account — one login for website and LMS."},{"name":"Auto account creation with welcome email","description":"First-time social sign-ins get an account created automatically and receive a welcome email with fallback credentials."},{"name":"Cross-app auth handoff","description":"After login, users are returned to the exact app and page they started from — including white-label custom domains — without re-authenticating."},{"name":"Per-portal login controls","description":"For every branded portal, independently switch password login, email OTP, phone login, Google and GitHub sign-in, and self-signup on or off."},{"name":"Credential recovery & distribution","description":"Users request their credentials by email in one click; admins can push login credentials to individual users or in bulk."},{"name":"Silent session renewal","description":"Sessions refresh securely in the background, so users stay signed in without interruption while security is preserved."},{"name":"Account identifier & duplicate detection","description":"Choose the identifier (such as email) that uniquely identifies users at registration and login; enrollment automatically detects existing accounts instead of creating duplicates."},{"name":"Edit and send learner credentials","description":"Admins update a learner's username or password and send it by email or WhatsApp using a template chosen in Learner Credential settings."}]},{"id":"device-session-security","name":"Device & Session Security","tagline":"Stop account sharing with per-learner device limits","description":"Cap how many devices a learner can be signed in on at once to stop account sharing. When the limit is hit, the learner sees their active devices and can log one out to free a slot — no support ticket needed. Revoked sessions are killed within minutes, and every session records its device type for visibility.","roles":["Admin","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Concurrent device limit","description":"Admins set a maximum number of simultaneous active sessions per learner for their institute (e.g. 2 devices); zero keeps it unlimited."},{"name":"Active device list","description":"When the limit is exceeded, the learner sees every active session with its device type and last activity."},{"name":"Remote logout of a single device","description":"The learner can end one specific session — say, the shared family tablet — and immediately sign in on the new device."},{"name":"Session heartbeat & instant revocation","description":"Apps validate the session every few minutes; a terminated session is signed out on its next request, so revocation takes effect fast."},{"name":"Clean logout everywhere","description":"Normal logout terminates the session server-side, not just locally, keeping the device count accurate."},{"name":"Device-type tracking","description":"Each session records whether it came from web, mobile app or desktop, giving admins visibility into how learners access content."}]},{"id":"learner-portal-designer","name":"Learner Portal Designer","tagline":"Design the learner app without writing code","description":"Shape everything a learner sees — sidebar layout, navigation style, custom tabs and widgets, sign-up options, notifications and post-login redirects. Preview how course navigation will look before saving, and control which profile fields learners can see and edit. Institutes effectively compose their own learner app.","roles":["Admin","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Layout & navigation","description":"Toggle, rename and reorder learner sidebar sections, and add custom tabs, sub-tabs and even custom widgets to the learner dashboard."},{"name":"Course navigation style","description":"Choose between a full expandable course tree or compact breadcrumb dropdowns, with a live visual preview of both."},{"name":"Learning experience defaults","description":"Set the default tab learners land on and how content outlines open."},{"name":"Learner side-view tabs","description":"Choose which side panels and tabs appear inside the learner content view."},{"name":"Login & signup options","description":"Control sign-up availability and account options for learners, including settings exposed to public enrollment pages."},{"name":"Notifications & post-login redirect","description":"Configure learner notification behavior and where learners land after login."},{"name":"Profile field visibility","description":"Choose which profile fields learners can see and which they can edit."},{"name":"Language selection","description":"A language dropdown lets learners switch the app language where enabled."}]},{"id":"appearance-studio","name":"Appearance Studio & Learner Skins","tagline":"Give the learner app your own look and feel","description":"A single Appearance page controls how your portals look: brand colour, font, page background, accent colours and sidebar colours, all with live previews. On top of your brand, choose a learner skin — from playful to corporate — and fine-tune corner style, spacing density and gradients. These choices reshape the learner app only, so your team's admin tools stay consistent.","roles":["Admin"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Brand colour","description":"Pick from preset palettes or enter any custom colour, and the full shade range is generated for buttons, highlights and charts."},{"name":"Font choice","description":"Choose the typeface used across your portals, with the editor previewing it immediately."},{"name":"Page background and accents","description":"Set the page background with brand-tint or neutral suggestions, plus secondary and tertiary accent colours."},{"name":"Sidebar colours","description":"Customise the sidebar surface, hover, active item and text colours to match your brand."},{"name":"Learner skins","description":"Switch the whole learner app between Default, Vibrant, Play, Cleaner Play and a modern Corporate skin suited to workplace training."},{"name":"Corner style","description":"Choose sharp, rounded or pill-shaped corners for cards, buttons and inputs throughout the learner app."},{"name":"Spacing density","description":"Choose compact, default or comfortable spacing to suit content-heavy courses or a more relaxed layout."},{"name":"Gradient intensity","description":"Pick flat, subtle or full gradients for headers and highlights in the learner app."},{"name":"Live scale previews","description":"Every option shows a miniature preview of the learner app, so you see the result before saving."}]},{"id":"tab-visibility-controls","name":"Feature & Tab Visibility Controls","tagline":"Turn whole product areas on or off per institute","description":"Switch entire product areas on or off so your team only sees what you actually use. Hide the Community Centre, Evaluation Centre, Doubt Management or Reports — down to individual sub-items under each area — and restore the standard layout in one click.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Top-level tab toggles","description":"Show or hide major areas such as Community Centre, Evaluation Centre, Doubt Management and Reports."},{"name":"Sub-item toggles","description":"Within a visible area, toggle individual sub-items; at least one sub-item always stays visible as a safety net."},{"name":"Reset to defaults","description":"One click restores the standard tab layout."},{"name":"Module entitlements","description":"Institutes are provisioned with product modules (Assessment, LMS, Volt, Vsmart) and their sub-modules, controlling which product areas appear at all."},{"name":"Copy settings to other roles","description":"Copy one role's display settings to any or all other roles, including custom roles, while each role keeps its own safety rules."}]},{"id":"branded-sender-email","name":"Branded Sender Email","tagline":"Send from your own domain, not ours","description":"Verify your own sender email addresses and domains so all platform email goes out under your brand. The product triggers verification, hands you the exact DNS records to publish, and tracks verification status separately for marketing, transactional and notification email.","roles":["Admin"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Self-serve sender verification","description":"Start verification of a custom from-address directly from the product; the platform handles the email-provider setup behind the scenes."},{"name":"DNS record guidance","description":"The verification flow returns the DNS records needed for domain authentication and reports live verification status."},{"name":"Per-purpose sender identities","description":"Configure distinct verified senders for marketing, transactional and notification emails — each independently managed, testable and restorable to defaults."},{"name":"Sender configuration management","description":"Create, update, delete and test per-institute email configurations, including from-name display and default templates."}]},{"id":"webhooks-open-api","name":"Webhooks & Open AP
