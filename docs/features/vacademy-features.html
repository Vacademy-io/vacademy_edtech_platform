Reel candidates found","value":"18","delta":"from one 62-min lecture"},{"label":"Final render","value":"1080p · 30fps"},{"label":"Languages shipped","value":"6"},{"label":"Credits used","value":"139"}]},{"type":"list","id":"reel-list","items":[{"title":"\"Why the ball comes back\" — hook","sub":"0:42 · 9:16 · karaoke captions","chip":"Rendered","tone":"green"},{"title":"Inertia in 30 seconds","sub":"0:31 · hook score 92 · auto b-roll","chip":"Rendered","tone":"green"},{"title":"F = ma numerical trick","sub":"0:58 · silence-trimmed, 1.2x pace","chip":"Rendering","tone":"blue"}]},{"type":"list","id":"locale-list","items":[{"title":"Tamil — lip-synced dub","sub":"Glossary protected: \"NEET\", \"Vacademy\"","chip":"Approved","tone":"green"},{"title":"Bengali — lip-synced dub","sub":"Per-segment review by Ananya","chip":"In review","tone":"blue"},{"title":"Marathi — lip-synced dub","sub":"Batch render queued","chip":"Queued","tone":"orange"}]}],"module":"ai"}],"steps":[{"screen":"create","target":null,"title":"Type a topic, get a finished video","text":"This is Vimotion, Vacademy's AI video studio. Type a brief — or paste a PDF, deck or URL — and the AI writes the script, records the voiceover, designs every animated scene and renders a branded MP4 in minutes."},{"screen":"create","target":"create-brief","title":"Speak to every learner, in their language","text":"Pick from 200+ voices across 60+ narration languages — including 9 Indian languages with 35+ authentic Indian voices — set the audience from Class 1–2 to Graduate, and choose any length from 30 seconds to 10 minutes."},{"screen":"create","target":"create-cost","title":"Know the cost before you generate","text":"An itemized credit estimate prices your exact setup — tier, duration, voice, avatar — next to your live balance, before you press Generate. Past runs sit in history, so you can reopen results or reuse their settings."},{"screen":"storyboard","target":"gen-stages","title":"Watch production, stage by stage","text":"Live progress streams through script, voiceover, storyboard and render. Pause at the script to review the narration, leave and come back, or resume a failed run from its last checkpoint without losing spend."},{"screen":"storyboard","target":"shot-cards","title":"Real motion design, not templates","text":"Scenes come from a library of 18+ animated types — equation builds, data stories, kinetic titles — across 8 visual themes. On Premium and above, an AI vision pass inspects every rendered frame for defects before it ships."},{"screen":"storyboard","target":"assist-chat","title":"Direct the AI like a filmmaker","text":"Assist Mode pauses at checkpoints you choose — concept, shot plan, narration, casting — and asks for your call in chat. Put a presenter on camera too: pick from 30+ avatars or build one from a single photo of your teacher."},{"screen":"editor","target":"ed-settings","title":"Five quality tiers, your presenter","text":"Trade cost for polish across Free to Super Ultra tiers. Your avatar — cloned from a photo or a 2-minute phone recording — presents lip-synced in 80+ languages, and a 2-minute audio sample clones the voice to match."},{"screen":"editor","target":"ed-edits","title":"Edit in plain English","text":"Rewrite one sentence and only that line is re-recorded in the same voice and spliced in. Or type instructions like \"cut the intro\" — the assistant shows a preview and applies a surgical patch, never a costly full regeneration."},{"screen":"publish","target":"reel-list","title":"One lecture, a week of reels","text":"Point Vimotion at any long recording: a free scan scores up to 50 moments on hook strength and pacing, then renders the winners as 9:16 reels with karaoke captions, auto b-roll and silence trimming — you pay only for keepers."},{"screen":"publish","target":"locale-list","title":"Localized into 80+ markets","text":"Translate the finished video into 80+ languages with frame-accurate lip sync, so it looks filmed in Tamil or Bengali — not dubbed. A brand glossary protects names like \"NEET\", and reviewers approve lines per market before render."}]}},{"id":"automation","name":"Automation & Workflows","icon":"auto","color":"#0EA5E9","tagline":"Visual workflows and one-click automations across the platform","description":"Automation & Workflows turns every event in your institute — an enrollment, a missed class, a payment, a new lead — into the next right action, automatically. Build sophisticated flows on a visual canvas, switch on ready-made automations with one click, or simply describe what you want and let AI draft it. Every run is logged step-by-step, so you always know exactly what was sent, to whom, and when.","features":[{"id":"visual-workflow-builder","name":"Visual Workflow Builder","tagline":"Drag-and-drop automation engine for your whole institute","description":"A full visual builder for event-driven and scheduled automations across the platform. Drag nodes onto a canvas — triggers, data queries, filters, conditions, loops, emails, WhatsApp, push notifications, webhooks and more — wire them together, test them safely, and publish. Workflows listen to what actually happens (attendance, payments, enquiries, live classes, assessments) and fire the next move without anyone lifting a finger. Every run is logged step-by-step so you can see exactly what happened and to whom.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"35+ trigger events","description":"Fire workflows on enrollment, re-enrollment, learner termination, lead form submission, lead opt-out, installment due, live class created/started/ended, payment success/failure, abandoned cart, subscription cancelled, membership expiry, course created, doubt raised, assignment submitted, invites, counsellor assignment, follow-ups due or overdue, lead SLA breaches, lead status changes, inbound AI calls, and assessment lifecycle events."},{"name":"Scheduled workflows","description":"Run automations on a schedule — cron expressions, intervals or day-of-month, timezone-aware, with start and end dates and next-run visibility."},{"name":"20 node types","description":"Trigger, Query, Transform, Filter, Aggregate, Action, Send Email, Send WhatsApp, Push Notification, HTTP Request, Chatbot, Delay, If/Else, For-Each loop, Merge, Schedule Task, Update Record, Set Lead Status, Router and AI Call nodes — all in a searchable palette."},{"name":"Prebuilt data queries","description":"Ready-made lookups like batch students, live-session attendance (present and absent lists), fee installments, admin team emails, attendance reports and user contact details — no technical setup needed."},{"name":"Point-and-click condition & aggregate builders","description":"Build branching logic and data aggregations visually, with a variable picker that surfaces every value available at each step."},{"name":"Template gallery with 26 use-case templates","description":"Start from proven templates — batch emails, parent updates, lead confirmations, fee reminders, expiry checks, session recaps, assessment notifications, engagement summaries and more — each with a short question wizard."},{"name":"Outgoing webhooks (Zapier, Make, Pabbly, n8n)","description":"Send learner or cart details to any external URL on events like enrollment or abandoned checkout, with a fully configurable payload and per-course scoping."},{"name":"Incoming webhook trigger","description":"Each workflow can expose its own webhook URL, so external systems can start it directly."},{"name":"Safe test runs & manual triggering","description":"Test-run a workflow before publishing, or fire it on demand outside its schedule — with clear warnings before real messages go out."},{"name":"Pre-publish validation","description":"Built-in validation catches misconfigured steps with errors and warnings before anything goes live."},{"name":"Execution history & step-by-step logs","description":"Every run appears in a history tab with summary cards (total, completed, failed, success rate, average duration), a visual execution flow, a timeline, and per-node logs including messages sent and any errors."},{"name":"Duplicate-safe delivery","description":"Built-in safeguards ensure a learner never receives the same automated message twice for the same event."},{"name":"Workflow management","description":"Search and list all workflows (event-driven vs scheduled), edit them on the canvas, pause or deactivate with full history preserved, and view a simplified diagram of any automation."},{"name":"More trigger events","description":"Start automations when an assessment is published, results are released, a test is about to start, a reattempt is requested or granted, an AI copy-check finishes, a plan changes, onboarding steps progress, or HR leave and payroll events occur."},{"name":"Wait until a weekday","description":"Delay steps can pause until the next chosen weekday and time — for example, start a drip the Monday after signup — not only for a fixed duration."},{"name":"Branded short links","description":"Messages can carry short links instead of long join URLs, optionally with a readable code such as the learner's mobile number, and each learner keeps the same link."},{"name":"WhatsApp steps on par with email","description":"Send WhatsApp to any phone field — including parent numbers or a form's phone question — in any template-gallery automation, with variables mapped to lead details or form answers and a live preview."},{"name":"Plain-language Configuration tab","description":"A simple view lets non-technical admins edit message text, links, day-by-day schedules and step settings as readable cards with live template previews; a developer view keeps the full editor."},{"name":"Clear 'what fires, for whom' diagram","description":"The workflow diagram names the actual trigger event, the batch or audience it is scoped to, and the template each step sends."},{"name":"Per-learner automation history with Retry","description":"A Workflows tab on each learner's profile lists every automation that ran for them, step by step, with a one-click Retry using the original inputs."}]},{"id":"ai-workflow-creation","name":"AI-Assisted Workflow Creation","tagline":"Describe the automation — AI drafts the workflow","description":"Type your goal in plain language — 'email parents every Friday with attendance' — and AI drafts a complete, ready-to-review workflow on the canvas. It asks clarifying questions when needed, explains its reasoning step-by-step, and flags anything that needs your attention. Nothing goes live until you review and publish.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Plain-language drafting","description":"Describe what you want; the AI picks the right triggers, data queries, templates and actions and assembles the flow for you."},{"name":"Clarifying questions","description":"When your goal is ambiguous — which batch? which template? — the AI asks targeted follow-up questions and re-drafts."},{"name":"Step-by-step rationale","description":"Every draft comes with an explanation of why each step exists, so you can trust it and tweak it confidently."},{"name":"Human review before publish","description":"Drafts load into the visual builder for full review and editing — an admin always makes the final call to publish."},{"name":"Same validation as hand-built workflows","description":"AI drafts run through the standard validation checks, surfacing errors and warnings inline before going live."},{"name":"Multi-day drip drafting","description":"AI can draft multi-day sequences — such as a 14-day WhatsApp trial series that starts the Monday after signup — with duplicate-safe delivery to each person built in."},{"name":"Build workflows from your own AI assistant","description":"Through the institute's AI-assistant connector, admins can list, inspect and draft workflows from their preferred AI chat tool; drafts stay unpublished until reviewed in the builder."}]},{"id":"one-click-automations-library","name":"One-Click Automations Library","tagline":"Switch on ready-made automations — no builder required","description":"A curated library of plug-and-play automations organised by what they do for learners, parents and your own team. Each one is a plain-language toggle: pick a template (or use a provided sample), answer one or two simple questions, and it's live. Behind the scenes each recipe creates a full workflow you can inspect or extend later.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Audience & lead automations","description":"Instant welcome email on form submission, opt-out confirmations, immediate nurture and second-touch emails, and follow-ups sent a set number of days after a lead submits."},{"name":"Course announcements","description":"Automatically announce a newly published course to learners in chosen batches — built-in cross-sell."},{"name":"Live class automations","description":"'We're live now' alerts when a class starts, invites when one is scheduled, post-class follow-ups, and separate recap emails for learners who attended versus those who missed."},{"name":"Enrollment & onboarding","description":"Welcome emails with login credentials on enrollment, welcome-back emails on re-enrollment, sub-organisation member welcomes, and access-removed notices."},{"name":"Payments & fees automations","description":"Daily fee-due reminders, instant payment-success receipts, payment-failed emails with retry links, and abandoned-checkout nudges."},{"name":"Membership & renewal automations","description":"Scheduled expiry scans with configurable notice periods, renewal nudges when a plan enters its renewal window, cancellation win-back emails, and termination notices."},{"name":"Attendance & engagement reports","description":"Scheduled attendance reports across all batches, per-learner engagement summaries, and weekly attendance updates."},{"name":"Parent update automations","description":"Tell parents whether their child attended each live class, plus scheduled weekly attendance roll-ups."},{"name":"Admin team alerts","description":"Email your team on every new enrollment, payment success or failure, new lead, new course, new doubt raised, assignment submission, and post-class attendance summaries."},{"name":"Assessment notifications","description":"Notify a batch when an assessment is published and remind them when the assessment window opens."},{"name":"Guided configuration","description":"Each recipe asks only friendly questions — which template, which batch, what time, how many days — with sample email templates offered when you have none."},{"name":"Toggle on and off with confidence","description":"Automations show as simple switches; turning one off pauses the underlying workflow with all history preserved."},{"name":"WhatsApp lead confirmations","description":"Lead-form confirmation and follow-up automations can go out by email, WhatsApp or both, with each template variable mapped to lead details or form answers and a live message preview."}]},{"id":"whatsapp-chatbot-flow-builder","name":"WhatsApp Chatbot Flow Builder","tagline":"Build WhatsApp bots that qualify leads while you sleep","description":"A visual drag-and-drop builder for automated WhatsApp conversations. Trigger flows on keywords or events, send messages, templates or interactive button menus, branch on replies, trigger platform workflows mid-chat, and hand over to AI for free-form conversation. Every conversation is recorded as a session, with live inspection and analytics to show how each flow performs.","roles":["Admin","Counsellor"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Nine node types","description":"Build flows from Trigger, Send Message, Send Template, Send Interactive, Condition, Workflow Action, Delay, HTTP Webhook and AI Response nodes connected on a visual canvas."},{"name":"Six trigger types","description":"Start flows on keyword match (contains or exact), first contact from a new number, button reply, enrollment events, form submissions, or engagement-threshold events."},{"name":"Free-form messaging","description":"Send text, images, videos or documents inside the 24-hour conversation window — no template approval needed."},{"name":"Approved template sends","description":"Send pre-approved WhatsApp templates with body parameters, header media and buttons."},{"name":"Interactive buttons & lists","description":"Send tappable button menus and list pickers to guide users through choices."},{"name":"Conditional branching & personalisation","description":"Branch the conversation on the user's reply or resolved variables, with a default fallback path; personalisation variables are substituted throughout the flow."},{"name":"AI-powered replies","description":"Hand the conversation to AI for natural, free-form answers to open-ended questions inside the flow."},{"name":"Workflow actions & external webhooks","description":"Trigger any platform workflow from inside a chat — create a lead, enroll a learner, send an email — or call an external URL mid-conversation to fetch or push data."},{"name":"Timed delays","description":"Pause a flow for minutes or hours (for example, follow up after 24 hours) with a scheduler that reliably resumes where it left off."},{"name":"Variable capture to lead fields","description":"Map chat answers into lead fields — name, email, mobile, city and more — plus custom fields and session variables, building a lead record straight from the conversation."},{"name":"Session viewer & tracking","description":"Every user's journey through a flow is a session with a clear status (active, completed, timed-out or error), browsable message-by-message."},{"name":"Flow analytics","description":"Per-flow and institute-wide analytics on sessions and completions show exactly how each bot performs."},{"name":"Flow lifecycle management","description":"Draft, activate, deactivate, duplicate, archive and edit flows, with everything listed in one place."},{"name":"Works with your WhatsApp provider","description":"Flows run transparently over the institute's connected WhatsApp provider."},{"name":"CRM lead capture steps","description":"Check whether a number is already a lead, ask one CRM question at a time with validation, and save each answer immediately — so even half-finished chats land in the CRM."},{"name":"Hand over to a human","description":"When the AI does not know the answer it says so instead of guessing, tells the learner someone will reply, and flags the chat as Unanswered in the WhatsApp inbox."}]},{"id":"audience-drip-messaging","name":"Audience Messaging & Drip Automation","tagline":"Message an entire lead list in one send","description":"Send WhatsApp, email or push messages to everyone in a campaign audience, with template variables auto-filled from each lead's form answers and filters to narrow the recipient list. A full history of what was sent to each audience is kept, and leads who opt out are handled automatically — including a polite goodbye sequence.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Multi-channel sends","description":"Choose WhatsApp (template-based with language selection), email (utility or promotional, with subject and rich body), push notification or in-app alert."},{"name":"Variable mapping","description":"Map template variables to lead fields so every message is personalised automatically."},{"name":"Recipient filtering","description":"Narrow a send by lead source, submission date range or custom-field values instead of blasting the whole list."},{"name":"Communication history","description":"A per-campaign log of every message sent, and per-lead communication history right in the lead drawer."},{"name":"Opt-out management","description":"Leads who reply STOP or tap opt-out are moved to an opt-out list immediately; silent leads can be auto-opted-out by an inactivity scanner."},{"name":"Opt-out goodbye drip","description":"A polite goodbye sequence goes out on opt-out — immediate for explicit opt-outs, next morning for inactivity — with a second message two days later."},{"name":"Suppression everywhere","description":"Opted-out and deleted leads are excluded from every future recipient list automatically."}]},{"id":"engagement-nudges","name":"Automated Engagement Nudges","tagline":"Automatically re-engage learners who go quiet","description":"Configure inactivity triggers that automatically send a WhatsApp message when a learner or lead hasn't engaged for a chosen period. Rules can be scoped to a batch or the whole institute, chained so a nudge only fires after a previous message, and paired with audience filters that find inactive users ready for a campaign.","roles":["Admin","Counsellor"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Inactivity thresholds","description":"Define a time threshold — cumulative or since last activity — after which a chosen template is sent automatically to the inactive contact."},{"name":"Sequenced nudges","description":"Require that a previous message was already sent before the next nudge fires, enabling drip-style re-engagement sequences."},{"name":"Inactive-audience filters","description":"Find inactive users, inactive phone numbers, users at a specific point in a message sequence, or users by the messages they have or haven't received — ready to target with a campaign."},{"name":"Real engagement signals","description":"Learner activity events are logged continuously, so triggers evaluate on real usage rather than guesswork."},{"name":"Per-batch or institute-wide scope","description":"Each trigger rule is scoped to a specific batch or the whole institute and can be switched on or off independently."}]}],"demo":{"intro":"Watch a fee-reminder automation go from a visual canvas to messages on a parent's phone — and the run log that proves it all happened.","screens":[{"id":"builder","device":"desktop","title":"Workflow Builder — Daily Fee Reminder","nav":["Dashboard","Study Library","Learners","Automations*","Payments","Reports","Settings"],"widgets":[{"type":"header","id":"wf-head","title":"Daily Fee Reminder","subtitle":"Scheduled · Every day, 9:00 AM IST · Next run in 14h","actions":["Test Run","Publish"]},{"type":"tree","id":"flow-tree","nodes":[{"label":"Trigger — Schedule: daily, 9:00 AM IST","children":[{"label":"Query — Fee installments due in 3 days","children":[{"label":"If/Else — Installment still unpaid?","children":[{"label":"Yes → Send WhatsApp: 'fee_reminder_v2' template","children":[{"label":"Send Email — reminder with payment link"}]},{"label":"No → End (already paid)"}]}]}]}]},{"type":"chat","id":"ai-draft","messages":[{"from":"user","text":"Remind parents on WhatsApp 3 days before a fee installment is due"},{"from":"ai","text":"Drafted a 5-node workflow: daily schedule → fee-installments query → unpaid filter → WhatsApp + email. Which batches should it cover — all, or NEET 2027 Batch A only?"}],"composer":"Describe an automation..."}],"module":"crm"},{"id":"library","device":"desktop","title":"One-Click Automations","nav":["Dashboard","Study Library","Learners","Automations*","Payments","Reports","Settings"],"widgets":[{"type":"header","id":"lib-head","title":"Automations Library","subtitle":"26 ready-made recipes · 9 active","actions":["Open Workflow Builder"],"tabs":["All recipes","Active","Drafts","Templates"],"activeTab":0},{"type":"form","id":"auto-toggles","title":"Payments & Fees","fields":[{"label":"Daily fee-due reminders (WhatsApp + email)","value":"on","type":"toggle"},{"label":"Instant payment-success receipt","value":"on","type":"toggle"},{"label":"Payment-failed email with retry link","value":"on","type":"toggle"},{"label":"Abandoned-checkout nudge","value":"off","type":"toggle"}]},{"type":"cards","id":"lib-cards","items":[{"title":"Live class alerts","sub":"'We're live now' + separate recaps for absentees","chip":"3 active","tone":"green"},{"title":"Parent updates","sub":"Attended vs missed, weekly attendance roll-ups","chip":"2 active","tone":"green"},{"title":"Enrollment & onboarding","sub":"Welcome email with login credentials","chip":"On","tone":"green"},{"title":"Membership renewals","sub":"Expiry scans, renewal nudges, win-back emails","chip":"Off","tone":"gray"}]}],"module":"crm"},{"id":"run","device":"phone","title":"Parent's Phone — 9:00 AM","nav":["Chats*","Updates","Calls","Settings"],"widgets":[{"type":"header","id":"p-head","title":"Mrs. Verma","subtitle":"+91 98201 44573 · Rohan, NEET 2027 Batch A"},{"type":"notify","id":"sent-msgs","items":[{"channel":"WhatsApp","text":"Hi Mrs. Verma, Rohan's installment #2 of ₹12,500 for NEET 2027 Batch A is due 20 Jul. Pay securely: vacademy.io/pay/8k2f"},{"channel":"Email","text":"Fee reminder — ₹12,500 due 20 Jul · invoice and payment link attached"},{"channel":"Push","text":"Reminder: Rohan's fee installment is due in 3 days"}]}]},{"id":"history","device":"desktop","title":"Execution History — Daily Fee Reminder","nav":["Dashboard","Study Library","Learners","Automations*","Payments","Reports","Settings"],"widgets":[{"type":"stats","id":"run-stats","items":[{"label":"Runs this month","value":"312"},{"label":"Success rate","value":"98.7%"},{"label":"Messages sent","value":"1,046","delta":"+41 today"},{"label":"Avg duration","value":"6.2s"}]},{"type":"table","id":"run-table","columns":["Run","Trigger","Recipients","Status","Duration"],"rows":[["17 Jul, 9:00 AM","Schedule","41 parents",{"chip":"Completed","tone":"green"},"5.8s"],["16 Jul, 9:00 AM","Schedule","38 parents",{"chip":"Completed","tone":"green"},"6.1s"],["15 Jul, 9:00 AM","Schedule","44 parents",{"chip":"1 failed","tone":"red"},"7.4s"],["14 Jul, 9:00 AM","Schedule","36 parents",{"chip":"Completed","tone":"green"},"5.9s"]]},{"type":"list","id":"step-log","items":[{"title":"Trigger fired","sub":"15 Jul, 9:00:00 AM IST","chip":"OK","tone":"green"},{"title":"Query: fee installments due in 3 days","sub":"44 unpaid installments found","chip":"OK","tone":"green"},{"title":"Send WhatsApp × 44","sub":"fee_reminder_v2 · all delivered","chip":"OK","tone":"green"},{"title":"Send Email × 44","sub":"1 bounced — invalid address for Kabir Shah","chip":"1 failed","tone":"red"}]}],"module":"crm"}],"steps":[{"screen":"builder","target":null,"title":"Every event becomes the next action","text":"Vacademy's workflow engine listens to 35+ events — enrollments, payments, missed classes, new leads — and fires the right response automatically. This flow chases unpaid fee installments every morning."},{"screen":"builder","target":"flow-tree","title":"Wire it up on a visual canvas","text":"Drag from 20 node types — triggers, queries, If/Else branches, loops, delays, WhatsApp, email, push, webhooks — and connect them. Prebuilt lookups like 'fee installments due' mean zero technical setup."},{"screen":"builder","target":"ai-draft","title":"Or describe it — AI drafts the flow","text":"Type your goal in plain language and AI assembles the whole workflow, asking clarifying questions — which batch? which template? — and explaining every step. Nothing goes live until you review and publish."},{"screen":"builder","target":"wf-head","title":"Test safely before anything goes live","text":"Run a safe test with clear warnings before real messages go out. Pre-publish validation flags misconfigured steps, and duplicate-safe delivery ensures no one ever gets the same message twice for one event."},{"screen":"library","target":"lib-cards","title":"26 automations, ready to switch on","text":"No canvas needed — the curated library covers live class alerts, parent updates, enrollment welcomes with login credentials, renewal nudges and admin team alerts. Each recipe is a full workflow you can open and extend later."},{"screen":"library","target":"auto-toggles","title":"Fee follow-ups in one click","text":"Flip a switch and answer one or two friendly questions — which template, what time, how many days before due. Daily reminders, payment receipts and failed-payment retry links start running immediately."},{"screen":"run","target":"sent-msgs","title":"The right message, on every channel","text":"At 9:00 AM the run finds Rohan's unpaid ₹12,500 installment and reaches his parent on WhatsApp, email and push — template variables filled from his record, with a secure payment link in each message."},{"screen":"history","target":"run-table","title":"Every run, on the record","text":"The history tab logs each execution with recipients, status and duration — plus summary cards for runs, success rate and average time. When a parent says 'I never got it', you have the receipt."},{"screen":"history","target":"step-log","title":"Drill into any run, node by node","text":"Open a run to see the execution flow step by step: what the query found, exactly which messages went out, and what failed and why — like the one bounced email here — so nothing is a black box."}]}},{"id":"finance","name":"Finance & Payments","icon":"fin","color":"#059669","tagline":"Fees, invoices, subscriptions and 6+ payment gateways","description":"Vacademy Finance & Payments handles every way an education business collects money — online course sales, recurring subscriptions, school-style fee installments, and front-office cash collection — with the funds settling directly into your own payment gateway account. Branded tax-compliant invoicing, shareable payment links, self-service learner billing and audited fee adjustments replace a patchwork of gateway dashboards, billing tools and spreadsheets with one connected system.","features":[{"id":"payment-gateway-integrations","name":"Payment Gateway Integrations","tagline":"Your gateway, your money — connected in minutes","description":"Connect the payment gateway your institute already uses and collect money directly into your own account — Vacademy never sits between you and your funds. Six gateways are supported out of the box, each with guided credential entry, copy-paste webhook URLs and automatic payment verification. Manage, edit and deactivate gateways any time.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Stripe","description":"Accept international card payments with your own API keys, including saved cards and recurring charges. An optional webhook signing secret verifies every payment callback."},{"name":"Razorpay","description":"India's most popular gateway for UPI, cards, netbanking and wallets, with guided setup for key ID, key secret and webhook secret."},{"name":"PhonePe","description":"PhonePe Standard Checkout for Indian merchants — UPI, cards and wallets with INR settlement, live and sandbox environments, and credential-secured webhooks."},{"name":"Cashfree","description":"Cashfree Payments for India with hosted checkout and automatic payment-status callbacks."},{"name":"eWAY","description":"eWAY for Australian and international merchants, including tokenized recurring payments and automatic payment-status polling."},{"name":"PayPal","description":"Accept international payments through PayPal."},{"name":"Guided gateway setup","description":"Step-by-step, provider-specific setup inside Settings — field-by-field help, links to each provider's dashboard, and the exact webhook URL to paste in so payment statuses sync automatically."},{"name":"Secure webhook verification","description":"Incoming payment confirmations are signature-verified per gateway; failed callbacks are logged and can be reprocessed so no payment is ever lost."},{"name":"Real-time payment status checks","description":"Live order-status lookup against the gateway ensures a payer's screen always reflects the true outcome, even if a confirmation callback is delayed."},{"name":"Gateway lifecycle management","description":"View configured gateways, edit credentials, refresh status and deactivate a gateway at any time."}]},{"id":"flexible-payment-plans","name":"Flexible Payment Plans","tagline":"Free, one-time, subscription, installment or donation — price it your way","description":"Sell every course or batch under the pricing model that fits it: free access, one-time payments, recurring subscriptions, multi-installment fee plans or pay-what-you-want donations. Build payment options once, attach them to batches or enrollment invites as the default or a per-batch preference, and learners automatically see the right checkout.","roles":["Admin"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Public Web"],"subFeatures":[{"name":"Free enrollment plans","description":"Open a course at no charge, optionally with a validity period after which access expires."},{"name":"One-time (upfront) payment","description":"A single payment for access, with validity configurable in days or months and an optional strike-through 'was' price to show savings."},{"name":"Subscriptions with custom intervals","description":"Recurring plans with any billing intervals you define (e.g. 1/3/6/12 months), each with its own title, price and feature checklist on the plan card."},{"name":"Donation plans","description":"Let supporters pay what they want — configure suggested amounts, an optional minimum, and whether custom amounts are allowed."},{"name":"Installment fee plans","description":"Attach a multi-installment, school-style fee structure (tuition, admission, transport and more) as the payment option for a batch."},{"name":"Plan-level discounts","description":"Configure discounts directly on a plan — for example longer-commitment pricing — so the reduced price is what learners see at checkout."},{"name":"Enrollment approval gate","description":"Optionally require admin approval before a paid or free enrollment goes live."},{"name":"Default and preferred plans","description":"Mark one payment option as the institute default and set preferred options per batch; checkout picks the right one automatically."},{"name":"Multi-member plans","description":"Plans can carry a member count for family and group enrollments."},{"name":"Plan descriptions, tags and feature lists","description":"Each plan supports a marketing description, tag and feature list that render on public plan cards."},{"name":"Checkout previews","description":"Live previews show subscription and donation plans exactly as learners will see them before you publish."},{"name":"Plan library management","description":"Edit, list and safely delete payment plans from one place."},{"name":"Searchable plan picker","description":"Find payment plans by name and filter by type, newest first, with each plan showing when it was created and by whom; every plan change is recorded in the activity log."}]},{"id":"subscriptions-auto-pay","name":"Subscriptions & Auto-Pay","tagline":"Recurring revenue with automatic off-session charging","description":"Recurring plans charge learners automatically when each period renews, using saved payment mandates on Stripe, Razorpay or eWAY. Learners manage their own memberships and cards; admins can see and change any learner's plan status at any time.","roles":["Admin","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Payment mandates","description":"A saved, provider-agnostic auto-pay authorization per subscription charges renewals without the learner returning to checkout."},{"name":"Charge cap protection","description":"Every mandate carries a maximum amount derived from the plan, enforced before each recurring charge as an extra safety layer."},{"name":"Mandate lifecycle states","description":"Mandates move through Pending, Active, Paused, Revoked and Failed states, so admins always know why a renewal did or didn't charge."},{"name":"Learner self-service cancellation","description":"Learners can view their active memberships and cancel a subscription themselves from their account."},{"name":"Admin plan management","description":"List every learner plan, change plan status (Active, Pending Payment, Payment Failed, Canceled, Expired, Terminated), or cancel on a learner's behalf."},{"name":"Membership details view","description":"Per-learner membership lookup showing the plan, validity window, payment option and full payment history behind it."},{"name":"Expiry and re-enrollment policies","description":"Configurable policies define what happens when a plan expires, including re-enrollment rules and follow-up actions."},{"name":"Saved card updates","description":"Learners can securely replace the card on file and update billing details without contacting the institute."},{"name":"Pay to continue","description":"Learners whose auto-pay was cancelled or failed can pay once from their subscriptions page to reactivate the same membership, optionally re-enabling auto-pay for future renewals."},{"name":"Grace period on failed renewals","description":"Keep a learner's access for a set number of days after a failed renewal while the charge is retried, and only revoke access if it is still unpaid."},{"name":"Fixed-term subscriptions","description":"Set a total subscription duration in months so auto-pay stops charging once the term is complete, with access running to the end of the final paid period."},{"name":"One free trial per learner","description":"A learner who has already used a free trial at your institute is charged the full price on return, even through a different enrollment link."}]},{"id":"plan-upgrades","name":"Plan Upgrades & Switching","tagline":"Let members move up a plan without re-enrolling","description":"Members on a recurring plan can upgrade to a longer or richer plan themselves, paying only the price difference and keeping their membership, payment history and invoices intact. Admins decide exactly which plans are switchable, and can also move a learner between plans directly as a back-office correction. Auto-pay is re-authorised at the new price so future renewals charge the right amount.","roles":["Admin","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Self-service upgrades","description":"Learners see a Change plan option on their membership and subscriptions page, with a clear quote of what they will pay and what they will get before confirming."},{"name":"Pay only the difference","description":"An upgrade costs the new plan's price minus the current plan's price, and the extra validity is added onto the learner's existing end date — no lost days, no restarted term."},{"name":"Same membership, unbroken history","description":"The learner's existing membership is updated in place, so payment history, invoices, ledger entries and course access stay continuous instead of being split across a new enrollment."},{"name":"Three-level opt-in","description":"An institute-wide master switch plus per-payment-option and per-plan switches let you open plan changes only where you want them; everything stays off by default."},{"name":"Admin plan change","description":"From a learner's profile, admins can move them to another plan immediately without a charge, for corrections and negotiated arrangements."},{"name":"Auto-pay re-authorisation","description":"When an upgrade affects recurring billing, the learner re-approves the mandate so future cycles automatically debit the new plan's full price, honouring UPI or card."},{"name":"Works for lapsed members too","description":"Learners whose plan has expired or whose renewal failed can still pick an upgrade to get back in, with an abandoned earlier checkout shown rather than silently blocking them."}]},{"id":"school-fee-structures","name":"School Fee Structures","tagline":"Real school fees: heads, installments, penalties, approvals","description":"Model true school-style fees with multiple fee heads — tuition, admission, transport, hostel, mess, sports and any custom types — each with its own amount, installment schedule and rules. Structures pass through a maker-checker approval before use and attach directly to batches, so every new admission inherits the right fee plan automatically.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Custom fee type catalog","description":"Define any number of fee heads with name, code and description (Tuition, Admission, Transport, Hostel, Mess, Sports, Exam and more) and reuse them across fee plans."},{"name":"Per-fee installment schedules","description":"Each fee head can be paid in full or split into numbered installments, each with its own amount, start/end dates and due date."},{"name":"Installment plan templates","description":"Ready-made Monthly, Quarterly, Term-wise and Annual structures, editable to your academic calendar, with one plan markable as the institute default."},{"name":"Late-payment penalties","description":"Mark a fee head as penalty-bearing with a configurable penalty percentage for overdue installments."},{"name":"Refundable flags","description":"Tag fee heads such as caution money as refundable for correct accounting."},{"name":"Built-in discounts","description":"Apply a percentage or flat discount to a fee head, keeping both the original and discounted amounts on record."},{"name":"Maker-checker approval","description":"Fee structures record who created them and require a separate approval step before going live."},{"name":"Batch linking","description":"Attach a fee structure to one or more batches or enrollment invites so new admissions automatically inherit the right fee plan."},{"name":"Fee-type priority ordering","description":"Set an institute-wide priority order of fee heads that controls how incoming payments are allocated across dues."},{"name":"Edit and retire safely","description":"Update structures and fee types or retire a structure without losing historical payment records."},{"name":"Approval-required fee plans","description":"Mark an instalment fee plan so enrollments on it wait for admin approval before access is granted."}]},{"id":"fee-collection-desk","name":"Fee Collection Desk","tagline":"Front-office counter for cash, cheque, UPI and card","description":"A guided four-step counter workflow for office staff: find the student, pick the installments being paid, record the payment, and hand over the receipt. Built for offline payments — cash, cheque, UPI or card — with automatic receipt generation on the spot.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Student search","description":"Find any student instantly by name or details as the first step of collection."},{"name":"Installment selection","description":"See all pending and overdue installments across fee heads and choose exactly which ones this payment covers."},{"name":"Offline payment modes","description":"Record Cash, Cheque, UPI or Card payments with a reference number and a free-text note."},{"name":"Smart payment allocation","description":"An allocation engine spreads a lump-sum payment across dues by fee-type priority — with overdue-only, upcoming-only or all-dues scopes — or allocate to specific installments manually."},{"name":"Instant receipts","description":"A fee receipt is generated on the spot with a download link, and past receipts remain downloadable per installment."},{"name":"On-the-spot adjustments","description":"Apply a concession or penalty during collection, routed through the approval workflow, before confirming the payment."},{"name":"Confirmation and success summary","description":"A confirmation dialog recaps amounts before recording, followed by a success screen with receipt and invoice actions."}]},{"id":"student-fee-ledger","name":"Student Fee Ledger","tagline":"Every student's fee position in one searchable table","description":"A master view of every student's fee status — expected, paid, due, overdue and waived amounts with a visual collection progress bar per student. Drill into any row for the full installment schedule, receipts and payment ledger, and act on a student's fees straight from their profile.","roles":["Admin","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Status at a glance","description":"Each student is flagged Paid, Partial, Pending or Overdue with color-coded badges and a collection progress bar."},{"name":"Search and filters","description":"Filter the ledger by course, fee plan, status and more, with expandable rows showing per-fee-head detail."},{"name":"Installment drill-down","description":"See every installment with amounts, due dates, payments applied, adjustments and remaining balance."},{"name":"Receipts history","description":"List and download all fee receipts and invoice receipts for any student."},{"name":"Per-student fee tools","description":"From a student's profile, staff can view payment history, edit that student's installment plan, apply a plan-level discount, record an offline payment and generate an invoice."},{"name":"Learner self-view","description":"Learners can check their own dues and receipts and pay pending installments from their app."},{"name":"Split an instalment","description":"Move part of a part-paid instalment's remaining balance into a new instalment with its own due date, keeping the plan total unchanged."}]},{"id":"dues-revenue-tracking","name":"Dues, Upcoming & Revenue Tracking","tagline":"Know who owes what, and when the rest arrives","description":"A clear, honest picture of money across every plan type — what has been collected, what is genuinely overdue, and what is scheduled to come in. Dues count only money owed on access already granted, so abandoned checkouts and coupon discounts never inflate the number. Drill into any learner's balance, see instalments month by month, and track revenue trends on a dedicated Payment Dashboard.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Honest Due figure","description":"Due counts only overdue instalments, failed subscription renewals and unpaid invoices on active enrollments — never unfinished checkouts, one-time purchases or coupon discounts."},{"name":"Upcoming and Outstanding","description":"See money falling due in the next 30 days, or every future instalment with its next due date for institutes that collect fees in instalments, plus an all-unpaid Outstanding view."},{"name":"Who-owes drill-down","description":"Open any Due, Upcoming or Outstanding figure to get the list of learners behind it, with the amount each one owes."},{"name":"Learner balance sheet","description":"One sheet per learner shows billed, paid, outstanding and due amounts, a percent-collected bar, the next instalment, the full schedule and payment history — with due dates editable in place."},{"name":"Instalment forecast","description":"Track instalment-plan progress (billed, paid, overdue, still to come) and see upcoming money split month by month, with the learners paying in each month."},{"name":"Choose your summary cards","description":"Pick which KPI cards appear on Manage Payments and the Payment Dashboard; sensible defaults follow your fee model and can be reset any time."},{"name":"Payment Dashboard","description":"Month-by-month, financial-year and daily revenue views compared with the same period last year, split by source, payment method, course and batch."},{"name":"Overdue ageing and cash-flow forecast","description":"See how long overdue money has been outstanding and a month-by-month forecast of expected collections, overall and per batch."},{"name":"Unrecorded payment check","description":"Paid plans that were activated without any recorded payment are flagged separately, so offline payments nobody logged can be found and reconciled."}]},{"id":"concessions-penalties","name":"Concessions & Penalties with Approval Workflow","tagline":"Discretionary fee changes, fully audited and approved","description":"Staff can propose a concession (fee waiver) or penalty on any installment, but nothing takes effect until an authorized approver signs off. Every request, approval, rejection and retraction is kept in a permanent, searchable audit trail.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Concession requests","description":"Reduce a student's installment by a chosen amount with a reason; the request is validated against the expected amount and queued for approval."},{"name":"Penalty application","description":"Add late-fee penalties to an installment, either manually or from the fee plan's configured penalty percentage."},{"name":"Pending approvals queue","description":"A dedicated Adjustment Approvals page lists every pending request with student, amount, type and requester for one-click approve or reject."},{"name":"Retraction","description":"Requesters can withdraw a pending adjustment before it is reviewed."},{"name":"Full adjustment history","description":"Per-installment and institute-wide history of every adjustment event — submitted, approved, rejected, retracted — with who did what and when."}]},{"id":"invoicing","name":"Invoicing","tagline":"Branded invoices — automatic on payment or raised on demand","description":"Every successful payment can generate a professional PDF invoice automatically, and admins can raise invoices manually for anything else — for one learner or in bulk — with live preview, taxes, payment links and reminders. Invoices are delivered by email and payable online.","roles":["Admin","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Public Web"],"subFeatures":[{"name":"Automatic invoice on payment","description":"A branded PDF invoice is generated and emailed automatically after each successful online payment, including multi-course orders."},{"name":"Manual invoice creation","description":"Raise an invoice for any learner with free-form line items (description, quantity, unit price), currency, due date, custom invoice date and notes."},{"name":"Bulk invoicing","description":"Create the same invoice for many learners at once — each gets their own numbered invoice and payment link."},{"name":"Live preview before sending","description":"A pixel-accurate preview shows exactly what the learner will receive, with editable fields grouped by section."},{"name":"Editable details","description":"Override invoice number, customer name and address, institute details, tax label, place of supply and notes per invoice; totals are always computed, never editable."},{"name":"Per-invoice tax control","description":"Tax defaults from institute settings but can be switched off for an individual invoice."},{"name":"Payment link per invoice","description":"Every invoice gets a shareable payment link — copy it, email it, or send it over WhatsApp directly from the success screen."},{"name":"Mark paid manually","description":"Record an offline settlement against an invoice, with payment details, so books stay accurate."},{"name":"Void with reason","description":"Void an incorrect invoice with a recorded reason instead of deleting history."},{"name":"Duplicate invoice","description":"Clone a past invoice's line items, currency and notes into a new one; tax re-defaults from current settings for safety."},{"name":"Payment reminders","description":"Send a reminder email for any unpaid invoice or overdue installment with one click."},{"name":"PDF download and regeneration","description":"Download any invoice PDF at any time; expired links are regenerated automatically."},{"name":"Invoice lists and search","description":"Browse all invoices institute-wide or per learner; learners see their own invoices too."},{"name":"Invoices for every renewal","description":"Each recurring renewal payment now generates its own invoice and receipt email, with the PDF available in the learner's payment history."},{"name":"Proforma invoices","description":"Optionally issue unpaid invoices as proformas that take a real invoice number only when paid, keeping your tax invoice series free of gaps."}]},{"id":"invoice-branding-tax-settings","name":"Invoice Branding, Templates & Tax Settings","tagline":"Your logo, your numbering, your country's taxes","description":"Control exactly how invoices look and how tax is applied. Pick and customize invoice templates with your branding, set your country, tax registration details and tax components, and choose how invoice emails reach payers — so every invoice is compliant out of the box.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Template gallery","description":"Choose from ready-made invoice templates and customize them; templates use placeholders like invoice number, line items, tax components and institute logo."},{"name":"Institute branding","description":"Invoices carry your institute logo, name and address automatically."},{"name":"Country and currency defaults","description":"Set your billing country and default invoice currency once; all new invoices inherit them."},{"name":"Custom tax label and components","description":"Name your tax (GST, VAT, Sales Tax) and split it into components with individual rates — e.g. CGST 9% + SGST 9% — that render as a tax table on the invoice, with different components possible per package type."},{"name":"Tax registration fields","description":"Store your GSTIN/tax ID, HSN/SAC code and place of supply so invoices meet local requirements."},{"name":"Invoice email placement","description":"Choose whether the PDF arrives in a dedicated invoice email or attached to the payment-confirmation email."},{"name":"Internal notification recipients","description":"Pick which admins are notified about invoice events."},{"name":"Custom invoice numbering","description":"Build your own invoice number format from tokens — sequence, institute code, financial year, quarter, date parts and more — with a live preview and a warning before changing it."},{"name":"Fee-receipt placeholders","description":"Templates can show course, learner and fee-schedule details plus your institute tagline, all insertable from the template editor."},{"name":"Custom payment-confirmation email","description":"Replace the standard payment-confirmation email with your own template, built in the email editor with payment and receipt placeholders."}]},{"id":"payment-links-public-checkout","name":"Payment Links & Public Checkout","tagline":"Anyone can pay from a link — no login needed","description":"Share a link and get paid. Public, branded payment pages let learners, parents or guests pay an invoice, settle fee installments, or buy a course through a stepped catalogue-to-cart-to-payment flow — all without signing in, with live payment-status tracking and a clear result screen. Every signup captures campaign attribution automatically.","roles":["Admin","Learner","Parent"],"platforms":["Public Web","Learner Web","Learner Mobile App","Admin Web"],"subFeatures":[{"name":"Public invoice payment page","description":"Each invoice link opens a mobile-friendly page showing the institute's logo, invoice details and line items, with a pay button that launches the configured gateway."},{"name":"Guest fee payment","description":"Fee dues and full installment schedules can be viewed and paid through open links — ideal for parents paying school fees without an account."},{"name":"Stepped course checkout","description":"Visitors move through catalogue, cart and payment steps with a clear progress indicator; the starting step is set by the page owner."},{"name":"Coupon entry at checkout","description":"Buyers apply coupon codes that are validated live and reflected in the payable amount."},{"name":"Enroll multiple learners at once","description":"A multi-enroll form captures several learners — for example siblings — in one transaction."},{"name":"Custom fields at signup","description":"Any custom fields configured on the page are collected and stored with the enrollment or lead."},{"name":"Automatic campaign attribution","description":"UTM source, medium, campaign, content and term on the link are captured and attributed to the resulting lead or enrollment."},{"name":"Instant account and access","description":"Successful checkout enrolls the learner into the mapped courses immediately, with a configurable success page and login access to start learning."},{"name":"Universal payment result page","description":"After checkout, payers land on a result screen that confirms success, failure or cancellation, polling the gateway for the final status."},{"name":"Multi-gateway checkout","description":"The same public flow works across Stripe, Razorpay, PhonePe, Cashfree, eWAY and PayPal based on the institute's configuration."},{"name":"Share via WhatsApp or email","description":"Payment links can be copied or sent over WhatsApp or email straight from the admin screens that generate them."}]},{"id":"learner-payment-center","name":"Learner Payment Center & In-App Checkout","tagline":"Learners see, manage and pay everything themselves","description":"Learners and parents get self-service access to their entire financial relationship with the institute: enrolling and paying in-app under any plan type, tracking dues and installments, downloading receipts and invoices, and managing memberships and saved cards — on web, mobile and desktop.","roles":["Learner","Parent"],"platforms":["Learner Web","Learner Mobile App","Learner Desktop App","Public Web"],"subFeatures":[{"name":"Checkout for every plan type","description":"Free enrollment, one-time purchase, subscription and donation checkouts, each with clear confirmation, success, pending and failure dialogs."},{"name":"Approval-based enrollment","description":"Courses that require institute approval show a pending-approval dialog with automatic status polling and a success dialog once approved."},{"name":"Enroll by invite","description":"Learners enroll through invite links sent by the institute, with a guided form and payment step where applicable."},{"name":"Gateway-matched payment experience","description":"Checkout adapts to the institute's gateway — inline card, hosted modal or redirect — across Stripe, Razorpay, PhonePe, Cashfree and eWAY, with a result page that routes redirect payments back into the course."},{"name":"Live payment status polling","description":"After paying, the app polls payment status and moves the learner from pending to success automatically — no manual refresh."},{"name":"Coupon codes at checkout","description":"Learners apply coupon codes during checkout with instant validation."},{"name":"My dues","description":"Pending and overdue installments across all fee heads, with amounts and due dates, payable online without visiting the office."},{"name":"My receipts and invoices","description":"Download past fee receipts and invoices anytime, and pay institute-issued invoices from a link."},{"name":"Membership management","description":"View active subscriptions and plans with validity, and cancel a recurring plan when needed."},{"name":"Saved payment method and billing details","description":"View the card on file, replace it securely, and keep billing name and address up to date for receipts."},{"name":"Payment history and expiry visibility","description":"A record of past payments with statuses and references, plus a list of enrollments nearing expiry so learners can renew in time."}]},{"id":"multi-currency-pricing","name":"Multi-Currency Pricing","tagline":"Charge in 16 currencies with correct local formatting","description":"Price courses, plans and invoices in the payer's currency. The platform supports 16 charge currencies and handles each one's symbol, formatting and minor-unit rules — including zero-decimal currencies like yen — correctly across checkout, invoices and reports.","roles":["Admin","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Public Web"],"subFeatures":[{"name":"16 charge currencies","description":"USD, EUR, GBP, INR, AED, SAR, QAR, AUD, CAD, SGD, HKD, NZD, CHF, JPY, ZAR and MYR available anywhere a price is set."},{"name":"Per-currency prices","description":"Payment plans and coupons carry explicit prices per currency rather than converted approximations."},{"name":"Correct minor-unit handling","description":"Gateways are charged in exact minor units per currency — paise, cents, zero-decimal yen — eliminating rounding surprises."},{"name":"Localized symbols everywhere","description":"Every dashboard, invoice and checkout screen renders the right currency symbol and formatting automatically."},{"name":"Institute default currency","description":"Set your default currency once and all new plans and invoices inherit it."}]},{"id":"per-learner-markdowns","name":"Per-Learner Price Markdowns","tagline":"Case-by-case pricing without touching the public plan","description":"Give an individual enrollment a special price without editing the published plan. Apply a percentage or fixed-amount markdown to a plan for specific enrollment links, look up current markdowns before quoting a family, and reset back to standard pricing at any time.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Percent or absolute markdowns","description":"Reduce a plan's price by a percentage or a fixed amount for targeted enrollment invites."},{"name":"Markdown lookup","description":"Query which plans currently carry markdowns and by how much before quoting a price."},{"name":"One-click reset","description":"Remove a markdown and restore the standard published price instantly."},{"name":"Enrollment-invite discounts","description":"Attach discount options directly to specific enrollment invites so a particular admission link carries its own pricing."},{"name":"Admin discounts on enrollment and invoices","description":"Apply a percentage (with optional cap), flat or coupon discount when enrolling a learner, bulk-assigning, or raising an invoice, with the granting admin recorded."},{"name":"Subscription discount duration","description":"For subscriptions, choose whether an admin discount applies to the first payment, the first several payments, or every billing cycle."}]},{"id":"coupons-discount-codes","name":"Coupons & Discount Codes","tagline":"Discount codes with caps, scopes and email locks","description":"Create discount coupons that apply at any checkout: percentage or flat discounts with an optional maximum cap, usable institute-wide or scoped to specific courses and invite links, with usage limits and optional restriction to named email addresses. Coupon-driven promotions and campaigns pair with the Marketing & Website tools.","roles":["Admin","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Public Web"],"subFeatures":[{"name":"Coupon codes","description":"Custom codes (e.g. SAVE20) with configurable percentage or flat discount value."},{"name":"Maximum discount cap","description":"Cap the monetary value of percentage discounts."},{"name":"Usage limits","description":"Limit total redemptions or leave a coupon unlimited."},{"name":"Scope control","description":"Run coupons institute-wide or scope them to specific courses or invite links."},{"name":"Email-restricted coupons","description":"Restrict a coupon to specific email addresses — perfect for negotiated or alumni discounts."},{"name":"Live validation at checkout","description":"Coupons are validated instantly at public and in-app checkout, with the discount reflected in the payable amount."}]}],"demo":{"intro":"Follow the money — from the admin's fee collection dashboard to a parent paying an installment by UPI on their phone.","screens":[{"id":"collections","device":"desktop","title":"Fee Collection Dashboard","nav":["Dashboard","Study Library","Learners","Finance*","Marketing","Reports","Settings"],"widgets":[{"type":"header","id":"col-head","title":"Fee Collection","subtitle":"AY 2026-27 · 486 students across 9 batches","actions":["Collect Payment","+ New Invoice"]},{"type":"stats","id":"col-stats","items":[{"label":"Collected this month","value":"₹18.4L","delta":"+12% vs June"},{"label":"Due this week","value":"₹3.2L"},{"label":"Overdue","value":"₹1.6L","delta":"55 students"},{"label":"Collection
