n preview."}]},{"id":"instructor-copilot","name":"Instructor Copilot","tagline":"Record a class; get notes, quizzes and homework automatically","description":"A before, during and after companion for every lecture. Record your class live in the browser (or upload the audio) and the copilot transcribes it and generates classroom-ready material: structured notes, a summary, flashcards, a quiz, slide and video ideas, plus the classwork and homework you assigned in class — all downloadable as polished PDFs within minutes of the session ending.","roles":["Teacher","Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Lecture workflow dashboard","description":"Guided Before-Lecture, In-Lecture and After-Lecture views organize preparation, capture and follow-up."},{"name":"Live recording or upload","description":"Record lecture audio directly in the browser or upload a pre-recorded file; automatic speech-to-text transcription follows."},{"name":"Eight generated artifacts per lecture","description":"Transcription, notes, summary, flashcards, quiz, slide ideas, video ideas, plus homework and classwork — each generated from what was actually taught."},{"name":"Configurable quiz generation","description":"Set grade level, question type and language before generating, then download a formatted quiz PDF ready to run as homework."},{"name":"Classwork and homework capture","description":"Tasks and assignments mentioned in class are extracted into numbered lists with completion checkboxes and a due-date field on the homework PDF."},{"name":"Professional PDF downloads","description":"Every artifact exports as a cleanly formatted, printable PDF — notes, summary, quiz, classwork and homework."},{"name":"Lecture log history","description":"Every processed lecture is saved as a log you can reopen, rename, regenerate content for, or delete; failed generations can be retried."},{"name":"Built-in audio player","description":"Replay the lecture recording alongside its generated content."}]},{"id":"lecture-intelligence","name":"Live Class Lecture Intelligence","tagline":"Every recorded class becomes notes, quizzes and exam papers","description":"After a live class is recorded, AI converts it into study assets: a full transcript, polished lecture notes, and complete practice assessments generated from what was actually taught. Export professional printable exam papers with answer keys, or publish everything straight into courses and the assessment center — with your own name, schedule and marking overrides.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web"],"subFeatures":[{"name":"Automatic recording transcription","description":"Kick off transcription for any live-session recording and track its status; stuck jobs are caught and recovered automatically."},{"name":"AI lecture notes","description":"One click turns the transcript into well-structured study notes with headings and images, with copy, download and regenerate options; the latest version is saved with the recording."},{"name":"Assessment generation with question-type control","description":"Generate assessments from the lecture with control over question types: MCQ single-correct, MCQ multiple-correct, true/false, one-word and long-answer."},{"name":"Question-type presets","description":"Ready-made bundles — Only MCQs, MCQs + True/False, MCQs + One Word, Mixed Assessment, Subjective + Objective Mix — for one-click paper composition."},{"name":"Printable exam paper export","description":"Export generated assessments as professional PDF question papers — student copy and answer-key copy — with optional institute letterhead, title, marks and dated footer."},{"name":"Past papers and notes history","description":"Every assessment and notes version generated from a recording is kept in a per-class history for reuse."},{"name":"One-click publish with overrides","description":"Push notes into courses as lesson pages, or publish quizzes to courses or directly to the Assessment Center — as draft or published, with details overridable before going live."},{"name":"Link class materials to chapters","description":"Attach the recording and materials to one or more course chapters so they appear in the learning library, with duplicate protection and a materials history."}]},{"id":"lesson-planner-lecture-coach","name":"AI Lesson Planner & Lecture Coach","tagline":"Plan lectures with AI, then get coached on delivery","description":"Tell the planner your lecture title, topics, class level, teaching style, language and time available, and it drafts a structured, minute-by-minute lesson plan you can edit and export. After class, upload a recording of your delivery and receive a scored evaluation report across eight teaching criteria with concrete, constructive suggestions — ideal for teacher training and self-development.","roles":["Teacher","Admin"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Minute-by-minute lesson plans","description":"Generate a time-boxed, topic-wise lecture timeline that fits your stated duration, class level and language (English or Hindi)."},{"name":"Teaching-style aware content","description":"State your preferred method — storytelling, more examples, and so on — and the plan matches that style."},{"name":"Engagement and homework options","description":"Toggle in mid-lecture questions for engagement and an assignment or homework section at the end."},{"name":"Edit and export","description":"Refine the draft plan in place and export the finished version."},{"name":"Scored delivery feedback","description":"Recorded lectures are evaluated across eight criteria — delivery, content quality, student engagement, assessment, inclusivity, classroom management, teaching aids and professionalism — with a total score."},{"name":"Constructive commentary","description":"Each section carries specific comments and actionable suggestions, plus recognition of strong moments in the lecture."},{"name":"Broad audio support with background processing","description":"Accepts WAV, FLAC, MP3, AAC and M4A recordings; long files and long generations process in the background with automatic retries."},{"name":"PDF report export","description":"Download the full evaluation report as a PDF for peer review or records."},{"name":"Model choice","description":"Pick a preferred AI model or use the institute default, with automatic fallbacks."}]},{"id":"interactive-content-generator","name":"Interactive Content Generator","tagline":"One prompt, thirteen kinds of interactive learning content","description":"One prompt-driven engine produces thirteen kinds of learning content that run right inside the course player — from quizzes and illustrated storybooks to playable games, simulations and code playgrounds. Every format is age-tuned, multilingual, and delivered as ready-to-use interactive material.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","API"],"subFeatures":[{"name":"Quiz","description":"Auto-generated question sets with options, correct answers, explanations, difficulty rating and passing score."},{"name":"Storybook","description":"Page-by-page illustrated stories with per-page illustrations, narration text, age range, themes, learning objectives, interactive touch hotspots, and discussion questions and activities at the back."},{"name":"Interactive game","description":"Self-contained playable games built around the topic, complete with scoring."},{"name":"Puzzle book","description":"A collection of themed puzzles for practice and engagement."},{"name":"Simulation","description":"Physics or economics-style interactive sandboxes learners can manipulate."},{"name":"Flashcards","description":"Spaced-repetition style card decks generated from the topic."},{"name":"Map exploration","description":"Interactive clickable maps for geography and location-based lessons."},{"name":"Worksheet","description":"Printable or interactive homework sheets."},{"name":"Code playground","description":"Interactive coding exercises learners can edit and run."},{"name":"Timeline","description":"Chronological event visualizations for history and process topics."},{"name":"Conversation","description":"Language-learning dialogue content with role-play exchanges."},{"name":"Slides","description":"Presentation decks in classic slide style, generated from a plain prompt."},{"name":"Practice quiz inside chat","description":"The learner tutor detects practice intent, generates a timed quiz on the topic, grades the submission, and returns per-question feedback, score and study recommendations."}]},{"id":"ai-interactive-pages","name":"AI Interactive Lesson Pages","tagline":"Rich, illustrated lesson pages from one prompt","description":"Describe a lesson and the AI builds a complete, self-contained page inside your course — notes, summaries, flashcards, quizzes, practical examples and even playable games — illustrated with diagrams and textbook-style pictures. Ground it in your own PDF and images, match your institute's brand, then keep refining it with plain-language edits. Generation runs in the background with step-by-step progress, so teachers can leave and come back.","roles":["Admin","Teacher"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Prompt-to-page creation","description":"Describe the page, pick what to include — notes, summary, flashcards, quiz, practical examples, interactive games — and add optional key points."},{"name":"Ground in your material","description":"Attach a PDF or images so the page is written from your own content, with the extra cost shown before generating."},{"name":"Illustrated pages","description":"Pages teach visually with labelled diagrams, visual-note blocks and AI-drawn textbook-style illustrations placed where they help."},{"name":"Brand matching","description":"One switch styles the page in your institute's brand colours and look."},{"name":"Edit with AI and version history uestion type (MCQ, short answer, descriptive, mixed) and language."},{"name":"Vsmart Topics — questions from a prompt","description":"Describe the coverage you want in plain language and set count, difficulty, chapter and language preferences."},{"name":"Vsmart Chat — refine by chatting","description":"After generation, chat with the AI to modify the paper: add more MCQs, add higher-order questions, simplify a question, or focus on part of the document."},{"name":"Vsmart Organizer — auto-group by topic","description":"Generate questions from a file and have them automatically arranged under topic headings for chapter-wise tests, with drag-to-refine."},{"name":"Vsmart Sorter — prompt-controlled ordering","description":"Sort and reorder generated questions with plain-language instructions like 'put questions 5 and 6 from Plant Nutrition first'."},{"name":"Question configuration","description":"Control how many questions, difficulty, question type (single-choice, multiple-choice and comprehension variants and more) and output language for each generation."},{"name":"Background AI task tracker","description":"All generations run in the background; a My AI Tasks list shows status per job with retry for failures — you can navigate away and come back."},{"name":"Export and reuse","description":"Export finished papers as PDF or DOC question papers (with paper-set formatting), regenerate with a custom prompt, and push questions into assessments."},{"name":"My Resources file library","description":"A personal library of uploaded source files you can re-run tools against without re-uploading."},{"name":"Complete assessment generation","description":"Generate a full, structured assessment (sections, questions, answers) ready to publish into the assessment system."},{"name":"AI model picker","description":"Choose which AI model runs each tool via a model selector backed by the institute's model registry."},{"name":"Word-for-word paper digitisation","description":"Vsmart Extract plete question paper from any knowledge base or curriculum textbook: choose chapters and weightage, question types and marks, and test details, then review the AI's plan before a single question is written. Every question cites its page and uses the book's own diagrams. Download a branded, print-ready PDF in three layouts, share it by link, save it to the question bank or turn it straight into an offline test.","roles":["Admin","Teacher","Assessment Creator"],"platforms":["Admin Web"],"subFeatures":[{"name":"Syllabus and weightage","description":"Pick chapters or subtopics and set how much of the paper each one carries."},{"name":"Rich question-type mix","description":"Combine single and multi-correct MCQs, assertion–reason, case or passage-based, true/false, one-word, numericals, and short, long and very long answers, each with its own count and marks."},{"name":"Plan first, then generate","description":"See the full blueprint with total marks, time and estimated credits, ask for changes in plain words, and only then generate the questions."},{"name":"Review and refine","description":"Edit, reorder, remove or rewrite any question, or nudge it harder, easier or more application-based; every question shows its page and marking scheme."},{"name":"Book diagrams and optional drawn figures","description":"Questions reuse diagrams from the book, and you can let the AI draw labelled figures where a question needs one the book doesn't have."},{"name":"Branded print-ready PDF","description":"Download the paper or paper-plus-answer-key in Classic board, Compact two-column or Coaching layouts, with your logo, watermark, letterhead and editable instructions."},{"name":"Preview and share by link","description":"Preview the laid-out paper in the app and publish a shareable link for WhatsApp or email, with a separate teachers-only answer-key link."},{"name":"Question bank and offline test hand-off","description":"Save the paper to your question bank, or create an offline test pre- id":"o-page","outline":[{"title":"Page prompt","items":[{"t":"Derive mirror formula step-by-step","done":true},{"t":"Use Fig 18.3 from HC-Verma-Optics.pdf","done":true},{"t":"End with 3 NEET-style numericals","on":true}]}],"slide":{"title":"Topic: Mirror formula & magnification","body":"Every planned page carries an editable AI prompt. Refine it, regenerate just this page, or drag it to a new chapter — the course is created in exactly the order you arrange."}}],"module":"ai"},{"id":"vsmart","device":"desktop","title":"Vsmart Question Paper Generator","nav":["Dashboard","AI Studio*","Study Library","Assessments","Learners","Reports","Settings"],"widgets":[{"type":"header","id":"v-head","title":"Vsmart Upload","subtitle":"Paper from PDF, photo, audio or a plain prompt","actions":["My Resources","My AI Tasks"]},{"type":"form","id":"v-form","title":"Generate from document","fields":[{"label":"Source file","value":"Class-11-Thermodynamics-Notes.pdf","type":"select"},{"label":"Questions","value":"20 · Medium difficulty","type":"select"},{"label":"Question type","value":"MCQ single-correct + True/False","type":"select"},{"label":"Language","value":"English","type":"select"}],"submit":"Generate paper"},{"type":"list","id":"v-questions","items":[{"title":"Q1. An ideal gas expands isothermally...","sub":"MCQ · 4 options · answer key attached","chip":"Ready","tone":"green"},{"title":"Q2. First law of thermodynamics states...","sub":"True/False · with explanation","chip":"Ready","tone":"green"},{"title":"Q3. Work done in an adiabatic process...","sub":"MCQ · numerical","chip":"Ready","tone":"green"},{"title":"17 more questions","sub":"Auto-grouped by topic via Vsmart Organizer","right":"20/20"}]},{"type":"chat","id":"v-chat","messages":[{"from":"user","text":"Add 5 higher-order questions on entropy and make Q3 easier"},{"from":"ai","text":"Done — added 5 HOTS questions on entropy and simplified Q3 to a single-step calculation. Paper is now 25 questions."}],"composer":"Refine the paper..."}],"module":"ai"},{"id":"tutor","device":"phone","title":"Learner AI Tutor","nav":["Home","Courses","AI Tutor*","Tests","Profile"],"widgets":[{"type":"header","id":"t-head","title":"Alpha Buddy","subtitle":"Your 24/7 tutor · knows this lesson"},{"type":"chat","id":"t-chat","messages":[{"from":"user","text":"I don't get sign convention in mirrors 😩"},{"from":"ai","text":"Think of the mirror as origin: distances measured against incoming light are negative. So for a concave mirror, object distance u is always negative. Want a quick check?"},{"from":"user","text":"Quiz me"},{"from":"ai","text":"Timed quiz: 5 questions on sign convention, 5 minutes. Q1: An object is 30 cm in front of a concave mirror of f = 20 cm. What is u?"}],"composer":"Ask anything · 🎤 voice"},{"type":"list","id":"t-modes","items":[{"title":"Explain this · Summarize · Hint","sub":"One-tap actions on the open lesson"},{"title":"Voice doubt-solving","sub":"Speak in Hindi or English","chip":"Voice","tone":"purple"},{"title":"AI mock interview & oral test","sub":"Scored, with feedback","chip":"New","tone":"green"}]}]}],"steps":[{"screen":"builder","target":null,"title":"A course from one prompt","text":"Describe what you want to teach and the AI drafts the whole course — structure, lesson pages, diagrams, videos, quizzes and homework. Admins can even white-label the builder under their own name."},{"screen":"builder","target":"b-form","title":"Grounded in YOUR syllabus","text":"Attach reference PDFs and website URLs — math-aware OCR pulls real figures and equations from your material, so lessons reflect your actual syllabus, not generic AI knowledge. Set audience age, level and language too."},{"screen":"builder","target":"b-cost","title":"See the cost before you commit","text":"Every generation shows its exact credit price up front, drawn from a prepaid institute balance. Pick a specific AI model or bring your own OpenAI or Gemini keys."},{"screen":"outline","target":"o-tree","title":"Review every page before it exists","text":"The draft lands as an interactive outline: chapters and pages spanning topic pages, AI videos, slide decks, quizzes, homework and solutions. Rename, delete or drag anything into a new order."},{"screen":"outline","target":"o-page","title":"Edit the prompt behind each page","text":"Every planned page carries an editable AI prompt. Refine it, regenerate a single page, or give course-wide corrective feedback — content fills in via background generation while you keep editing, then publishes to your study library in one click."},{"screen":"vsmart","target":"v-form","title":"Question papers from anything","text":"Vsmart builds editable papers from a PDF or PPT, a photographed printed paper, an audio lecture, or a plain topic prompt — with control over count, difficulty, question type and language."},{"screen":"vsmart","target":"v-questions","title":"Straight into your question bank","text":"Generated questions land ready with answer keys, auto-grouped by topic for chapter-wise tests. Export as a formatted PDF or DOC paper, or push directly into a live assessment."},{"screen":"vsmart","target":"v-chat","title":"Refine the paper by chatting","text":"Not happy? Just tell Vsmart Chat: add more MCQs, add higher-order questions, simplify Q3. Jobs run in the background with a task tracker, so you can navigate away and come back."},{"screen":"tutor","target":"t-chat","title":"A 24/7 tutor that knows the lesson","text":"On every learner screen, a branded tutor aware of the open course and lesson. Ananya asks a doubt at 11pm, says 'Quiz me', and gets a timed practice quiz graded with per-question feedback."},{"screen":"tutor","target":"t-modes","title":"Voice tutoring, on your terms","text":"Voice doubt-solving, AI-led mock interviews and oral tests in the learner's language. Admins design the persona, hard rules, voices and exactly which pages the tutor appears on."}]}},{"id":"video","name":"AI Video Studio (Vimotion)","icon":"vid","color":"#C026D3","tagline":"Prompt-to-video studio: avatars, voiceovers, editing, reels","description":"Vimotion is Vacademy's AI Video Studio: type a brief and get a finished, branded, narrated video — script, visuals, voiceover, music and captions produced automatically in minutes. Beyond generation, it is a complete video operation: a full post-production editor, avatars and voice cloning, dialogue-driven story scenes, reels from long recordings, screen recording, translation with lip-sync, and a developer API for video at scale. Every video renders in your brand, in 60+ languages, with credit costs shown before you spend.","features":[{"id":"prompt-to-video","name":"AI Video Generator (Prompt to Video)","tagline":"Type a topic, get a finished narrated video","description":"Turn a plain-text prompt, document or link into a complete narrated video. The AI writes the script, records the voiceover, designs every animated scene, adds captions and renders a final MP4 — while you watch each production stage complete live. Videos can also play instantly inside the course player as interactive scenes, and the same engine powers landscape explainers, vertical shorts and marketing films alike.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"One-prompt creation","description":"Enter a topic or a full brief in plain language — length, format and audience are parsed automatically, with no prompt engineering or template hunting required."},{"name":"Any-source briefing","description":"Start from a PDF, slide deck, document, blog post or Notion page; the AI condenses it into a structured script that preserves the author's argument and message hierarchy."},{"name":"Website grounding from URLs","description":"Paste a URL and the system visits the page, captures its screenshots and images, and grounds the video in that site's actual content."},{"name":"Reference-file grounding","description":"Attach images and PDFs and the AI uses their real facts and figures in the video instead of inventing material."},{"name":"Target audience control","description":"Pick the audience — from Class 1-2 through Graduate/Professional — and the script, vocabulary and visuals adapt to that level."},{"name":"Target duration control","description":"Choose the intended length from 30 seconds to 10 minutes; pacing, shot count and script density are sized to hit it."},{"name":"60+ narration languages","description":"Generate videos narrated in 60+ languages grouped by region, including 9 Indian languages and regional English variants, with voice gender and named-voice selection."},{"name":"Landscape and portrait output","description":"Produce 16:9 videos for courses and YouTube or 9:16 vertical videos for Shorts and Reels, with an on/off toggle for burned-in, word-synced captions."},{"name":"Script review mode","description":"Stop generation at the script stage, review and edit the narration, then continue to full production."},{"name":"Stage-by-stage generation","description":"Generate up to any checkpoint — script only, script plus audio, full visual timeline, or final MP4 — and resume from any completed stage without redoing earlier work."},{"name":"Live progress streaming","description":"Real-time progress shows the current stage, percentage and messages while the video builds; creators can leave and come back."},{"name":"Cancel, retry and resume","description":"Cancel a running generation mid-flight, retry a failed run from its last successful checkpoint, and resume interrupted runs without losing spend."},{"name":"Generation history and settings reuse","description":"A history sidebar lists every past generation with status and output links; reopen results or reuse a previous run's voice, tier, brand kit and visual settings."},{"name":"Smart intent routing preview","description":"Before you submit, the studio previews how your request will be routed — which tools and stages will run, whether URLs will be scraped or the web searched — and lets you override any decision."},{"name":"Instant interactive playback","description":"Videos can play immediately in the course player as synced audio and animated scenes, so learners get content right away while the MP4 render is optional."},{"name":"Course builder integration","description":"AI course outlines can mark slides as video items; the pipeline generates each one and streams progress straight into the course editor."},{"name":"Course-wide video settings","description":"A single settings card controls how every video in a generated course is produced — narration language, voice, audio quality, video model, target length and quality tier — set once and applied throughout."},{"name":"Versioned re-renders","description":"Re-render any video on a prompt change without re-recording; past versions remain intact for rollback."},{"name":"Your script, spoken verbatim","description":"Paste a brief with your own voiceover lines per shot and they are narrated word for word instead of rewritten — essential for exact clinical or technical terms."}]},{"id":"quality-tiers-ai-director","name":"Quality Tiers & AI Director","tagline":"Choose your quality level, from free to film-grade","description":"Five quality tiers — Free, Standard, Premium, Ultra and Super Ultra — let you trade cost against polish on every video. Higher tiers switch on an AI Director that plans the whole edit like a filmmaker, generates multiple candidate designs for key scenes and picks the best, and runs automated visual quality inspections before anything ships.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Five quality tiers","description":"Free (stock-only, fastest), Standard, Premium, Ultra and Super Ultra — each tier unlocks more design intelligence, sound design and review passes, with per-tier pricing."},{"name":"AI Director planning","description":"On Premium and above, a director model plans acts, beats, shot types, emphasis, motion density and per-scene styling before any visuals are generated."},{"name":"Frontier-model creative concepts","description":"Top tiers explore multiple divergent creative concepts with anti-repetition prompting, so videos never look templated."},{"name":"Best-of-N hero shots","description":"On key scenes — hook, hero, closing — the system generates 2-4 candidate designs at different creative angles and a visual judge compares actual rendered frames to pick the winner."},{"name":"AI vision review of every scene","description":"A vision model inspects each rendered scene for visible defects such as broken text or clipped layouts, with bounded regeneration of anything that fails."},{"name":"Pixel-accurate overflow checks","description":"A deterministic bounding-box check walks every rendered frame and flags any text or media crossing the canvas edge — catching clipped headlines no reviewer can miss."},{"name":"Animation density enforcement","description":"A validator ensures every scene has enough animated elements and none of the forbidden anti-patterns, keeping motion quality consistently high."},{"name":"Creativity critic","description":"Ultra tiers run a director's-eye scoring gate on hero shots and elevate any scene that falls below the creative bar."},{"name":"AI-choreographed transitions","description":"An edit choreographer authors scene-to-scene transitions instead of using one stock crossfade everywhere."},{"name":"Two-pass script review","description":"Premium scripts are drafted, then reviewed and rewritten in a second pass for tighter narration."},{"name":"Cost guardrails and transparency","description":"Every quality gate carries its own cost cap, credit pre-flight checks block runs your balance cannot support, and each run records a per-stage cost breakdown so you can see exactly where credits went."}]},{"id":"voiceover-tts-cloning","name":"AI Voiceover, Text-to-Speech & Voice Cloning","tagline":"Hundreds of natural voices — or your own, cloned","description":"Every video gets a natural, studio-grade voiceover. A free standard tier covers 50+ languages, premium tiers add named studio voices for global and Indian languages, and voice cloning reproduces a real instructor's or founder's voice from a two-minute sample — so your star presenter narrates every video in every language. Narration also works standalone for podcasts, phone systems and accessibility.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Standard voices in 50+ languages","description":"Male and female neural voices included free across 50+ languages and locales, from US/UK/India English to Hindi, Tamil, Spanish, Japanese, Arabic and more."},{"name":"Premium Indian voices","description":"35+ named voices with authentic Indian accents across Hindi, Tamil, Telugu, Bengali, Marathi, Kannada, Gujarati, Malayalam, Punjabi, Odia and Indian English."},{"name":"Premium global voices","description":"Multiple named studio-grade voices per language for 25+ global languages, with graceful fallback when a language and gender combination is unavailable."},{"name":"Voice picker with audio samples","description":"Browse a 200+ voice library filtered by language, accent, gender, age and tone, and audition every voice with a sample clip before choosing; lock a default voice per workspace."},{"name":"Automatic provider routing","description":"On the premium tier, Indian languages and global languages route automatically to the best voice engine for each — no configuration needed."},{"name":"Voice cloning from a 2-minute sample","description":"Upload two minutes of clean audio — phone-mic quality is fine — and get a quality-checked clone that carries the original's cadence, warmth and quirks."},{"name":"Consent-governed clones","description":"Every clone carries a consent record, stays scoped to your workspace, is never shared or used for third-party training, and can be revoked in one click with a full audit log."},{"name":"Cross-language clone fidelity","description":"A cloned voice speaks 80+ languages with the same cadence — a message recorded once becomes a localized series without dubbing studios."},{"name":"Inline direction marks","description":"Slow a word, lift a phrase, pause for breath — pace and emphasis marks placed inline in the script, plus per-paragraph emotion presets."},{"name":"Custom pronunciation lexicons","description":"Define how product names and jargon are pronounced, per workspace."},{"name":"Word-level timestamping","description":"Narration is aligned to word-level timestamps with automated verification, powering captions, scene sync and sentence editing."},{"name":"Per-scene audio and retakes","description":"Narration is recorded per sentence and per scene, so individual lines can be edited or re-taken later without regenerating the whole track."},{"name":"Voice-matched pacing","description":"Scene timings adapt to how fast each chosen voice actually speaks and to the content style."},{"name":"Standalone audio export","description":"Ship narration as standalone audio in WAV, MP3, OGG or OPUS, download it or stream it via API to any channel — cleared for commercial use."}]},{"id":"avatars-presenters","name":"AI Avatars & On-Screen Presenters","tagline":"Your best instructor on camera — without a camera","description":"Put a lifelike presenter in any video. Upload one clear face photo or a two-minute phone recording and the platform builds a reusable avatar that presents any script with lip-synced speech in 80+ languages — or pick from a library of 30+ pre-built presenters. Control exactly how much screen time the host gets, and choose between multiple avatar engines at different price and fidelity points.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Custom avatar from a photo","description":"Upload a front-facing photo plus an optional description of clothing, demeanour and background; the system generates consistent per-scene presenter footage lip-synced to the narration."},{"name":"Avatar from a 2-minute recording","description":"Record two minutes on any phone in a quiet room and receive a brand-grade avatar within 24 hours, complete with a quality-assurance pass — no green screen or crew."},{"name":"Saved avatar library","description":"Save reusable avatar identities with their face, engine and voice, pick them from a dropdown for any video, and choose from 30+ diverse pre-built presenters across age, gender and ethnicity."},{"name":"Multiple avatar engines","description":"Seven generation engines spanning budget to premium fidelity, each labelled with its per-second credit price, so you pick the cost/realism trade-off per video."},{"name":"Host screen-time dial","description":"Set what percentage of scenes show the host on camera (0-100%); the Director places host appearances on hooks, recaps and key beats while narration plays continuously."},{"name":"First-person script rewrite","description":"When a host is enabled, the script is automatically rewritten in first person so the presenter speaks naturally."},{"name":"Cross-language presenting","description":"The same face speaks 80+ languages with lips matching the words and the source voice's rhythm preserved, with per-language preview before render."},{"name":"Personalized avatar videos at scale","description":"Pipe in a CRM feed — first name, company, deal value — and generate thousands of personalized presenter videos from one recording, with per-variable preview and approval gates."},{"name":"Consent, IP controls and audit","description":"Avatar likeness rights are locked to your workspace with consent records, never reused by third parties, and every avatar render is recorded in an audit log."},{"name":"Resolution and frame-rate options","description":"480p or 720p avatar output with adjustable frame rates on engines that support it."},{"name":"Segment-level re-renders","description":"Edit any sentence and re-render only that segment; versioned sources allow rollback."}]},{"id":"dialogue-story-scenes","name":"Storybook & Drama Dialogue Scenes","tagline":"Characters that talk on camera, in consistent voices","description":"Turn lessons into short films: the AI writes characters and dialogue, then produces lip-synced, voice-matched acted scenes. Choose Storybook mode, where a narrator carries the video and dialogue scenes land at dramatic moments, or Drama mode — a pure dialogue film with no narrator at all. Save a cast once and the same faces and voices star across a whole series.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Storybook mode","description":"The narrator carries the video and 1-4 dialogue scenes appear at dramatic moments for emotional impact."},{"name":"Drama mode","description":"A pure dialogue film — every scene is characters talking, clips carry their own ambience, and the clip budget is raised accordingly."},{"name":"Voice-locked characters","description":"The default engine lip-syncs characters to the platform's own per-character AI voices, so each character sounds identical across scenes and sequel videos."},{"name":"Budget dialogue engine","description":"A lower-cost alternative engine speaks the lines itself — strong visuals at roughly half the price, for productions where per-clip voice consistency matters less."},{"name":"Intelligent voice casting","description":"Each character gets a distinct voice matched to their age and personality; no two characters share a voice, and you can override any casting choice."},{"name":"Reusable saved casts","description":"Save a finished video's cast — names, portraits, reference sheets and voice assignments — and reuse it so a series keeps the same faces and voices."},{"name":"Character consistency via reference images","description":"Up to 9 reference images lock character and setting appearance across independently generated clips."},{"name":"Clip quality control and re-takes","description":"Every filmed clip passes an automated quality check, and in Assist Mode you can review clips and send back specific shots with re-take notes."},{"name":"Dialogue budget caps","description":"Dialogue-scene spend is estimated up front and capped per tier, so drama videos stay within predictable cost."},{"name":"Seamless scene cuts","description":"Continuing dialogue clips start from the previous clip's final frame and dissolve at the join, new scenes match the established colour grade, and no line repeats across cuts."}]},{"id":"cinematic-ai-clips","name":"Cinematic AI Video Clips","tagline":"True AI-generated film clips inside your videos","description":"On the top quality tiers, opt in to fully AI-generated cinematic video clips woven into your video as full-frame hero scenes or inline moments — with optional generated sound of their own. A built-in cost circuit-breaker caps AI-clip spend per video so premium footage never runs away with your budget.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"AI hero clips","description":"The AI Director plans full-frame generated video scenes where real footage doesn't exist — opt-in per run."},{"name":"Inline AI clips","description":"Individual scenes can embed short AI-generated clips inside larger layouts."},{"name":"Optional clip audio","description":"AI clips can carry their own generated sound; master narration is automatically silenced during those moments."},{"name":"Hard per-video cost cap","description":"A circuit breaker rejects further AI-clip generation past a fixed per-video ceiling and falls back to standard scene designs, so costs never run away."},{"name":"Worst-case cost preview","description":"The pre-generation estimate shows the AI-clip upper bound in credits before you commit."},{"name":"Extended clip chaining","description":"Image-to-video chaining supports clips longer than a single generation window."},{"name":"AI-footage-led films","description":"Opt in and the Director can let generated footage carry the whole film, using AI clips for visual and physical moments and motion graphics for numbers and definitions."},{"name":"Clip quality choice","description":"Choose Best, Balanced or Budget quality for generated clips, each showing its per-clip cost, so you trade realism against spend per video."}]},{"id":"shot-library-motion-design","name":"Cinematic Shot Library & Motion Design","tagline":"18+ scene types, 8 visual themes, real motion design","description":"Videos are assembled from a library of professionally designed animated scene types — data stories, process steps, equation builds, device mockups, kinetic titles and more — each with its own motion language. Eight ready-made visual themes, style modes and preference controls keep every video on-brand and non-generic.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"18+ animated scene types","description":"Text diagrams, image and video heroes, split comparisons, lower thirds, annotated maps, animated data stories, process steps, equation builds, product heroes, kinetic text, SVG infographics, device mockups and more."},{"name":"Curated shot templates","description":"Battle-tested layouts including definition cards, quote callouts, stat blocks, step progressions, three-up grids, horizontal timelines and article zoom-pans."},{"name":"Motion primitives","description":"Reusable animation building blocks — number counters, typewriter text, growing bar charts, progress rings, staggered lists, underline sweeps and equation term reveals."},{"name":"8 visual themes","description":"Whiteboard, Cerulean, Glamour, Diorama, Neon, Chalkboard, Blueprint and Minimal — each a complete look with its own palette and design rules."},{"name":"Visual style modes","description":"Educational (clean lecture look), Marketing (premium brand-film look with depth and choreographed motion) or Bold (high-energy social styling) — auto-detected from content or set explicitly."},{"name":"Visual preference sliders","description":"Bias the mix of stock footage, AI imagery, SVG diagrams, motion graphics, app mockups and AI video per family — or just type preferences in plain language like 'use more diagrams'."},{"name":"On-screen text density control","description":"Choose minimal, low, auto or rich on-screen text independently of narration length — from title-only scenes to full supporting labels."},{"name":"Domain-aware shot selection","description":"The planner picks scene types suited to the subject — math gets equation builds, business gets data stories — and enforces shot diversity so scenes never repeat."},{"name":"Subject-matched pacing and music mood","description":"Speaking pace, transition style and music mood adapt to the detected subject and target duration."},{"name":"Narration-synced visuals","description":"Every content shot carries two to four supporting photos or icons that appear at the exact moment the narrator mentions them, so videos never become walls of text."},{"name":"Frame composition variety","description":"Each shot gets one of ten named compositions on a shared grid — columns, corner type, margin notes, full-bleed overlays and more — with repeats and centred layouts limited."},{"name":"Documentary staging","description":"Shots can stage documents, prints and film strips on paper, slate or desk surfaces with perspective, shadows, marker highlights and timelines, with subtle film finishing on educational videos."}]},{"id":"footage-imagery-sourcing","name":"Real Footage & Imagery Sourcing","tagline":"Real stock, real news photos, and AI imagery — automatically","description":"Every scene is dressed with the right imagery without the creator lifting a finger. The pipeline searches licensed stock photo and video libraries, pulls real news and web images for named people, places and events, and generates AI images where nothing real fits — with an AI ranking pass choosing the best match instead of the first result.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Stock photo and video search","description":"Automatic licensed stock search per scene with orientation matching and built-in redundancy for reliability."},{"name":"Real-entity image search","description":"Web-powered image and video search finds actual photos of specific people, places, events and products that stock libraries don't have."},{"name":"AI image generation","description":"Custom images are generated for abstract or conceptual scenes, with prompt enhancement on higher tiers."},{"name":"AI-ranked selection","description":"Instead of taking the first search result, higher tiers run an AI ranking over the top candidates and pick the best-fitting photo or clip."},{"name":"Visual continuity","description":"Continuity mode keeps characters and settings visually consistent across scenes in the same video."},{"name":"Reference image placement","description":"Attached reference images are understood by a vision model and threaded into the script and scene design, so real diagrams appear exactly where they belong."},{"name":"Tier-based sourcing policy","description":"The free tier is stock-only; higher tiers prefer stock and use AI generation only where stock can't deliver."}]},{"id":"use-your-own-footage","name":"Use Your Own Footage","tagline":"AI videos built from your recordings and screenshots","description":"Upload your own videos and images — demos, lectures, podcasts, product walkthroughs — and the AI understands them: transcribing speech, detecting scenes and faces, and mapping screen regions. Generated videos then splice in your real footage with graphics intelligently overlaid around it, turning raw recordings into polished produced videos.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Video indexing with podcast and demo modes","description":"Uploaded videos are analyzed with mode-specific pipelines — podcast (faces, speech) or demo (screen activity) — producing transcripts, scene maps and spatial layouts, with visible processing status."},{"name":"Image indexing","description":"Photos, screenshots and diagrams are indexed as reusable assets the planner can place into scenes."},{"name":"Multi-source generation","description":"Attach up to 5 indexed videos to one generation; the AI Director plans which source clips to use where."},{"name":"Original audio or AI narration","description":"Keep the source video's own audio as the narration, or let AI narrate over the footage — with an option to duck narration during source clips so their real sound plays."},{"name":"Source clip priority","description":"Tell the Director to lean lightly or heavily on your footage versus generated visuals."},{"name":"Smart overlay placement","description":"Face detection identifies free screen regions so text and graphics never cover the speaker."},{"name":"Asset library management","description":"Browse, filter, inspect and delete uploaded source videos and images from a dedicated library."},{"name":"Screenshot-led walkthroughs","description":"Build a full product or process walkthrough from up to 20 screenshots or images in one video, with explanatory diagram scenes between them and no invented interface."},{"name":"Batch asset upload","description":"Upload a whole set of screenshots or videos at once, with per-file names, automatic type detection, per-file status and retry of only the failed uploads."}]},{"id":"sound-design-music","name":"AI Sound Design & Generated Music","tagline":"Original score and sound effects on every video","description":"Videos ship with a complete audio mix, not just a voice. A sound planner places tasteful effects on transitions and emphasis moments, AI generates fresh custom effects so videos never reuse the same whoosh, and an AI composer writes an original background score matched to each video's emotional arc.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Automatic sound-effect placement","description":"Cues are derived from scene types, animation events and narration emphasis, with per-tier caps and a one-click off switch."},{"name":"AI-generated fresh effects","description":"Bespoke effects — typewriter ticks, paper rustle, chart-growth tones, whooshes and stingers — are generated to match actual on-screen animation events."},{"name":"Curated sound library with semantic search","description":"A role-based catalog of transition whooshes, chimes and impacts with semantic matching and repeat-avoidance so the same file isn't overused."},{"name":"AI-composed background music","description":"An original score is composed per video from the Director's music plan — mood, style and emotional beats — tiled seamlessly for long videos and delivered as an editable track."},{"name":"Curated music fallback","description":"A mood-tagged royalty-free library (ambient, triumphant, cinematic, tense, playful, reflective) keeps every video scored."},{"name":"Music controls","description":"Enable or disable background music per run, set its starting volume, and adjust or remove it later in the editor."},{"name":"Full audio mixdown","description":"Narration, source-clip audio, dialogue-scene audio, music and effects are mixed with loudness normalization into the final render."}]},{"id":"assist-mode","name":"Assist Mode — Human-in-the-Loop Co-Direction","tagline":"Approve the AI's creative decisions like a film director","description":"Instead of a fully automatic video, Assist Mode pauses the pipeline at the creative checkpoints you choose and asks for your decision in a chat-style panel. Approve or redirect the concept, shot plan, narration, visual style, casting and filmed clips — so the final video matches your vision without you doing the production work.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"13 configurable decision gates","description":"Enable any subset of pause points: creative concept, shot plan, styleframe, asset requests, narration, cast, dailies, visual casting, shot look, contact sheet, voice, music and avatar."},{"name":"Conversational approvals with five answer modes","description":"Each gate arrives as a chat card where you select an option, edit the draft directly, type free-form direction, let the AI decide this one, or auto-approve all remaining decisions of that kind."},{"name":"Shot plan review and editing","description":"See, reorder and rewrite the full planned shot list before any visuals are generated."},{"name":"Narration review and editing","description":"Edit narration per scene or replace the full script at the gate before the voiceover is recorded."},{"name":"Visual casting with live stock search","description":"At the visual-casting gate, search stock media live and hand-pick the exact footage or photo for each scene."},{"name":"Dailies review with re-takes","description":"Review each filmed dialogue clip alongside its automated quality verdict and send back specific shots with a note describing what the re-take must fix."},{"name":"Design identity approval","description":"Approve the video's visual signature — font pairing, motion style, finishing and color arc — before every shot is produced in that style."},{"name":"Per-decision or batched granularity","description":"Pause at every individual choice, including per-shot, or receive same-kind decisions consolidated in batches."},{"name":"Persistent, resumable decisions","description":"Pending decisions survive page reloads; the run resumes cleanly the moment an answer arrives."},{"name":"Live pipeline map","description":"Watch production as a node graph — research, pitch, screenplay, narration, shot planning, storyboard, talent, filming, score and final cut — with live status per stage."},{"name":"Thumbnail picker","description":"Choose the video's cover image from generated frame options."},{"name":"Production audit trail","description":"An audit sheet exposes every stage's inputs and outputs for quality inspection."}]},{"id":"video-editor","name":"AI Video Editor","tagline":"Fix any scene or sentence without regenerating the video","description":"Every generated video opens in a full timeline editor: scrub frame-accurately, rewrite narration sentence by sentence in the same voice, move and restyle on-screen elements directly on the canvas, and layer music and effects — then re-render the final cut. An AI edit assistant also takes plain-English instructions like 'change the headline' or 'cut the intro', shows you the proposed change, and applies surgical fixes without a costly full regeneration.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Timeline scrubbing and live playback","description":"Frame-accurate scrubbing with a real in-browser playback engine, so you review edits instantly without waiting for renders."},{"name":"Scene and shot management","description":"Add, edit, reorder, duplicate or delete scenes on the timeline, override a shot's captions, and download individual shots."},{"name":"Edit with AI in plain English","description":"Type an instruction — 'swap the background video', 'add captions in French', 'drop the last 10 seconds' — and the assistant applies a fast targeted patch or a full remake as needed, with a preview you accept, reject or refine."},{"name":"AI gap-fill scenes","description":"Generate a brand-new scene to fill a gap in the timeline, styled to match its neighbors."},{"name":"Sentence-level re-narration","description":"Rewrite one sentence and the platform re-records just that line in the same voice, splices it into the master audio with crossfades, and ripples all later timings automatically."},{"name":"Mute a sentence or scene","description":"Replace any sentence's or scene's audio with equal-length silence in one click."},{"name":"On-canvas visual editing","description":"Select, drag and resize text and media layers directly on the video canvas with alignment guides and a full layer stack."},{"name":"Built-in media picker and overlays","description":"Search stock photos and videos, generate AI images on demand, add image and video overlays, and maintain a saved media library — all inside the editor."},{"name":"Advanced markup editing","description":"Power users can open any scene's underlying markup in a built-in code editor for pixel-level control."},{"name":"Caption styling","description":"Ready-made caption style presets plus per-shot caption overrides."},{"name":"Audio tracks, music and transitions","description":"Manage multiple audio tracks with waveforms, add or remove music and sound cues, trim silent tails, and apply shot-to-shot transitions from a library."},{"name":"Channel restyling","description":"Restyle a finished video for a new channel — different brand frame, pacing and captions — and export in every aspect ratio needed."},{"name":"AI thumbnails","description":"Each video gets AI-generated thumbnail options with the headline typeset into the image; swap the selected option or regenerate."},{"name":"Safe collaborative saving","description":"Conflict detection warns when someone else saved the same video, so edits are never silently lost; script, audio, timings and renders are stored as separate recoverable assets."}]},{"id":"brand-kits","name":"Brand Kits & Video Branding","tagline":"Every video in your colors, fonts and logo — automatically","description":"Define your brand once — palette, fonts, logo, intro and outro, watermark and standing creative instructions — and every AI video applies it automatically at render time. Named brand kits keep separate identities for different brands or departments, a one-click scraper drafts a complete kit from any public website, and per-video overrides handle special cases without touching saved settings.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Institute-wide branding defaults","description":"Configure intro slide,  without affecting the rest of the platform. Creators control resolution, frame rate and a full caption styling suite — including karaoke-style word highlighting — at export time, and one render can serve every channel's aspect ratio.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Resolution and orientation options","description":"Export at 720p or 1080p in landscape (1920x1080) or portrait (1080x1920)."},{"name":"Frame rate options","description":"Choose 15, 20, 25, 30, 45 or 60 fps per render."},{"name":"Caption styling suite","description":"Phrase or karaoke word-highlight styles, multiple font families and weights, text and background colors with opacity, stroke, highlight color, position and size presets."},{"name":"Multi-ratio output","description":"Produce 16:9, 9:16 and 1:1 cuts for every channel from the same project."},{"name":"Branding toggle at export","description":"Show or hide watermarks and branding per render without editing the video."},{"name":"Parallel chunked rendering","description":"Videos render in parallel chunks with aggregate progress reporting for fast turnaround on long content."},{"name":"Render job management","description":"Submit, track and cancel render jobs; completion updates the video automatically."},{"name":"Source footage compositing","description":"Scenes using your own uploaded footage are composited with frame-accurate seeking and correctly mixed audio."}]},{"id":"reels-clip-finder","name":"AI Reels & Clip Finder","tagline":"Turn one lecture into a week of viral shorts","description":"Point the platform at any long recording and it finds the most engaging moments, scores them like a social media editor, and renders them as short-form reels with captions and branding. A three-step funnel — free scan, low-cost AI preview, full render — means you only pay for clips worth publishing.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Free engagement scan","description":"Heuristic scoring finds up to 50 candidate moments, rating each on hook strength, pacing, information density, loop-back potential and topic concentration."},{"name":"Targeting controls","description":"Set target reel duration (10-120 seconds), tolerance, aspect ratio, topic keywords and must-include time ranges; re-scan anytime."},{"name":"Candidate preview","description":"Review each candidate with a segment player, a thumbnail strip, and a word-importance timeline showing why the moment scored well."},{"name":"AI preview enrichment","description":"Selected candidates get an AI pass that writes a hook title and rationale, grades words for caption emphasis, and corrects misheard names and terms in the transcript."},{"name":"Aspect ratios and layouts","description":"Render 9:16, 16:9 or 1:1 with full-speaker, stacked or picture-in-picture layouts."},{"name":"B-roll options","description":"Auto-pick relevant stock b-roll from the transcript, or supply your own video."},{"name":"Silence trimming and pacing","description":"Off, gentle or tighter silence trimming plus configurable playback pace up to 1.5x clean up dead air."},{"name":"Cut plan overrides","description":"Manually override the AI's cut points with your own spans before rendering."},{"name":"Reel scene editing","description":"Add, update or delete overlay scenes on a finished reel just like the main video editor."},{"name":"Render tracking and retry","description":"Stage-by-stage progress per reel with one-click retry on failures, plus full reel management."}]},{"id":"long-form-projects","name":"Long-Form Edit Projects (Multi-Clip Wizard)","tagline":"Raw recordings to a finished edit in guided steps","description":"A project-based workspace that assembles long-form videos from your raw footage through a guided AI wizard: arrange and slice clips, clean up silences and filler words, add titles and captions, lay in music and effects, and build straight into the editor for final polish. The AI proposes a plan at every step; you refine it in conversation and confirm before anything is built.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Project workspace","description":"Create and manage projects that bundle multiple indexed video and image assets with a prompt, preferences and per-project options; a dashboard tracks build status per project."},{"name":"Four-step AI wizard","description":"Arrangement (clip ordering), Cuts (what to trim), Overlays (titles, captions, text) and Audio (music and effects) — each step offers an AI plan, chat-style refinement and explicit confirmation."},{"name":"Smart cut detection","description":"Automatic silence and filler-word detection proposes cuts; segment picking and sequencing tools assemble the story."},{"name":"Overlay and caption proposals","description":"The AI proposes titles, text overlays and captions placed on the timeline; every proposal is editable."},{"name":"Audio proposals","description":"The AI proposes background music and sound effects; a master soundtrack is assembled per build with per-track control."},{"name":"Deep control at every layer","description":"Override per asset, per project, per wizard step, per operation and per build — skip steps, reorder, or hand-edit anything the AI proposed."},{"name":"Builds and publishing","description":"Create multiple builds — fork a previous build, change aspect ratio or frame rate — track their status, publish the winner and delete the rest."},{"name":"Frame-level build editing","description":"Add, update, delete and reorder scenes on a finished build before rendering."},{"name":"Editor handoff and final render","description":"Open any build directly in the AI video editor for polish, then render to MP4 with the full export options."}]},{"id":"translation-localization","name":"Video Translation & Lip-Synced Localization","tagline":"One video localized into 80+ markets in one batch","description":"Translate any video — script, voiceover and captions — into 80+ languages with frame-accurate lip sync, so the result looks filmed in the target language rather than dubbed. Brand glossaries protect product names from translation, per-segment review lets humans approve the lines that matter, and one batch produces the entire localized set.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Frame-accurate lip sync","description":"Mouth movements match the new language — for AI avatars and real human talent alike — with per-language preview before render."},{"name":"Brand-glossary protection","description":"A workspace-locked glossary protects product names, trademarks and idioms from translation; translation memory carries across projects."},{"name":"Per-segment review and approval","description":"Reviewers approve individual translated lines before render, per market."},{"name":"Batch multi-market rendering","description":"Pick target markets and produce the full localized set — voiced, captioned, lip-synced — in one batch, with an audit log of every locale shipped."},{"name":"Works on any source video","description":"Localize videos made on the platform or uploaded from anywhere."},{"name":"Native-speaker QA","description":"Enterprise plans add a native-speaker quality-assurance review per market."}]},{"id":"transcription","name":"AI Transcription & Translation","tagline":"Accurate word-timed transcripts for any recording","description":"Any audio or video file can be transcribed with word-level timestamps, in the source language or translated into English. Transcription powers captions, video indexing, reels, clip extraction and searchable content across the platform.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Async transcription jobs","description":"Submit any media file, choose accuracy level, and receive the finished transcript with completion callbacks."},{"name":"Word-level timestamps","description":"Every word is timed, enabling synced captions, sentence editing and clip extraction."},{"name":"Translate mode","description":"Transcribe in the source language, translate to English, or produce both in one job."},{"name":"Multiple output formats","description":"Plain text and structured formats for downstream use."}]},{"id":"screen-recorder","name":"Screen Recorder with Auto-Edit","tagline":"Record once, auto-edit, ship anywhere","description":"Record a browser tab, application window or full screen with webcam picture-in-picture and background removal — straight from the browser with nothing to install. The platform then automatically removes filler words and dead space, tightens pacing, adds captions and brand-stamps the result for internal shares, support replies or social.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Browser-based capture","description":"Record tab, window or full screen with webcam picture-in-picture and background removal — no extension or install."},{"name":"Automatic filler removal","description":"'Ums', silences and dead space are cut with pacing-aware trims, with a one-click 'keep raw' option for technical demos."},{"name":"Caption and brand stamping","description":"Captions in source and target language plus workspace brand marks applied to every recording."},{"name":"Multi-destination sharing","description":"Push the same cut to chat, drive or support tools as an internal share, ticket reply or social short."}]},{"id":"thumbnail-maker","name":"Thumbnail Maker","tagline":"Click-worthy, on-brand thumbnails with A/B variants","description":"Generate platform-perfect thumbnails from a finished video, a frame or a brief — with preset compositions tuned for YouTube click-through, LinkedIn scroll-stop, TikTok hooks and X. Brand type, color and logo lockups apply automatically, and multiple variants per video can be pushed straight into YouTube A/B testing.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Platform composition presets","description":"Presets for YouTube, LinkedIn, TikTok and X with per-platform safe-area and crop logic."},{"name":"Automatic brand styling","description":"Type, palette, logo lockup and overlay style applied at render time, with per-channel variations."},{"name":"A/B variant generation","description":"Four composition variants per video, pushed directly to YouTube A/B tests with per-variant performance reporting."}]},{"id":"ppt-to-video","name":"PowerPoint to Video & Animated Slides","tagline":"Slide decks that present themselves","description":"Upload a deck and get two superpowers: a narrated presenter video — speaker notes become the script, transitions are animated, and pacing matches each slide's density — or web-ready animated slides that replay your click-by-click entrance animations beautifully in the browser. Existing uploaded decks can be upgraded in bulk.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Engage Client","API"],"subFeatures":[{"name":"Multi-format deck input","description":"PPTX, Keynote, Google Slides and PDF supported, with slide text, speaker notes and visual hierarchy read automatically."},{"name":"Speaker-notes narration","description":"Speaker notes become the narration script when present; otherwise copy is generated — optionally in a cloned voice."},{"name":"Content-aware pacing","description":"Each slide gets a timing window matched to its density — no flat per-slide timing."},{"name":"Branded motion layer","description":"Transitions, lower-thirds and motion language applied per your brand template, tweakable per slide."},{"name":"Animation-preserving web slides","description":"Click-by-click entrance animations are detected from the PPTX and replayed as smooth build steps in the online deck player, rendered at high fidelity."},{"name":"Async conversion and bulk upgrade","description":"Submit decks as background jobs and upgrade previously uploaded decks to the animated format in bulk."},{"name":"Flexible export","description":"Every aspect ratio from one deck, exported to MP4, WebM or GIF preview with auto-captions."}]},{"id":"image-to-video","name":"Image to Video","tagline":"Product stills turned into branded motion clips","description":"Turn product shots, screenshots or stock images into motion clips with composition-aware camera moves, narration and on-brand captions. Built for product pages, retargeting creative and email — with batch rendering across an entire product catalog.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Composition-aware motion","description":"Each image receives the camera move its composition warrants — pans, zooms, parallax — with per-image override and preview."},{"name":"Automatic brand framing","description":"Lower-thirds, logo placement rules, color overlays and locked caption styles applied at render time."},{"name":"Catalog batch rendering","description":"Render hundreds of clips across a product catalog in one pass, in every aspect ratio."},{"name":"Ad-account push","description":"Push finished clips directly to ad accounts and asset managers."}]},{"id":"video-api","name":"Video API & Automation","tagline":"Video as infrastructure, wired into your stack","description":"The entire video engine is available as a documented developer API: create API keys, generate videos programmatically from your CRM, product, LMS or marketing tools, and receive webhooks when each video is ready. Teams wire it so releases trigger launch films, CRM stages trigger personalized outreach, and catalogs render per-SKU video automatically.","roles":["Admin","Teacher"],"platforms":["API","Admin Web"],"subFeatures":[{"name":"API key management","description":"Generate, list and revoke workspace-scoped API keys directly from the studio."},{"name":"In-app interactive documentation","description":"Docs cover generation, status polling and asset endpoints with ready-to-copy JavaScript, Python and cURL examples."},{"name":"Cost and route preview endpoints","description":"Programmatically preview the credit cost and planned production route for a prompt before generating."},{"name":"Personalization at scale","description":"Submit a template plus variables from a CRM, CSV or webhook — name, company, deal value — and generate thousands of personalized videos with preview and approval gates."},{"name":"Lifecycle webhooks","description":"Signed webhooks with retries fire at every render lifecycle event; bulk generation is built in."},{"name":"Release-pipeline integration","description":"Connect the API to your changelog or release process so walkthroughs and launch content refresh automatically with every ship."},{"name":"Catalog and ad integrations","description":"Wire a product catalog or CSV feed for per-SKU video and push variants directly to ad platforms."},{"name":"Throughput guarantees","description":"Priority render queues and guaranteed API throughput on higher plans."}]},{"id":"cost-preview-guardrails","name":"Cost Preview & Spend Guardrails","tagline":"Know the credit cost before you press Generate","description":"Before any video generates, creators see an itemized credit estimate for their exact selections — tier, duration, voice tier, avatar, AI clips, dialogue scenes — next to their live balance. Hard per-run caps, tier balance checks and a full run ledger keep AI video spend predictable and auditable.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Itemized pre-flight estimate","description":"The cost preview prices your exact configuration — tier, model, duration, voice tier, avatar, music, AI clips, dialogue mode — and shows the breakdown next to your balance."},{"name":"Worst-case rows for premium add-ons","description":"AI clips and dialogue scenes show upper-bound rows so maximum possible spend is visible before submit."},{"name":"Tier balance checks","description":"Runs are blocked up front
