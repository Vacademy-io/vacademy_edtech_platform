min","Teacher","Learner"],"platforms":["Admin Web","Learner Web"],"subFeatures":[{"name":"Folders","description":"Create, list and delete folders to organize study materials."},{"name":"Upload or create study docs","description":"Upload existing files or author new study documents directly in the app, singly or in bulk."},{"name":"Audience-based access","description":"Set each document's visibility to Learner, Admin or Both."}]},{"id":"course-settings","name":"Course Settings & Authoring Policies","tagline":"Institute-wide rules for how courses get built","description":"Define how course creation behaves across the institute: which detail fields are required, the default and fixed course depth, whether sessions and levels are used, default view mode, and how finished courses reach the public catalogue. Per-course settings panels add workflow automation triggers, sub-organization sharing, offer pricing defaults and external LMS connections.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Required-field policies","description":"Choose which course information fields are mandatory or enabled, from descriptions to banner images and promo media."},{"name":"Structure defaults","description":"Set the default course depth, lock it institute-wide, enable or disable sessions and levels, and set the default view mode and outline state."},{"name":"Catalogue publishing mode","description":"Decide whether finished courses go to the public catalogue automatically, manually, or with a prompt each time."},{"name":"Learner creation permissions","description":"Optionally allow learners to create courses, and control whether payment, discount and referral options can be changed per course."},{"name":"Per-course settings editor","description":"Override institute defaults for a single course through a dedicated settings panel."},{"name":"Workflow triggers per course","description":"Attach automation workflows to course events (e.g. on enrollment) and manage the triggers from the course settings panel."},{"name":"Sub-organization sharing","description":"Associate a course's batches with sub-organizations for franchise or multi-branch setups."},{"name":"External LMS connections","description":"Connect a course to an external LMS — LearnDash, Moodle or any custom LMS — with a saved connection library and one-click connection tests; Vacademy's built-in LMS needs no setup."},{"name":"Offer pricing and rounding defaults","description":"Configure offer pricing with automatic rounding rules for clean price points."}]},{"id":"content-protection","name":"Content Protection","tagline":"Keep your paid content from walking out the door","description":"Per-role content protection controls make it harder to copy or leak your study material. Configure protections separately for Admins, Teachers and Learners, control who may download slides and documents role by role, and rely on in-viewer protection plus a mobile privacy screen against screenshots.","roles":["Admin","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Per-role protection profiles","description":"Enable protection rules separately for Admin, Teacher, Learner and other roles."},{"name":"In-viewer copy protection","description":"Protect slide content from copying inside the study viewer."},{"name":"Slide download control","description":"Decide role by role who may download slides and documents."},{"name":"Mobile privacy screen","description":"The mobile app adds a privacy screen that guards content against screenshots."}]},{"id":"offline-learning","name":"Offline Learning & Secure Downloads","tagline":"Study anywhere — even without an internet connection","description":"Learners download course content inside the mobile and desktop apps and keep studying with no connection — videos, PDFs, documents, audio and quizzes all play offline. Files are encrypted on the device, a device limit and periodic check-in keep paid content under control, and everything a learner does offline syncs back automatically when they reconnect. Admins decide institute-wide, per course and down to individual chapters or slides what may be downloaded.","roles":["Admin","Learner"],"platforms":["Admin Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Institute offline switch with device limits","description":"Turn offline access on for the institute and set how many devices each learner may use and how often a device must check in online to keep its downloads."},{"name":"Per-course and per-item availability","description":"Allow or block downloads for a whole course or for individual subjects, chapters and slides, so premium or live-only material stays online-only."},{"name":"Downloads page and download buttons","description":"Learners download a course, chapter or slide with one tap and manage everything they have saved from a dedicated Downloads page in the app."},{"name":"Encrypted on-device storage","description":"Downloaded files are stored encrypted with device-held keys, so content can only be played inside the institute's app."},{"name":"Offline playback of every core content type","description":"Videos, PDFs, documents, audio lessons and quizzes play fully offline with the same player learners use online."},{"name":"Automatic progress and quiz sync","description":"Progress and quiz attempts made offline are queued and synced when the device reconnects, with quiz scores re-checked on the server."},{"name":"Device management and remote revoke","description":"Admins see each learner's offline devices and can revoke one remotely, which removes its downloaded content at the next check-in."},{"name":"Content update notices and download stats","description":"Learners are told when downloaded content has changed and can refresh it, while a course Downloads tab shows admins what is being downloaded."}]}],"demo":{"intro":"Follow a course from the admin's course builder to a learner finishing a lesson on their phone.","screens":[{"id":"library","device":"desktop","title":"Study Library","nav":["Dashboard","Study Library*","Learners","Assessments","Live Classes","Reports","Settings"],"widgets":[{"type":"header","id":"lib-head","title":"Courses","subtitle":"24 published · 3 drafts","actions":["+ Create Course","Bulk Upload"],"tabs":["All Courses","Authored Courses","Course Approval"],"activeTab":0},{"type":"stats","id":"lib-stats","items":[{"label":"Active learners","value":"1,842","delta":"+126 this month"},{"label":"Courses","value":"27"},{"label":"Avg. completion","value":"72%"},{"label":"Avg. rating","value":"4.6 ★"}]},{"type":"filters","id":"lib-filters","search":"Search courses…","chips":["Filters","Level","Session","Tags",{"label":"Published","on":true}]},{"type":"cards","id":"lib-cards","items":[{"title":"NEET 2027 — Physics","sub":"3 levels · 214 slides","chip":"Published","tone":"green","cta":"View Course","banner":{"title":"Physics","sub":"All Chapters","chip":"NEET 2027"}},{"title":"Class 10 Maths Foundation","sub":"2 levels · 168 slides","chip":"Published","tone":"green","cta":"View Course","banner":{"title":"Mathematics","sub":"Foundation Course","chip":"Class 10"}},{"title":"IELTS Band 8 Sprint","sub":"1 level · 96 slides","chip":"Draft","tone":"orange","cta":"View Course","banner":{"title":"IELTS","sub":"Band 8 Sprint","chip":"8 weeks"}},{"title":"JEE Chemistry Crash Course","sub":"2 levels · 143 slides","chip":"In review","tone":"blue","cta":"View Course","banner":{"title":"Chemistry","sub":"Crash Course","chip":"JEE 2027"}}]}],"module":"lms"},{"id":"authoring","device":"desktop","title":"Course Editor — NEET 2027 Physics","nav":["Dashboard","Study Library*","Learners","Assessments","Live Classes","Reports","Settings"],"widgets":[{"type":"wizard","id":"auth-crumbs","steps":["Course","Level: Class 12","Subject: Mechanics","Chapter: Laws of Motion"],"active":3},{"type":"player","id":"auth-slides","outline":[{"title":"Laws of Motion","items":[{"t":"Intro video: Newton's laws","done":true},{"t":"Reading: Inertia & mass","done":true},{"t":"In-video quiz checkpoint","on":true},{"t":"Numericals worksheet (PDF)"},{"t":"Homework: 12 problems"}]}],"slide":{"title":"In-video quiz checkpoint","body":"Question appears at 04:32 of the video — learners must answer before the lesson continues. Supports MCQ, numeric and one-word answers, with instant explanations."}},{"type":"form","id":"auth-drip","title":"Publish settings","fields":[{"label":"Visibility","value":"Publish to NEET 2027 Batch A","type":"select"},{"label":"Drip schedule","value":"Unlock chapter-by-chapter, every Monday","type":"select"},{"label":"Downloads allowed","value":"on","type":"toggle"}],"submit":"Publish"}],"module":"lms"},{"id":"learner","device":"phone","title":"Learner App","nav":["Home*","Courses","Tests","Doubts","Profile"],"widgets":[{"type":"header","id":"l-head","title":"Hi Ananya 👋","subtitle":"NEET 2027 Batch A"},{"type":"video","id":"l-video","title":"Newton's Laws — Lesson 3","time":"12:40"},{"type":"list","id":"l-next","items":[{"title":"Continue: Laws of Motion","sub":"3 of 5 slides done","right":"60%"},{"title":"Homework due Friday","sub":"12 numericals","chip":"Due","tone":"orange"},{"title":"Chapter test unlocked","sub":"Laws of Motion · 30 min","chip":"New","tone":"green"}]},{"type":"stats","id":"l-streak","items":[{"label":"Day streak","value":"🔥 14"},{"label":"XP this week","value":"480"},{"label":"Certificates","value":"2"}]}]}],"steps":[{"screen":"library","target":null,"title":"One library for every course","text":"Admins and teachers manage every offering here — courses, memberships, even one-off services. Live stats show enrollment, completion and ratings at a glance."},{"screen":"library","target":"lib-cards","title":"Courses with a real lifecycle","text":"Each course moves through draft, editorial review and publish. Batches, levels and academic sessions hang off the same card — no duplicate content per batch."},{"screen":"library","target":"lib-head","title":"Create by hand or in bulk","text":"Start a course with the guided wizard, or bulk-upload existing folders of videos and PDFs — Vacademy maps them into chapters and slides automatically."},{"screen":"authoring","target":"auth-crumbs","title":"Structure that matches how you teach","text":"Choose 2 to 5 levels of depth per course — from a flat chapter list up to Level → Session → Subject → Module → Chapter trees."},{"screen":"authoring","target":"auth-slides","title":"A dozen slide types in one editor","text":"Mix video with in-video questions, PDFs, quizzes, code labs, whiteboards and homework in a single chapter. Slides keep full version history with restore."},{"screen":"authoring","target":"auth-drip","title":"Publish with drip and controls","text":"Publish to specific batches, drip content on a schedule or after prerequisites, and control downloads and watermarking per course."},{"screen":"learner","target":"l-video","title":"The learner side, on any device","text":"Learners get the same course in a distraction-free player — web, Android app or desktop app — with resume, playback speed and offline-friendly viewing."},{"screen":"learner","target":"l-next","title":"Progress that drives itself","text":"True completion tracking (not just 'opened'), homework deadlines and newly unlocked tests surface right on the home screen."},{"screen":"learner","target":"l-streak","title":"Momentum built in","text":"Streaks, XP and certificates keep learners coming back — and every bit of this activity feeds the reports admins see."}]}},{"id":"assessments","name":"Assessments & Evaluation","icon":"assess","color":"#7C3AED","tagline":"Every exam format — online, offline, OMR — with manual and AI grading","description":"A complete examination engine that takes institutes from question authoring to published results — online exams, mock tests, practice papers, homework, surveys and pen-and-paper tests all run on the same platform. Staff build papers from a rich question-type library or import them from Word, control exactly who takes each test, monitor exams live, and grade with manual tools or AI that evaluates handwritten answer sheets in minutes. Learners get a resilient exam experience on web, mobile and desktop, followed by detailed report cards with peer comparison and leaderboards.","features":[{"id":"assessment-creation-wizard","name":"Assessment Creation Wizard","tagline":"Build any exam in four guided steps","description":"A step-by-step wizard walks staff through creating an assessment: basic details, questions and sections, participants, and access control. It supports multiple assessment types — Exam, Mock, Practice, Survey and Manual-Upload exams where learners submit files instead of answering on screen — each with tailored options. Assessments stay in draft until published, so nothing goes live by accident.","roles":["Admin","Teacher","Assessment Creator"],"platforms":["Admin Web"],"subFeatures":[{"name":"Five assessment types","description":"Choose between Exam, Mock test, Practice test, Survey, and Manual-Upload exam where learners submit PDFs, files or videos instead of answering on screen."},{"name":"Basic details and instructions","description":"Name the assessment, link it to a subject, and write rich-text instructions participants see before starting."},{"name":"Live date window","description":"Define the start and end date/time between which participants can begin and must finish."},{"name":"Timed preview window","description":"Optionally give participants a timed preview to read the paper before the clock starts."},{"name":"Automatic or manual evaluation","description":"Pick instant machine grading, or manual evaluation where teachers grade answer sheets."},{"name":"Submission modes","description":"Choose auto-submit when time expires or manual submit by the learner; manual-upload exams accept PDF, file, live-recorded video or uploaded video submissions."},{"name":"Result release policy","description":"Release results automatically after the exam ends, after each submission, or hold them for manual release."},{"name":"Re-attempt settings","description":"Set a default re-attempt count and optionally let learners raise re-attempt requests for admin approval."},{"name":"Extra-time requests","description":"Optionally let learners request more time during the exam, granted with admin consent."},{"name":"Section switching control","description":"Allow or block participants from moving back and forth between sections during the attempt."},{"name":"OMR mode","description":"Enable OMR-style answering for pen-and-paper tests whose responses are entered later."},{"name":"Duration distribution","description":"Apply the time limit at whole-assessment level, per section, or per question."},{"name":"Draft / publish lifecycle","description":"Assessments stay in draft while being built and publish only when ready; each wizard step tracks its own complete/incomplete status."},{"name":"Public or private visibility","description":"Mark an assessment public (open to anyone via link) or private (restricted to selected learners)."},{"name":"Build from a knowledge base","description":"Plan sections from a knowledge base's topic tree and adjust the plan before generating. Each planned row becomes a section of questions that you review before saving."},{"name":"Edit questions in place","description":"Edit a question and its options directly in the sections step without leaving the wizard. Each edit is recorded in the admin activity log."}]},{"id":"question-type-library","name":"Rich Question Type Library","tagline":"Nine question types, from MCQ to live coding","description":"Author questions in a wide range of formats: single-correct MCQ, multiple-correct MCQ, true/false, one-word answer, long answer, fill-in-the-blank, match-the-following, numeric answer, and coding questions graded in the browser against test cases. Comprehension passages group related questions under one shared text, and every question supports formatted text, images and mathematical formulas.","roles":["Admin","Teacher","Assessment Creator"],"platforms":["Admin Web"],"subFeatures":[{"name":"MCQ — single correct","description":"Classic multiple choice with one correct answer."},{"name":"MCQ — multiple correct","description":"Multiple-select questions with support for partial credit."},{"name":"True / False","description":"Quick binary questions."},{"name":"One-word answer","description":"Short free-text answers auto-checked against accepted words."},{"name":"Long answer","description":"Essay-style subjective questions with an answer key for evaluators, graded manually or by AI."},{"name":"Numeric answer","description":"Numeric questions with validation modes: single digit, any integer, positive integer, or decimal."},{"name":"Fill in the blank","description":"Sentence-completion questions with inline blanks."},{"name":"Match the following","description":"Pair items across two columns."},{"name":"Coding questions","description":"Learners write source code in an in-exam editor; submissions run against test cases and return a verdict with per-test-case results."},{"name":"Comprehension groups","description":"Attach a shared passage to sets of single-correct, multiple-correct or numeric questions."},{"name":"Rich content everywhere","description":"Question text, options and explanations support formatted text, images and mathematical formulas."},{"name":"Per-question evaluation mode","description":"Each question is marked for automatic or manual evaluation, so mixed papers grade the objective part instantly."},{"name":"Hidden test-case partial marking","description":"Coding answers earn marks in proportion to the hidden test cases they pass, and reports show hidden and sample results separately."},{"name":"Coding answer review","description":"Staff see each coding answer's verdict, a bar of test cases passed, every test result, the runtime and the submitted source code."}]},{"id":"ai-answer-sheet-evaluation","name":"AI Answer-Sheet Evaluation","tagline":"AI grades whole batches of answer sheets in minutes","description":"Upload scanned answer sheets and let AI do the grading: the system reads each PDF — including handwriting and math — extracts every answer, applies your marking rubric, and awards question-wise marks with written feedback. Evaluate one learner or a whole classroom in a single run, watch progress live, and review or override any AI mark before results go out. Evaluation time drops from days to minutes while teachers keep the final say.","roles":["Admin","Teacher","Evaluator"],"platforms":["Admin Web"],"subFeatures":[{"name":"Rubric management","description":"Create, edit and delete a marking rubric per assessment, down to individual questions, so the AI grades to your standard."},{"name":"AI-drafted criteria and templates","description":"Ask AI to draft evaluation criteria automatically, or manage a library of reusable criteria templates."},{"name":"Batch evaluation","description":"Select individual students or evaluate many at once, with live per-student status from pending through processing to completed."},{"name":"Handwriting and math reading","description":"The AI reads scanned PDFs including handwritten answers and mathematical notation, rendering math properly in the review view."},{"name":"Live progress tracking","description":"Watch each stage — PDF processing, answer extraction, criteria generation, grading, saving — with per-question statuses while evaluation runs."},{"name":"Annotated answer sheets","description":"The reviewed PDF shows AI annotations and margin notes anchored to the learner's actual writing."},{"name":"Per-student summaries with remarks","description":"Each student gets a consolidated score breakdown and written evaluation summary; evaluators can add their own remarks."},{"name":"Human review and override","description":"Teachers review each AI-graded question and adjust marks before release; a badge flags answers graded before a rubric change."},{"name":"Stop, retry and run history","description":"Stop a running evaluation, retry failures, and browse a history of every AI evaluation run per attempt with its status."},{"name":"Automatic AI evaluation on submission","description":"Turn on 'Evaluate submissions with AI' for an assessment. Every submission, including ones closed when time runs out, is then queued for AI grading with no teacher action needed."},{"name":"AI grading of typed long answers","description":"Essays, letters and emails typed in the online test are graded by AI against your rubric and model answer for content, format, organisation and language. Objective questions keep their exact auto-score."},{"name":"Bulk upload with name matching","description":"Upload every scanned copy at once. The AI reads the name on each sheet, matches it to a student and queues the checks. For any copy it cannot match, you pick the student."},{"name":"Bulk check of learner-submitted copies","description":"AI-check every answer sheet learners uploaded themselves, or only the selected ones. A preview shows what is already checked or running, and no copy is queued twice."},{"name":"Bulk check tracker and alerts","description":"A Bulk checks panel shows each copy's status and who it was matched to. An email and an in-app alert arrive when the batch finishes."},{"name":"Credit cost preview","description":"Before a check starts, see its cost in AI credits for each copy and in total, worked out from the number of questions, next to the institute's current balance."},{"name":"Results held for teacher review","description":"AI-checked marks stay hidden from learners until a teacher reviews them and releases results. This rule is enforced on the server."}]},{"id":"manual-evaluation-workspace","name":"Manual Evaluation & Answer-Sheet Checking","tagline":"Grade answer sheets on screen, attempt by attempt","description":"A dedicated evaluation area lists every assessment awaiting grading and walks evaluators through attempts one learner at a time. Evaluators upload or view scanned answer sheets, annotate PDFs directly in the browser, award marks per question, and save partial work as drafts before final submission — with a built-in calculator and progress tracking along the way.","roles":["Admin","Teacher","Evaluator"],"platforms":["Admin Web"],"subFeatures":[{"name":"Evaluation queue","description":"Live, upcoming and past tabs of assessments with a participant sidebar showing who still needs grading."},{"name":"Answer sheet upload","description":"Upload a learner's scanned answer sheet against their attempt for evaluation."},{"name":"PDF annotation editor","description":"Mark up scanned answer sheets directly in the browser, with the ability to reset annotations before confirming."},{"name":"Per-question marks entry","description":"Award marks question-by-question against the answer key and maximum marks, with totals computed automatically."},{"name":"Built-in calculator","description":"A calculator overlay for totalling marks without leaving the sheet."},{"name":"Evaluation drafts","description":"Save grading progress as a draft, resume later, or discard it."},{"name":"Update marks and attempts","description":"Correct previously submitted marks at question or attempt level."},{"name":"All-attempts view","description":"See every attempt of an assessment with its evaluation status in one list."},{"name":"Evaluator progress tracking","description":"See pages reviewed, questions not yet visited, total marks awarded and time spent on each evaluation."},{"name":"Quick checking setup","description":"Spin up a lightweight assessment with sections purely for answer-sheet checking, with AI-assisted publishing."},{"name":"Page rotation","description":"Rotate sideways or upside-down scans page by page. The rotation is saved into the checked PDF while untouched pages keep their original quality."},{"name":"Adjustable pen","description":"Change pen thickness and colour as you mark. You can also restyle a mark you already made by selecting it."},{"name":"Fullscreen and fit-to-width","description":"Go fullscreen for more room, and let pages fit the available width automatically as the workspace resizes."},{"name":"Click-to-place marks","description":"Ticks, crosses, text, boxes and circles appear where you click and stay selected, so you can mark repeatedly from a compact floating toolbar."}]},{"id":"learner-exam-experience","name":"Learner Exam Experience","tagline":"A serious exam hall on any device","description":"Learners take scheduled and practice assessments in a purpose-built exam interface with sections, multi-level timers, a question palette and auto-submission. Answers stream continuously to the server, so crashes and flaky networks lose nothing, and interrupted attempts can be resumed. The same experience runs on web, mobile and desktop apps.","roles":["Learner"],"platforms":["Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Exam catalog with tabs","description":"Assessment lists organized into live, upcoming, past and attempted tabs, with search and pull-to-refresh."},{"name":"Instructions and timed preview","description":"Learners see exam details, duration, marking information and instructions before starting; where enabled, a timed preview lets them read the paper before the attempt clock starts."},{"name":"Question navigator and list view","description":"A palette showing answered, unanswered and marked questions with one-tap jumps, plus a scrollable full-paper list view."},{"name":"Timers at every level","description":"Assessment-level, section-level and per-question countdowns with automatic submission at expiry."},{"name":"Controlled section switching","description":"Multi-section papers where the institute decides whether learners may move between sections."},{"name":"Autosave and network resilience","description":"Answers and time state stream to the server throughout the attempt, with a live network status indicator protecting learners on unstable connections."},{"name":"Resume interrupted attempts","description":"If the app closes mid-exam, learners rejoin the running attempt and continue exactly where they were."},{"name":"In-exam announcements","description":"Admin broadcasts reach learners mid-exam without interrupting the attempt."},{"name":"Homework and file submissions","description":"Manual-upload assessments accept file, PDF or video submissions that learners mark complete."},{"name":"Re-attempt and extra-time requests","description":"Where allowed, learners request another attempt or more time and admins approve from the monitoring console."},{"name":"Attention tracking","description":"The exam screen records tab-switch and visibility events as part of the attempt data available to the institute."},{"name":"Collapsible question panel","description":"On desktop, learners can hide the question palette so the question or code editor uses the full width, then bring it back from the header."}]},{"id":"assessment-video-proctoring","name":"Video Proctoring","tagline":"Camera proctoring without the cost of streaming","description":"Switch on camera proctoring for any assessment that needs it. The learner's own device checks for a missing face or extra people, and captures small snapshots on a timer and at every flag. No video is streamed, so it runs well on ordinary connections and costs little. Staff review each attempt's flags and snapshots in a timeline, during the exam or after it, and can set a violation limit that auto-submits the attempt.","roles":["Admin","Assessment Creator","Evaluator","Learner"],"platforms":["Admin Web","Learner Web"],"subFeatures":[{"name":"Per-assessment proctoring setting","description":"Pick a proctoring level for each assessment in the creation wizard. It is off unless you choose it, so existing tests are unchanged."},{"name":"Camera check-in","description":"Learners complete a camera check-in on the instructions page. You can choose to block the start until camera access is granted."},{"name":"On-device face checks","description":"Throughout the attempt, the learner's device flags moments with no face in view or more than one face. Nothing is streamed to a server."},{"name":"Timed and flag snapshots","description":"Small photos are captured on a schedule you set, from every 10 seconds to every 10 minutes, plus one at every flag as evidence."},{"name":"Tab-switch and camera-loss signals","description":"Leaving the exam tab, exiting fullscreen and losing the camera are recorded as warnings or flags alongside the face checks."},{"name":"Violation limit with auto-submit","description":"Set how many flags an attempt can collect before it auto-submits. Set it to zero to only record flags and leave the decision to a reviewer."},{"name":"Learner self-view","description":"Show learners a small self-view while they work, so they know the camera is on."},{"name":"Proctoring review timeline","description":"Open any attempt from the Attempted or Ongoing tab to see its flags, warnings and snapshots in order. While open, the view refreshes live during the exam."}]},{"id":"live-exam-monitoring","name":"Live Exam Monitoring & Submissions Console","tagline":"Watch, extend, close and manage attempts in real time","description":"While an exam runs, staff see participants grouped into Attempted, Ongoing and Pending tabs with live counters, search and filters. Individual and bulk actions cover the whole exam-day toolkit: extend time, force-close submissions, remove participants, send reminders, grant re-attempts and release results.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Attempt status tabs","description":"Participants split into Attempted, Ongoing and Pending lists with a live summary strip and counters."},{"name":"Increase time","description":"Add extra minutes to ongoing attempts, individually or in bulk."},{"name":"Close submissions","description":"Force-submit ongoing attempts, individually or in bulk."},{"name":"Grant re-attempts","description":"Give selected learners another attempt after they have submitted."},{"name":"Remove participants","description":"Take pending participants off the exam roster in bulk."},{"name":"Send reminders","description":"Nudge pending participants who have not started yet."},{"name":"Release results","description":"Release results per learner, in bulk, or for the entire assessment when set to manual release."},{"name":"Search and filters","description":"Find participants by name and filter each tab before applying bulk actions."},{"name":"WhatsApp and email reminders","description":"Send reminders to pending learners on WhatsApp or email, for one learner or in bulk. 'Select all' reaches the whole filtered list, not just the visible page."},{"name":"Not-attempted list and export","description":"See batch learners who never attempted the test and export them to CSV, with contact details, for follow-up."},{"name":"Contact columns and column manager","description":"Add learner contact columns to the submissions table and choose which columns appear. Registration custom fields are included in the CSV export."},{"name":"Requests inbox","description":"A dedicated tab collects learners' reattempt and extra-time requests. Filter them by pending, approved or rejected, and grant between one and twenty extra attempts."},{"name":"Bulk report export as ZIP","description":"Generate a ZIP with one report PDF per student for the selected or filtered submissions. Progress is tracked, and the export can be resumed or cancelled."},{"name":"AI class diagnostic report","description":"Get one AI-written analysis of the whole assessment: weak areas by section, topic and question, common misconceptions with how to reteach them, and an action plan. You pay once, and every later download is free."}]},{"id":"question-paper-bank","name":"Question Paper Bank","tagline":"A searchable, taggable library of reusable papers","description":"Every question paper lives in a central bank where staff can search, filter, favourite and reuse it across assessments. Papers are organised by level, subject and tags, and a public community bank lets institutes pull shared papers into their private collection with one click — protecting institute IP while making reuse effortless.","roles":["Admin","Teacher","Assessment Creator"],"platforms":["Admin Web"],"subFeatures":[{"name":"Create and edit papers","description":"Author papers question-by-question in the editor, edit titles and metadata later, and preview the full paper at any time."},{"name":"Filters and search","description":"Filter the bank by level, subject and tags, search by name, and narrow by creation date range."},{"name":"Favourites","description":"Star frequently used papers into a separate Favourites view."},{"name":"Question tags","description":"Tag questions and papers for topic-wise organisation and retrieval."},{"name":"Public question bank","description":"Browse a public community bank of shared question papers with the same filters."},{"name":"Copy public papers to private","description":"One click imports a public paper into the institute's private bank for editing and use."},{"name":"Archive papers","description":"Remove outdated papers from the active bank without touching past assessments."},{"name":"Question selector","description":"Pick individual questions from existing papers when assembling a new assessment section."},{"name":"Add-paper chooser","description":"Add a paper by generating it with AI, uploading a file and reviewing every parsed question, or writing it by hand in the editor."},{"name":"Sorting, date groups and counts","description":"The bank shows totals for all papers, papers added this week and favourites. You can sort by newest, oldest or name, and papers are grouped by date."},{"name":"Delete with undo","description":"Deleting a paper asks for confirmation first, and the notification that follows has an Undo button."}]},{"id":"docx-question-import","name":"Word / DOCX Question Import","tagline":"Turn a Word file into a digital question paper","description":"Upload a question paper written in Microsoft Word and the platform converts it into structured digital questions automatically — options, correct answers, explanations, tags, images and mathematical formulas included. Simple markers tell the importer where questions, options and answers begin, comprehension passages come across intact, and a diagnostics view flags anything that could not be parsed.","roles":["Admin","Teacher","Assessment Creator"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"One-click DOCX conversion","description":"Upload a .docx file and get back fully structured questions with options, answers and explanations, including multi-line question stems."},{"name":"Configurable markers","description":"Tell the importer which identifiers your paper uses for questions, options and answers so almost any format can be parsed."},{"name":"Question type auto-detection","description":"Based on the answer given, each question is classified automatically: single-choice MCQ, multiple-correct MCQ, numeric, one-word, or long-answer."},{"name":"Comprehension passages","description":"Passage-based sets with sub-questions are imported with the passage attached to every sub-question."},{"name":"Auto-marking setup","description":"Correct answers from the document become auto-evaluation rules, so imported papers are instantly auto-gradable."},{"name":"Topic tags from the document","description":"Tag lines around a question are captured as subject tags on that question, deduplicated automatically."},{"name":"Images and formulas preserved","description":"Embedded pictures, diagrams and equation images — including legacy Word formats — are converted to web-friendly formats and hosted so they render on any device."},{"name":"Diagnostics and error reporting","description":"Questions that break the expected format are flagged with a specific reason, so staff fix problems before saving instead of silently corrupting the paper."},{"name":"Preview before save","description":"Review and edit every imported question before the paper is added to the bank."},{"name":"Downloadable format templates","description":"A library of template files shows the exact document format to follow before uploading."}]},{"id":"sections-marking-schemes","name":"Sections & Marking Schemes","tagline":"Flexible sections with fine-grained marking rules","description":"Split any assessment into multiple sections, each with its own description, duration and marking rules. Marking is highly configurable — per-question marks, negative marking, partial credit, cutoff marks and question shuffling can all be set per section, with total marks calculated live as the paper is built.","roles":["Admin","Teacher","Assessment Creator"],"platforms":["Admin Web"],"subFeatures":[{"name":"Multiple sections","description":"Add, reorder, describe and delete sections; attach a different question paper or question set to each."},{"name":"Marks per question","description":"Set default marks per question for a section, then fine-tune question-by-question with adaptive marking."},{"name":"Negative marking","description":"Switch on negative marking per section and set how many marks are deducted for wrong answers."},{"name":"Partial marking","description":"Award partial credit on multi-select questions where the learner gets some options right."},{"name":"Cutoff marks","description":"Define a per-section cutoff score for pass and qualification decisions."},{"name":"Question randomization","description":"Shuffle question order per participant to deter copying."},{"name":"Section-wise duration","description":"Give each section its own time budget when duration is distributed by section or question."},{"name":"Live total-marks calculation","description":"The builder totals marks across sections in real time so the paper always adds up."}]},{"id":"participant-registration","name":"Participant Management & Open Registration","tagline":"Closed batch exams or open public tests","description":"Decide exactly who can take each assessment. Closed tests are assigned to selected batches or individual learners; open tests get a shareable public link and QR code with a custom registration form, so anyone can sign up — ideal for scholarship tests and lead-generation exams. Registration windows, form fields and participant lists are all under staff control.","roles":["Admin","Teacher","Counsellor","Learner","Parent"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"Closed tests by batch","description":"Assign the assessment to one or more batches so every enrolled learner is pre-registered."},{"name":"Closed tests by learner","description":"Hand-pick individual learners from the institute roster."},{"name":"Bulk batch registration","description":"Register whole batches to an assessment in one operation."},{"name":"Open public tests with link and QR","description":"Generate a public join link and downloadable QR code so anyone can register and take the test."},{"name":"Custom registration form","description":"Build the open-registration form with text and dropdown fields, mark fields required, and drag to reorder them."},{"name":"Registration window","description":"Set registration open and close dates independently of the exam window, plus registration instructions."},{"name":"Public assessment page","description":"Every open assessment gets a shareable page, addressed by a short code, showing the exam name, schedule and instructions where prospects self-register instantly."},{"name":"Participant status check","description":"Registrants can look up whether their registration and attempt are confirmed."},{"name":"Registered participants list","description":"View, filter and export everyone registered, including their registration source: admin pre-registration, batch, or open link."},{"name":"Expected participants","description":"Record expected participant counts for planning open tests."},{"name":"Field help text and per-form required rules","description":"Add help text under registration fields. Built-in fields such as name, email and phone can be made required or optional for each form."}]},{"id":"learner-results-report-cards","name":"Learner Results & Report Cards","tagline":"Rich post-exam reports learners can download","description":"After results release, learners get a detailed report: score breakdown, peer comparison, leaderboard position, and how the rest of the cohort answered each question. Reports download as formatted PDFs, or as AI-narrated report cards with written feedback on the attempt.","roles":["Learner","Parent"],"platforms":["Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Report list and detail","description":"Learners see all their assessment reports and open question-wise detail for any attempt."},{"name":"Peer comparison","description":"Compare personal performance against batch averages and toppers."},{"name":"Leaderboard","description":"Where enabled by the institute, learners view the assessment leaderboard."},{"name":"Option distribution","description":"See what percentage of peers picked each option on every question."},{"name":"PDF report download","description":"Download the report as a formatted PDF."},{"name":"AI report card","description":"Generate an AI-written PDF report with narrative feedback on the attempt."},{"name":"Answer sheets with results","description":"Next to their results, learners open their own scanned answer sheet, the teacher's checked copy and any attached report, each clearly labelled."},{"name":"Richer report PDF","description":"A redesigned report PDF includes the learner's own answers and the criteria used for AI marking, so feedback is easy to follow."}]},{"id":"re-evaluation-engine","name":"Re-evaluation Engine","tagline":"Regrade anything after marking-scheme changes","description":"If an answer key or marking rule changes after the exam, staff trigger re-evaluation at any granularity: the entire assessment, selected participants, or specific participants on specific questions. Every evaluation change is recorded in an audit log for accountability.","roles":["Admin","Teacher","Evaluator"],"platforms":["Admin Web"],"subFeatures":[{"name":"Full assessment re-evaluation","description":"Regrade every attempt of the assessment in one action."},{"name":"Participant-level re-evaluation","description":"Regrade only the selected learners' attempts."},{"name":"Question-wise re-evaluation","description":"Regrade chosen questions for chosen participants — ideal after an answer-key correction."},{"name":"Evaluation audit log","description":"A per-assessment log records manual evaluation and regrade events for accountability."}]},{"id":"omr-offline-entry","name":"Offline / OMR Response Entry","tagline":"Digitise pen-and-paper exam responses fast","description":"For exams conducted on paper, staff enter learner responses into the platform afterwards and get the full digital stack — grading, leaderboards and reports — as if the exam were online. Entry works question-by-question or in a fast spreadsheet-style table view.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Create offline attempts","description":"Pick a learner and create an attempt on their behalf for the offline exam."},{"name":"Question-by-question entry","description":"A question navigator with a response form for careful data entry, rendering the original rich question content."},{"name":"Table entry mode","description":"A spreadsheet-like grid to enter many responses quickly."},{"name":"One-shot create-and-submit","description":"Create the attempt and submit all responses in a single step."},{"name":"Automatic grading of entered data","description":"Entered responses are graded by the same engine, feeding results, ranks and analytics."},{"name":"Institute-level offline entry setting","description":"Turn manual marks entry for offline and paper assessments on or off across the institute."},{"name":"Answer sheet and checked-copy attachments","description":"Attach the learner's scanned answer sheet, the checked copy and an optional report PDF to each offline entry. Learners see them with their result."},{"name":"Bulk offline import","description":"Download a CSV template and a sample ZIP already filled with the batch roster. Then upload one ZIP of marks and scanned PDFs to enter results for a whole class."}]},{"id":"surveys-feedback-forms","name":"Surveys & Feedback Forms","tagline":"Collect and analyse responses like a survey pro","description":"The same builder powers unscored surveys: send questionnaires to batches or the public and analyse results in a dedicated dashboard. Staff view aggregate distributions per question, drill into individual respondents, and export the respondent list.","roles":["Admin","Teacher","Counsellor","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Public Web"],"subFeatures":[{"name":"Survey builder","description":"Create surveys with the standard question types, sections, open or closed distribution and custom registration forms — with marking hidden since surveys are unscored."},{"name":"Survey overview analytics","description":"Per-question response distributions with charts and completion metrics."},{"name":"Question-wise responses","description":"Inspect all answers to a single question across respondents."},{"name":"Respondent-wise view","description":"Open one respondent and read their entire submission."},{"name":"Respondent exports","description":"Export the respondent list as CSV or PDF."},{"name":"Survey access control","description":"Separate staff access lists for survey creation, live notifications, submissions and reports."}]},{"id":"question-paper-export-printing","name":"Question Paper Export & Printing","tagline":"Print-ready papers with your formatting rules","description":"Export any question paper or assessment as a print-ready PDF for offline exams. Layout, typography and answer-space options are configurable, and multiple paper sets can be produced for anti-cheating distribution in exam halls.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Print settings","description":"Control layout, font size and whether images keep their aspect ratio."},{"name":"Custom header fields","description":"Add custom input fields such as name and roll number, plus an optional question-set code, to the printed paper."},{"name":"Answer spacing","description":"Configure blank answer space under each question for written exams."},{"name":"Multiple paper sets","description":"Generate several sets of the same paper for anti-cheating distribution in exam halls."},{"name":"Preview and export","description":"Preview the final formatted paper on screen before downloading the PDF."}]},{"id":"exam-notifications-reminders","name":"Exam Notifications & Reminders","tagline":"Automatic alerts to learners and parents","description":"The platform notifies participants — and optionally their parents — at every stage of an assessment: when it is created, shortly before it goes live, the moment it starts, and when reports are ready. Scheduled jobs send these automatically across email, WhatsApp and push, and staff can fire manual reminders to learners who have not attempted yet.","roles":["Admin","Teacher","Learner","Parent"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Learner notifications","description":"Opt-in notifications when the assessment is created, before it goes live with a configurable lead time, when it goes live, and when the report is generated."},{"name":"Parent notifications","description":"The same notification set can be sent to parents independently of learners."},{"name":"Automated scheduling","description":"An hourly scheduler sends upcoming and started notifications without any manual work."},{"name":"Manual reminders","description":"Select pending participants who have not attempted and send them a reminder in bulk."},{"name":"Multi-channel delivery","description":"Notifications go out over email, WhatsApp and push notifications."},{"name":"Result notification recipients","description":"Configure which recipients — learner, parents, staff — are notified when results release."}]},{"id":"assessment-access-control","name":"Assessment Access Control & Collaboration","tagline":"Decide which staff can create, watch and grade","description":"Per-assessment permissions let institutes split duties across the team. Separate access lists control who can edit the assessment, who gets live-exam alerts, who can see submissions and reports, and who participates in evaluation — assigned by role or by inviting individual staff.","roles":["Admin","Teacher","Evaluator"],"platforms":["Admin Web"],"subFeatures":[{"name":"Creation access","description":"Grant specific roles or users the right to edit the assessment setup."},{"name":"Live notification access","description":"Choose who is alerted while the exam is running."},{"name":"Submission and report access","description":"Control who can open submissions and analytics for each assessment."},{"name":"Evaluation access","description":"Assign the evaluators allowed to grade answer sheets."},{"name":"Invite institute users","description":"Search existing staff by role and add them to any access list; filter and revoke invitations."},{"name":"Role-based assessment actions","description":"In Display Settings, choose for each role, including custom roles, whether staff see the create, edit and delete actions for assessments."}]},{"id":"course-embedded-assessments","name":"Assessments & Quizzes Inside Courses","tagline":"Full tests and instant quizzes in the course flow","description":"Embed a complete test from the assessment engine into any course chapter — link an existing assessment or create a new one without leaving the course editor — and review learner submissions right beside the content. Chapter quizzes give learners timers, attempt limits, instant scorecards and a full answer-review mode.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Link existing assessment","description":"Place any assessment already built in the institute as a slide in the course."},{"name":"Create assessment in place","description":"Open a create-assessment form from within the course editor and attach the new test immediately."},{"name":"Submissions panel","description":"Review learner attempts and results for the embedded assessment directly from the slide view."},{"name":"Quiz timer with warnings","description":"Countdown timer with an on-screen warning; the quiz auto-submits when time expires."},{"name":"Attempt limits","description":"Cap re-attempts per quiz; once attempts are exhausted the learner moves to review mode."},{"name":"Instant scorecard","description":"A score summary appears immediately after submission."},{"name":"Answer review mode","description":"Learners revisit each question to see their answer, the correct answer and explanations."},{"name":"Attempt history","description":"Past attempts are stored and viewable, so learners can track improvement."},{"name":"Schedule-locked assessment slides","description":"An assessment slide stays locked in the course outside its live window, and learners see when it opens."},{"name":"AI checking for paper-based chapter tests","description":"Create a paper-based test from the course. In the background, AI reads the uploaded question paper to set up questions and marks, then checks every answer sheet learners upload."}]},{"id":"assessment-organization","name":"Assessment & Homework Organization","tagline":"Every test and homework organised by status at a glance","description":"The assessments home organises everything into Live, Upcoming, Previous and Draft tabs with search, filters and per-row quick actions. A dedicated homework area gives the same status-based view for homework tests, with creation running through the standard wizard pre-set to homework mode.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Status tabs","description":"Live, Upcoming, Previous and Draft tabs keep the assessment list manageable."},{"name":"Filters and search","description":"Filter by batch, subject and other attributes; search assessments by name."},{"name":"Quick actions menu","description":"Per-assessment menu for editing, viewing details and submissions, exporting the paper, and deleting."},{"name":"Detail tabs","description":"Each assessment opens into Basic Info, Questions, Participants, Access Control and Submissions tabs, including a learner-view preview of the paper."},{"name":"Homework list with status tabs","description":"Browse homework tests split into upcoming, live and past states with per-tab counts, search and filter chips."},{"name":"Create homework via wizard","description":"Launch the multi-step assessment creation flow pre-set to homework mode, with schedule details and quick actions on every item."},{"name":"Redesigned test cards","description":"Each test is a card with coloured type, status and access badges. The tabs carry icons, and the list is ordered by exam start date."},{"name":"Share link and QR from the card","description":"Copy a test's join link, show or download its QR code, or build a campaign-tagged link from the card menu. Private tests explain how to make the link work."}]},{"id":"assessment-dashboard","name":"Assessment Dashboard","tagline":"Every test, score and checking backlog at a glance","description":"One page shows how testing is going across the institute over any date range: which tests are live now, participation, scores and how much evaluation is still waiting. Charts show when and how well learners submit, how every copy was checked, and which batches are doing well. A follow-up list names learners who skip tests or score low, and you can contact them in one click.","roles":["Admin","Teacher","Assessment Creator"],"platforms":["Admin Web"],"subFeatures":[{"name":"Date range and filters","description":"Use date presets or a custom range, and filter by batch and test type. Filters stay in the page link, and the view exports to CSV or prints to PDF."},{"name":"Live now","description":"See the scheduled tests running right now, with counts of learners who have submitted, are still writing and have not started. The panel refreshes every minute."},{"name":"KPI cards with trends","description":"See tests held, participation, submissions, average score, not attempted and evaluation backlog. Each card has a sparkline and the change from the previous period."},{"name":"Activity and score charts","description":"A daily activity trend, a participation donut, the score distribution, a weekday-by-hour submission heatmap and the mix of test types."},{"name":"Evaluation queue","description":"Lists the tests that still have copies to check, how much is left on each and which teachers are checking them."},{"name":"Copy-checking breakdown","description":"Shows how each submission was checked: by a teacher, by AI, auto-graded or entered directly. A per-teacher table gives copies checked, time per copy and the last check date."},{"name":"Batch performance and top learners","description":"Compare participation and average score across batches, track copies checked per batch, and see the learners with the highest average scores."},{"name":"Learners to follow up","description":"Lists learners who skipped several closed tests or are averaging below a set score. Reach them by WhatsApp, email or phone, or export the list to CSV."},{"name":"All-tests table","description":"Every test in the range with its participation, scores and checkers. Click a row to open that test's details."}]}],"demo":{"intro":"Build a NEET mock test in the wizard, watch the exam hall live, sit the paper as a learner, and let AI grade the answer sheets.","screens":[{"id":"create","device":"desktop","title":"Create Assessment — NEET Mock 4","nav":["Dashboard","Study Library","Learners","Assessments*","Live Classes","Reports","Settings"],"widgets":[{"type":"wizard","id":"create-wizard","steps":["Basic Info","Add Questions","Add Participants","Access Control"],"active":1},{"type":"form","id":"create-form","title":"Basic details","fields":[{"label":"Assessment type","value":"Mock test","type":"select"},{"label":"Live window","value":"20 Jul, 2:00 PM → 5:00 PM","type":"text"},{"label":"Evaluation","value":"Automatic · release results after exam ends","type":"select"},{"label":"Allow re-attempt requests","value":"on","type":"toggle"}],"submit":"Save & Continue"},{"type":"table","id":"create-questions","columns":["#","Question","Type","Marks"],"rows":[["1","Two blocks joined by a string over a frictionless pulley…",{"chip":"MCQ Single","tone":"blue"},"+4 / −1"],["2","Match each physical quantity with its SI unit",{"chip":"Match","tone":"purple"},"+4"],["3","A projectile fired at 45° covers what range (in m)?",{"chip":"Numeric","tone":"green"},"+4 / −1"],["4","Explain Kirchhoff's junction rule with one example",{"chip":"Long answer","tone":"orange"},"+5"],["5","Passage: Photoelectric effect (Q5–Q7 attached)",{"chip":"Comprehension","tone":"gray"},"+12"]]}],"module":"lms"},{"id":"monitor","device":"desktop","title":"Live Monitoring — NEET Mock 4","nav":["Dashboard","Study Library","Learners","Assessments*","Live Classes","Reports","Settings"],"widgets":[{"type":"header","id":"mon-head","title":"NEET Mock 4 — Full Syllabus","subtitle":"Live · ends 5:00 PM · 186 registered","actions":["Send Reminders","Close Submissions"]},{"type":"stats","id":"mon-stats","items":[{"label":"Attempted","value":"92"},{"label":"Ongoing","value":"61"},{"label":"Pending","value":"33"},{"label":"Extra-time requests","value":"2","delta":"awaiting approval"}]},{"type":"table","id":"mon-table","columns":["Learner","Batch","Progress","Status"],"rows":[["Ananya Iyer","NEET 2027 Batch A","180/180 · submitted 4:12 PM",{"chip":"Attempted","tone":"green"}],["Rohan Gupta","NEET 2027 Batch A","112/180 · 41 min left",{"chip":"Ongoing","tone":"blue"}],["Priya Sharma","NEET 2027 Batch B","96/180 · requested +15 min",{"chip":"Extra time","tone":"purple"}],["Aarav Mehta","NEET 2027 Batch B","Not started · +91 98201 44xxx",{"chip":"Pending","tone":"orange"}]]}],"module":"lms"},{"id":"exam","device":"phone","title":"Exam — Section A: Physics","nav":["Home","Courses","Tests*","Doubts","Profile"],"widgets":[{"type":"stats","id":"exam-timer","items":[{"label":"Time left","value":"41:26"},{"label":"Answered","value":"31/45"},{"label":"Marked","value":"3"}]},{"type":"cards","id":"exam-question","items":[{"title":"Q34 · Physics","sub":"A 2 kg block slides down a 30° frictionless incline. Find its acceleration in m/s².","chip":"Numeric · +4, −1","tone":"blue"}]},{"type":"cards","id":"exam-palette","items":[{"title":"Q32","sub":"Kinematics","chip":"Answered","tone":"green"},{"title":"Q33","sub":"Work & energy","chip":"Marked","tone":"purple"},{"title":"Q34","sub":"Laws of motion","chip":"Current","tone":"blue"},{"title":"Q35","sub":"Gravitation","chip":"Skipped","tone":"orange"}]}]},{"id":"results","device":"desktop","title":"Submissions — NEET Mock 4","nav":["Dashboard","Study Library","Learners","Assessments*","Live Classes","Reports","Settings"],"widgets":[{"type":"header","id":"res-head","title":"Results & Evaluation","subtitle":"186 attempts · 174 evaluated","actions":["Release Results","Re-evaluate"]},{"type":"stats","id":"res-stats","items":[{"label":"Average score","value":"412 / 720"},{"label":"Topper","value":"668","delta":"Ananya Iyer"},{"label":"AI-checked sheets","value":"142"},{"label":"Awaiting review","value":"12"}]},{"type":"list","id":"res-list","items":[{"title":"Ananya Iyer","sub":"668/720 · Rank 1 · feedback drafted","right":"92.8%","chip":"AI checked","tone":"green"},{"title":"Rohan Gupta","sub":"521/720 · Rank 14 · 2 marks adjusted by teacher","right":"72.4%","chip":"AI checked","tone":"green"},{"title":"Priya Sharma","sub":"Long answers graded · Q4 flagged for review","right":"—","chip":"Review marks","tone":"orange"},{"title":"Aarav Mehta","sub":"Answer sheet PDF · extracting answers","right":"—","chip":"Processing","tone":"blue"}]}],"module":"lms"}],"steps":[{"screen":"create","target":null,"title":"Five exam types, four guided steps","text":"One wizard builds Exams, Mock tests, Practice tests, Surveys and Manual-Upload exams where learners submit PDFs or videos. Everything stays in draft until you publish, so nothing goes live by accident."},{"screen":"create","target":"create-form","title":"Exam-day rules, decided upfront","text":"Set the live window, timed preview, auto- or manual submission, and whether results release automatically or on your say-so. Re-attempt and extra-time requests can be switched on for admin approval."},{"screen":"create","target":"create-questions","title":"Nine question types, or import Word","text":"Mix MCQs, numeric, match-the-following, comprehension passages, even coding questions run against test cases. Or upload a .docx paper — options, answers, images and math formulas convert automatically."},{"screen":"monitor","target":"mon-stats","title":"See the whole exam hall live","text":"While the exam runs, participants split into Attempted, Ongoing and Pending tabs with live counters, search and filters — 186 learners, one glance."},{"screen":"monitor","target":"mon-table","title":"Extend, close, remind — in bulk","text":"Approve Priya's extra-time request, force-close stragglers, remove no-shows, grant re-attempts and nudge pending learners with reminders — per learner or in bulk, without leaving this console."},{"screen":"exam","target":"exam-timer","title":"Timers that never lose an answer","text":"Countdowns run at exam, section and question level with auto-submit at expiry. Answers stream to the server continuously — a crash or dropped network loses nothing, and learners resume exactly where they were."},{"screen":"exam","target":"exam-palette","title":"A palette built for exam strategy","text":"Answered, marked and skipped questions are one tap away, and the institute controls whether learners can move between sections. Tab-switch events are recorded with the attempt for the institute to review."},{"screen":"results","target":"res-list","title":"AI grades a classroom in minutes","text":"Upload scanned answer sheets and AI reads them — handwriting and math included — applies your rubric, and awards question-wise marks with written feedback. Watch per-student status live, from processing to completed."},{"screen":"results","target":"res-stats","title":"Teachers keep the final say","text":"Every AI mark can be reviewed and overridden, with annotated PDFs anchored to the learner's actual writing. Changed the answer key? Re-evaluate the whole exam or single questions, with an audit log of every regrade."},{"screen":"results","target":"res-head","title":"Results learners actually read","text":"Release results in bulk or per learner. Each learner gets peer comparison, option-wise distributions, a leaderboard rank and a downloadable AI-narrated report card — with alerts to parents over email, WhatsApp and push."}]}},{"id":"live","name":"Live Classroom","icon":"live","color":"#E11D48","tagline":"Schedule, teach and engage live — built-in classroom or Zoom/Meet","description":"Everything an institute needs to run live teaching at scale: schedule one-time or recurring classes in minutes, host them on the built-in classroom or the platforms you already use (Zoom, Google Meet, Zoho, YouTube, custom links), and keep learners inside your branded app from waiting room to replay. Volt, the built-in live presentation studio, turns every lecture into an interactive show with polls, leaderboards, whiteboards and an AI co-pilot. Attendance, recordings and post-class feedback are captured automatically, so nothing about a class needs manual follow-up.","features":[{"id":"live-class-scheduling","name":"Live Class Scheduling","tagline":"One-time or recurring live classes, scheduled in minutes","description":"A guided two-step wizard schedules live classes across batches — one-time sessions or weekly recurring series with per-day timings, subjects, rich descriptions and cover images. Classes can be bulk-imported, saved as drafts, previewed exactly as learners will see them, and rescheduled or cancelled with automatic learner notifications.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Two-step scheduling wizard","description":"Step one sets class basics — title, subject, description, platform and timing; step two adds participants, registration options and notifications before publishing."},{"name":"One-time and weekly recurring classes","description":"Schedule a single class or a weekly repeating series with an end date; each weekday can carry multiple sessions with its own start time, duration and link."},{"name":"Per-day class configuration","description":"In recurring schedules, each day of the week can have its own class link, name, thumbnail and custom learner action button."},{"name":"Timezone-aware scheduling","description":"Every class is scheduled in an explicit timezone, so institutes with learners in multiple regions always see correct local times."},{"name":"Bulk scheduling via CSV import","description":"Upload a spreadsheet to create many classes at once, with a validation grid to review and fix rows before submitting."},{"name":"Draft classes","description":"Save partially configured classes as drafts and finish them later from a dedicated Drafts tab."},{"name":"Live / Upcoming / Past / Drafts session list","description":"One list of all classes filtered by state, with search and pagination."},{"name":"Calendar view","description":"See every scheduled class on a calendar for quick visual planning."},{"name":"Class preview","description":"Preview exactly what learners will see for a scheduled class before it goes live."},{"name":"Custom learner action button","description":"Add a fully branded button — custom text, URL and colors — to the learner's class card, such as 'Download worksheet' or 'Join WhatsApp group'."},{"name":"Cancel with learner notification","description":"Delete single occurrences or whole series and optionally notify enrolled learners automatically."},{"name":"Class cover, thumbnail and waiting-room music","description":"Attach a cover image, thumbnail and background audio track that plays in the waiting room for a polished pre-class experience."},{"name":"Search and audit trail","description":"Search across all sessions, and review each class's log of actions — created, starting, started, rescheduled — for accountability."},{"name":"Multiple instructors per class","description":"Assign one or more teachers or presenters to a class; they receive the class notification emails and appear on learners' class cards, while whoever schedules stays the default."},{"name":"Teachers in bulk scheduling","description":"The bulk scheduling grid has a searchable Teacher column, the CSV accepts teacher emails or usernames, and unmatched names are flagged per row instead of failing the import."},{"name":"Teacher on every card and one-click host start","description":"Session cards show the assigned teacher and a Start as Host button that works for the built-in classroom, Zoom, Google Meet, Zoho or an external link."},{"name":"Delete past classes","description":"Remove a single past class from the Past tab without notifying learners, available to roles you allow in display settings."},{"name":"Manage class materials","description":"Add, rename and remove the materials linked to a class from its detail page, with every change recorded in the admin activity log."},{"name":"Public classes for batches too","description":"A public class can also be assigned to batches, so enrolled learners see it in their app while outsiders register through the public link."}]},{"id":"meeting-platform-integrations","name":"Meeting Platform Integrations","tagline":"Zoom, Google Meet, Zoho, YouTube or any link — your choice","description":"Connect the video platforms your institute already uses and let Vacademy create meetings automatically. Zoom (with multiple accounts), Google Meet, Zoho Meeting, YouTube live streams and any custom meeting link are all supported, and entire recurring series are provisioned in the background with retry protection. Recordings and attendance flow back automatically via provider webhooks.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","API"],"subFeatures":[{"name":"Multi-account Zoom","description":"Connect several Zoom accounts, set a default, test each connection, and pick which account hosts each class."},{"name":"Full Zoom meeting controls from inside Vacademy","description":"Configure waiting room, join-before-host, required Zoom login, registration approval, alternative hosts, mute on entry, host and participant video, audio mode (computer, telephony or both), automatic cloud or local recording, breakout rooms, focus mode, multi-device join and identity watermark — all while scheduling."},{"name":"Google Meet integration","description":"Connect one or more Google Workspace accounts via secure Google sign-in, set a default, test the connection and auto-create Meet links for classes; disconnect access at any time."},{"name":"Zoho Meeting integration","description":"Connect Zoho via secure sign-in; meetings, attendance and recordings sync automatically on a schedule."},{"name":"YouTube live and custom links","description":"Paste a YouTube live URL or any meeting link — Teams, Webex and more — when you prefer to manage meetings yourself."},{"name":"Automatic meeting provisioning for series","description":"When a recurring class is created, meetings for every occurrence are created in the background, with a provisioning status view, a manual 'provision now' action and automatic retry."},{"name":"Host and participant links kept separate","description":"Presenter-only start URLs are stored apart from learner join URLs, so hosts always get host privileges and learners never do."},{"name":"Personalized participant join links","description":"Join links tied to each participant's real name give you accurate in-meeting rosters and attendance."},{"name":"Schedule conflict check","description":"Before scheduling, check whether a host account is already booked at the requested time — for a single slot or across a whole recurring series."},{"name":"Provider webhooks","description":"Zoom and Google Meet events such as meeting ended and recording ready flow back into Vacademy automatically, keeping recordings and attendance current."}]},{"id":"built-in-video-classroom","name":"Built-in Video Classroom","tagline":"A full virtual classroom with zero external accounts","description":"Vacademy ships its own hosted virtual classroom, so institutes can run live classes without buying Zoom or Meet licenses. Rooms are created automatically at class time with whiteboard, webcam, screen share and recording, and Vacademy manages the classroom servers behind the scenes for reliability.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"One-click rooms, no account needed","description":"Choose the built-in classroom when scheduling and the room is created automatically — no license, link pasting or setup."},{"name":"Recording controls","description":"Per-class toggles to record the session and to auto-start recording the moment class begins."},{"name":"Moderator controls","description":"Mute all participants on join, restrict webcams so only the host is on camera, and set a guest policy — always accept, ask moderator, or always deny."},{"name":"Personalized learner join","description":"Learners join with their real name and identity so the in-class roster and attendance are accurate; guests get their own supervised join flow."},{"name":"Automatic attendance from the classroom","description":"When class ends, the classroom reports who attended and for how long, and attendance is recorded automatically."},{"name":"Recordings archived to your library","description":"Classroom recordings are processed and uploaded to secure cloud storage so learners can rewatch them later."},{"name":"Managed classroom server fleet","description":"Vacademy operates a pool of classroom servers with capacity and scaling controls, so classes stay smooth even at peak hours."},{"name":"Participant restrictions","description":"Stop participants from private messaging, posting in class chat, editing shared notes or seeing the attendee list, per class or as institute defaults; the host keeps full access."},{"name":"Auto-end when the host leaves","description":"Optionally close the room automatically a few minutes after the host leaves, so classes never run on unattended."},{"name":"Host opens the room","description":"Learners who arrive before the teacher are told the class hasn't started yet, so everyone ends up in the same room the host opens."},{"name":"Classroom on your own domain","description":"Run the built-in classroom — including audio and video — on your institute's own web address, set up by the Vacademy team."}]},{"id":"volt-presentation-studio","name":"Volt — Live Presentation Studio","tagline":"Build interactive presentations with AI in minutes","description":"Volt is Vacademy's built-in presentation tool for teachers. Create decks on an infinite whiteboard-style editor, import existing PowerPoint files with layouts intact, or have AI generate a complete presentation — slides plus quiz questions — from just a topic. Every deck can then be presented live to an interactive audience.","roles":["Admin","Teacher"],"platforms":["Admin Web","Engage Client"],"subFeatures":[{"name":"Presentation library","description":"Create, search, edit, duplicate and delete presentations, each with its own title, description and cover."},{"name":"Whiteboard-style slide editor","description":"Slides are drawn on a free-form canvas — freehand drawing, shapes, text, images and diagrams — with a slide list for reordering."},{"name":"Rich slide types","description":"Title, text, blank canvas, text-plus-media, fullscreen media, web link, quiz, feedback and interactive-video slides in one deck."},{"name":"Quiz and feedback slides","description":"Embed live questions directly into the deck — single and multi-select multiple choice, true/false, one-word, numeric and long-answer formats — plus open feedback prompts."},{"name":"AI presentation generation","description":"Type a topic, pick a language and AI model, and get a complete deck of designed slides with auto-generated quiz questions, ready to edit."},{"name":"AI slide regeneration","description":"Regenerate any individual slide with AI when it needs a fresh take."},{"name":"PowerPoint import","description":"Import existing PPT and PPTX files; each slide becomes its own fully editable whiteboard scene, keeping deck order and per-slide backgrounds."},{"name":"High-fidelity slide conversion","description":"Shapes, text boxes, images, tables, connectors and grouped objects are recreated as native editable elements, with fonts, colors, alignment and positions carried over."},{"name":"Public share link","description":"Share a read-only public link so anyone can flip through a presentation without logging in."},{"name":"Session history per deck","description":"Every live run of a presentation is kept in history with its participants and results, available long after the session ends."}]},{"id":"volt-live-sessions","name":"Volt Live Sessions — Presenter Cockpit","tagline":"Present live with polls, leaderboards and an AI co-pilot","description":"Start any Volt deck as a live session and the audience joins instantly from any browser with a short code — no account or install required. Slides sync to every participant's screen in real time, responses stream into the presenter's dashboard as they arrive, and an AI co-pilot suggests slides based on what the teacher is actually saying. Sessions run reliably for hours with automatic reconnection, built for audiences of hundreds.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Engage Client","Public Web"],"subFeatures":[{"name":"Start live with a join code","description":"One click generates a short invite code; enrolled learners and guests alike join from any browser by entering the code and a name — codes auto-uppercase and Enter submits, so entry takes seconds."},{"name":"Session rules and gamification settings","description":"Per-session switches for joining mid-session, showing results on the last slide, learner hand-raise, chat, session recording, default seconds per question, attempts allowed per learner, points per correct answer and negative marking with a configurable penalty."},{"name":"Real-time slide control and sync","description":"Move forward, back or jump to any slide and every participant's screen follows instantly, with heartbeats and automatic reconnection keeping late joiners and flaky networks in step."},{"name":"Waiting room","description":"Participants who join early sit in a waiting room and are pulled in automatically the moment the presenter begins."},{"name":"Live participant roster","description":"See who is in the room in real time, with heartbeat-based presence so drop-offs are immediately visible."},{"name":"Live response views","description":"Watch answers arrive as an overlay, open a response-distribution chart per question, view text answers as a word cloud, and drill into a per-slide list of every participant's response with correctness."},{"name":"Live leaderboard with CSV export","description":"A points leaderboard updates throughout the session, can be shown to the room, and exports to CSV afterwards."},{"name":"Quick question on the fly","description":"Fire an instant poll or quiz question mid-session without leaving the presentation — AI helps prepare it in seconds."},{"name":"Insert and annotate slides mid-session","description":"Drop a new slide — including a new question — into a running session at any position, and draw over the current slide with a live annotation overlay; changes appear for all participants immediately."},{"name":"Automatic answer checking","description":"Objective answers are evaluated against the answer key the moment they arrive; open-ended answers are flagged for review."},{"name":"AI-assisted evaluation","description":"AI can help evaluate free-text responses that a simple answer key cannot judge."},{"name":"Session audio recording","description":"Record the presenter's audio with pause and resume, a live duration indicator, and download as WebM or MP3."},{"name":"AI slide recommendations from speech","description":"The AI listens to what is being taught and periodically suggests ready-made summary slides and a feedback question the presenter can insert with one click."},{"name":"Live transcript","description":"A transcript of the class audio is generated in the background and can be viewed during or after the session."},{"name":"AI summary email on finish","description":"On ending, optionally transcribe the recording, generate a session summary and email each participant a personalized report including every question and the answer they gave."},{"name":"Marathon-length sessions","description":"Sessions support hours of continuous streaming and are built for hundreds of simultaneous participants."}]},{"id":"engage-audience-response","name":"Engage — Live Polls, Quizzes & Leaderboards","tagline":"Turn passive listeners into active compet
