o Booked","sub":"by Priya Nair · yesterday 6:42 PM"},{"title":"WhatsApp: fee brochure sent","sub":"Delivered · read 8:10 PM","chip":"Read","tone":"green"},{"title":"Score updated 74 → 87","sub":"Engagement + recency · auto"},{"title":"Lead submitted via Meta Lead Ads","sub":"Campaign: NEET Early Bird · Andheri center"}]},{"type":"call","id":"ld-call","name":"Aarav Mehta (father)","number":"+91 98201 44317","status":"Connected","time":"03:41","lines":["Discussing scholarship test on Sunday","Outcome logs to timeline on hang-up"]}]}],"module":"crm"},{"id":"reports","device":"desktop","title":"Sales Reports","nav":["Dashboard","Leads","Campaigns","Counsellors","Admissions","Reports*","Settings"],"widgets":[{"type":"header","id":"rp-head","title":"Sales Funnel — July","subtitle":"All campaigns · IST reporting timezone"},{"cols":[{"type":"funnel","id":"rp-funnel","stages":[{"label":"Leads captured","value":1248},{"label":"Contacted","value":934},{"label":"Demo booked","value":402},{"label":"Negotiation","value":187},{"label":"Enrolled","value":118}]},{"type":"list","id":"rp-leaderboard","items":[{"title":"Priya Nair","sub":"31 conversions · target 30","right":"4.7 ★","chip":"103%","tone":"green"},{"title":"Rohan Gupta","sub":"24 conversions · target 30","right":"4.3 ★","chip":"80%","tone":"blue"},{"title":"Meera Joshi","sub":"19 conversions · target 25","right":"4.1 ★","chip":"76%","tone":"blue"},{"title":"Arjun Singh","sub":"11 conversions · target 25","right":"3.6 ★","chip":"44%","tone":"orange"}]}]}],"module":"crm"}],"steps":[{"screen":"inbox","target":null,"title":"Every enquiry lands in one inbox","text":"Meta Lead Ads, Google Lead Forms, website forms, walk-ins and CSV imports all feed one deduplicated pipeline — matched by phone or email so the same person never becomes two leads."},{"screen":"inbox","target":"in-stats","title":"SLA clocks keep leads warm","text":"Set first-contact and follow-up deadlines in hours. One click filters every lead that's due or missed, and reminders go to the right roles before the clock runs out."},{"screen":"inbox","target":"in-table","title":"Scored, staged and owned","text":"Each lead carries a live 0–100 score from source quality, completeness, recency and engagement. Change stage, tag hot/warm/cold, add a note or place a call — right from the row."},{"screen":"workbench","target":"wb-kanban","title":"Your funnel, your stages","text":"Define your own pipeline stages and move leads through them one by one or in bulk. New leads route themselves via counsellor pools — round-robin, by shift roster, or to the best converter."},{"screen":"workbench","target":"wb-followups","title":"Today's call list, ready at login","text":"Follow-ups bucket into Pending, Today and Upcoming, with a month calendar view. Close one with an outcome note and schedule the next touch in the same step."},{"screen":"lead-detail","target":"ld-timeline","title":"The complete story of every prospect","text":"One timeline mixes automatic events — stage changes, score updates, bookings, payments — with notes and call logs. Pin the note the next counsellor must read first."},{"screen":"lead-detail","target":"ld-call","title":"Call without leaving the lead","text":"Click-to-call or send an AI agent call from the lead itself; every email, WhatsApp, SMS and push also lands on the contact's communication timeline with delivery status."},{"screen":"reports","target":"rp-funnel","title":"See exactly where leads drop off","text":"Every stage change is time-stamped, so the funnel is built from real history — not guesses. Conversion and lost outcomes are tracked separately from the working stage."},{"screen":"reports","target":"rp-leaderboard","title":"Targets and ratings, computed live","text":"Set weekly or monthly targets per counsellor — conversions, leads or calls — measured from actual activity. Ratings blend conversion ratio and speed, ranked on a team leaderboard."}]}},{"id":"marketing","name":"Marketing & Website","icon":"mkt","color":"#DB2777","tagline":"Websites, campaigns, coupons and referrals that fill your funnel","description":"Everything an institute needs to attract, capture and convert learners — without hiring a web agency or stitching together five tools. Build a branded website and course storefront with a drag-and-drop editor, run sales pages with built-in checkout, pull ad leads straight from Meta and Google, and grow through email campaigns, coupons, referrals and shareable branded links. Every touchpoint runs on your own domain and feeds directly into your CRM.","features":[{"id":"website-builder","name":"Website & Course Catalogue Builder","tagline":"Build your institute's website with drag-and-drop, no developer needed","description":"An Elementor-style visual builder for creating your institute's public website and course catalogue. Assemble multi-page sites from a library of 40+ ready-made sections, watch a pixel-accurate live preview as you edit, and publish when ready. Every site is drafted, versioned and role-permissioned, so your team can work safely before anything goes live.","roles":["Admin"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"Multiple websites per institute","description":"Create and manage several independent sites, each with its own name and Active/Draft/Archived status — for example a main site plus campaign microsites."},{"name":"Multi-page sites with clean URLs","description":"Add unlimited pages such as /about, /pricing and /policy, each with its own auto-sanitized URL slug, page title and publish toggle. Rename, duplicate, reorder or delete pages at any time."},{"name":"Drag-and-drop canvas with live preview","description":"Arrange sections on a canvas while a real, pixel-accurate preview of the live site renders alongside; clicking a section highlights it in the preview."},{"name":"Desktop, tablet and mobile preview","description":"Switch the preview between desktop, tablet and mobile widths to check responsiveness before publishing."},{"name":"40+ ready-made section widgets","description":"Header with navigation and CTA, hero, course catalogue grid, footer, media showcase, stats, testimonials, FAQ accordion, video embed, CTA banner, pricing table, contact form, team, announcement feed, image gallery, tabs, logo cloud, trust chips, map embed, countdown timer, feature grid, newsletter signup, steps, scrolling marquee, custom HTML block and more."},{"name":"Bookstore widgets","description":"Dedicated book catalogue, book details, cart and buy/rent sections plus a policy renderer — enough to run a small book store on the same site."},{"name":"Multi-column layout containers","description":"2, 3 and 4 column layouts (including asymmetric splits) that nest other widgets inside, with adjustable gaps, vertical alignment and automatic stacking on mobile."},{"name":"Section layout variants","description":"Each widget ships multiple style presets — switch a hero from Split to Centered to Full-Width, or a catalogue from grid to list, without losing content."},{"name":"Page and section templates","description":"Start from full page templates (Landing Page, Course Landing, About Page, Book Store) or drop in pre-built section combos like Social Proof or Course Showcase."},{"name":"Live course catalogue section","description":"The catalogue widget pulls your real courses automatically, with configurable filters, card fields, grid or list layout and hover effects — no manual updates when courses change."},{"name":"Per-page SEO settings","description":"Set meta title, meta description and a social-share (Open Graph) image on every page so it looks right in search results and link previews."},{"name":"Rich text, images and link picker","description":"Edit copy with a rich-text editor, upload images directly into any section, and pick link targets — pages, external URLs or in-page anchors — from a link picker."},{"name":"Anchor links and conditional visibility","description":"Give any section an anchor ID so navigation buttons smooth-scroll to it, and enable, disable or conditionally show any section."},{"name":"Undo/redo and layers panel","description":"Full edit history with keyboard shortcuts, plus a structural tree of every section on the page for quick selection and reordering."},{"name":"Draft-to-publish workflow","description":"Save work as a draft visitors never see, then publish the exact version live in one click; discard a draft to fall back to the published site."},{"name":"Version history and one-click restore","description":"Browse every saved draft and published revision, restore any old version into the editor, and re-publish it."},{"name":"Role-based editing permissions","description":"Read, write, delete and publish rights are gated by role — admins can publish and delete while other staff are limited to editing."},{"name":"Sticky header and back-to-top","description":"Optional site-wide sticky navigation header and a floating back-to-top button."},{"name":"Live website view","description":"Edit while the canvas shows your real site — including unsaved changes — at true desktop, tablet and mobile sizes, and click any block to select it."},{"name":"HTML pages","description":"Add a page by pasting HTML, point its buttons at site pages, forms, enrolment links or URLs without touching code, and optionally hide the site header and footer."},{"name":"Show-on rules","description":"Show any section only on certain URLs, so one page can serve several audiences or campaigns."},{"name":"PDF reader block","description":"Let visitors read a PDF inline or in a full-screen reader with zoom and download."},{"name":"Protected video player","description":"Uploaded videos play with simple play and pause controls and no download menu, and the hero can hold a video too."},{"name":"Program detail blocks","description":"Spec-table blocks for programme and course directories, plus photo cards and swipeable rows for feature grids."},{"name":"Header controls","description":"Hide individual header links, add a site search box, and choose filled, outlined or text styles for each header button."},{"name":"Mobile action bar","description":"A bottom bar on phones mirrors your header buttons, including ones that open a lead form."},{"name":"Media library","description":"Pick from images you have already uploaded and reuse them across pages instead of uploading them again."},{"name":"Autosave and pre-publish checks","description":"Work saves automatically every 45 seconds, and a checklist flags issues before you publish without blocking you."},{"name":"Traffic insights","description":"See page views, unique visitors, top pages and top sources for the last 7, 30 or 90 days right inside the editor."},{"name":"Search-engine ready","description":"Published sites ship canonical URLs, structured data, robots rules and an automatic sitemap, with keywords and search-console verification set in SEO settings."},{"name":"Edit from your AI assistant","description":"Connect an external AI assistant to read your sites and draft page changes, which stay as drafts until you publish them in the builder."}]},{"id":"institute-blog","name":"Institute Blog","tagline":"Publish articles that bring learners to you","description":"Write and publish blog posts right inside the website builder and show them on your site with a ready-made blog section. Every article gets its own search-friendly page and is listed in your sitemap automatically, helping your institute rank for the topics your learners search. Posts can also be drafted from a connected AI assistant for review before publishing.","roles":["Admin"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"Post editor in the builder","description":"Create, edit and publish posts from a Blog button on the sites list and in the editor toolbar."},{"name":"Blog section","description":"Add a blog block to any page to list your latest articles in the site's own design."},{"name":"Article pages with SEO","description":"Each post gets its own page with search and social-sharing tags, included in the site's sitemap."},{"name":"AI assistant drafts","description":"A connected AI assistant can draft posts for you, which stay unpublished until you review them."}]},{"id":"design-studio","name":"Website Themes & Design Studio","tagline":"Agency-grade design: themes, fonts, gradients and animation","description":"Deep design controls make institute sites look professionally designed rather than templated. Pick from named color themes or set your own brand color, choose typography pairings from a curated font library, and layer in modern effects like glassmorphism, gradients and scroll-in animations — all without touching code.","roles":["Admin"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"9 color themes plus custom brand color","description":"Default, Ocean, Forest, Sunset, Midnight, Rose, Violet, Amber and Slate presets, or override with any custom primary color — with light and dark site modes."},{"name":"Curated Google Fonts library","description":"17 hand-picked typefaces with separate body and heading fonts, so you can pair a display serif over a clean sans."},{"name":"Typography scale controls","description":"Heading size scale (compact to display), body font-size override, and site-wide compactness settings."},{"name":"Corner style","description":"Sharp, rounded or pill corner radius applied consistently across the whole site."},{"name":"Page atmosphere backgrounds","description":"Whole-page canvas treatments — flat, soft, mesh or aurora — with adjustable intensity for a premium, non-flat look."},{"name":"Layered backgrounds and gradients","description":"Per-section background stacks: linear and radial gradients, solid layers, and background images with legibility overlays."},{"name":"Glassmorphism, glow and gradient borders","description":"Frosted-glass panels, soft brand-colored glow shadows, and gradient border effects on any section."},{"name":"Entrance animations","description":"Scroll-in animations per section with cascading stagger across child items, and a site-wide motion personality that scales all animation from calm to dynamic."},{"name":"Decorative ornaments","description":"Placeable background ornaments — blobs, rings, dot fields, grids and glow orbs — positioned freely behind content."},{"name":"Section shape dividers","description":"Wave, angle and curve dividers on the top or bottom edge of any section for smooth transitions between blocks."},{"name":"Section width presets","description":"Content-column width presets per section, including full-bleed, with custom max-width override."},{"name":"What you design is what visitors see","description":"The editor and the live site share one style engine, so the published page matches the design exactly."},{"name":"Audience mode","description":"Tune the site's presentation for children, adults or all audiences."}]},{"id":"multi-language-websites","name":"Multi-Language Websites","tagline":"One website, every language your learners speak","description":"Publish your institute website in several languages — for example English and Hindi — from a single site. Visitors switch language from the header and every page, link and search-engine tag follows their choice. Admins edit content directly in each language, see what still needs translating, and can fill the gaps with AI in one click.","roles":["Admin"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"Site languages","description":"Enable the languages your site offers in global settings; sites without extra languages behave exactly as before."},{"name":"Visitor language switch","description":"A language switch in the header lets visitors flip the whole site, and their choice carries across every page and link."},{"name":"Edit in any language","description":"An editing-language toggle in the builder lets you write each section's text directly in each offered language."},{"name":"Translations panel","description":"See every piece of site text — page titles, sections, course words, filters and checkout lines — with what is still untranslated."},{"name":"AI fill-in translation","description":"Translate everything missing with AI in one click, using AI credits; brand names, links and data are left untouched."},{"name":"Multilingual SEO","description":"Search engines receive language-aware tags and translated page titles and descriptions for each language version."},{"name":"Course language versions","description":"Show the English and Hindi versions of a course as one card with language chips, so visitors pick the version they want."}]},{"id":"sales-pages","name":"Sales & Product Pages with Checkout","tagline":"Landing pages that sell courses and take payment","description":"Purpose-built sales pages: pick the courses and payment plans to sell, design the page with the same visual builder, attach coupons and custom form fields, and share a short branded link. Every detail of the funnel — starting step, terms acceptance, invoices, upsells and redirects — is configurable per page.","roles":["Admin","Counsellor"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"Course and plan bundling","description":"Map any combination of courses and payment plans onto one page, mark items preselected, and control display order."},{"name":"Visual page design","description":"Design the sales page with the full widget library — header, hero, product course grid, footer and any other section — in a dedicated design tab."},{"name":"Page-specific coupon codes","description":"Create coupons scoped to the page with percentage or fixed discounts and an optional cap, and toggle whether the coupon box shows at checkout."},{"name":"Custom checkout fields","description":"Add or remove custom fields collected from buyers during checkout on that page."},{"name":"Funnel start step","description":"Choose whether visitors land on the catalog, the cart, or straight on payment."},{"name":"'People also buy' upsells","description":"Configure suggested-course cross-sells per offering, with a custom heading, shown on the cart, the checkout form, or both."},{"name":"Terms and conditions gate","description":"Require acceptance of inline terms or an external terms URL before purchase."},{"name":"Automatic invoices","description":"Send purchase invoices automatically by email and/or WhatsApp."},{"name":"Branded short link","description":"Every page gets an auto-generated short URL on your own domain, with one-click copy for sharing."},{"name":"Post-purchase behaviour","description":"Custom success-page content, an after-payment redirect URL, an optional login button, back-navigation control during checkout, and allow/disallow deselecting bundled courses."},{"name":"Draft status and buyer preview","description":"Keep pages in draft, preview them exactly as buyers will see them, and activate when ready."},{"name":"Basket pricing","description":"Price a basket as a whole — like 'any 3 for ₹799', a fixed price for a full class pack, or an extra-course price — instead of adding up individual course prices."},{"name":"Basket discounts","description":"Give automatic discounts by how many courses are picked or by basket value, with an optional cap, and show the savings on the course list and in the cart."},{"name":"Automatic offers","description":"Set code-free rules such as '₹99 off above ₹500'; the best applicable offer is applied automatically and offers never stack."},{"name":"Minimum-basket coupons","description":"Make a page coupon valid only when the buyer has enough courses in the cart."},{"name":"Course Finder","description":"Ask visitors which class or grade they are in first, then show only the matching courses — optionally skipping the cart and going straight to the form."},{"name":"View course from the offer","description":"Course cards on a sales page can open the full course page and bring the visitor back to checkout, with filters for long course lists."},{"name":"Itemised success screen","description":"The confirmation screen names every course the buyer just enrolled in, so there is no doubt about what was purchased."},{"name":"Site-wide cart and store page","description":"Add a cart to your website header so visitors collect courses from any page and check out once through a chosen store page."},{"name":"One-click catalogue sync","description":"Fill a store page with every course your public catalogue sells, at catalogue prices, with a plain-language report of what was added, skipped or switched off."},{"name":"Multi-currency checkout","description":"Each course is charged in its own currency, free courses can sit beside paid ones, and mixed-currency carts are asked to check out separately."}]},{"id":"lead-connectors","name":"Lead Ads & Form Connectors","tagline":"Every ad and form lead lands in your CRM automatically","description":"Connect Facebook/Instagram Lead Ads, Google lead forms and third-party form tools so every lead flows straight into your campaigns and audience lists — no CSV exports. A guided Meta sign-in picks the page and form, field mapping shapes each lead to your custom fields, and health monitoring plus backup polling keep leads arriving even when an ad platform hiccups.","roles":["Admin","Counsellor"],"platforms":["Admin Web","Public Web","API"],"subFeatures":[{"name":"Guided Meta connection","description":"One-click sign-in with Meta that lists the Pages you manage, warns when your account lacks full control of a Page, and returns you to your own white-label admin domain. Add several connectors in one session without repeating sign-in."},{"name":"Lead form and field mapping","description":"Browse each Page's lead forms, see their exact fields, and map every ad-form field to your campaign's custom fields — with auto-matching by name and unmapped fields kept under their original names."},{"name":"Real-time lead delivery","description":"Once connected, new leads from Meta ads land in your lead list within seconds via push delivery."},{"name":"Backup polling and manual sync","description":"A scheduled poller keeps re-fetching leads even if Meta's push delivery breaks, and a 'Sync leads now' button pulls the last 24 hours on demand — so nothing is lost."},{"name":"Connector health monitoring","description":"Per-connector health checks with diagnostics, last-lead-received time, automatic token refresh and a one-click re-subscribe fix — broken connectors surface honestly instead of silently dropping leads."},{"name":"Google Lead Form connector","description":"Generate a webhook URL and unique key to paste into Google Ads lead form extensions — no sign-in needed — routing submissions into a chosen campaign."},{"name":"Third-party form webhooks","description":"Receive submissions from Zoho Forms, Google Forms, Microsoft Forms or any generic webhook, with field mapping into your campaign's custom fields."},{"name":"Public campaign response forms","description":"Each marketing campaign gets a shareable public form — branded with your logo and colors, built from your own custom fields with validation — that captures respondents as leads with no login required."},{"name":"Routing and per-connector defaults","description":"Choose which audience list or campaign each connector feeds, and attach default values (like a branch or center name) so every lead is auto-tagged at capture."},{"name":"Connector lifecycle management","description":"List all active connectors with Meta/Google platform badges, edit, deactivate and copy webhook URLs from one place."},{"name":"Source tracking and deduplication","description":"Every lead is stamped with its source — website, Google Ads, Meta ads, manual entry and more — and repeat submissions from the same person are merged into the existing lead with the merge recorded on its timeline."},{"name":"Website enquiry capture","description":"Enquiries submitted from your public course catalogue pages are captured as leads automatically."},{"name":"Encrypted credential storage","description":"All connected-account tokens are encrypted at rest and never leave the server."},{"name":"Google Lead Form setup and status","description":"A guided setup dialog shows the webhook URL and key, the steps to follow in Google Ads, and live confirmation when Google's test data or a real lead arrives."},{"name":"Google Ads campaign attribution","description":"Leads from Google lead forms carry their Google campaign, ad group and click details, while Google's test submissions are acknowledged but never saved as leads."}]},{"id":"email-campaigns","name":"Email Campaigns","tagline":"Design, target, schedule and send email blasts","description":"A dedicated email campaigning workspace for marketing and engagement emails. Start from a designed template or write your own, target precise audiences — including lead lists captured from your campaigns, not just enrolled users — and send now or on a schedule. Big blasts are rate-controlled automatically, and scheduled campaigns stay editable until they go out.","roles":["Admin","Counsellor"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Campaign composer","description":"Separate internal campaign name and customer-facing subject line, rich-text or raw-HTML body, and hidden inbox preview text that appears next to the subject in recipients' inboxes."},{"name":"Template re-use","description":"Start a campaign from any saved email template — its subject auto-fills and stays editable — instead of designing from scratch."},{"name":"From-address and email classification","description":"Choose which configured sender address and display name the campaign goes out from; emails are classified as marketing, transactional or notification, each with its own deliverability treatment."},{"name":"Audience targeting with estimates","description":"Target by role, specific users, batches, tags, custom fields or captured lead lists, and see estimated recipient counts before sending."},{"name":"Exclusions","description":"Exclude specific people, batches or tags from any audience selection."},{"name":"Send now or schedule","description":"Immediate, one-time or recurring sends with timezone selection and quick picks like 'in 1 hour', 'tomorrow 9 AM' or 'next Monday 9 AM'."},{"name":"Review step and device preview","description":"A final review summarizes audience, schedule and content before confirming, with the rendered email previewable at mobile, tablet and laptop widths."},{"name":"Edit, reschedule and resend","description":"Open any not-yet-sent campaign back in the editor and change anything until its start time passes, or reopen a past campaign to adapt and send again."},{"name":"Bulk sending with rate control","description":"Large sends are processed as background batches with a configurable send rate, so big blasts don't trip provider limits."},{"name":"Attachments","description":"Emails can carry file attachments, including automatically generated documents like invoices."},{"name":"Daily send caps and warm-up","description":"Cap how many emails each sender address sends per day — with a warm-up schedule that raises the cap gradually — and overflow is queued for the next sending window automatically."},{"name":"Guided campaign editor","description":"A sectioned editor walks through details, content, audience and delivery with a live email preview, a campaign summary and inline error checks before sending."}]},{"id":"email-template-designer","name":"Drag-and-Drop Template Designer","tagline":"Build branded message templates without touching code","description":"A visual, block-based designer for creating reusable message templates. Drag in text, images, buttons and layout sections, insert personalisation variables from a picker, and save templates that then power announcements, campaigns and automated notifications.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Visual block editor","description":"Compose emails from drag-and-drop blocks — headings, text, images, buttons and sections — on a canvas with a formatting toolbar."},{"name":"Personalisation variables","description":"Insert merge fields like learner name or payment link from a picker; they're filled automatically per recipient at send time."},{"name":"Image uploads","description":"Upload and embed images directly inside the template editor."},{"name":"Template library with editing","description":"Create new templates and reopen any saved template later to edit it."},{"name":"Multi-channel template store","description":"The template library supports Email, WhatsApp, SMS and Push template types, each with its own variable list."}]},{"id":"course-catalog-discovery","name":"Course Catalog & Discovery","tagline":"A branded storefront where learners browse and enroll","description":"A public course storefront where learners and anonymous visitors browse, search and filter your catalog and open rich course detail pages before enrolling. Build any number of curated catalogues — including tag-based collections that stay current automatically — edit them safely as drafts with full revision history, and serve everything on your own custom domain.","roles":["Admin","Learner","Parent"],"platforms":["Admin Web","Public Web","Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Public course catalog","description":"A browsable storefront of published courses with hero section, course cards, instructor call-to-action and supporter sections."},{"name":"Search, sort and filters","description":"Full-text course search with sorting, a filter panel (level, session, tags, price and more) and pagination."},{"name":"Multiple and tag-based catalogues","description":"Create any number of catalogues including a default one, plus shareable tag-scoped pages (like /jee or /neet) so campaigns can point buyers at a curated list that updates itself."},{"name":"Draft, publish and revision history","description":"Edit catalogues safely in a draft, publish atomically, discard drafts, and browse or restore from full revision history."},{"name":"Rich course detail pages","description":"Banner media, description, what-you-learn sections, the full curriculum structure — subjects, modules, chapters and slide counts — plus instructor info and stats, all viewable before enrolling."},{"name":"Ratings and reviews","description":"Average rating, rating distribution and learner reviews shown on the course page; enrolled learners can submit their own."},{"name":"Course leaderboard preview","description":"Course pages can showcase the batch leaderboard to build competitive excitement."},{"name":"Live seat availability","description":"Batch listings can reflect real-time seat availability from the seat inventory system."},{"name":"White-label catalog on your domain","description":"Domain-aware routing serves the catalog under the institute's own web domain with the institute's logo, colors and terminology."},{"name":"App-store compliant purchasing","description":"On iOS the app automatically adjusts paid-purchase UI where required, keeping the mobile app store-compliant."},{"name":"Stream tabs and badges","description":"The courses page can show stream tabs, live filter counts, quick filters and Bestseller, Popular, New or Free badges, with a Popular sort."},{"name":"Course showcase strip","description":"Feature newest, on-sale, tagged, hand-picked or coming-soon courses in a short strip, with optional ribbons like 'Hot' per course."},{"name":"Course finder wizard","description":"Guide visitors step by step through level, session and tag to the right course."},{"name":"Choose what 'View course' opens","description":"Per course, open the standard course page, a page you designed, an outline view or subject tiles."},{"name":"Default catalogue sort","description":"Choose how the course grid is sorted when visitors first arrive — for example newest, popular or by name."},{"name":"Sell a product page from your site","description":"A Product Page Offer section sells a sales page's courses directly from your marketing website."}]},{"id":"folder-libraries-learning-paths","name":"Folder Libraries & Learning Paths","tagline":"Organise big catalogues into browsable streams","description":"Arrange a large course offering into shared folder trees — such as Stream, Class and Subject — with sales pages at the end of each branch, and reuse the same library on any website. Visitors drill down one level at a time, add courses to their cart along the way, and can follow guided learning paths. Folder edits go live immediately, so the catalogue always reflects what you sell.","roles":["Admin"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"Shared folder libraries","description":"Build folder trees once — for example Class, then Subject — with product pages as the final level, and use them across all your sites."},{"name":"Folder Browser section","description":"Drop a browser onto any page so visitors explore the library one level at a time and add courses to the cart inline."},{"name":"Streams mega menu","description":"Turn a header link into a mega menu of your streams, built automatically from a folder library."},{"name":"Folder styling and coming soon","description":"Give each folder a link key and accent colour, mark it coming soon, and attach a 'notify me' lead campaign to collect interest."},{"name":"Learning Path section","description":"Show a step-by-step learning path, or a list of paths, fed live from your product pages and folders."},{"name":"Live edits","description":"Changes to folders appear on the live site immediately, with no separate publish step."}]},{"id":"discount-coupons","name":"Discount Coupons","tagline":"Targeted promo codes with limits, scopes and expiry","description":"Create promotional codes that apply percentage or flat discounts at checkout. Control exactly who can use each code, on which courses, how many times and for how long — and the code is validated live on the public checkout before payment.","roles":["Admin","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Public Web"],"subFeatures":[{"name":"Percentage or flat discounts","description":"Each coupon applies either a percentage (with an optional maximum discount cap) or a fixed amount in a chosen currency."},{"name":"Redemption window","description":"Set a start and end date; codes outside the window are rejected automatically."},{"name":"Usage limits","description":"Cap total redemptions per code or leave it unlimited."},{"name":"Email-restricted coupons","description":"Restrict a code to a specific list of email addresses for private offers."},{"name":"Course and batch scoping","description":"Limit a coupon to specific batches or enrollment invites so it only works where intended."},{"name":"Live validation at checkout","description":"The public checkout verifies the code instantly and shows the exact discounted amount before the learner pays."},{"name":"Coupon lifecycle management","description":"Create, edit, activate, deactivate and delete coupons; every applied discount is recorded against the payment for auditing."},{"name":"System-issued codes","description":"Coupons can also originate from registration flows, product pages or referral programs, not just manual creation."}]},{"id":"referral-programs","name":"Referral Programs","tagline":"Turn learners into your best acquisition channel","description":"Run configurable refer-a-friend programs where both the referrer and the new learner earn rewards. Choose from five benefit types, stack them into reward tiers, protect payouts with vesting, and deliver bonus content automatically by email or WhatsApp when a referral converts. Learners share and track everything from a referral screen in their app.","roles":["Admin","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Five reward types","description":"Percentage discount, flat discount, bonus content (a file or link), free membership days, and reward points — configurable separately for the referrer and the referee."},{"name":"Reward tiers and thresholds","description":"Create tiered programs — for example bigger rewards after 5 referrals — with per-tier benefits, qualification rules, and points-per-referral thresholds."},{"name":"Vesting period","description":"Referrer rewards can vest only after a set number of days, protecting against refunds and fake signups."},{"name":"Offer stacking control","description":"Decide whether referral benefits can combine with other discounts or must apply alone."},{"name":"Automated reward delivery","description":"Bonus content and benefits are delivered automatically via email or WhatsApp using selectable message templates."},{"name":"Learner referral page","description":"Learners get an in-app screen with their copyable referral code and invite links, a table of who joined through them, and their earned rewards and points."},{"name":"Program templates and default","description":"Start from ready-made program templates, run multiple programs at once, and mark one as the institute default."},{"name":"Referral tracking and logs","description":"Every referral mapping and benefit payout is logged with status, beneficiary and timestamps; admins can query points balances per learner."}]},{"id":"branded-short-links","name":"Branded Short Links","tagline":"Short, trackable links on your own domain","description":"The platform automatically mints short, human-readable links for everything you share — sales pages, enrollment invites, learner invitations, coupons and notification links — and serves them from your own custom domain. Destinations can be updated later, so links people already have never break.","roles":["Admin","Counsellor","Learner"],"platforms":["Admin Web","Public Web","Learner Web","API"],"subFeatures":[{"name":"Automatic short links everywhere","description":"Sales pages, enrollment invites, learner invitations and coupon share links all get compact short codes automatically."},{"name":"Readable link slugs","description":"Short codes are generated from the content's name (like 'compiler-design') rather than random characters, with automatic suffixes when a name is taken."},{"name":"Your domain, not ours","description":"Short links resolve on the institute's own registered domain, keeping every shared URL on-brand."},{"name":"Self-healing destinations","description":"When the underlying page or invite changes, the short link updates in place — shared links never break, and deleted items clean up their links."},{"name":"One link per item, forever","description":"Requesting a link for the same course or invite always returns the same short URL — no duplicate links floating around."},{"name":"Instant redirect with info lookup","description":"Visiting a short link redirects immediately; an info mode also lets apps look up where a link points without redirecting."},{"name":"Usage logging and deactivation","description":"Each link records when it was last opened, and links can be deactivated so they stop resolving."},{"name":"Short links in messages","description":"Outbound notifications embed the short form of long deep links for cleaner SMS, WhatsApp and email content."}]},{"id":"youtube-publishing","name":"YouTube Channel Publishing","tagline":"Class recordings upload themselves to your YouTube channel","description":"Connect the institute's YouTube channel once and publish platform videos to it — including automatic publishing of live-class recordings. Set institute-wide upload defaults, trigger manual uploads, retry failures with one click, and audit the full upload history.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"One-time channel connection","description":"Securely connect the institute's YouTube account with clear status states (connected, needs reconnect, not connected) and check health anytime; disconnecting is admin-only."},{"name":"Upload defaults","description":"Set default privacy (Public, Unlisted, Private), category, license, language, tags and an optional default playlist applied to every upload."},{"name":"Automatic recording publishing","description":"Class recordings can be published to the channel automatically, with each upload traceable back to the live-class schedule it came from."},{"name":"Manual upload and retry","description":"Trigger an upload on demand and retry any failed job with one click."},{"name":"Upload history","description":"Track every video through Uploading, Uploaded, Failed or Cancelled states in a full history view."}]},{"id":"public-webinars","name":"Public Webinars & Guest Registration","tagline":"Run open demo classes that capture every registrant","description":"Make any live class public and share it as a registration link — perfect for demo classes, webinars and open houses. Visitors register through a custom form with their email or phone number, optionally confirm a one-time code, and join as guests without creating an account, while the institute captures every registrant as a lead for follow-up.","roles":["Admin","Counsellor","Learner"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"Public or private access per class","description":"Mark a class private (enrolled batches only) or public, where anyone with the registration link can sign up."},{"name":"Custom registration forms","description":"Build the registration form from many field types — text, dropdown, number, email, URL, phone, date, long text, checkbox, radio and file upload — each optional or required."},{"name":"Email verification and duplicate check","description":"Registrants verify their email, and the system detects when an email is already registered for the session."},{"name":"Branded registration page with countdown","description":"The public page shows class details, institute branding, session status and a live countdown to start time."},{"name":"Guest join without an account","description":"Registered guests join through their own guest flow — including the built-in classroom, waiting room and in-page viewing — with attendance recorded separately."},{"name":"Registrant data for follow-up","description":"Admins can view all registration responses per session — a ready-made lead list for counsellors to work."}]},{"id":"demo-onboarding-links","name":"Public Onboarding & Instant Demo Workspaces","tagline":"Prospects go from a link to a live demo in minutes","description":"Shareable onboarding links let prospects answer a short qualification form — or skip it entirely — and drop straight into a live demo workspace matched to their organization type: school, distance learning, corporate or university. Every submission lands in a sales pipeline with instant alerts to your team.","roles":["Admin"],"platforms":["Public Web","Admin Web"],"subFeatures":[{"name":"Three link styles","description":"General links ask the full question set, custom links show hand-picked questions with prefilled answers, and direct-demo links skip questions entirely and go straight to the demo."},{"name":"Question form builder","description":"Links are assembled from a question catalogue supporting text, email, phone, long text, URL, single-select, multi-select, yes/no and even brand-color picker fields."},{"name":"Demos matched to institute type","description":"Four seeded demo environments — School, Distance Learning, Corporate and University — so every prospect sees a workspace that looks like their world."},{"name":"Instant demo handoff","description":"On submitting, the prospect is handed demo credentials and taken into the product immediately."},{"name":"Submission pipeline","description":"Submissions move through New, Viewed, Contacted, Won and Lost, with per-stage counts and filters by institute type."},{"name":"Instant team alerts","description":"A managed recipient list gets an email the moment a new prospect submits, so follow-up starts immediately."},{"name":"Link and demo management","description":"Create, edit and retire links with unique slugs, and update the demo accounts behind each institute type centrally without breaking existing links."}]},{"id":"conversion-tracking","name":"Conversion Tracking (GTM & UTM)","tagline":"Measure ad ROI end-to-end without engineering help","description":"Wire your own analytics and ad pixels into every enrollment touchpoint. Add a Google Tag Manager container institute-wide or per sales page so GA4, Meta Pixel and remarketing tags fire on your pages, and generate UTM-tagged share links straight from the editor for clean campaign attribution.","roles":["Admin","Counsellor"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"GTM container per institute","description":"Paste a Container ID once and every tag you manage in GTM — GA4, Meta Pixel, remarketing — goes live on your platform pages."},{"name":"GTM per sales page","description":"Attach a separate GTM container to an individual sales page for campaign-specific conversion tracking."},{"name":"UTM tracking link generator","description":"Generate share links with utm_source, medium, campaign, term and content baked in, straight from the page editor toolbar."},{"name":"Campaign link builder everywhere","description":"Once Campaign Links are switched on, build UTM-tagged links from the share menu of invite links, sales pages, catalogues, lead campaigns, assessments and live classes."},{"name":"Per-learner campaign source","description":"The first campaign a visitor arrived from is remembered and attached to them when they enrol or submit a form, shown as a Campaign source card on their profile."},{"name":"Curated sources and mediums","description":"Define your standard UTM sources and mediums in settings so every team member tags links the same way."},{"name":"Pixel and analytics IDs","description":"Paste a GA4, Meta Pixel or GTM ID in website settings and tracking runs on every page of that site."}]},{"id":"shareable-media-links","name":"Shareable Media Links","tagline":"Send a video or file as a simple expiring link","description":"Share individual videos and documents as short public links that open in a lightweight viewer — optionally tied to a recipient's phone number and auto-expiring after a set period. Ideal for WhatsApp distribution of sample lectures and notices.","roles":["Admin","Learner","Parent"],"platforms":["Public Web"],"subFeatures":[{"name":"Public media viewer","description":"A clean viewer page for shared videos (including YouTube embeds) and files — no login required."},{"name":"Phone-personalized links","description":"Links can embed the recipient's phone number for tracking and personalization."},{"name":"Auto-expiring links","description":"Shared links expire automatically after a set period to keep content controlled."}]},{"id":"vertical-solutions","name":"Vertical Solutions & Switching Support","tagline":"Purpose-built for every kind of education business","description":"Vacademy is packaged and positioned for specific education verticals, with dedicated solution configurations for exam coaching, schools, corporate training and more — plus free migration from existing tools and rapid go-live support. Localized presence spans India, the GCC, Australia and New Zealand.","roles":["Admin"],"platforms":["Public Web"],"subFeatures":[{"name":"Exam-coaching solutions","description":"Tailored configurations for IELTS (module-wise mocks, teacher-reviewed Writing and Speaking), NEET (auto-graded test series, PYQ banks, subject-wise reports) and UPSC (Prelims and Mains test series, daily current-affairs practice, AI-assisted answer evaluation)."},{"name":"Studio and wellness solutions","description":"Yoga and fitness studio setup with trial cohorts, membership and renewal handling, drip nurture and a white-label member platform."},{"name":"Schools, STEM, corporate and distance learning","description":"Dedicated positioning and setups for schools, STEM and robotics education companies scaling across schools, corporate L&D, and fully-online academies."},{"name":"Localized global reach","description":"Country- and city-specific presence across India, GCC (with Arabic-language options), Australia and New Zealand, a marketing site in 20 languages, and multi-currency pricing."},{"name":"Free migration and fast go-live","description":"Free migration from existing tools with go-live support in about 48 hours."},{"name":"Comparison and switching resources","description":"Head-to-head comparison guides against 65+ platforms — from Moodle and Canvas to Classplus, Graphy, Teachable and Docebo — with feature matrices, migration steps and switching stories to support an informed move."}]}],"demo":{"intro":"Follow a marketing funnel end to end: build the institute's website, sell a course with built-in checkout, grow through referrals and coupons, and watch ad leads flow straight into your CRM.","screens":[{"id":"builder","device":"desktop","title":"Website Builder — Prakash Career Academy","nav":["Dashboard","Marketing*","Study Library","Learners","Assessments","Reports","Settings"],"widgets":[{"type":"header","id":"wb-head","title":"prakashacademy.in — Home","subtitle":"Draft · last edited 10 min ago by Priya","actions":["Preview Mobile","Publish"]},{"type":"builder","id":"wb-canvas","tray":["Hero","Course Catalogue","Pricing Table","Testimonials","FAQ Accordion","Countdown Timer","Contact Form","Custom HTML"],"canvas":["Header — logo, nav, 'Book Free Counselling' CTA","Hero — NEET 2027 Admissions Open · Split layout","Course Catalogue Grid — pulls live courses","Testimonials — 6 parent reviews","FAQ Accordion — 8 questions","Footer — contact, policies, map"]},{"type":"form","id":"wb-publish","title":"Design & publish","fields":[{"label":"Theme","value":"Ocean · custom brand #1B5FA8","type":"select"},{"label":"Fonts","value":"Playfair Display / Inter","type":"select"},{"label":"SEO title","value":"NEET & JEE Coaching in Indore | Prakash Career Academy","type":"text"},{"label":"Sticky header","value":"on","type":"toggle"}],"submit":"Publish site"}],"module":"crm"},{"id":"salespage","device":"phone","title":"Course Page — Buyer View","nav":["Courses*","Search","Cart","Account"],"widgets":[{"type":"header","id":"sp-head","title":"Prakash Career Academy","subtitle":"prakashacademy.in/neet-2027"},{"type":"cards","id":"sp-cards","items":[{"title":"NEET 2027 Batch A","sub":"₹45,000/yr · 4.7 ★ · 18 seats left","chip":"Bestseller","tone":"green","banner":{"title":"NEET 2027","sub":"Batch A · Live"}},{"title":"NEET 2027 Crash Course","sub":"₹18,500 · starts 1 Aug","chip":"New","tone":"blue","banner":{"title":"NEET 2027","sub":"Crash Course"}},{"title":"Class 10 Foundation","sub":"₹24,000/yr · 4.6 ★","chip":"Open","tone":"gray","banner":{"title":"Class 10","sub":"Foundation"}}]},{"type":"form","id":"sp-checkout","title":"Checkout — NEET 2027 Batch A","fields":[{"label":"Name","value":"Aarav Deshmukh","type":"text"},{"label":"Phone","value":"+91 98230 41567","type":"text"},{"label":"Coupon","value":"EARLYBIRD25 ✓ — you pay ₹33,750","type":"text"},{"label":"I accept the terms","value":"on","type":"toggle"}],"submit":"Pay ₹33,750"}],"inst":"Prakash Career Academy"},{"id":"growth","device":"desktop","title":"Referrals & Coupons","nav":["Dashboard","Marketing*","Study Library","Learners","Assessments","Reports","Settings"],"widgets":[{"type":"header","id":"gr-head","title":"Growth","subtitle":"Referral program: 'Bring a Friend 2026' (default)","actions":["+ New Coupon","+ New Program"]},{"type":"stats","id":"gr-stats","items":[{"label":"Referral joins","value":"142","delta":"+31 this month"},{"label":"Revenue via referrals","value":"₹6.4L"},{"label":"Coupon redemptions","value":"389"},{"label":"Top referrer","value":"Ananya S. · 9"}]},{"type":"table","id":"gr-coupons","columns":["Code","Discount","Scope","Used","Status"],"rows":[["EARLYBIRD25","25% (cap ₹12,000)","NEET 2027 Batch A","212 / 500",{"chip":"Active","tone":"green"}],["TOPPER5000","₹5,000 flat","JEE Advanced Dropper","64 / 100",{"chip":"Active","tone":"green"}],["ALUMNI-ONLY","40%","12 invited emails","9 / 12",{"chip":"Active","tone":"blue"}],["DIWALI24","15%","All courses","104 / 104",{"chip":"Expired","tone":"gray"}]]}],"module":"crm"},{"id":"leads","device":"desktop","title":"Lead Ads Connectors","nav":["Dashboard","Marketing*","Study Library","Learners","Assessments","Reports","Settings"],"widgets":[{"type":"header","id":"ld-head","title":"Lead Connectors","subtitle":"3 active · last lead 40 sec ago","actions":["+ Connect Meta","Sync leads now"]},{"cols":[{"type":"form","id":"ld-connect","title":"Meta Lead Ads — setup","fields":[{"label":"Facebook Page","value":"Prakash Career Academy (verified)","type":"select"},{"label":"Lead form","value":"NEET 2027 — Free Demo Class","type":"select"},{"label":"Map 'full_name' →","value":"Student Name","type":"select"},{"label":"Route to","value":"Audience list: NEET Enquiries · tag: Indore Centre","type":"select"}],"submit":"Activate connector"},{"type":"notify","id":"ld-feed","items":[{"channel":"Meta Ads","text":"New lead: Rohan Verma · +91 98765 20143 · NEET Demo form"},{"channel":"Google Ads","text":"New lead: Sneha Kulkarni · JEE lead form extension"},{"channel":"Zoho Forms","text":"New lead: Kabir Mehta · scholarship test signup"},{"channel":"Website","text":"Enquiry from course page: Class 10 Foundation"}]}]},{"type":"list","id":"ld-health","items":[{"title":"Meta · NEET Demo form","sub":"Last lead 40 sec ago · token OK","chip":"Healthy","tone":"green"},{"title":"Google · JEE lead form","sub":"Webhook key active · 26 leads today","chip":"Healthy","tone":"green"},{"title":"Meta · Old Diwali campaign","sub":"Page permission revoked · 1-click re-subscribe","chip":"Fix","tone":"orange"}]}],"module":"crm"}],"steps":[{"screen":"builder","target":null,"title":"Your website, without an agency","text":"This is the visual site builder — an Elementor-style editor for your institute's public website and course catalogue. Sites are drafted, versioned and role-permissioned, and everything publishes to your own domain."},{"screen":"builder","target":"wb-canvas","title":"Assemble pages from 40+ sections","text":"Drag sections — hero, course catalogue grid, pricing table, FAQ, countdown timer — onto the canvas while a pixel-accurate live preview renders alongside. Check desktop, tablet and mobile widths before anything goes live."},{"screen":"builder","target":"wb-publish","title":"Agency-grade design, one click live","text":"Pick from 9 color themes or your exact brand color, pair fonts from a curated library, and set per-page SEO. Drafts stay invisible until you publish, and full version history restores any old revision in one click."},{"screen":"salespage","target":"sp-cards","title":"A storefront that updates itself","text":"The catalogue widget pulls your real published courses — prices, ratings, even live seat availability from seat inventory. Tag-based pages like /neet stay current automatically as courses change."},{"screen":"salespage","target":"sp-checkout","title":"Checkout built into the page","text":"Sales pages bundle courses and payment plans with a real checkout: coupons validate live and show the exact discounted amount, terms acceptance is enforced, and invoices go out automatically by email or WhatsApp."},{"screen":"growth","target":"gr-stats","title":"Learners become your ad channel","text":"Referral programs offer five reward types — discounts, bonus content, free membership days, points — with tiers, vesting against refunds, and automatic reward delivery via email or WhatsApp when a referral converts."},{"screen":"growth","target":"gr-coupons","title":"Coupons with real controls","text":"Percentage or flat discounts with caps, redemption windows, usage limits, email-restricted private offers and batch scoping. Every applied discount is recorded against the payment for auditing."},{"screen":"leads","target":"ld-connect","title":"Connect Meta in one guided flow","text":"Sign in once, pick the Page and lead form, and map every ad-form field to your campaign's custom fields — auto-matched by name. Route each connector to an audience list with default tags like branch or centre."},{"screen":"leads","target":"ld-feed","title":"Every lead, in seconds","text":"Meta leads arrive via push within seconds; Google lead forms, Zoho and website enquiries flow in through webhooks. Each lead is stamped with its source, and repeat submissions merge into the existing lead."},{"screen":"leads","target":"ld-health","title":"Connectors that never fail silently","text":"Per-connector health checks show last-lead-received time, refresh tokens automatically and offer a one-click re-subscribe fix. A backup poller and 'Sync leads now' re-fetch leads even if push delivery breaks."}]}},{"id":"comms","name":"Communication Suite","icon":"comm","color":"#2563EB","tagline":"Announcements, email, WhatsApp, push and chat — one hub","description":"The Communication Suite gives your institute one place to reach — and hear back from — every learner, parent, teacher and lead. Broadcast rich announcements across email, WhatsApp, push and nine in-app surfaces; run two-way email and WhatsApp inboxes; resolve learner doubts to completion; and keep every message on-brand with reusable templates. Precise targeting, scheduling, approvals and deliverability protection are built in, so the right message reaches the right people at the right time.","features":[{"id":"announcement-center","name":"Announcement Center","tagline":"One announcement, delivered to every screen and channel","description":"Compose a rich announcement once and deliver it simultaneously over push notification, email and WhatsApp — and inside the apps as alerts, pins, popups, messages, posts or tasks. Announcements carry rich content, attachments and priority, move through a full lifecycle from draft to expired, and every send is tracked with delivery and read statistics.","roles":["Admin","Teacher","Counsellor"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App","API"],"subFeatures":[{"name":"Rich content composer","description":"Write announcements in a rich-text editor or switch to raw HTML source view. Content can be text, HTML, video or image, including full HTML email documents."},{"name":"Three delivery channels in one send","description":"Push notification, email and WhatsApp go out together, each with its own configuration — email subject and from-address, WhatsApp template with variable mapping, push title and body with character guidance."},{"name":"Email campaigning","description":"Full email sends with subject line, inbox preview text, template selection and campaign settings."},{"name":"Device preview","description":"Preview the announcement exactly as it will look on mobile, tablet and laptop before sending."},{"name":"Auto-fill push from content","description":"Push title and body populate automatically from the announcement, with a toggle to write them manually."},{"name":"Priority levels","description":"Mark each announcement Low, Normal, High or Urgent so critical notices stand out to recipients."},{"name":"Attachments and resources","description":"Attach documents, videos, links, images, audio and presentations so recipients get the materials with the message."},{"name":"Full announcement lifecycle","description":"Announcements move through Draft, Pending Approval, Scheduled, Active, Inactive and Expired states, with controls to activate or deactivate at any time."},{"name":"Delivery and read analytics","description":"Per-announcement stats show delivered, read, dismissed counts and dismiss rate, down to per-recipient delivery status with seen and dismissed timestamps."},{"name":"Edit, duplicate and re-deliver","description":"Update or duplicate any announcement, trigger delivery again on demand, and restart failed deliveries with recovery tracking."},{"name":"Planned and past views","description":"Separate history and schedule screens with search, status and date-range filters keep teams on top of what is queued and what already went out."},{"name":"Readable send history","description":"Announcement history lists recipients by name and audiences by batch or role label, with a delivery overview per announcement and times in the viewer's local time."}]},{"id":"in-app-channels","name":"In-App Announcement Channels","tagline":"Nine in-app surfaces, from popups to pinned dashboards","description":"Beyond email and WhatsApp, announcements appear inside the learner and admin apps in purpose-built ways: urgent alerts, dashboard pins, direct messages, class streams, a resources area, community posts, task assignments and full-screen overlays. Each surface has its own behaviour settings, and everything streams to open apps in real time.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"System alerts","description":"High-visibility alerts in users' alert trays with configurable auto-dismiss timing and priority handling."},{"name":"Dashboard pins","description":"Pin an announcement prominently on users' home dashboards for a set duration and position."},{"name":"Broadcast direct messages","description":"Deliver the announcement into each recipient's personal message inbox, with optional threaded replies."},{"name":"Class streams","description":"Post into a batch's stream, typed as General, Assignment, Live Class, Announcement, Discussion or Q&A."},{"name":"Resources feed","description":"Publish study materials into a resources area organised by folder, category and content type — document, video, link, image, audio or presentation."},{"name":"Community posts","description":"Publish to community spaces typed General, Q&A, Discussion, Study Group, Announcements, Events or Help & Support, with tags and replies."},{"name":"Announcement-as-task","description":"Turn an announcement into real work: linked slides, go-live and deadline times, estimated duration, attempts, mandatory flag and automatic deadline reminders, tracked through Live, Completed and Overdue states."},{"name":"Full-screen app overlays","description":"Show an unmissable dismissible popup on app open — ideal for exam notices, fee reminders and policy updates."},{"name":"Real-time delivery","description":"New announcements, pins, alerts and task status changes stream to open apps instantly over a live connection — no refresh needed."},{"name":"Unified message feed","description":"Every user gets a consolidated messages view with unread counts, per-channel feeds and mark-as-read or dismiss actions."},{"name":"Engagement tracking","description":"The platform records who read, dismissed, clicked, liked or shared each message, feeding delivery statistics."}]},{"id":"audience-targeting","name":"Smart Audience Targeting","tagline":"Target exactly who should hear it — nobody else","description":"Pick recipients by role, individual user, batch, tag, custom-field filter or marketing campaign audience, then layer exclusions on top. A live estimate shows how many people will receive the message before you send it.","roles":["Admin","Teacher","Counsellor"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Seven recipient types","description":"Address whole roles (all learners, all teachers), specific users, entire batches, batches restricted to certain org roles, tags, custom-field filters, or campaign audiences — mixed freely across multiple rows."},{"name":"Custom-field filters","description":"Narrow any audience with equals, contains, starts-with and ends-with filters on custom profile fields — for example, only learners whose city equals Pune."},{"name":"Per-row exclusions","description":"Exclude specific roles, users, batches or tags from any recipient row — for example, all learners except Batch X."},{"name":"Tag-based audiences","description":"Select one or many user tags as an audience, each with its own reach estimate."},{"name":"Campaign audiences","description":"Reach leads captured through marketing campaign forms directly from the announcement composer."},{"name":"Live reach estimate","description":"See the estimated recipient count for the whole announcement and per audience row before sending."},{"name":"Sub-organisation targeting","description":"For sub-org batches, choose whether the message goes to the batch's admins or its learners."}]},{"id":"scheduling-recurring","name":"Scheduling & Recurring Broadcasts","tagline":"Send now, later, or on a repeating schedule","description":"Announcements go out immediately, at a chosen future time, or on a repeating schedule such as every Monday at 9am. Everything is timezone-aware, visible on a schedule calendar, and executed by a reliable background scheduler.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Immediate send","description":"Deliver to the full resolved audience the moment the announcement is submitted."},{"name":"One-time scheduling","description":"Pick a future date and time in any timezone, with quick picks like 'in 1 hour', 'tomorrow 9 AM' or 'next Monday 9 AM'."},{"name":"Recurring schedules","description":"Define daily, weekly or custom repeat rules with optional start and end dates — perfect for weekly digests and fee reminders."},{"name":"Schedule calendar and queue management","description":"A schedule view lists upcoming one-time and recurring sends as calendar items, with edit, delete and a 'Deliver now' action to fire a scheduled announcement immediately."},{"name":"Reliable background delivery","description":"Scheduled sends run in the background with recovery — interrupted deliveries are detected and restarted without duplicating messages."}]},{"id":"doubts-help-queries","name":"Doubts & Help Queries","tagline":"Learners ask, the right teacher answers — tracked to resolution","description":"Learners raise doubts anchored to the exact spot in a lesson — even a specific moment in a video — and teachers answer in threaded conversations. A separate help-desk flow handles non-academic queries like payment or technical issues, with configurable types, automatic routing to the right staff, and tracking through resolution. Even logged-out website visitors can submit questions.","roles":["Admin","Teacher","Learner","Parent"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App","Public Web"],"subFeatures":[{"name":"Content-anchored doubts","description":"Doubts capture the exact content position — a video timestamp chip jumps anyone reading the doubt to that moment — so teachers see precisely what the learner was viewing."},{"name":"In-slide doubt sidebar","description":"Learners ask and teachers answer right next to the slide the doubt refers to, keeping the conversation in context."},{"name":"Threaded replies","description":"Every doubt is a conversation: replies, history and follow-ups stay together in one thread."},{"name":"Central doubts inbox","description":"Admins and teachers triage every doubt across courses in a filterable inbox — by batch, status, type and assignee."},{"name":"Automatic assignment rules","description":"Route new queries to the subject teacher, batch teacher, everyone in a role, or specific staff, with a fallback when no one matches — or keep assignment manual."},{"name":"Configurable query types","description":"Built-in types (Doubt, Payment Issue, Technical Issue) plus custom types with institute-defined labels and per-type routing."},{"name":"Guest queries","description":"Logged-out visitors submit questions with their name and email from public pages; replies and resolution notices are emailed to them directly."},{"name":"Learner query tracking","description":"Learners see all their raised queries with status and institute responses, and can mark their own doubts resolved."},{"name":"Resolution workflow","description":"Doubts move through Active and Resolved states with raised and resolved timestamps, keeping accountability clear."},{"name":"Instant staff alerts","description":"Device push notifications tell assigned staff the moment a new doubt arrives."},{"name":"Doubt board","description":"Switch the inbox to a board grouped by teacher or status and drag doubts between columns to assign, reassign, move or resolve them."},{"name":"Custom doubt statuses","description":"Add statuses like In progress or Waiting on learner with a colour, choose whether each counts as open, in progress or resolved, and set the label learners see."},{"name":"Activity trail and staff remarks","description":"Every doubt keeps a history of who raised, assigned, auto-assigned or moved it, plus staff-only remarks learners never see."},{"name":"Always-assigned handlers","description":"Add fixed roles or staff to any query type on top of its automatic routing, so the right people are always included."},{"name":"Sub-organization routing","description":"Doubts from a sub-organization's learners also reach that sub-organization's own admins or whole team."}]},{"id":"whatsapp-business","name":"WhatsApp Business Messaging","tagline":"Official WhatsApp messaging at institute scale","description":"Send WhatsApp messages to learners and leads through official WhatsApp Business channels, connecting via your choice of provider — Meta's Cloud API, WATI or Combot. Bulk template sends personalise per recipient, delivery is confirmed end-to-end, and inbound replies flow back into the platform automatically.","roles":["Admin","Counsellor"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Multi-provider support","description":"Connect through Meta's official Cloud API, WATI or Combot with credentials stored securely; the platform routes messages through whichever provider the channel uses."},{"name":"Guided webhook setup","description":"Copy-paste webhook configuration so inbound messages and delivery statuses flow back into the platform out of the box."},{"name":"Bulk template sending","description":"Send pre-approved templates with per-recipient variables to precisely targeted audiences."},{"name":"Rich media messages","description":"Messages support text, images, video, documents, audio, locations, contacts, buttons and interactive lists."},{"name":"Media headers and dynamic buttons","description":"Attach an image, video or document header to template sends and inject per-recipient URLs into buttons — for example, personal payment links."},{"name":"End-to-end delivery receipts","description":"Every message is tracked as sent, delivered, read or failed via provider webhooks, visible across analytics and contact timelines."},{"name":"Multiple numbers per institute","description":"Register one or more WhatsApp numbers against the institute, with webhook registration and verification handled in-product."},{"name":"Incoming message capture","description":"Replies and inbound messages are received, logged and routed to inboxes and chatbot flows automatically."},{"name":"Template-to-event mapping","description":"Map approved templates to system messages, such as which template is used for invoice notices or transactional updates."},{"name":"Send from a learner profile or list","description":"Send a template to one learner or a bulk selection from the learner list, mapping variables to profile fields — including their portal username and password — with a review of resolved values first."}]},{"id":"whatsapp-inbox","name":"WhatsApp Team Inbox","tagline":"Two-way WhatsApp conversations, right in the dashboard","description":"A shared WhatsApp inbox where staff see every conversation with learners and leads, reply in real time, and stay compliant with WhatsApp's rules automatically. When a conversation's 24-hour reply window has closed, agents send an approved template to re-open it.","roles":["Admin","Counsellor"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Conversation list with unread counts","description":"All WhatsApp threads sorted by recency, showing sender name, last message and unread badge, with search and pagination."},{"name":"Full message history","description":"Scroll through the complete inbound and outbound history per contact, including delivery states on every message."},{"name":"Free-text replies","description":"Reply directly within WhatsApp's 24-hour customer-service window, with a clear notice when the window has expired."},{"name":"Template replies for expired windows","description":"Search and send any approved template — with variable prompts — to re-engage contacts outside the 24-hour window."},{"name":"Linked identities","description":"Conversations tie back to platform users wherever the phone number matches, so staff know exactly who they are talking to."},{"name":"Send photos, videos, documents and voice notes","description":"Reply with media and files inside the 24-hour window, with WhatsApp's size and caption rules checked before sending."},{"name":"Delivery ticks and clear failure reasons","description":"Every message shows real sent, delivered and read ticks, threads are split by day, and refused messages appear as red bubbles explaining what went wrong in plain language."},{"name":"Unanswered and Not delivered filters","description":"Jump to conversations the chatbot handed over that nobody has answered yet, or to conversations with undelivered messages; replying resolves the hand-over."},{"name":"See which automation sent a message","description":"Each automated message is labelled with the workflow or chatbot flow that sent it, in the inbox and on the learner's communication history."},{"name":"Template messages as the learner saw them","description":"Template sends render with their real header image, video or document, body and buttons, and media-header templates can be sent from the inbox with a preview first."}]},{"id":"whatsapp-template-studio","name":"WhatsApp Template Studio","tagline":"Build and get Meta-approved templates without leaving the platform","description":"Create official WhatsApp Business message templates in-app: compose header, body, footer and buttons, add numbered variables with sample values, preview the message live, and submit straight to Meta for approval. Already-approved templates sync in from your provider so they are immediately usable in campaigns and flows.","roles":["Admin","Counsellor"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Full template composer","description":"Header, body text, footer and action buttons — matching Meta's template anatomy exactly."},{"name":"Marketing and utility categories","description":"Choose the Meta category that governs each template's pricing and rules."},{"name":"13 languages","description":"Author templates in English, English (US), Hindi, Spanish, Portuguese (BR), Arabic, French, German, Indonesian, Italian, Japanese, Korean and Chinese (Simplified)."},{"name":"Numbered variables with samples","description":"Insert {{1}}, {{2}}-style placeholders with one click; the builder tracks the count, requires a sample value for each (needed for Meta review), and lets you name variables for later mapping."},{"name":"Media headers","description":"Add a text header or an image, video or document header with a sample for Meta review."},{"name":"Live preview","description":"See the rendered message with sample values substituted as you type."},{"name":"Draft, submit and track approval","description":"Save drafts, edit them, submit to Meta from the template list, and monitor approval status and date per template."},{"name":"Provider sync","description":"Pull already-approved templates from your connected provider into the platform library, with last-synced status per template."},{"name":"Upload header sample media","description":"Upload the sample image, video or document for a media header directly in the builder, with WhatsApp's file limits checked, instead of hosting it yourself."},{"name":"WhatsApp-style preview cards","description":"The template library shows each template as a WhatsApp bubble with header, highlighted variables, footer and buttons, plus chips for header type, variable and button counts."}]},{"id":"communication-hub","name":"Communication Hub & Email Inbox","tagline":"One dashboard for all outbound and inbound email","description":"A command center for institute communications: at-a-glance email and WhatsApp performance stats, a cross-channel activity feed, and a shared two-way email inbox. When contacts reply to your emails, the replies land in per-contact conversation threads that staff answer without leaving the platform.","roles":["Admin","Counsellor"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Channel stats overview","description":"Email and WhatsApp delivery statistics with per-batch breakdowns over a selectable window, shown as stat cards."},{"name":"Recent activity feed","description":"A cross-channel timeline of recent email and WhatsApp sends."},{"name":"Threaded email conversations","description":"Inbound and outbound emails group into per-contact conversation threads with a conversation list, filters and full thread view."},{"name":"Reply from the dashboard","description":"Compose and send email replies directly from the inbox, choosing which verified sender address to reply from."},{"name":"Inbox search","description":"Search conversations across the inbox to find a contact's thread quickly."},{"name":"Inbound setup status","description":"A status view shows whether inbound email receiving is configured and healthy for the institute."}]},{"id":"message-template-studio","name":"Message Template Studio","tagline":"On-brand email and message templates, reusable everywhere","description":"A visual drag-and-drop designer for reusable branded templates — email, WhatsApp, invoice email and invoice PDF layout — categorized as marketing, utility or transactional. Drop in blocks, style them visually, and insert personalization variables that auto-fill per recipient at send time. Saved templates are picked up across campaigns, announcements, automations and invoices.","roles":["Admin","Counsellor"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Visual drag-and-drop editor","description":"Compose with header, hero, two-column, button and footer blocks built for email-safe layout, with visual controls for alignment and widths."},{"name":"Style manager with HTML access","description":"Edit colors, spacing and typography on any element without writing HTML — while full HTML access remains available for power users."},{"name":"Personalization variables","description":"A variables dialog lists all merge fields by category with click-to-insert; values like learner name or course fill per recipient automatically, and used variables are detected as you write."},{"name":"Four template types","description":"One studio covers Email, WhatsApp, Invoice and Invoice-Email templates, tagged as marketing, utility or transactional."},{"name":"Subject line and inbox preview","description":"Set template name, type, category, email subject and inbox preview text right from the editor."},{"name":"Shared image and font library","description":"Upload images once to cloud hosting and reuse them across every template; choose from 14 fonts including Roboto, Poppins, Montserrat and Georgia."},{"name":"Invoice templates","description":"Dedicated templates for the invoice email and the invoice PDF layout keep billing communication on-brand."},{"name":"Default templates and sample packs","description":"Mark a template as the default for its type so automations pick it up without configuration, and start from ready-made samples like welcome emails and reminders."},{"name":"Organized, searchable library","description":"Search, filter by type and provider, duplicate, delete, and rely on duplicate-name guards an
