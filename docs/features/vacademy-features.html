:root{
  --brand:#ED7424;
  --display:#C05F1F;
  --brand-soft:#FBEADB;
  --brand-ink:#B45309;
  --bg:#F7F0E6;
  --surface:#FFFFFF;
  --surface-2:#F1E8DA;
  --ink:#221C17;
  --ink-2:#5C534B;
  --ink-3:#A2968A;
  --line:#E9DFD0;
  --line-2:#D9CDBA;
  --shadow:0 1px 2px rgb(60 40 10 / .04),0 6px 20px rgb(60 40 10 / .07);
  --shadow-lg:0 6px 16px rgb(60 40 10 / .08),0 20px 50px rgb(60 40 10 / .16);
  --radius:18px;
  --hl:#FBE3C8;
  --fd:'Fraunces',Georgia,'Times New Roman',serif;
  --fm:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --brand:#F08434;
    --display:#F08434;
    --brand-soft:#3A2717;
    --brand-ink:#F5A05C;
    --bg:#171310;
    --surface:#211B16;
    --surface-2:#2B231D;
    --ink:#F4EDE3;
    --ink-2:#C7BBAD;
    --ink-3:#8A7D6F;
    --line:#352C24;
    --line-2:#463A2F;
    --shadow:0 1px 2px rgb(0 0 0 / .4),0 6px 20px rgb(0 0 0 / .35);
    --shadow-lg:0 6px 16px rgb(0 0 0 / .5),0 24px 60px rgb(0 0 0 / .6);
    --hl:#4A3413;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--brand-ink);text-decoration:none}
a:hover{text-decoration:underline}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.kicker{font:700 11px/1 var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--brand)}

/* ---------- header ---------- */
header.site{
  position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.hwrap{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
.logo svg{display:block}
.logo b{font-size:16px;letter-spacing:-.01em}
.logo span{display:block;font-size:11px;color:var(--ink-3);margin-top:-2px}
.searchbox{position:relative;flex:1;max-width:560px;margin-left:auto}
.searchbox input{
  width:100%;padding:9px 36px 9px 38px;border:1px solid var(--line-2);border-radius:12px;
  background:var(--surface);color:var(--ink);font-size:14px;outline:none;transition:border-color .15s, box-shadow .15s;
}
.searchbox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.searchbox .sicon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.searchbox kbd{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font:600 11px/1 var(--fm);color:var(--ink-3);border:1px solid var(--line-2);
  border-radius:5px;padding:3px 6px;background:var(--surface-2);
}
.updated{font-size:12px;color:var(--ink-3);white-space:nowrap;font-family:var(--fm)}
@media (max-width:720px){.updated{display:none}.logo span{display:none}}

/* ---------- search results ---------- */
#results{
  position:absolute;top:calc(100% + 8px);left:0;right:0;max-height:min(70vh,640px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  display:none;
}
#results.open{display:block}
.rgroup{padding:12px 14px 4px;font:700 10.5px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.ritem{display:block;width:100%;text-align:left;padding:10px 14px;border-top:1px solid var(--line);transition:background .1s}
.ritem:hover,.ritem.active{background:var(--surface-2)}
.ritem .rt{font-weight:650;font-size:14px}
.ritem .rp{font-size:12px;color:var(--ink-3);margin-top:1px}
.ritem .rd{font-size:13px;color:var(--ink-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rnone{padding:22px 14px;color:var(--ink-3);font-size:14px;text-align:center}

/* ---------- layout ---------- */
main{max-width:1200px;margin:0 auto;padding:28px 20px 80px}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);margin-bottom:18px;flex-wrap:wrap}
.crumbs button{color:var(--brand-ink);font-weight:600}
.crumbs button:hover{text-decoration:underline}

/* ---------- home ---------- */
.hero{padding:52px 10px 34px;max-width:900px}
.hero h1{
  font-family:var(--fd);font-weight:900;text-transform:lowercase;
  font-size:clamp(40px,7vw,76px);letter-spacing:-.01em;line-height:1.02;color:var(--display);
}
.hero p{max-width:680px;margin:22px 0 0;color:var(--ink-2);font-size:17px;line-height:1.6}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.stat{
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:7px 16px;font-size:13px;color:var(--ink-2);box-shadow:var(--shadow);
}
.stat b{color:var(--ink);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px;margin-top:30px}
.pcard{
  text-align:left;background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 60%,transparent);
  border-radius:var(--radius);padding:22px 22px 20px 30px;box-shadow:var(--shadow);
  transition:transform .15s, box-shadow .15s;position:relative;overflow:hidden;
  display:flex;flex-direction:column;gap:9px;
}
.pcard::before{
  content:'';position:absolute;left:10px;top:18px;bottom:18px;width:6px;border-radius:999px;
  background:var(--pc,var(--brand));
}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.pcard .kicker{color:var(--pc,var(--brand))}
.pcard h3{font-size:19px;letter-spacing:-.015em;font-weight:750}
.pcard .tag{font-size:13.5px;color:var(--ink-2)}
.pcard .prev{font-size:12px;color:var(--ink-3)}
.pcard .cnt{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink-3)}
.pcard .go{color:var(--pc,var(--brand));font-weight:700;display:flex;align-items:center;gap:4px}
.demobtn{
  display:inline-flex;align-items:center;gap:7px;margin-top:2px;
  font-size:12.5px;font-weight:700;color:var(--pc,var(--brand));
}
.demobtn:hover{text-decoration:underline}
.byline{margin-top:44px;text-align:center;font-size:12.5px;color:var(--ink-3)}

/* ---------- pillar view ---------- */
.pillar-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:6px;flex-wrap:wrap}
.picon{
  width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex-shrink:0;
  background:color-mix(in srgb,var(--pc,var(--brand)) 14%,var(--surface));color:var(--pc,var(--brand));
}
.pillar-head h1{
  font-family:var(--fd);font-weight:900;font-size:clamp(30px,4.5vw,46px);
  letter-spacing:-.01em;line-height:1.08;color:var(--display);
}
.pillar-head .tag{color:var(--ink-2);font-size:15px;margin-top:4px}
.pillar-desc{color:var(--ink-2);font-size:15px;max-width:820px;margin:12px 0 4px}
.toolbar{display:flex;align-items:center;gap:10px;margin:18px 0 6px;flex-wrap:wrap}
.chipbtn{
  font-size:12.5px;font-weight:650;color:var(--ink-2);border:1px solid var(--line-2);
  border-radius:999px;padding:6px 14px;background:var(--surface);
}
.chipbtn:hover{border-color:var(--brand);color:var(--brand-ink)}
.chipbtn.solid{background:var(--pc,var(--brand));border-color:var(--pc,var(--brand));color:#fff}
.chipbtn.solid:hover{filter:brightness(1.07);color:#fff}
.pillar-body{display:grid;grid-template-columns:230px 1fr;gap:28px;align-items:start;margin-top:14px}
@media (max-width:900px){.pillar-body{grid-template-columns:1fr}.sidenav{display:none}}
.sidenav{position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto;padding-right:6px}
.sidenav a{
  display:block;font-size:13px;color:var(--ink-2);padding:6px 10px;border-left:2px solid var(--line);
  border-radius:0 8px 8px 0;
}
.sidenav a:hover{color:var(--ink);text-decoration:none;background:var(--surface-2)}
.sidenav a.on{color:var(--brand-ink);border-left-color:var(--pc,var(--brand));font-weight:650;background:var(--brand-soft)}

/* ---------- feature card ---------- */
.fcard{
  background:var(--surface);border:1px solid color-mix(in srgb,var(--line) 60%,transparent);
  border-radius:var(--radius);padding:22px 22px 20px 30px;box-shadow:var(--shadow);
  margin-bottom:16px;scroll-margin-top:84px;position:relative;overflow:hidden;
}
.fcard::before{
  content:'';position:absolute;left:10px;top:20px;bottom:20px;width:5px;border-radius:999px;
  background:color-mix(in srgb,var(--pc,var(--brand)) 55%,var(--surface));
}
.fcard.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,45%{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 30%,transparent)}100%{}}
.fhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fhead h2{font-size:19px;letter-spacing:-.012em;font-weight:750}
.fhead .ftag{font-size:13px;color:var(--pc,var(--brand-ink));font-weight:650}
.fdesc{color:var(--ink-2);font-size:14.5px;margin-top:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{
  font:650 10.5px var(--fm);letter-spacing:.08em;text-transform:uppercase;
  border-radius:999px;padding:4px 10px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);
}
.chip.role{background:color-mix(in srgb,var(--pc,var(--brand)) 11%,var(--surface));color:var(--pc,var(--brand-ink));border-color:transparent}
.sf-toggle{
  margin-top:14px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--brand-ink);
}
.sf-toggle svg{transition:transform .18s}
.sf-toggle[aria-expanded="true"] svg{transform:rotate(90deg)}
.sflist{display:none;margin-top:10px;border-top:1px solid var(--line)}
.sflist.open{display:block}
.sf{
  display:grid;grid-template-columns:minmax(160px,240px) 1fr;gap:6px 18px;
  padding:11px 2px;border-bottom:1px solid var(--line);scroll-margin-top:100px;
}
.sf:last-child{border-bottom:0}
.sf .sn{font-size:13.5px;font-weight:650}
.sf .sd{font-size:13.5px;color:var(--ink-2)}
.sf.flash{background:var(--hl)}
@media (max-width:640px){.sf{grid-template-columns:1fr;gap:2px}}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);padding:26px 20px 40px;text-align:center;color:var(--ink-3);font-size:12.5px}
footer .fw{max-width:1200px;margin:0 auto}

/* ============================================================
   GUIDED DEMO — mock app + tour
   ============================================================ */
.demo-ov{
  position:fixed;inset:0;z-index:100;background:color-mix(in srgb,var(--ink) 55%,transparent);
  display:none;align-items:center;justify-content:center;padding:2.5vh 2vw;
}
.demo-ov.open{display:flex}
.demo-shellwrap{
  width:min(1180px,100%);height:min(760px,95vh);display:flex;flex-direction:column;
  background:var(--bg);border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden;
  border:1px solid var(--line);
}
.demo-top{
  display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:var(--surface);
}
.demo-top .kicker{font-size:10.5px}
.demo-top b{font-size:14px}
.demo-top .demo-x{margin-left:auto;color:var(--ink-3);font-size:13px;font-weight:650;display:flex;align-items:center;gap:6px}
.demo-top .demo-x:hover{color:var(--ink)}
.demo-stage{flex:1;overflow:auto;position:relative;padding:18px;display:flex;align-items:flex-start;justify-content:center}
.demo-note{
  border-top:1px solid var(--line);background:var(--surface);padding:14px 18px;
  display:flex;gap:16px;align-items:center;
}
.demo-note .txt{flex:1;min-width:0}
.demo-note .txt .kicker{display:block;margin-bottom:3px}
.demo-note .txt b{font-size:14.5px}
.demo-note .txt p{font-size:13px;color:var(--ink-2);margin-top:2px}
.demo-note .nav{display:flex;gap:8px;align-items:center}
.demo-note .dots{display:flex;gap:5px;margin-right:6px}
.demo-note .dot{width:7px;height:7px;border-radius:99px;background:var(--line-2)}
.demo-note .dot.on{background:var(--brand)}
.dbtn{
  font-size:13px;font-weight:700;padding:8px 16px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--surface);
}
.dbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.dbtn.primary:hover{filter:brightness(1.07)}
.dbtn:disabled{opacity:.4;cursor:default}

/* mock app frame */
/* ============================================================
   PRODUCT-ACCURATE APP MOCK
   Tokens below mirror the live Vacademy admin shell (teal module
   rail, white sidebar, mint canvas, per-module accent) and are
   deliberately scoped + light-only so the mock reads like a real
   screenshot even when the doc is in dark mode.
   ============================================================ */
.mock,.phone,[data-mock-tokens]{
  --p-brand:#ED7424;--p-brand-d:#C2610F;--p-brand-soft:#FFF0E3;--p-brand-rail:#E0701F;--p-brand-ink:#8A4310;
  --p-indigo:#5B5BD6;--p-indigo-soft:#EDEDFB;
  --p-red:#E5455F;--p-violet:#6D28D9;--p-violet-soft:#F4F0FF;
  --p-orange:#ED7424;
  --p-bg:#FDF8F3;--p-surface:#FFFFFF;--p-surface-2:#F8F5F1;
  --p-line:#F0E8DF;--p-line-2:#E3D7C9;
  --p-ink:#211B15;--p-ink-2:#6A5F55;--p-ink-3:#A6988A;
  --p-accent:var(--p-brand);--p-accent-soft:var(--p-brand-soft);
  --p-fs:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
.mock.m-lms{--p-accent:var(--p-indigo);--p-accent-soft:var(--p-indigo-soft)}
.mock.m-ai{--p-accent:var(--p-red);--p-accent-soft:#FDECEF}
.mock{
  display:flex;background:var(--p-surface);border:1px solid var(--p-line-2);border-radius:16px;
  overflow:hidden;box-shadow:var(--shadow-lg);width:100%;max-width:1120px;font-size:13px;
  font-family:var(--p-fs);color:var(--p-ink);letter-spacing:-.005em;
}
.mock *{line-height:1.45}
.mock svg{flex-shrink:0}

/* --- module rail (far left, teal) --- */
.mock-rail{
  width:62px;flex-shrink:0;background:var(--p-brand-rail);color:#fff;
  display:flex;flex-direction:column;align-items:center;padding:10px 0 12px;gap:2px;
}
.mock-rail .r-srch{width:34px;height:34px;display:grid;place-items:center;opacity:.95;margin-bottom:6px}
.mock-rail .rm{
  width:48px;padding:7px 0 5px;border-radius:11px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:9.5px;font-weight:700;color:rgb(255 255 255/.92);letter-spacing:.01em;
}
.mock-rail .rm.on{background:#fff;color:var(--p-accent);box-shadow:0 2px 6px rgb(0 0 0/.12)}
.mock-rail .rm.on svg{color:var(--p-accent)}
.mock-rail .r-sep{width:30px;height:1px;background:rgb(255 255 255/.28);margin:7px 0}
.mock-rail .r-btm{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:center}

/* --- institute sidebar --- */
.mock-side{
  width:206px;flex-shrink:0;background:var(--p-surface);border-right:1px solid var(--p-line);
  display:flex;flex-direction:column;
}
.mock-side .ms-head{display:flex;align-items:center;gap:9px;padding:12px 12px 11px;border-bottom:1px solid var(--p-line)}
.mock-side .ms-logo{
  width:26px;height:26px;border-radius:7px;flex-shrink:0;display:grid;place-items:center;
  background:linear-gradient(135deg,#F5A05C,#ED7424 55%,#C2610F);color:#fff;font-size:10px;font-weight:800;
}
.mock-side .ms-head b{font-size:13.5px;font-weight:750;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mock-side .ms-nav{padding:9px 8px;flex:1;overflow:hidden}
.mock-side .ni{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;margin-bottom:1px;
  color:#2C3A36;font-size:12.5px;font-weight:550;white-space:nowrap;overflow:hidden;
}
.mock-side .ni svg{color:var(--p-ink-2);opacity:.9}
.mock-side .ni .nlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mock-side .ni .nchev{color:var(--p-ink-3);flex-shrink:0}
.mock-side .ni.on{background:var(--p-accent);color:#fff;font-weight:650;box-shadow:0 1px 3px rgb(0 0 0/.12)}
.mock-side .ni.on svg{color:#fff;opacity:1}
.mock-side .ni.sub{padding-left:34px;font-size:12px}
.mock-side .ni.sub.on{background:var(--p-accent)}
.mock-side .ms-foot{
  border-top:1px solid var(--p-line);padding:11px 14px;display:flex;align-items:center;gap:8px;
  font-size:12.5px;font-weight:600;color:#2C3A36;
}
.mock-side .ms-foot .dedi{margin-left:auto;color:var(--p-brand);font-size:11.5px;font-weight:650}

/* --- main column --- */
.mock-col{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--p-bg)}
.mock-top{
  display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--p-line);
  background:var(--p-surface);flex-shrink:0;
}
.mock-top .mt-panel{color:var(--p-ink-2)}
.mock-top .mt-div{width:1px;height:18px;background:var(--p-line-2)}
.mock-top .mt-title{font-weight:650;font-size:14.5px;letter-spacing:-.015em}
.mock-top .mt-right{margin-left:auto;display:flex;align-items:center;gap:9px}
.mock-top .mt-credits{
  display:flex;align-items:center;gap:5px;background:var(--p-violet-soft);border:1px solid #E3DAFB;
  color:var(--p-violet);border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:750;
}
.mock-top .mt-ic{color:var(--p-ink-2);display:grid;place-items:center;position:relative}
.mock-top .mt-switch{
  display:flex;align-items:center;gap:6px;border:1px solid var(--p-line-2);border-radius:9px;
  padding:5px 11px;font-size:12px;font-weight:650;background:var(--p-surface);
}
.mock-top .mt-av{width:26px;height:26px;border-radius:99px;background:var(--p-brand);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
.mock-main{flex:1;padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:14px;background:var(--p-bg);min-height:392px}

/* --- right utility rail --- */
.mock-urail{
  width:62px;flex-shrink:0;background:var(--p-bg);border-left:1px solid var(--p-line);
  display:flex;flex-direction:column;align-items:center;gap:11px;padding:14px 0;
}
.mock-urail .ur{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--p-ink-2);font-size:9px;font-weight:650;text-align:center;line-height:1.2;position:relative}
.mock-urail .ur .badge{
  position:absolute;top:-4px;right:6px;min-width:13px;height:13px;border-radius:99px;background:#16A34A;
  color:#fff;font-size:8px;font-weight:800;display:grid;place-items:center;padding:0 3px;
}
.mock-urail .ur .badge.warn{background:#DC2626}
@media (max-width:900px){.mock-urail{display:none}}
@media (max-width:760px){.mock-side{display:none}}

/* --- phone frame (learner app) --- */
.phone{
  width:300px;border:8px solid #1E1913;border-radius:34px;overflow:hidden;background:var(--p-surface);
  box-shadow:var(--shadow-lg);flex-shrink:0;font-family:var(--p-fs);color:var(--p-ink);
}
.phone .p-status{display:flex;justify-content:space-between;padding:6px 14px;font:600 10px var(--fm);color:var(--p-ink-2);background:var(--p-surface)}
.phone .p-body{height:480px;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px;background:var(--p-bg)}
.phone .p-tabs{display:flex;border-top:1px solid var(--p-line);background:var(--p-surface)}
.phone .p-tabs .pt{flex:1;text-align:center;padding:9px 2px;font-size:9.5px;color:var(--p-ink-3);font-weight:650}
.phone .p-tabs .pt.on{color:var(--p-brand)}

/* ============================ widgets ============================ */
.wg{background:var(--p-surface);border:1px solid var(--p-line);border-radius:14px;padding:14px 16px;position:relative;box-shadow:0 1px 2px rgb(33 27 21/.05)}
.wg.bare{background:none;border:0;padding:0;box-shadow:none}
.wg.bare .wg-h{margin-bottom:0}
.wg.bare .wg-h+.mtabs{margin-top:12px}
.phone .wg{border-radius:14px;padding:12px 13px}
.wg.spot{
  outline:2.5px solid var(--p-violet);outline-offset:3px;
  animation:pulse 1.6s ease-in-out infinite;z-index:2;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgb(109 40 217/.38)}50%{box-shadow:0 0 0 9px transparent}}
.wg-h{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.wg-h b{font-size:16px;font-weight:750;letter-spacing:-.02em;flex-shrink:0}
.wg-h .wg-sub{color:var(--p-ink-3);font-size:12px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wg-h .wg-act{margin-left:auto;display:flex;gap:8px}
.mbtn{
  white-space:nowrap;font-size:12px;font-weight:650;padding:6px 13px;border-radius:9px;background:var(--p-brand);color:#fff;
  display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgb(33 27 21/.12);
}
.mbtn.ghost{background:var(--p-surface);color:#2C3A36;border:1px solid var(--p-line-2);box-shadow:none}
.mchip{font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:99px;display:inline-block;white-space:nowrap}
.tone-orange{background:#FFF4E8;color:#B45309}.tone-green{background:#E9F8EF;color:#12794A}
.tone-blue{background:#EAF1FD;color:#1D5FBF}.tone-red{background:#FDECEC;color:#B4372C}
.tone-purple{background:#F1EBFC;color:#6D28D9}.tone-gray{background:#F1F4F3;color:var(--p-ink-2)}

/* greeting hero + assistant bar (admin dashboard) */
.mhero .greet{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.15}
.mhero .greet i{font-style:normal;color:var(--p-brand)}
.mhero .gsub{font-size:13px;color:var(--p-ink-2);margin-top:3px}
.mhero .gmeta{font-size:11.5px;color:var(--p-ink-3);font-weight:650;letter-spacing:.04em;text-transform:uppercase}
.mhero .qa{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.mhero .qa .q{display:inline-flex;align-items:center;gap:8px;background:var(--p-surface);border:1px solid var(--p-line-2);border-radius:11px;padding:9px 15px;font-size:13px;font-weight:650;color:#2C3A36}
.mhero .qa .q svg{color:var(--p-orange)}
.maskbar{background:linear-gradient(180deg,#FFF5EC,#FFFBF7);border:1px solid #F7E3CE;border-radius:14px;padding:13px 14px;display:flex;gap:11px;align-items:flex-start}
.maskbar .spark{color:var(--p-brand);margin-top:6px}
.maskbar .ab{flex:1;min-width:0}
.maskbar .abrow{display:flex;gap:10px}
.maskbar .abin{flex:1;background:var(--p-surface);border:1px solid var(--p-line-2);border-radius:10px;padding:9px 13px;color:var(--p-ink-3);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maskbar .abgo{background:#FBDCBE;color:#8A4310;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.maskbar .absug{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.maskbar .absug span{background:var(--p-surface);border:1px solid var(--p-line-2);border-radius:9px;padding:6px 12px;font-size:12px;color:#2C3A36}

/* stats */
.mstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px}
.mstat{background:var(--p-surface);border:1px solid var(--p-line);border-radius:14px;padding:13px 14px;box-shadow:0 1px 2px rgb(33 27 21/.05)}
.mstat .top{display:flex;align-items:flex-start;gap:8px;margin-bottom:9px}
.mstat .l{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--p-ink-2);flex:1}
.mstat .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;background:var(--p-brand-soft);color:var(--p-brand)}
.mstat .ico.i1{background:#EDEBFB;color:#6D57D6}.mstat .ico.i2{background:#EAF1FD;color:#2563EB}
.mstat .ico.i3{background:#E9F8EF;color:#12794A}.mstat .ico.i4{background:#FFF6E5;color:#B45309}
.mstat .ico.i5{background:#FDECEC;color:#DC2626}.mstat .ico.i6{background:#FFF0E6;color:#ED7424}
.mstat .v{font-size:28px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.mstat .d{font-size:11.5px;color:var(--p-ink-3);margin-top:4px}
.mstat .d.up{color:#12794A;font-weight:650}
.phone .mstat .v{font-size:21px}

/* tabs + filter chips */
.mtabs{display:flex;gap:20px;border-bottom:1px solid var(--p-line);padding:0 2px}
.mtabs .tb{padding:8px 0 9px;font-size:13.5px;font-weight:600;color:var(--p-ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.mtabs .tb.on{color:var(--p-brand);border-bottom-color:var(--p-brand);font-weight:700}
.mfilters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mfilters .fsearch{
  display:flex;align-items:center;gap:8px;background:var(--p-surface);border:1px solid var(--p-line-2);
  border-radius:10px;padding:7px 12px;color:var(--p-ink-3);font-size:12.5px;min-width:230px;flex:1;
}
.mfilters .fchip{
  display:inline-flex;align-items:center;gap:6px;background:var(--p-surface);border:1px solid var(--p-line-2);
  border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;color:#2C3A36;
}
.mfilters .fchip .pl{color:var(--p-ink-3);font-weight:700}
.mfilters .fchip.on{background:var(--p-brand-soft);border-color:#F5DCC0;color:#8A4310}

/* table */
.mtable{width:100%;border-collapse:collapse;font-size:12.5px}
.mtable th{
  font-size:11.5px;font-weight:700;color:#3B4C47;text-align:left;padding:10px 10px;
  background:#FCF8F4;border-bottom:1px solid var(--p-line);white-space:nowrap;
}
.mtable th:first-child{border-top-left-radius:10px}.mtable th:last-child{border-top-right-radius:10px}
.mtable td{padding:10px;border-bottom:1px solid var(--p-line);color:#3B4C47;vertical-align:middle}
.mtable tr:last-child td{border-bottom:0}
.mtable td:first-child{color:var(--p-ink);font-weight:600}
.mpager{display:flex;align-items:center;justify-content:center;gap:14px;padding-top:10px;font-size:12px;color:var(--p-ink-3);font-weight:600}
.mpager .pg{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--p-brand-soft);color:#8A4310;font-weight:750}

/* kanban */
.mkan{display:flex;gap:10px;overflow-x:auto}
.mkan .kcol{flex:1;min-width:136px;background:var(--p-surface-2);border:1px solid var(--p-line);border-radius:12px;padding:9px}
.mkan .kcol .kt{font-size:11px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;color:var(--p-ink-2);margin-bottom:8px;display:flex;justify-content:space-between}
.mkan .kcard{background:var(--p-surface);border:1px solid var(--p-line);border-radius:10px;padding:8px 10px;margin-bottom:7px;font-size:11.5px;box-shadow:0 1px 2px rgb(33 27 21/.06)}
.mkan .kcard b{display:block;font-size:12px;font-weight:650}
.mkan .kcard span{color:var(--p-ink-3);font-size:10.5px}

/* cards */
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.mcard{background:var(--p-surface);border:1px solid var(--p-line);border-radius:14px;padding:0;overflow:hidden;box-shadow:0 1px 2px rgb(33 27 21/.06);display:flex;flex-direction:column}
.mcard .thumb{height:66px;background:linear-gradient(135deg,#FFF1E5,#FCEFE2 60%,#EEF1FB);display:grid;place-items:center;color:var(--p-brand);border-bottom:1px solid var(--p-line)}
.mcard:nth-child(2n) .thumb{background:linear-gradient(135deg,#FDE7D2,#FFF7EF 60%,#EEF1FB);color:#5B5BD6}
.mcard:nth-child(3n) .thumb{background:linear-gradient(135deg,#FFF7EF,#EEF1FB 60%,#FFF1E5);color:#C2610F}
/* course-card banner: the titled cover art the real catalogue cards carry */
.mcard .banner{aspect-ratio:2/1;border-bottom:1px solid var(--p-line);background:none;padding:0;overflow:hidden;position:relative}
.mcard .banner svg,.mcard .banner img{width:100%;height:100%;display:block;object-fit:cover}
/* photo cover with the course title set over it, as the live catalogue cards do */
.mcard .banner .bov{
  position:absolute;inset:0;padding:11px 13px;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(180deg,rgba(24,17,11,.42) 0%,rgba(24,17,11,.08) 30%,rgba(24,17,11,.34) 56%,rgba(24,17,11,.8) 100%);color:#fff;
}
.mcard .banner .bov .bwm{font-size:8.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.92;margin-bottom:auto;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.mcard .banner .bov .bt{font-size:17px;font-weight:800;letter-spacing:-.03em;line-height:1.15;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.mcard .banner .bov .bs{font-size:11px;font-weight:650;opacity:.92;margin-top:1px}
.mcard .banner .bov .bc{align-self:flex-start;margin-top:7px;background:rgba(255,255,255,.92);color:#211B15;font-size:9.5px;font-weight:750;border-radius:6px;padding:3px 8px}
.mvideo.hasposter::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,12,.18),rgba(20,16,12,.62))}
.mvideo.hasposter>*{position:relative;z-index:1}
.mcard .cbody{padding:11px 12px;flex:1;display:flex;flex-direction:column}
.mcard .cbody .mchip{align-self:flex-start}
.mcard b{font-size:13px;display:block;font-weight:700;letter-spacing:-.015em}
.mcard span.csub{font-size:11.5px;color:var(--p-ink-3);display:block;margin-top:2px}
.mcard .cfoot{margin-top:auto;padding-top:11px}
.mcard .cbtn{display:block;text-align:center;background:var(--p-brand);color:#fff;border-radius:9px;padding:6px;font-size:12px;font-weight:650}

/* chat */
.mchat{display:flex;flex-direction:column;gap:8px}
.mmsg{max-width:78%;padding:9px 13px;border-radius:14px;font-size:12.5px}
.mmsg.user{align-self:flex-end;background:var(--p-brand);color:#fff;border-bottom-right-radius:4px}
.mmsg.ai,.mmsg.agent{align-self:flex-start;background:var(--p-surface-2);border:1px solid var(--p-line);border-bottom-left-radius:4px}
.mmsg.system{align-self:center;background:none;color:var(--p-ink-3);font-size:11px}
.mcomposer{display:flex;gap:8px;margin-top:6px}
.mcomposer .inp{flex:1;background:var(--p-surface);border:1px solid var(--p-line-2);border-radius:10px;padding:8px 12px;color:var(--p-ink-3);font-size:12.5px}

/* form */
.mform .ff{margin-bottom:11px}
.mform label{display:block;font-size:12px;font-weight:650;color:#2C3A36;margin-bottom:5px}
.mform .fv{background:var(--p-surface);border:1px solid var(--p-line-2);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--p-ink)}
.mform .fv.sel::after{content:'⌄';float:right;color:var(--p-ink-3);font-weight:700;line-height:1}
.mform .ff.tg{display:flex;align-items:center;gap:10px}
.mform .ff.tg label{margin-bottom:0;flex:1}
.mtoggle{display:inline-flex;width:34px;height:19px;border-radius:99px;background:var(--p-brand);position:relative;flex-shrink:0}
.mtoggle::after{content:'';position:absolute;right:2px;top:2px;width:15px;height:15px;border-radius:99px;background:#fff}
.mtoggle.off{background:var(--p-line-2)}
.mtoggle.off::after{right:auto;left:2px}

/* player / outline */
.mplayer{display:flex;gap:14px;min-height:220px}
.mplayer .pol{width:192px;flex-shrink:0;border-right:1px solid var(--p-line);padding-right:12px;font-size:12px}
.mplayer .pol .og{font-weight:750;font-size:11.5px;margin:6px 0 6px;color:var(--p-ink)}
.mplayer .pol .oi{padding:6px 8px;border-radius:8px;color:var(--p-ink-2);display:flex;gap:7px;align-items:center;font-size:11.5px}
.mplayer .pol .oi.on{background:var(--p-brand-soft);color:#8A4310;font-weight:650}
.mplayer .pol .oi .tick{color:#12794A;font-weight:800}
.mplayer .psl{flex:1;min-width:0}
.mplayer .psl h4{font-size:16px;margin-bottom:7px;font-weight:750;letter-spacing:-.02em}
.mplayer .psl p{font-size:12.5px;color:var(--p-ink-2)}

/* video */
.mvideo{background:#1E1913;border-radius:12px;aspect-ratio:16/7.5;position:relative;display:grid;place-items:center;overflow:hidden}
.mvideo .play{width:46px;height:46px;border-radius:99px;background:rgb(255 255 255/.93);display:grid;place-items:center;color:#1E1913;font-size:17px;padding-left:4px}
.mvideo .vt{position:absolute;left:12px;right:12px;bottom:10px;color:#fff;font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phone .mvideo{aspect-ratio:16/9.5}
.mvideo .vbar{position:absolute;left:12px;right:12px;bottom:34px;height:4px;border-radius:99px;background:rgb(255 255 255/.25)}
.mvideo .vbar i{display:block;width:38%;height:100%;border-radius:99px;background:var(--p-brand)}

/* funnel + chart */
.mfunnel .fs{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mfunnel .fs .fl{width:116px;font-size:11.5px;color:var(--p-ink-2);text-align:right;flex-shrink:0;font-weight:600}
.mfunnel .fs .fb{height:24px;border-radius:7px;background:linear-gradient(90deg,var(--p-brand),#F59A55);color:#fff;font-size:11px;font-weight:750;display:flex;align-items:center;padding:0 9px;min-width:36px}
.mchart>svg{width:100%;height:112px;display:block;overflow:visible}
.mchart .wg-h svg{width:16px;height:16px;flex-shrink:0}
.mchart .clegend{display:flex;gap:14px;margin-left:auto;font-size:11px;color:var(--p-ink-2);font-weight:600}
.mchart .clegend i{width:8px;height:8px;border-radius:99px;background:var(--p-brand);display:inline-block;margin-right:5px}

/* list */
.mlist .li{display:flex;gap:11px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--p-line)}
.mlist .li:last-child{border-bottom:0}
.mlist .li .lt{flex:1;min-width:0}
.mlist .li b{font-size:12.5px;display:block;font-weight:650}
.mlist .li span{font-size:11.5px;color:var(--p-ink-3)}
.mlist .li .lr{font-size:11.5px;color:var(--p-ink-2);font-weight:650;flex-shrink:0}

/* invoice */
.minvoice{font-size:12.5px}
.minvoice .ih{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.minvoice .ih b{font-size:15px;font-weight:800;letter-spacing:.06em;color:var(--p-ink)}
.minvoice .ih span{font-size:12px;color:var(--p-ink-3);font-weight:650}
.minvoice table{width:100%;border-collapse:collapse}
.minvoice td{padding:7px 4px;border-bottom:1px solid var(--p-line);color:var(--p-ink-2)}
.minvoice td:last-child{text-align:right;font-weight:650;color:var(--p-ink)}
.minvoice .tot td{border-bottom:0;font-weight:800;color:var(--p-ink);font-size:14px;padding-top:11px}

/* call */
.mcall{display:flex;gap:14px;align-items:flex-start}
.mcall .cavatar{width:44px;height:44px;border-radius:99px;background:var(--p-brand-soft);color:#8A4310;display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0}
.mcall .cbody{flex:1;min-width:0}
.mcall .cbody b{font-size:14px;font-weight:700}
.mcall .cbody .cnum{font:600 11.5px var(--fm);color:var(--p-ink-3);margin-top:2px}
.mcall .clines{margin-top:10px;border-left:2px solid var(--p-line-2);padding-left:11px;font-size:11.5px;color:var(--p-ink-2)}
.mcall .clines div{margin-bottom:5px}

/* tree / builder / whiteboard / notify / wizard */
.mtree .tn{margin-left:14px;padding:6px 10px;border-left:2px solid var(--p-line-2);font-size:12px;color:var(--p-ink-2)}
.mtree > .tn:first-child{margin-left:0;border-left:0;font-weight:750;color:var(--p-ink)}
.mbuilder{display:flex;gap:12px}
.mbuilder .btray{width:128px;flex-shrink:0}
.mbuilder .btray .bw{background:var(--p-surface);border:1px solid var(--p-line-2);border-radius:9px;padding:8px 9px;font-size:11px;color:#2C3A36;font-weight:600;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.mbuilder .btray .bw::after{content:'+';color:var(--p-ink-3);font-weight:700}
.mbuilder .bcanvas{flex:1;border:1px dashed var(--p-line-2);border-radius:12px;padding:11px;background:var(--p-bg)}
.mbuilder .bsec{background:var(--p-surface);border:1px solid var(--p-line);border-radius:9px;padding:10px 11px;font-size:11.5px;margin-bottom:8px;display:flex;justify-content:space-between;color:#2C3A36;font-weight:600}
.mwb{background:var(--p-bg);border:1px solid var(--p-line);border-radius:12px;min-height:180px;position:relative;overflow:hidden}
.mwb .wtools{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:5px}
.mwb .wtool{width:28px;height:28px;border-radius:9px;background:var(--p-surface);border:1px solid var(--p-line-2);display:grid;place-items:center;font-size:12px}
.mwb .wscript{position:absolute;left:58px;right:14px;top:18px;font-size:17px;font-weight:750;letter-spacing:-.02em;color:var(--p-ink)}
.mwb .wreact{position:absolute;right:12px;bottom:10px;display:flex;gap:6px;font-size:13px}
.mnotify .nrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--p-line);font-size:12.5px;color:#3B4C47}
.mnotify .nrow:last-child{border-bottom:0}
.mnotify .nch{font-size:9.5px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--p-brand-soft);color:#8A4310;flex-shrink:0;min-width:64px;text-align:center}
.mwizard{display:flex;align-items:center;flex-wrap:wrap}
.mwizard .ws{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--p-ink-3);font-weight:650}
.mwizard .ws .wn{width:21px;height:21px;border-radius:99px;background:var(--p-surface-2);border:1px solid var(--p-line-2);display:grid;place-items:center;font-size:10px;font-weight:800}
.mwizard .ws.on{color:#8A4310}
.mwizard .ws.on .wn{background:var(--p-brand);border-color:var(--p-brand);color:#fff}
.mwizard .wl{width:26px;height:2px;background:var(--p-line-2);margin:0 9px}
/* segmented control — Learning Timeline / Progress / AI Analysis, Roster / Content Map / Live Feed */
.msegs{display:inline-flex;gap:4px;background:var(--p-surface-2);border:1px solid var(--p-line);border-radius:11px;padding:4px}
.msegs .sg{display:inline-flex;align-items:center;gap:7px;padding:7px 15px;border-radius:8px;font-size:13px;font-weight:650;color:var(--p-ink-2);white-space:nowrap}
.msegs .sg.on{background:var(--p-brand);color:#fff;box-shadow:0 1px 3px rgb(33 27 21/.16)}
.msegs .sg.on svg{color:#fff}
.msegs.plain .sg.on{background:var(--p-surface);color:var(--p-ink);border:1px solid var(--p-line-2)}

/* labelled detail grid — Session Details */
.mprops{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.mprops .pr:has(.pv.link){grid-column:1/-1}
.mprops .pr{display:flex;gap:11px;align-items:flex-start}
.mprops .pr .pic{width:32px;height:32px;border-radius:9px;background:var(--p-brand-soft);color:var(--p-brand);display:grid;place-items:center;flex-shrink:0}
.mprops .pr>span:last-child{display:block;min-width:0}
.mprops .pr .pl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--p-ink-3)}
.mprops .pr .pv{display:block;font-size:13.5px;font-weight:650;margin-top:2px}
.mprops .pr .pv.link{color:var(--p-brand-d);word-break:break-all;font-weight:600}

/* leaderboard */
.mranks .rk{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--p-line)}
.mranks .rk:last-child{border-bottom:0}
.mranks .rk .pos{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:var(--p-surface-2);color:var(--p-ink-2);flex-shrink:0}
.mranks .rk .pos.m1{background:#FDE9C8;color:#8A5B0B}.mranks .rk .pos.m2{background:#ECEEF0;color:#5B646B}
.mranks .rk .pos.m3{background:#F7DFCB;color:#8A4310}
.mranks .rk .nm{flex:1;min-width:0;font-size:13.5px;font-weight:650}
.mranks .rk .pts{font-size:13px;font-weight:750;color:var(--p-ink-2)}
.mbadges{display:flex;flex-wrap:wrap;gap:10px}
.mbadges .bg{display:flex;align-items:center;gap:9px;background:var(--p-surface-2);border:1px solid var(--p-line);border-radius:11px;padding:9px 13px;font-size:12.5px;font-weight:650}
.mbadges .bg .bn{margin-left:6px;font-weight:800;color:var(--p-ink-2)}

/* two-pane thread — Doubt Management */
.mthread{display:flex;gap:0;border:1px solid var(--p-line);border-radius:12px;overflow:hidden;min-height:300px}
.mthread .tlist{width:250px;flex-shrink:0;border-right:1px solid var(--p-line);background:var(--p-surface)}
.mthread .tlist .ti{padding:11px 13px;border-bottom:1px solid var(--p-line);display:flex;gap:9px}
.mthread .tlist .ti.on{background:var(--p-brand-soft)}
.mthread .av{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;font-size:10.5px;font-weight:800;flex-shrink:0;background:#EDEBFB;color:#6D57D6}
.mthread .av.a1{background:#E9F8EF;color:#12794A}.mthread .av.a2{background:#FFF0E3;color:#8A4310}
.mthread .tlist .ti .tb{flex:1;min-width:0}
.mthread .tlist .ti b{font-size:12.5px;display:block}
.mthread .tlist .ti p{font-size:11.5px;color:var(--p-ink-2);margin:2px 0 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mthread .tlist .ti .tw{font-size:10.5px;color:var(--p-ink-3);flex-shrink:0}
.mthread .tpane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--p-surface)}
.mthread .thead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--p-line);flex-wrap:wrap}
.mthread .thead b{font-size:14px}
.mthread .assign{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--p-line);align-items:center}
.mthread .assign .lbl{font-size:11.5px;color:var(--p-ink-3);font-weight:650;margin-right:2px}
.mthread .assign .tag{display:inline-flex;align-items:center;gap:6px;background:var(--p-brand-soft);color:var(--p-brand-ink);border-radius:8px;padding:4px 9px;font-size:11.5px;font-weight:650}
.mthread .tbody{padding:14px;flex:1;display:flex;flex-direction:column;gap:11px}
.mthread .tmsg{background:var(--p-surface-2);border:1px solid var(--p-line);border-radius:11px;padding:11px 13px}
.mthread .tmsg .who{font-size:12px;font-weight:700;margin-bottom:3px;display:flex;gap:8px;align-items:baseline}
.mthread .tmsg .who span{font-weight:500;color:var(--p-ink-3);font-size:11px;margin-left:auto}
.mthread .tmsg p{font-size:12.5px;color:var(--p-ink-2)}
.mthread .rte{border-top:1px solid var(--p-line);padding:10px 14px}
.mthread .rte .tools{display:flex;gap:9px;font-size:11.5px;color:var(--p-ink-3);font-weight:700;margin-bottom:8px;flex-wrap:wrap}
.mthread .rte .box{border:1px solid var(--p-line-2);border-radius:10px;padding:10px 12px;color:var(--p-ink-3);font-size:12.5px;display:flex;align-items:center}
.mthread .rte .box .send{margin-left:auto;width:30px;height:30px;border-radius:99px;background:var(--p-brand);color:#fff;display:grid;place-items:center}
@media (max-width:820px){.mthread .tlist{display:none}}

/* scheduled session card with join link + QR */
.msession{border:1px solid var(--p-line);border-radius:12px;padding:14px 15px;margin-bottom:11px;background:var(--p-surface)}
.msession:last-child{margin-bottom:0}
.msession .sh{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.msession .sh b{font-size:14.5px;font-weight:750}
.msession .smeta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:12px;color:var(--p-ink-2);margin-bottom:10px}
.msession .smeta i{font-style:normal;color:var(--p-ink-3);font-weight:650;margin-right:5px}
.msession .sfoot{display:flex;align-items:center;gap:12px}
.msession .sfoot .jl{flex:1;min-width:0;font-size:12px;color:var(--p-brand-d);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msession .sfoot .jl i{font-style:normal;color:var(--p-ink-3);font-weight:650;margin-right:6px}
.msession .qr{width:56px;height:56px;flex-shrink:0;border-radius:6px;overflow:hidden}
.msession .qr svg{display:block;width:100%;height:100%}
.msession .ib{width:32px;height:32px;border:1px solid var(--p-line-2);border-radius:8px;display:grid;place-items:center;color:var(--p-ink-2);flex-shrink:0}

/* dialog — Activity Stats, Enroll Learner */
.mmodal{border:1px solid var(--p-line-2);border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgb(33 27 21/.14);background:var(--p-surface)}
.mmodal .mh{display:flex;align-items:center;gap:12px;padding:15px 17px;background:linear-gradient(180deg,#FFF7F0,var(--p-surface));border-bottom:1px solid var(--p-line)}
.mmodal .mh .mi{width:38px;height:38px;border-radius:11px;background:var(--p-brand-soft);color:var(--p-brand);display:grid;place-items:center;flex-shrink:0}
.mmodal .mh b{font-size:16px;font-weight:750;display:block}
.mmodal .mh span{font-size:12.5px;color:var(--p-ink-2)}
.mmodal .mh .x{margin-left:auto;color:var(--p-ink-3);font-size:17px}
.mmodal .mb{padding:15px 17px;display:flex;flex-direction:column;gap:13px}
.mmodal .mf{display:flex;gap:9px;justify-content:flex-end;padding:13px 17px;border-top:1px solid var(--p-line);background:var(--p-surface-2)}

/* slide editor rail — Lecture Video Slides */
.mslides{display:flex;gap:14px;min-height:300px}
.mslides .srail{width:250px;flex-shrink:0;border-right:1px solid var(--p-line);padding-right:12px}
.mslides .scrumb{font-size:11.5px;color:var(--p-ink-3);font-weight:650;margin-bottom:9px}
.mslides .scrumb b{color:var(--p-ink)}
.mslides .schip{display:inline-block;background:var(--p-brand-soft);color:var(--p-brand-ink);border-radius:7px;padding:4px 10px;font-size:11.5px;font-weight:700;margin-bottom:10px}
.mslides .si{display:flex;align-items:center;gap:10px;border:1px solid var(--p-line);border-radius:10px;padding:9px 10px;margin-bottom:7px}
.mslides .si.on{border-color:var(--p-brand);background:var(--p-brand-soft)}
.mslides .si .n{width:24px;height:24px;border-radius:7px;background:var(--p-surface-2);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--p-ink-2);flex-shrink:0}
.mslides .si.on .n{background:var(--p-brand);color:#fff}
.mslides .si .st{flex:1;min-width:0}
.mslides .si b{font-size:12.5px;display:block;font-weight:650}
.mslides .si.on b{color:var(--p-brand-d)}
.mslides .si span{font-size:11px;color:var(--p-ink-3)}
.mslides .si .ok{color:#12794A;flex-shrink:0}
.mslides .spane{flex:1;min-width:0;display:flex;flex-direction:column;gap:11px}
.mslides .spane .stitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mslides .spane .stitle b{font-size:16px;font-weight:750;flex:1;min-width:0}
@media (max-width:820px){.mslides .srail{display:none}}

/* Vacademy Assistant panel */
.massist{width:372px;max-width:100%;border:1px solid var(--p-line-2);border-radius:15px;overflow:hidden;
  background:var(--p-surface);box-shadow:0 14px 44px rgb(33 27 21/.18);display:flex;flex-direction:column}
.massist .ah{display:flex;align-items:center;gap:12px;padding:14px 15px;background:var(--p-brand-ink);color:#fff}
.massist .ah .ava{width:38px;height:38px;border-radius:99px;background:rgb(255 255 255/.18);display:grid;place-items:center;flex-shrink:0}
.massist .ah b{font-size:16px;font-weight:750;display:block;letter-spacing:-.02em}
.massist .ah span{font-size:12.5px;opacity:.82}
.massist .ah .ax{margin-left:auto;display:flex;gap:12px;align-items:center;opacity:.9;font-size:17px}
.massist .ab{padding:18px 16px 14px;overflow:auto;max-height:470px}
.massist .aicon{width:56px;height:56px;border-radius:99px;background:var(--p-surface-2);color:var(--p-ink-2);display:grid;place-items:center;margin:0 auto 12px}
.massist .ahi{text-align:center;font-size:17px;font-weight:750;letter-spacing:-.02em;margin-bottom:14px}
.massist .acap{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.massist .acap .cp{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--p-ink)}
.massist .acap .cp svg{color:var(--p-brand);margin-top:2px;flex-shrink:0}
.massist .asug{display:flex;flex-direction:column;gap:9px}
.massist .asug .sq{border:1px solid var(--p-line-2);border-radius:10px;padding:11px 14px;font-size:13.5px;text-align:center;color:var(--p-ink);background:var(--p-surface)}
.massist .af{display:flex;gap:9px;padding:12px 13px;border-top:1px solid var(--p-line);align-items:center;background:var(--p-surface)}

":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Guided course creation wizard","description":"Step-by-step setup for name, description, learning outcomes, about section, target audience, tags, preview image, banner and promo media (image, uploaded video or YouTube link) with built-in image cropping."},{"name":"Four offering types","description":"Create each offering as a Course, Membership, Product or Service — the same engine sells classic courses, recurring memberships or one-off services."},{"name":"Bulk course creation","description":"Create many courses in a single operation instead of one at a time."},{"name":"Course cards with live stats","description":"Library cards show ratings, instructors with photos, tags and optionally the count of actively enrolled learners per course."},{"name":"Search, filter and sort","description":"Find courses by keyword, level, tag or owning staff member; sort results and page through large catalogs."},{"name":"Edit and delete with safeguards","description":"Update course details anytime; deletion asks for confirmation and supports removing multiple courses at once."},{"name":"Faculty-scoped views","description":"Teachers with restricted access see only their own courses, with irrelevant filters hidden automatically."},{"name":"Instructor invitations","description":"Invite co-instructors onto a course while creating it, so teaching teams are in place from the start."},{"name":"Coming soon courses with a waitlist","description":"Mark a course Coming soon with a launch date and custom ribbon; interested visitors join the course's own waitlist, which admins can notify in one step at launch."},{"name":"Sell straight from the creation wizard","description":"An optional final step in course creation sets the payment option and invite link for each batch, so a new course is ready to sell immediately."},{"name":"Shared author profiles","description":"Reusable author profiles with photo, subtitle and bio appear on course pages, without ever exposing staff email addresses to learners."},{"name":"Module and chapter descriptions","description":"Add a short description to each module and chapter that appears on the content cards admins and learners see."}]},{"id":"course-hierarchy","name":"Flexible Course Hierarchy","tagline":"2-to-5 level course structures that match how you teach","description":"Structure courses with 2, 3, 4 or 5 levels of depth — from a simple chapter list up to full Level → Session → Subject → Module → Chapter trees — instead of being forced into a flat lesson list. Every layer can be added, renamed, reordered by drag-and-drop, copied, moved and deleted. Academic sessions (year or semester) and levels (class or grade) are optional and switch on or off per institute.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Selectable course depth","description":"Choose a 2, 3, 4 or 5-level structure per course, or fix a default depth institute-wide so all courses stay consistent."},{"name":"Levels management","description":"Add, update and delete levels (e.g. Class 9, Beginner/Advanced) with durations and thumbnails."},{"name":"Academic sessions","description":"Create, edit and delete academic sessions (e.g. 2026-27) and map level/session combinations into batches."},{"name":"Session-to-session content rollover","description":"Roll a whole session's content forward into a new academic session in one action — no rebuilding each year."},{"name":"Subjects and modules","description":"Add, update, reorder and delete subjects and their modules, each with names and thumbnails."},{"name":"Chapters with copy and move","description":"Create and edit chapters, drag to reorder, and copy or move a chapter with all its slides to another module, course or batch."},{"name":"Outline vs structure view","description":"Choose whether learners and staff see a course as a flat outline or a nested structure, with sections expanded or collapsed by default."}]},{"id":"slide-authoring","name":"Slide-Based Content Authoring","tagline":"Every lesson is a slide — 12+ content types, one editor","description":"Chapters are built from slides — individual learning units that can be a video, PDF, rich document, quiz, question, assignment, assessment, audio track, SCORM package, code editor, Jupyter notebook, Scratch project or interactive presentation. Authors work in a single editor with a chapter sidebar, adding, reordering, renaming, copying and moving slides freely, with full version history and engagement stats on every slide.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"12+ slide types from one menu","description":"Add PDF, PPT presentation, rich document, video (upload, YouTube or Vimeo), question, quiz, assignment, assessment, presentation, Jupyter notebook, Scratch project, audio, code editor and SCORM slides from a single add menu."},{"name":"Draft / publish lifecycle","description":"Slides are authored as drafts and explicitly published; draft and published content are stored separately so edits never leak early, and slides can be unpublished again."},{"name":"Drag-and-drop reordering","description":"Reorder slides in the chapter sidebar with drag-and-drop; the new order saves instantly."},{"name":"Copy and move slides","description":"Copy or move any slide to a different chapter, module, subject or course — ideal for reusing lessons across batches."},{"name":"Version history and restore","description":"Every save is captured in a content history timeline; authors can view past versions of a slide and restore any of them with one click."},{"name":"Slide-level engagement stats","description":"An activity panel shows which learners viewed or submitted on each slide, flags late submissions, and exports all submissions to CSV."},{"name":"In-context doubt resolution","description":"Learner doubts raised on a slide appear in a sidebar where staff can reply, assign a teacher, mark resolved or delete."},{"name":"Read-time analytics by content type","description":"Slide counts and estimated read time per content type help gauge course length at a glance."},{"name":"Interactive HTML slides from uploads","description":"Upload a self-contained HTML file and it runs as an interactive slide with its own styling and scripts, safely sandboxed from the rest of the app."},{"name":"Course-wide unsaved drafts","description":"A banner lists every slide with unsaved changes across the course, so authors can compare and restore drafts instead of losing work."}]},{"id":"course-player","name":"Interactive Course Player","tagline":"One player for video, documents, quizzes, code and more","description":"Learners consume content slide by slide in a distraction-free player with a full course-tree sidebar. The player natively renders more than a dozen content types — video, rich documents, PDFs, slide decks, audio, quizzes, assignments, code editors, notebooks, Scratch, SCORM and whiteboards — and always remembers exactly where the learner left off, down to the video second or PDF page.","roles":["Learner"],"platforms":["Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Every slide type, natively rendered","description":"Videos, documents, PDFs, presentation decks, audio, questions, quizzes, assignments, code editors, Jupyter notebooks, Scratch projects, SCORM packages and whiteboard slides all play inside one consistent player."},{"name":"Course tree navigation","description":"A collapsible sidebar shows the full Subject → Module → Chapter → Slide tree with per-item completion indicators and free navigation."},{"name":"Resume where you left off","description":"Every slide records progress, so learners resume at the exact video second or document page they left — on any device."},{"name":"Custom video player","description":"Plays YouTube, Vimeo and institute-uploaded videos with speed control and watch-position tracking."},{"name":"Rich documents ue/false, numeric, one-word and long answer — plus comprehension versions of MCQ and numeric questions built on a passage."},{"name":"Automatic evaluation","description":"Objective types are auto-graded against configured correct answers; long answers can be collected for manual review."},{"name":"Marks and negative marking","description":"Set marks per question with optional negative marking, and allow or block skipping per question."},{"name":"Explanations and media","description":"Attach an explanation shown after answering and add images and media to questions and options."},{"name":"Survey mode","description":"Run question slides as surveys with no right answer to collect learner feedback inside the course."},{"name":"Preview as a learner","description":"Preview the full quiz exactly as a learner will see it before publishing."},{"name":"Learner quiz experience","description":"Quizzes run with timers, attempt limits, instant feedback, scorecards and a review mode inside the course player."},{"name":"Partial marks for multiple-answer questions","description":"Optionally award a proportional share of marks when a learner picks only some of the correct options, shown as Partially correct in reviews and results."},{"name":"Marks per question in quiz review","description":"Every question in the learner's review shows the marks it earned, colour-coded for full, partial, negative or skipped, so totals are easy to follow."},{"name":"Multiple-answer CSV import","description":"Comma-separated correct answers in a quiz CSV import automatically become multiple-correct questions."}]},{"id":"assignments","name":"Assignments & Homework","tagline":"Deadline-driven homework with submissions, marks and reports","description":"Assignment slides give learners homework with a go-live date, deadline, total and passing marks, reference attachments and structured questions. Learners submit file uploads directly inside the course within precisely enforced submission windows, with configurable re-attempts. Staff review every submission per slide, spot late work, and export everything to CSV, while grades flow back to the learner's homework area.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Scheduling and live deadlines","description":"Set a go-live date and due date per assignment; submission windows are enforced against server time with a live countdown, and late submissions are flagged."},{"name":"Re-attempt policy","description":"Allow a configurable number of resubmissions per learner; the app tracks attempts used and blocks further submissions once exhausted."},{"name":"Marks and passing criteria","description":"Define total and passing marks; learners see their graded marks and pass/fail outcome once evaluated."},{"name":"Attachments and structured questions","description":"Attach reference files and add structured questions with typed answers and options."},{"name":"File-upload submissions","description":"Learners upload one or more files as their submission, with allowed file types configurable by the teacher."},{"name":"Submission review and CSV export","description":"See every learner's submission in an activity sidebar and download all submissions as a CSV."},{"name":"Homework list and reports","description":"A dedicated homework area lists all pending and completed homework across courses, with report views summarizing submissions and outcomes over time."}]},{"id":"documents-pdfs-presentations","name":"Documents, PDFs & Presentation Decks","tagline":"Rich docs, PDFs and animated slide decks learners love","description":"Written content comes in every flavor: upload PDFs, convert Word documents into editable pages, author rich documents in a modern block editor, or let AI write the lesson for you. PowerPoint decks convert automatically — either into polished PDFs or into smooth animated web slideshows that replay build steps — so presentations look as good online as they did in class.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"PDF slides","description":"Upload PDFs with an in-app viewer; page counts are tracked so learner progress can be measured page by page."},{"name":"Rich document editor","description":"Create documents in a modern block-based editor with headings, lists, media and formatting; existing Word docs upload and convert to editable content."},{"name":"AI-written documents","description":"Ask AI to author or rewrite a document slide from a prompt — content arrives as a polished lesson you can keep refining with AI."},{"name":"Animated PPT decks","description":"Upload a .pptx and it becomes a web slideshow that preserves build-step animations as elegant cross-fades, played in an in-course deck player."},{"name":"PowerPoint-to-PDF conversion","description":"Classic .ppt and modern .pptx decks convert to PDFs through a professional-grade conversion engine with standard and high-quality modes; very large decks upload straight to cloud storage and convert by reference, sidestepping size limits."},{"name":"Embedded URL slides","description":"Embed any external web page or tool directly inside a chapter as its own slide."},{"name":"Upgraded block editor","description":"Drag blocks to reorder them, delete blocks on hover, and move older documents to the new editor with a safety check that warns before anything could be lost."}]},{"id":"coding-stem-slides","name":"Coding & STEM Slides","tagline":"Runnable code, Jupyter notebooks and Scratch inside lessons","description":"Teach programming inside the course itself. Code editor slides give learners an in-browser editor where they write and run code against the lesson's starter files; Jupyter notebook and Scratch project slides embed full interactive STEM environments. Every learner code submission is stored and reviewable by staff.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner ription":"Plain text files of YouTube or video URLs expand into individual video slides with sensible titles."},{"name":"Preview and issue checking","description":"A preview tree shows exactly what will be created, with warnings for misplaced or skipped files before you commit."},{"name":"Progress and results report","description":"Watch the import run step by step and get a results summary of everything created."},{"name":"Sample zip download","description":"Download a sample zip that demonstrates the expected folder conventions."},{"name":"SCORM packages in zips","description":"SCORM packages included in a bulk-upload zip become SCORM slides automatically."},{"name":"New chapters from unmatched folders","description":"Zip folders that match no existing chapter are created as new chapters instead of blocking the import."}]},{"id":"drip-content","name":"Drip Content & Prerequisites","tagline":"Unlock content by date, progress or prerequisites","description":"Control exactly when learners can access content. Drip rules apply at course, chapter or individual-slide level and unlock content on a calendar date, after completion thresholds, after specific prerequisite chapters or slides, or strictly in sequence. Learners see locked items with clear unlock requirements, guiding them through a structured path that unlocks automatically as they progress.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Date-based unlock","description":"Release a chapter or slide automatically on a chosen date and time."},{"name":"Completion-based unlock","description":"Unlock content when a learner reaches a completion threshold, including averages over the last N items."},{"name":"Prerequisite rules","description":"Require specific chapters or slides to be finished to a threshold before new content opens."},{"name":"Sequential learning","description":"Force learners to complete the previous item before moving on."},{"name":"Three levels of control","description":"Configure drip at whole-course, chapter or individual-slide level, each with its own dialog and enable toggle."},{"name":"Locked badges and unlock requirements","description":"Locked items show a lock indicator in the course tree, and learners see exactly what they must complete to unlock the next piece of content."},{"name":"Day-wise release schedule","description":"Release one item every N days counted from each learner's enrolment or the batch start, at a set time, choosing whether upcoming items show locked or stay hidden."},{"name":"Preview mode for progress rules","description":"Progress-based rules can be set up in preview without affecting learners until switched on, while date and day-wise rules apply immediately."}]},{"id":"certificates","name":"Certificates: Designer, Auto-Issue & Bulk Generation","tagline":"Design once — certificates issue themselves","description":"Design completion certificates visually with no designer needed: start from a template gallery, customize in a drag-and-drop editor or drop to HTML for full control, or upload your own PDF design and place data fields exactly where they belong. Certificates then issue automatically the moment a learner crosses the completion threshold — celebrated in-app with confetti, downloadable from the course page, and emailed with the PDF attached. Bulk generation personalizes hundreds of certificates at once from a batch or CSV.","roles":["Admin","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Template gallery","description":"Start from professionally designed built-in certificate templates."},{"name":"Visual drag-and-drop editor","description":"Design text, images and layout in a visual editor with a customization panel."},{"name":"HTML mode","description":"Drop to full HTML editing for pixel-perfect branded certificates."},{"name":"Upload your own PDF design","description":"Use an existing certificate design as the template by uploading it as a PDF."},{"name":"Drag-and-drop field placement","description":"Place name, email and any custom CSV column onto the exact spot on the certificate with a visual field palette."},{"name":"Student data from batch or CSV","description":"Pull learners from an enrolled batch or upload a CSV (with a downloadable template) and get validation results before generating."},{"name":"Live per-student preview","description":"Preview exactly how any individual learner's certificate will look before generation."},{"name":"Bulk generation and download","description":"Generate personalized certificates for a whole batch at once and download the PDFs plus a generation summary."},{"name":"Auto-issue on course completion","description":"Certificates generate automatically with the learner's name and course details once completion passes the institute-set threshold."},{"name":"In-app celebration, view and download","description":"A completion banner with confetti celebrates the milestone, and learners view and download their certificate from the course page."},{"name":"Automatic certificate emails","description":"Every issued certificate is recorded and delivered to the learner by branded email with the PDF attached."},{"name":"Per-course certificate control","description":"Switch certificates on or off, set the completion threshold and choose the design for each course, overriding the institute defaults."},{"name":"Course certificates tab","description":"See issued, pending, completed-awaiting and near-threshold learners for a course in one tab, with a per-learner table."},{"name":"Custom certificate numbering","description":"Build your own certificate number format from prefix, suffix, year and a sequential counter, starting from any number you choose."},{"name":"QR and barcode verification","description":"Every certificate carries a scannable code that opens a branded public verification page — or, if preferred, the institute's own document with details filled in."},{"name":"Custom certificate fields","description":"Add your own fields such as grade or an accreditation line, filled with fixed text or each learner's own registration answers."},{"name":"Template library with auto-fit text","description":"Start from a library of ready designs; long names and titles automatically shrink to fit their box instead of overflowing."}]},{"id":"learner-home-dashboard","name":"Learner Home Dashboard","tagline":"Everything a learner needs on one personalized screen","description":"The learner's landing page brings together courses, live classes, tests, progress, attendance and announcements in one place. Institutes control exactly which widgets appear, so every brand shapes its own home experience — including a gamified 'Play' theme for younger audiences.","roles":["Learner","Admin"],"platforms":["Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Continue Learning card","description":"One-tap resume that takes the learner straight back to the exact lesson slide they last studied."},{"name":"Learning stats cards","description":"At-a-glance counters for enrolled courses, assigned tests and upcoming live sessions."},{"name":"Upcoming live classes widget","description":"Today's and upcoming live sessions with join buttons, all converted to the learner's own timezone."},{"name":"Weekly attendance widget","description":"The learner's live-class attendance for the week (present / absent / pending) right on the home screen."},{"name":"Past learning insights","description":"A 7-day activity view with charts showing how much the learner studied recently."},{"name":"Pinned announcements panel","description":"Institute announcements pinned by admins appear at the top of the dashboard."},{"name":"Raise a query card","description":"Learners can raise a support query to the institute directly from the dashboard."},{"name":"Gamification panel","description":"Streak counter, XP display, level progress ring and achievement badges appear when gamification is enabled."},{"name":"Membership, books and orders widgets","description":"Optional widgets showing the learner's active membership, purchased books and materials, and order history."},{"name":"Institute-configurable widget layout","description":"Admins choose per institute which dashboard widgets learners see, including alternative hero styles and a kid-friendly Play theme."},{"name":"Terms acceptance prompt","description":"A first-login modal captures the learner's acceptance of the institute's terms and conditions."},{"name":"Notifications preview","description":"Recent notifications listed on the dashboard with a link to the full notification center."},{"name":"Per-course progress widgets","description":"Optionally give each enrolled course its own dashboard widget with progress and a quick way back into the course."},{"name":"Custom Courses-page tabs","description":"Add tabs beside In Progress and Completed that show live sessions, free courses, hand-picked courses, sales pages or courses with chosen tags."},{"name":"Switchable onboarding and rewards blocks","description":"Admins can hide the first-run Getting started checklist and the XP, streak and badges block for institutes that don't use them."}]},{"id":"daily-engagement","name":"Daily Engagement Plans","tagline":"Daily bite-sized tasks that build a learning habit","description":"Teachers schedule what each batch sees on the learner home page every day — readings, a question of the day, flashcards, polls, games or a lesson from the course — inside a set time window. Learners work through a Today queue, earn points, keep their streak alive and come back at reveal time to see answers. Plans run on calendar dates or on days counted from each learner's join date, and teachers can see exactly who is keeping up and who is slipping.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Seven task types","description":"Mix readings, visual notes, questions of the day (multiple choice, written or file upload), flashcard decks, polls, sandboxed HTML games and existing course lessons in a single day's plan."},{"name":"Calendar or days-after-joining schedules","description":"Run a plan on fixed dates with repeat-on-weekdays, or as Day 1 to Day N counted from each learner's own enrolment, so every new joiner gets the same onboarding sequence."},{"name":"Time windows, reminders and answer reveal","description":"Each day opens and closes at set times in the institute's timezone, can push a reminder to learners, and reveals answers and poll results at a chosen time."},{"name":"Missed-task and catch-up policy","description":"Choose whether a missed task expires, can be caught up late for full points, or for reduced points — catch-up recovers points but never repairs a broken streak."},{"name":"Learner Today module","description":"A home-page card shows today's tasks with progress, countdowns, points, catch-up items and what is coming next, plus a Daily tasks page with Today, revealed Answers and a Past history."},{"name":"Flashcard decks with bulk import","description":"Build decks of up to 50 cards with hints, paste or upload a list to import, shuffle per learner; learners flip, self-rate and resume where they left off."},{"name":"Assign course lessons as tasks","description":"Turn any published slide into a daily task from the composer, the course page's Engagement tab or an Assign as task button on the slide; it completes when the lesson does."},{"name":"Multi-batch plans and duplication","description":"Create a plan for several batches at once — each keeps its own tracking — then publish, unpublish, archive, edit or duplicate plans to other batches."},{"name":"Progress tracking and CSV export","description":"Per-task learner tables show done, late, correct, points, written answers and uploads, answer distributions and card stats, while a plan overview flags learners who are falling behind."},{"name":"Plan with AI","description":"Describe the topic, pick chapters, duration and task types, and AI drafts the whole plan for the teacher to review and edit before anything reaches learners."}]},{"id":"course-approval-workflow","name":"Course Approval Workflow","tagline":"Teachers author, admins approve — quality stays controlled","description":"Require editorial review before courses go live. Teachers author courses or create an editable copy of a live course, submit for review, and can withdraw a submission. Admins get a pending-review dashboard where they approve or reject with full course history and an approval summary — so published content is always vetted, and the live version stays untouched until approval.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Teacher-authored courses","description":"Teachers create their own courses and track them in an authored-courses tab with detailed status."},{"name":"Editable copies of live courses","description":"Teachers edit a safe copy of a published course; the live version stays untouched until approval."},{"name":"Submit and withdraw for review","description":"Send a course for review or pull it back; an edit-permission check tells teachers when a course is locked."},{"name":"Admin approval dashboard","description":"Admins see all courses pending review, open full review details, and approve or reject with reasons."},{"name":"Approval history and summary","description":"Every course keeps an approval history, and a summary view shows the institute's review pipeline at a glance."},{"name":"In-review protection","description":"Slides under review are guarded against conflicting edits."},{"name":"Direct publishing per role","description":"Switch approval off for a teacher or custom role to give them a Publish button, while other roles keep the review step."}]},{"id":"content-reuse","name":"Content Copy & Reuse Across Batches","tagline":"Build once, reuse everywhere — with lineage tracking","description":"Copy whole course content between batches, sessions and courses, so new intakes start from proven material. The platform records copy lineage, showing where a batch's content originally came from, and copy or move is available at every level: course, session, subject, module, chapter and slide.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Copy whole course content","description":"Duplicate a batch's full content tree into another batch or course in one operation."},{"name":"Copy lineage badge","description":"See the ancestry of copied content — which batch it was copied from — right on the course page."},{"name":"Granular copy and move","description":"Copy or move individual subjects, chapters and slides between any location in the library."},{"name":"Copy content during course creation","description":"Start a new course by copying content from an existing one via a guided dialog."},{"name":"Copy to many places at once","description":"Copy or move a slide or chapter to several destinations in one action, with a picker that asks only for the levels each course actually has."}]},{"id":"scorm-import","name":"SCORM Course Import","tagline":"Your existing SCORM e-learning works out of the box","description":"Institutes with existing e-learning content can upload SCORM packages as slides. The platform hosts and plays each package and records learner progress and completion back into the course, so legacy content plugs straight into the modern LMS.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web"],"subFeatures":[{"name":"SCORM package upload","description":"Upload a SCORM zip; it is unpacked, hosted and playable as a slide."},{"name":"Progress tracking","description":"Learner sessions record SCORM tracking data, so scores and completion flow into course progress."},{"name":"SCORM preview","description":"Authors preview the package inside the editor before publishing."}]},{"id":"audio-lessons","name":"Audio Lessons","tagline":"Podcast-style audio as first-class course content","description":"Upload audio files as slides for language drills, lectures or podcast-style lessons. Audio plays in a dedicated in-course player with progress tracked like any other slide, and follows the same draft-and-publish lifecycle as all content.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Audio upload and player","description":"Upload audio files which learners play in an in-course audio player with progress tracking."},{"name":"Draft and publish for audio","description":"Audio slides follow the same draft/publish lifecycle as other content."}]},{"id":"whiteboard-presentations","name":"Interactive Presentation & Whiteboard Slides","tagline":"Draw, present and teach on an infinite canvas","description":"Presentation slides open an infinite whiteboard canvas where teachers sketch diagrams, drawings and full slide decks. The same presentations can be used live through the presentation client, bridging course content and classroom teaching.","roles":["Admin","Teacher"],"platforms":["Admin Web","Engage Client"],"subFeatures":[{"name":"Whiteboard-style presentation editor","description":"Create presentation slides on a freeform drawing canvas with shapes, text and sketches."},{"name":"Create presentations from the library","description":"Spin up a new interactive presentation directly from the study library for use in live teaching."}]},{"id":"study-material-library","name":"Study Material File Library","tagline":"Organized folders of study docs with audience control","description":"Beyond courses, staff maintain a folder-based library of standalone study documents. Upload files or create study docs in-app, organize them into folders, and control whether each document is visible to learners, staff only, or both.","roles":["Ad
