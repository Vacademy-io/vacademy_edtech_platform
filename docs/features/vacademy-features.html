d per-type counts to keep the library tidy."}]},{"id":"email-deliverability","name":"Email Deliverability & Bounce Protection","tagline":"Automatic suppression keeps your sender reputation clean","description":"Send from multiple verified institute addresses while the platform protects your deliverability automatically: addresses that hard-bounce or complain are suppressed from future sends, admins review and manage the list, and recipients can opt out instantly via one-click unsubscribe links.","roles":["Admin","Learner"],"platforms":["Admin Web","Public Web","API"],"subFeatures":[{"name":"Verified sender addresses","description":"Add multiple sending addresses with display names and purposes — announcements, marketing, receipts, chat and community — each with its own verification status."},{"name":"Automatic suppression","description":"Bounced and complained addresses are captured from the email provider and blocked from future sends automatically."},{"name":"Suppression list management","description":"Search and browse all blocked addresses with details of why and when they bounced; unblock a corrected address or re-block one with instant effect."},{"name":"Bounce statistics","description":"A stats view summarises bounce volume and types across the institute."},{"name":"Pre-send batch checking","description":"Check a whole recipient list against the suppression list in one call before a bulk send."},{"name":"One-click unsubscribe","description":"Public per-channel unsubscribe links honor opt-outs instantly."},{"name":"Daily sending caps per sender","description":"Limit how many emails each sender address sends per day; overflow queues automatically and goes out when the next sending window opens in the sender's timezone."},{"name":"Warm-up ramp and weekend pause","description":"Grow a new sender's daily cap on a schedule — start small, step up every few days, stop at a ceiling — and optionally hold mail over weekends."},{"name":"Standards-compliant unsubscribe","description":"Promotional emails carry one-click unsubscribe headers and a footer with your sender name and postal address, and opted-out recipients are skipped automatically."}]},{"id":"transactional-email","name":"Transactional Email & OTP Delivery","tagline":"Reliable system emails: OTPs, invites and receipts","description":"The same messaging engine powers critical system emails — one-time login codes, new-user invitations and automated receipts — sent through the institute's verified senders with the same tracking and bounce protection as campaigns.","roles":["Admin","Teacher","Learner"],"platforms":["Learner Web","Learner Mobile App","API"],"subFeatures":[{"name":"Email OTP","description":"One-time verification codes are generated and emailed for secure login and identity verification."},{"name":"New user invitations","description":"Invitation emails onboard newly added users with their access details."},{"name":"Full delivery logging","description":"System emails carry the same status tracking as all other communication and appear in the contact timeline."},{"name":"CC or BCC per email type","description":"Copy staff on enrolment, payment confirmation, invoice, fee receipt, certificate, guardian and team-invite emails, choosing CC or BCC and the addresses for each."},{"name":"Default or custom credential emails","description":"When sharing credentials or resetting a learner's password, choose the system email or your own template; resets can send a secure link instead of a password."}]},{"id":"push-notifications","name":"Push & In-App Notifications","tagline":"In-app inbox plus real push to phones and desktops","description":"A notification center collects everything users need to act on, while native push notifications reach Android and iOS devices even when the app is closed. Institutes connect their own Firebase project in minutes, and learners control exactly which notifications they receive.","roles":["Admin","Learner","Parent"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"Notification center","description":"A full-page list of all notifications with read states, plus a dashboard preview of the latest."},{"name":"Mobile and web push","description":"Firebase-powered push to Android, iOS and web for classes, tests, announcements and messages — delivered even when the app is closed."},{"name":"Self-serve push setup","description":"Enable push for your institute by pasting your Firebase configuration — no engineering work required."},{"name":"Personal notification preferences","description":"A settings panel where each user chooses which notification types they receive."}]},{"id":"batch-chat","name":"Messaging & Batch Chat","tagline":"Direct messages and batch group chats inside the learning app","description":"Learners message teachers and peers one-to-one, participate in batch group chats, and follow community channels — all without leaving the app or exposing anyone's personal phone number. Institute-defined rules keep community spaces safe.","roles":["Learner","Teacher"],"platforms":["Learner Web","Learner Mobile App","Learner Desktop App"],"subFeatures":[{"name":"One-to-one messages","description":"Start direct conversations from a new-chat modal and continue them in a threaded view."},{"name":"Batch group chat","description":"A chat panel scoped to the learner's batch for class-wide discussion."},{"name":"Conversation inbox","description":"A conversation list showing all active threads with unread indicators."},{"name":"Community rules panel","description":"Institute-defined rules displayed within community chat spaces."}]},{"id":"permissions-approvals","name":"Permissions, Moderation & Approval Workflow","tagline":"Control who can announce what, with maker-checker approval","description":"Decide per role who may send each type of communication — teachers can post to streams while only admins send system alerts, for example. Messages from restricted roles enter a pending-approval queue before anything goes out, and per-channel policies govern moderation, limits and retention across the whole suite.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App","API"],"subFeatures":[{"name":"Per-channel role permissions","description":"For every in-app channel — community, pins, alerts, DMs, streams, resources, overlays — configure independently whether learners, teachers and admins can send."},{"name":"Approval queue","description":"A dedicated approvals screen lists announcements pending review; approvers approve or reject each one with a reason, and creators submit drafts for approval."},{"name":"Learner-to-learner DM control","description":"An explicit switch governs whether learners may direct-message other learners."},{"name":"Moderation controls","description":"Approval-required toggles, banned keyword lists, automatic moderation actions, daily announcement caps and per-channel reply on/off switches."},{"name":"Channel behaviour policies","description":"Auto-dismiss timing for alerts, pin limits and durations per user, stream tags and retention days, and a maximum file size for shared resources."},{"name":"Community guidelines","description":"Set a guidelines title and list of rules shown to your community."},{"name":"Institute defaults with restore","description":"All communication settings live in one per-institute configuration with sensible defaults, a default timezone for scheduled sends, validation and restore-to-defaults."},{"name":"Personal notification preferences","description":"Each user has their own preference profile controlling how they receive communications."}]}],"demo":{"intro":"Follow one announcement from the composer to every learner's screen, then work the WhatsApp inbox and check what actually got read.","screens":[{"id":"composer","device":"desktop","title":"New Announcement","nav":["Dashboard","Study Library","Learners","Communication*","Reports","Settings"],"widgets":[{"type":"header","id":"comp-head","title":"New Announcement — PTM & Fee Reminder","subtitle":"Priority: High · Draft","actions":["Save Draft","Submit for Approval"]},{"type":"wizard","id":"comp-wizard","steps":["Content","Audience","Channels","Schedule"],"active":1},{"cols":[{"type":"form","id":"comp-audience","title":"Audience","fields":[{"label":"Recipients","value":"All Learners · NEET 2027 Batch A","type":"select"},{"label":"Also include","value":"Tag: Hostel Students (142)","type":"select"},{"label":"Custom-field filter","value":"City equals Kota","type":"select"},{"label":"Exclude","value":"Batch: JEE Advanced Evening","type":"select"},{"label":"Estimated reach","value":"1,286 recipients","type":"text"}]},{"type":"form","id":"comp-channels","title":"Channels & schedule","fields":[{"label":"Email subject","value":"PTM on Sat, 26 Jul — please confirm your slot","type":"text"},{"label":"WhatsApp template","value":"ptm_fee_reminder_v2 · {{1}} name, {{2}} date","type":"select"},{"label":"Push notification","value":"Auto-filled from content","type":"select"},{"label":"Send","value":"Next Monday, 9:00 AM IST","type":"select"}],"submit":"Schedule Send"}]}],"module":"crm"},{"id":"learner-phone","device":"phone","title":"Learner App","nav":["Home*","Courses","Messages","Profile"],"widgets":[{"type":"header","id":"lp-head","title":"Hi Rohan","subtitle":"NEET 2027 Batch A · Kota"},{"type":"notify","id":"lp-notify","items":[{"channel":"WhatsApp","text":"PTM on Sat 26 Jul, 10 AM. Reply YES to confirm — Nalanda Academy"},{"channel":"Email","text":"PTM on Sat, 26 Jul — please confirm your slot"},{"channel":"Push","text":"PTM this Saturday · Fee due 31 Jul"},{"channel":"In-app","text":"Pinned to your dashboard until 26 Jul"}]},{"type":"list","id":"lp-surfaces","items":[{"title":"Alert: PTM this Saturday","sub":"Auto-dismisses after 7 days","chip":"Urgent","tone":"red"},{"title":"Task: Confirm your PTM slot","sub":"Due Fri, 25 Jul · Mandatory","chip":"Live","tone":"green"},{"title":"Batch A stream · Announcement","sub":"Posted by Priya Ma'am","chip":"New","tone":"blue"}]}]},{"id":"wa-inbox","device":"desktop","title":"WhatsApp Team Inbox","nav":["Dashboard","Study Library","Learners","Communication*","Reports","Settings"],"widgets":[{"type":"header","id":"wa-head","title":"WhatsApp Inbox","subtitle":"+91 98220 04xxx · Meta Cloud API","actions":["New Template"]},{"cols":[{"type":"list","id":"wa-convos","items":[{"title":"Sunita Sharma (Parent)","sub":"YES, we will attend","right":"2m","chip":"2 new","tone":"green"},{"title":"Aarav Mehta · NEET Batch A","sub":"Can I pay the fee in two parts?","right":"18m","chip":"1 new","tone":"green"},{"title":"Priya Nair · IELTS lead","sub":"What are the batch timings?","right":"1h"},{"title":"Kavya Reddy (Parent)","sub":"Received, thank you","right":"Yesterday"}]},{"type":"chat","id":"wa-chat","messages":[{"from":"agent","text":"PTM on Sat 26 Jul, 10 AM. Reply YES to confirm — Nalanda Academy"},{"from":"user","text":"Can I pay the fee in two parts?"},{"from":"agent","text":"Yes Aarav — ₹22,500 now and ₹22,500 by 30 Aug. Sending your payment link."},{"from":"system","text":"24-hour reply window open · closes today 6:42 PM"}],"composer":"Reply to Aarav…"}]}],"module":"crm"},{"id":"analytics","device":"desktop","title":"Communication Hub","nav":["Dashboard","Study Library","Learners","Communication*","Reports","Settings"],"widgets":[{"type":"header","id":"hub-head","title":"Communication Hub","subtitle":"Last 30 days · All batches"},{"type":"stats","id":"hub-stats","items":[{"label":"Delivered","value":"12,480","delta":"+9% vs June"},{"label":"Read","value":"9,734","delta":"78% read rate"},{"label":"WhatsApp replies","value":"1,214"},{"label":"Bounces suppressed","value":"37"}]},{"cols":[{"type":"chart","id":"hub-chart","kind":"bars","label":"Read rate by channel (%)","values":[92,81,78,64]},{"type":"list","id":"hub-suppress","items":[{"title":"rohit.k@gmali.com","sub":"Hard bounce · suppressed 12 Jul","chip":"Blocked","tone":"red"},{"title":"PTM & Fee Reminder","sub":"1,286 sent · 1,271 delivered · 8 failed","chip":"Re-deliver","tone":"orange"},{"title":"Weekly digest · every Mon 9 AM","sub":"Recurring · next run 21 Jul","chip":"Scheduled","tone":"blue"}]}]}],"module":"crm"}],"steps":[{"screen":"composer","target":null,"title":"Compose once, reach everyone","text":"Write an announcement in a rich-text editor (or raw HTML), attach PDFs and videos, and mark priority up to Urgent. Every announcement has a lifecycle — draft, approval, scheduled, active — so nothing goes out half-baked."},{"screen":"composer","target":"comp-audience","title":"Target exactly who should hear it","text":"Mix seven recipient types — roles, users, batches, tags, custom-field filters, campaign audiences — and layer exclusions on top. A live estimate shows 1,286 recipients before you commit to sending."},{"screen":"composer","target":"comp-channels","title":"Email, WhatsApp and push in one send","text":"Each channel keeps its own settings: email subject and from-address, an approved WhatsApp template with variable mapping, and push that auto-fills from your content. Send now, next Monday 9 AM, or on a weekly repeat."},{"screen":"learner-phone","target":"lp-notify","title":"One send lands on every screen","text":"The same announcement arrives on WhatsApp (via Meta Cloud API, WATI or Combot), email, Firebase push — even with the app closed — and in-app, with delivery tracked per recipient on every channel."},{"screen":"learner-phone","target":"lp-surfaces","title":"Nine in-app surfaces, streamed live","text":"Beyond notifications: dashboard pins, urgent alerts, class-stream posts, even announcements-as-tasks with deadlines and mandatory flags. Everything streams to open apps in real time — no refresh."},{"screen":"wa-inbox","target":"wa-convos","title":"A shared WhatsApp inbox for your team","text":"Parent and learner replies flow back through provider webhooks into one team inbox, sorted by recency with unread counts. Numbers match to platform users, so staff always know it's Aarav from NEET Batch A."},{"screen":"wa-inbox","target":"wa-chat","title":"Compliant with WhatsApp's rules, always","text":"Reply free-text inside the 24-hour customer-service window; once it closes, send a Meta-approved template to re-open the thread. Build and submit templates to Meta in-app, in 13 languages."},{"screen":"analytics","target":"hub-stats","title":"Know what landed — and what got read","text":"Per-announcement stats track delivered, read and dismissed counts down to per-recipient timestamps. Failed sends are flagged with one-click re-delivery, and WhatsApp receipts confirm sent, delivered, read."},{"screen":"analytics","target":"hub-suppress","title":"Deliverability protected automatically","text":"Hard bounces and complaints are suppressed from future sends automatically, recipients get one-click unsubscribe, and you can check a whole list against suppressions before any bulk send."}]}},{"id":"voice","name":"Voice & AI Calling","icon":"voice","color":"#D97706","tagline":"Cloud telephony, IVR and AI agents that call for you","description":"Vacademy turns your admissions phone line into a complete calling operation: an AI voice agent that phones every enquiry within about a minute in natural Hindi, English or Hinglish, plus a full cloud-calling desk for your human counsellors — click-to-call, recordings, dispositions, IVR menus and smart inbound routing. Use Vacademy's own built-in telephony with no telecom setup, or plug in your existing Exotel, Plivo or Airtel IQ account. Every conversation is logged, transcribed and AI-scored, so managers coach from evidence and billing stays transparent, per minute.","features":[{"id":"vacademy-ai-voice-agent","name":"Vacademy AI Voice Agent","tagline":"An AI that phones your leads and sounds human","description":"A first-party AI calling agent that holds natural phone conversations with leads — greeting, qualifying, answering questions and handling objections — in Hindi, English or mixed Hinglish. New enquiries are dialled within about 60 seconds, and every call ends with the outcome, a lead rating and the answers you asked for written straight onto the lead record. Institutes author their own agent personas with custom scripts, voices and goals, and the agent hands the call to a human counsellor whenever the conversation warrants it.","roles":["Admin","Counsellor"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"Custom agent personas","description":"Create any number of named AI agents, each with its own opening line, conversation instructions, language, voice, direction (outbound, inbound or both) and enable/disable switch."},{"name":"Hindi, English and Hinglish","description":"The agent converses naturally in Hindi, English or mixed Hinglish and follows callers who switch mid-sentence — the way parents and students actually talk. Callers can interrupt it and it keeps up."},{"name":"Natural Indian voices","description":"Pick from a wide catalogue of male and female Indian voices across several speech engines, with per-agent speaking pace (0.5–2.0x) and expressiveness controls, plus a voice tester in settings."},{"name":"Calls every lead in about 60 seconds","description":"New enquiries are dialled within about a minute of arriving, and imported lead lists are worked through automatically."},{"name":"Question extraction onto the lead","description":"Define the questions each agent should get answered — class, budget, timeline and more — and the extracted answers are written straight onto the lead record after the call."},{"name":"Automatic disposition and lead rating","description":"After each call the outcome and a lead rating land on the lead record, so counsellors pick up ready, pre-qualified leads."},{"name":"Custom dispositions per agent","description":"Each agent can carry its own list of allowed call outcomes, or inherit the institute's defaults."},{"name":"Mid-call human handoff","description":"The agent transfers the live call to configured human numbers when the caller asks for a person or the conversation warrants it, with voicemail as the final fallback."},{"name":"Call-length cap","description":"A per-agent maximum call duration keeps AI conversations — and their cost — bounded."},{"name":"Try it live before you buy","description":"Prospects can talk to the AI agent from the public website in Hindi, English or Hinglish, and listen to a real sample recording."},{"name":"Runs on Vacademy's own telephony","description":"AI calls are carried on the institute's Vacademy Voice numbers — no third-party AI-calling vendor or extra account required."},{"name":"Choice of voice engines, priced upfront","description":"Pick a speech engine per agent — from a low-cost option to premium Indian voices or an English-only voice — with the credits-per-minute cost shown right in the picker."},{"name":"Voice modulation","description":"A per-agent preset widens how much the voice's pitch rises and falls, turning a flat, read-out tone conversational on any voice and engine."},{"name":"Knows today's date and time","description":"Agents greet by the actual time of day, turn 'tomorrow' or 'day after' into real dates, and scripts can use day, date and time placeholders in the institute's timezone."},{"name":"Natural phone manner","description":"Agents speak everyday phone Hindi, cushion questions warmly instead of interrogating, never repeat the same sentence, and stay in English for the rest of the call once a caller asks."},{"name":"Voicemail detection","description":"When a call lands on a carrier voicemail, the agent hangs up instead of talking to a machine, saving minutes and keeping the lead's history clean."}]},{"id":"ai-agent-studio","name":"AI Agent Studio & Prompt Assistant","tagline":"Launch a well-scripted AI caller in minutes","description":"A dedicated AI Agents workspace under Calling where institutes create, test and refine their AI callers. Start from ready-made education use cases, answer a few plain questions, and AI drafts the full script, opening line, questions to ask and call outcomes together. A built-in prompt assistant scores any script, flags instructions that break on live calls, and rewrites it from your notes or from the agent's own recent calls — so agents keep getting better without prompt-engineering skills.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Use-case gallery","description":"Start from six ready-made education agents — Doubt Solver, Study Mentor, Parent Update, Admissions Counsellor, Fee Reminder and Re-engagement — each card showing a sample exchange of how the call sounds."},{"name":"Guided setup wizard","description":"Answer three or four plain questions — institute name, language, what you offer, your goal — and the agent is created with a drafted script, with a ready fallback so setup never dead-ends."},{"name":"Draft with AI","description":"Describe the agent in plain words and AI writes the system prompt, opening line, questions to find out and call outcomes in one go, ready to review and save."},{"name":"Prompt review and scoring","description":"One click scores the script, rates it dimension by dimension and lists suggested improvements you can tick and apply selectively."},{"name":"Live-call checks","description":"The assistant flags instructions known to go wrong on real phone calls, so problems are fixed before the agent ever dials a lead."},{"name":"Improve from real calls","description":"Describe what went wrong and the assistant reads the agent's recent transcripts and outcomes to propose a revision grounded in how calls actually went."},{"name":"Regenerate with your notes","description":"Rewrite the prompt, opening line, questions and outcomes together from short notes, keeping your facts and every field in sync."},{"name":"Agents home","description":"Search and filter agents by status and direction, duplicate an agent as a starting point, and play each agent's voice straight from its card."}]},{"id":"vacademy-voice-telephony","name":"Vacademy Voice (Built-in Cloud Telephony)","tagline":"Business calling that works out of the box","description":"A first-party phone system: Vacademy provisions the numbers, carries the calls and bills per minute, so institutes get professional calling without opening their own telecom account or buying SIMs. It includes outbound click-to-call, inbound IVR, recording, and a built-in India-compliance layer covering calling hours, DND scrubbing and disclosures. Sold as simple published plans starting at ₹3,499/month.","roles":["Admin","Counsellor"],"platforms":["Admin Web","Public Web"],"subFeatures":[{"name":"Managed business numbers","description":"Vacademy provisions each institute's business numbers in its own isolated carrier subaccount, with a configurable default caller-ID for outbound calls."},{"name":"No telecom setup required","description":"No own telephony account or SIM needed — everything runs on Vacademy's telephony. DLT/PE registration is handled separately as Indian telecom regulation requires."},{"name":"India compliance guardrails","description":"Enforced before every dial: DND/NCPR number scrubbing, a configurable calling window (default 9 AM–9 PM in the institute's timezone), recording-consent and automated-call disclosures, and a DLT-registration gate for promotional campaigns."},{"name":"Concurrent-channel plans","description":"Plans define how many simultaneous calls the institute can run, with the purchased channel count acting as a hard dial cap."},{"name":"Recording and timezone controls","description":"A per-institute toggle records all inbound and outbound calls, and a timezone setting drives both the compliance window and reporting."},{"name":"Human handoff numbers","description":"Live calls can be transferred to configured human numbers, including mid-call handoff from the AI agent to a counsellor."},{"name":"Published plans from ₹3,499/month","description":"Voice Basic (₹3,499/mo, ₹3.99/min with ~850+ minutes included), Voice Pro (₹6,999/mo, ~1,750 minutes, adds direct calling and the full voice dashboard), and CRM + Voice monthly (₹8,999/mo). Recordings and full call history are included on every plan."},{"name":"Annual pay-per-use plan","description":"The flagship CRM + Voice annual plan (₹19,999/yr) charges a flat ₹3.49/min from minute one with no monthly minute minimum — built for seasonal admissions, with ₹0 minute charges in quiet months."}]},{"id":"ai-calling-automation","name":"AI Calling Automation & Guardrails","tagline":"Set the rules once — the AI works every lead within them","description":"Govern exactly how AI calling behaves for your institute: which AI provider to use, when the bot may dial, how many times it retries, and what happens after each outcome. Interested leads are auto-assigned to counsellors, and hard daily dial caps make a runaway campaign impossible.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Choice of AI provider","description":"Choose the AI voice provider per institute — Vacademy's own AI agent or an integrated third party (Aavtaar) — with credential management and no change to workflows or buttons."},{"name":"Campaign and agent registry","description":"Create named AI agents and campaigns (e.g. 'Class Feedback'), tagged inbound or outbound, plus a default campaign for ad-hoc calls — so every AI-call report is classified correctly and displays a friendly name."},{"name":"Calling shifts","description":"Define one or more daily time windows (e.g. 09:00–13:00 and 16:00–20:00, in the institute's timezone) in which the AI may dial; leads outside the window are automatically deferred and re-checked."},{"name":"Retry policy","description":"Set max retries per lead, minutes between retries, max AI calls per lead per day, and the minimum connect time that counts a call as answered."},{"name":"Institute-wide daily dial cap","description":"A hard ceiling on total AI dials in any rolling 24 hours — across every lead, campaign and manual click — as the ultimate runaway-spend guardrail."},{"name":"Outcome-to-action rules","description":"Map each call outcome to what happens next — assign a counsellor, stop retrying, or a custom outcome you define (e.g. 'Wrong Number'). Choose which dispositions are terminal and whether leads that exhaust all retries still reach a human."},{"name":"Counsellor assignment modes","description":"After an AI call, assign the lead to a counsellor manually, round-robin, or only to counsellors currently on shift."},{"name":"AI calls inside automation workflows","description":"Drop a 'Call with AI' step into any automation — for example, dial every new enquiry within about 60 seconds of it arriving — picking the agent by name."},{"name":"Lead-list button toggle","description":"Independently show or hide the manual 'AI call' button in lead lists without turning off workflow-driven AI calling."},{"name":"Engaged callers always reach a human","description":"If a caller held a real conversation but the call ended without a clear outcome, the lead goes to a counsellor instead of being re-dialled by the bot."},{"name":"Hand qualified leads to the list's pool","description":"An opt-in switch sends AI-qualified leads to the list's counsellor pool even if they already had an owner — ideal for re-working previously-called lead lists."},{"name":"AI re-call on lead status","description":"A ready workflow template has the AI call a lead back after a set wait when a counsellor marks a status such as 'Did not pick', optionally including leads a counsellor already owns."}]},{"id":"ai-call-follow-through","name":"AI Call Follow-Through","tagline":"Every brochure, link or meeting promised actually goes out","description":"When an AI agent offers a brochure, a quiz link or a counselling slot, follow-through rules make sure it actually happens. Admins write each rule as one plain sentence — when this happens on the call, send this WhatsApp template, email or book a meeting — using the agent's own questions and outcomes. Messages go out the moment the caller says yes or after the call ends, meetings agreed on the call are booked automatically, and every promise shows whether it was delivered.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Plain-sentence rules","description":"Each rule reads as 'when … do … using …', built from the agent's own dispositions and questions — a short questionnaire, not a technical rule builder."},{"name":"Six kinds of trigger","description":"Fire a rule when the caller says yes or no to an offer, the call ends with a chosen outcome, an answer is captured, a meeting time is agreed, or a situation you describe is judged clearly true."},{"name":"WhatsApp, email or meeting actions","description":"Send an approved WhatsApp template (including image-header templates), one of the institute's email templates, or book a meeting on a booking page."},{"name":"Send during or after the call","description":"Deliver a link while the caller is still on the line, the moment they agree, or wait until the call has ended."},{"name":"Variables filled from the lead","description":"Template variables are filled automatically from the lead's own record, and a rule that cannot run explains why instead of failing silently."},{"name":"Automatic meeting booking","description":"Link an agent to a booking page and any demo, visit or callback time agreed on the call — even 'tomorrow at 3' — is booked with host, meeting link and reminders."},{"name":"Promise delivery status","description":"Each call lists what it promised and whether it went out — queued, sent, failed or expired — on the lead's call card and in the Call Log, with the failure reason."}]},{"id":"one-click-bulk-ai-calling","name":"One-Click & Bulk AI Calling","tagline":"AI-call one lead or a whole list, with full queue control","description":"Trigger an AI call on any single lead with one click, choosing which agent speaks and which number it calls from. For a whole audience or a hand-picked selection, 'Call all with AI' first runs a dry run that counts eligible leads without dialing, then queues and paces the calls in the background while outcomes and counsellor assignments land automatically. A dedicated Call Queue page shows everything waiting or live and lets admins pause, resume or cancel at any time.","roles":["Admin","Counsellor"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Per-lead AI call button","description":"One click on any lead row places an immediate AI call, with the acting counsellor recorded as the call's owner."},{"name":"Agent and caller-ID chooser","description":"When the institute has multiple agents or numbers, a chooser lets the caller pick which persona speaks and which caller-ID is used — otherwise sensible defaults apply."},{"name":"Bulk campaign with dry run","description":"'Call all with AI' on an audience list first reports total vs eligible leads without dialing, then on confirmation dispatches paced background calls to every eligible lead."},{"name":"Automatic outcome processing","description":"Each call's end-of-call report drives the next step automatically — retry later, stop, or assign a counsellor — so no one has to babysit the campaign."},{"name":"Attempt tracking","description":"Each lead's AI calls display the true attempt number (Attempt 1, 2, 3...) so the retry sequence reads correctly in the call history."},{"name":"Selected-only or whole-list campaigns","description":"When rows are ticked, choose to AI-call only the selected leads or every eligible lead in the list, and set how many calls run at a time."},{"name":"Live campaign progress","description":"A progress view lists every lead in dial order with its status and an estimated finish time, and the run stays findable after the dialog is closed."},{"name":"AI Call Queue page","description":"A dedicated Calling → Call Queue page shows every AI call waiting, connecting, live or finished, with its agent, what queued it (manual click, campaign or automation) and the expected wait."},{"name":"Pause, resume and cancel","description":"Pause the institute's AI call queue and resume later without losing waiting calls, or cancel a single call, one campaign, or everything still waiting."},{"name":"Manual calls skip the line","description":"A one-click AI call placed by a counsellor goes ahead of queued campaign and automation calls, so live follow-ups never wait behind a bulk run."},{"name":"AI calling API","description":"Start single or bulk AI calls (up to 1,000 numbers per request) and fetch each call's status, duration and recording from your own systems with an institute API key."}]},{"id":"inbound-ai-receptionist","name":"Inbound AI Receptionist & Auto Lead Capture","tagline":"Your AI answers the phone and turns callers into leads","description":"The AI agent can answer your inbound line — as a menu option or the whole line — and hold a real qualification conversation. When an unknown number calls in, the system can automatically create a lead for the caller, de-duplicated by phone number, so every inbound enquiry becomes followable in the CRM.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"AI-answered inbound line","description":"Route inbound calls — directly or via an IVR menu choice — to an AI agent that greets, answers questions and qualifies the caller."},{"name":"Opt-in auto lead creation","description":"An explicit per-institute toggle: when on, unknown inbound callers are created (or matched) as leads by phone number, so no inbound interest is ever lost."},{"name":"Known-caller matching","description":"Inbound calls from existing leads are matched by phone number and attached to the right lead record automatically."},{"name":"Inbound/outbound classification","description":"AI-call reports are labelled inbound vs outbound, so dashboards cleanly separate 'they called us' from 'we called them'."}]},{"id":"call-intelligence","name":"Call Intelligence (AI Transcripts & Scoring)","tagline":"Every call transcribed, scored and summarized by AI","description":"Recordings of human and AI calls are automatically transcribed — Hindi, English and mixed speech — and analysed by AI into a structured report: summary, outcome, ratings, objections, action items and coaching tips. Every AI-agent call is analysed automatically at no extra charge, while analysis of human calls is switched on per institute and metered against credits. You define the scoring rubric and the conversion goal, and the analysis attaches to the call and the lead, giving managers x-ray vision into thousands of conversations without listening to them.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Automatic transcription with translation","description":"Calls are transcribed in the spoken language (Hindi/English/Hinglish, auto-detected) plus an English translation pass, both stored against the call."},{"name":"AI summary and call type","description":"Each call gets a plain-language summary, an inferred call objective, and a type classification such as sales outreach, follow-up, demo booking, objection handling, payment or support."},{"name":"Dual scoring with conversion likelihood","description":"Two 0–10 scores per call — how effectively the counsellor advanced their objective and how strong the outcome was from the lead's perspective — plus a high/medium/low conversion-likelihood estimate."},{"name":"Custom scoring rubric and goal","description":"Define your own weighted quality metrics (defaults: rapport, needs discovery, objection handling, next step secured) and state the conversion goal — e.g. 'book a campus demo' — so every call is measured against what you actually want."},{"name":"Objection and sentiment analysis","description":"The AI lists each objection raised, whether and how it was handled, and reads the lead's overall sentiment."},{"name":"Action items, coaching tips and highlights","description":"Concrete follow-up action items, personalized coaching tips for the caller, a talk-time ratio, and verbatim highlight quotes from the conversation."},{"name":"Normalized outcome status","description":"Every call gets a normalized status — connected positive/neutral/negative, callback requested and more — that powers dashboards and filters."},{"name":"Choose which calls get analysed","description":"Select the sources — telephony calls, AI-agent calls and/or manual uploads — that flow through analysis."},{"name":"Analyze or re-analyze on demand","description":"Any call — old, skipped or failed — can be queued for analysis from its call-log entry with one click."},{"name":"Per-lead intelligence history","description":"All analyzed calls for a lead in one view, across counsellors and attempts, so anyone picking up the lead has full context."},{"name":"On/off switch with cost control","description":"Call Intelligence is a per-institute setting, metered against credits, with minimum-duration gates and clear skip reasons so money isn't spent analysing empty calls."},{"name":"Free, automatic analysis of AI calls","description":"Every AI-agent call is transcribed and analysed automatically at no extra charge; the institute's switch and credit metering apply only to human calls."},{"name":"Two-line call update","description":"Each analysed call gets a two-line plain-language update of what happened and what's next, shown right in the Call Log row."},{"name":"Transcript tab","description":"Read the full call transcript beside the analysis, switching between the original language and an English translation."},{"name":"Analysis in call exports","description":"Call Log CSV and Excel exports include the AI summary, goal, outcome, ratings, sentiment, conversion likelihood and full transcripts for offline review."}]},{"id":"counsellor-coaching-analytics","name":"Counsellor Coaching & Team Call Analytics","tagline":"Know exactly what each counsellor should improve","description":"Roll-ups over the AI call analysis turn thousands of conversations into coaching: each counsellor's weakest skills, recurring improvement tips and the objections they face most, with the calls behind them one click away. A comparison-first team view shows KPIs with deltas against the previous period, and every view is automatically scoped to the manager's own reporting line.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Team insights with trend deltas","description":"Whole-team KPIs — analyzed calls, average quality ratings, positive-sentiment share — each shown with its change versus the immediately preceding equal-length window."},{"name":"Per-counsellor breakdown","description":"One row per rep with analyzed calls, both quality ratings, call-status and sentiment distributions, leads dispositioned and calling reach — each with its own vs-previous delta."},{"name":"Personal coaching insights","description":"For each counsellor: their weakest rubric qualities, recurring coaching tips and the most common objections in their calls, with drill-down into the calls behind them."},{"name":"Team coaching insights","description":"The same coaching view aggregated across a manager's entire reporting line, highlighting top objections, top coaching tips and which counsellors need help on which skill."},{"name":"Counsellor profile tabs","description":"Each counsellor's profile includes Calls and Insights tabs showing their call history and intelligence-driven performance view."},{"name":"Manager-scoped visibility","description":"Every view is automatically scoped by the reporting hierarchy — managers see only their own reps."},{"name":"Flexible date windows","description":"7/30/90-day presets or custom ranges, with the comparison window computed automatically."}]},{"id":"click-to-call","name":"Click-to-Call from the CRM","tagline":"Dial any lead in one click, straight from their record","description":"Counsellors call leads directly from lead lists, the enquiry side view and the counsellor workbench — no separate dialer app. The system bridges the counsellor and the lead through the institute's telephony provider, picks the right caller-ID automatically, and logs everything against the lead. A one-click confirmation step prevents accidental dials from burning calling credit.","roles":["Admin","Counsellor","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"One-click bridged calling","description":"Click the phone icon on a lead and the system rings the counsellor first, then connects the lead — no numbers to type or copy."},{"name":"Caller-ID picker with smart recommendation","description":"Before dialing, a popover shows every available outbound number with the recommended one pre-selected — doubling as a confirm step so a stray click never places a paid call."},{"name":"Automatic number-selection strategies","description":"Choose how the outbound caller-ID is picked per institute: Sticky-per-Lead (the lead always sees the same number), Round Robin, or Region Match."},{"name":"Live call status","description":"Real-time call progress streams onto the screen — Queued, Counsellor Ringing, In Progress, Completed, No Answer, Busy and more — so the counsellor always knows where the call is."},{"name":"Calls panel on the lead record","description":"Every call — human and AI, inbound and outbound — appears in the lead's side-view call history with status, duration, attempt number and outcome."},{"name":"Call from the counsellor workbench","description":"Team leads reviewing a counsellor can open that counsellor's full call history in a coaching drawer."},{"name":"Call learners, not just leads","description":"Staff can call enrolled learners straight from the student side view, using the same caller-ID picker and live status as lead calls."},{"name":"Calls in the student Communication tab","description":"Calls to a learner sit alongside their emails and WhatsApp messages, with outcome, duration, AI result and inline recording playback."},{"name":"Extensions for admins too","description":"Admins as well as counsellors can be mapped to a calling extension, so anyone on the team can dial from the platform."},{"name":"Know why you can't call","description":"Staff see up front when calling isn't available to them — calling switched off or no extension mapped — instead of a dial that fails after the click."}]},{"id":"call-log-dashboard","name":"Unified Call Log & Calling Dashboard","tagline":"Every call across the team, filterable and exportable","description":"One central Call Log shows every call the organisation makes or receives — human and AI, inbound and outbound, across all connected providers — with headline KPIs and deep filters. Managers see their whole team's calls while each counsellor sees their own, based on the reporting hierarchy, and the filtered list exports to CSV or Excel in one click.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"KPI strip","description":"Headline numbers for the selected period: total calls, connected calls with connect rate, total talk time, and unique leads reached."},{"name":"Worklist chips","description":"One-tap chips surface actionable calls — Missed Inbound (call these back) and Callbacks Due (promised follow-ups whose time has come) — each with a live count badge."},{"name":"Deep filtering","description":"Filter by lead name, phone number, direction, call type (human/AI), provider, call status, disposition, counsellor and date range, with quick 7/30/90-day presets."},{"name":"CSV / Excel export","description":"Export the filtered call list (up to 25,000 rows) as CSV or XLSX for offline analysis or audits."},{"name":"Hierarchy-scoped visibility","description":"Access is automatically scoped by the reporting line: a counsellor sees their own calls, a team head their team's, leadership everything."},{"name":"Phone-number privacy control","description":"Lead phone numbers are masked by default; only staff granted a specific 'view call numbers' permission see unmasked numbers, on screen and in exports."},{"name":"AI outcome enrichment","description":"AI calls in the log show their AI-determined disposition and the true attempt number, so retry sequences read correctly."},{"name":"Hour-level time ranges","description":"Quick 1h, 3h, 6h and 24h presets plus a 'last N hours' box sit beside the 7/30/90-day ranges for watching today's calling as it happens."},{"name":"Outcome strip","description":"Every call outcome in the selected window appears with its count; one click filters the log down to that outcome."},{"name":"AI verdict columns","description":"Rows show the AI scores (caller, outcome, sentiment), the two-line call update, and what the agent did in-call — WhatsApp sends, call-backs and transfers."},{"name":"Follow-up advice per AI call","description":"Each AI call carries a one-line recommendation — worth a manual call, call back at the time they asked, or no manual call needed."},{"name":"Inline lead status and bulk actions","description":"Change a lead's status right from the call row, or select many calls to set status or disposition, assign a counsellor, add to a campaign or re-run AI analysis."}]},{"id":"call-recordings","name":"Call Recordings & Playback","tagline":"Every conversation recorded, stored and replayable","description":"Calls are automatically recorded and attached to the lead they belong to, so anyone with access can replay the exact conversation to audit quality or settle a dispute. Recording can be switched off per institute for organisations that prefer not to record.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Automatic recording","description":"Outbound and inbound calls are recorded automatically across providers — recordings are fetched and stored even when the provider only makes them available after the call ends."},{"name":"In-app playback","description":"Play any recording directly inside the admin dashboard from the call log or the lead's call history — no downloads needed."},{"name":"Recording stored per lead","description":"Each recording lives against the specific lead and call attempt, so the full audio trail of a lead's journey is browsable in one place."},{"name":"Recording on/off switch","description":"A per-institute setting disables recording entirely for organisations that opt out."}]},{"id":"call-dispositions","name":"Call Dispositions & Callback Scheduling","tagline":"Log every outcome and never miss a promised callback","description":"After each call, counsellors pick an outcome from the institute's disposition catalog, add notes, and optionally schedule a callback. Outcomes can automatically move the lead to the matching pipeline stage, keeping the CRM in sync without extra data entry.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Disposition catalog","description":"A per-institute catalog of call outcomes — each with a label, colour and category — powers both the after-call picker and the dashboard's disposition filter."},{"name":"Post-call disposition sheet","description":"A quick after-call panel lets the counsellor set the outcome, add free-text notes and schedule a callback date/time in seconds."},{"name":"Automatic lead-stage sync","description":"When a disposition maps to a pipeline status (e.g. 'Interested'), saving it automatically updates the lead's status in the CRM."},{"name":"Callbacks worklist","description":"Scheduled callbacks surface in the Call Log's 'Callbacks Due' chip so promised follow-ups actually happen."},{"name":"Edit dispositions later","description":"Outcomes can be set or corrected from the call log after the fact, not just immediately post-call."}]},{"id":"smart-inbound-routing","name":"Smart Inbound Call Routing","tagline":"Callers reach the right counsellor automatically","description":"When a lead calls back, the system answers instantly and routes them intelligently — by default to the counsellor who last spoke to them, falling back to a voicemail number if nobody is available. Every inbound call, answered or missed, is logged against the lead so no callback opportunity is lost.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Last-counsellor routing","description":"An inbound caller is automatically connected to the counsellor who most recently spoke with them, preserving relationship continuity."},{"name":"Voicemail fallback","description":"If no matching counsellor is reachable, the call diverts to the institute's configured voicemail number instead of ringing out."},{"name":"Missed-call capture","description":"Missed and unanswered inbound calls are logged with the caller identified by phone number, and surface in the Call Log's 'Missed Inbound' worklist for callback."},{"name":"Instant answer decisions","description":"Routing decisions happen in a fraction of a second while the provider holds the caller, so callers hear ringing rather than dead air."}]},{"id":"ivr-builder","name":"IVR Builder (Multi-Level Phone Menus)","tagline":"Build 'Press 1 for admissions' menus visually","description":"Design the phone menus callers hear when they dial your numbers, in a visual tree editor — no telecom vendor required. Combine spoken prompts, key-press menus of any depth, call forwarding, voicemail and even an AI agent that talks to the caller, then attach a menu to each phone number and it goes live immediately.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Visual menu tree editor","description":"Create, edit and delete complete multi-level IVR menus in a tree editor inside Calling settings, with whole menus saved in one action and labels for easy management."},{"name":"Play prompt steps","description":"Speak a recorded or text-to-speech prompt to the caller, then continue to the next step; prompts are pre-generated so callers never wait for audio."},{"name":"Keypad menus of any depth","description":"Ask the caller to press a digit and branch to a different sub-tree per key — nested 'Press 1 / Press 2' menus to any level."},{"name":"Forward-to-team steps","description":"Ring one or more staff numbers (with the conversation recorded) so a menu choice connects the caller to the right counsellor or team."},{"name":"Voicemail steps","description":"Play a prompt and record the caller's message when no one can pick up."},{"name":"AI-agent steps","description":"Hand the call to a chosen AI voice agent mid-menu — e.g. 'Press 3 to talk to our admissions assistant'."},{"name":"Graceful hangup steps","description":"End the call with an optional closing message."},{"name":"Per-number menus","description":"Assign a default menu to each inbound number, choose where each call starts, and enable or disable menus independently."}]},{"id":"multi-provider-telephony","name":"Multi-Provider Telephony Integrations","tagline":"Bring your own telephony — Exotel, Plivo, Airtel IQ and more","description":"Institutes that already have a cloud-telephony account plug it into Vacademy and get click-to-call, recordings and the unified call log on top of it. Connect Exotel, Plivo, Airtel IQ (Vonage), Aavtaar or Vacademy's own voice service — each provider's quirks are absorbed behind one consistent experience, with encrypted credentials and an in-app setup guide showing the exact settings to paste into the provider's console.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Five providers, one experience","description":"Connect Exotel, Plivo, Airtel IQ/Vonage, Aavtaar or the first-party Vacademy voice service; the settings screen adapts to each provider's capabilities."},{"name":"Exotel integration","description":"Bridged outbound calls, a shared pool of ExoPhone caller-IDs, real-time call events, recordings, inbound routing and one-click number sync from the provider."},{"name":"Airtel IQ / Vonage integration","description":"Click-to-dial through Airtel IQ Business Connect with per-counsellor extensions and direct numbers, plus automatic import of the provider's call records so off-platform calls still appear in the log."},{"name":"Aavtaar.ai integration","description":"Connect an Aavtaar autonomous AI voice-agent account so its AI calls and end-of-call reports flow into the same lead records and call log."},{"name":"Calling on/off and service choice","description":"Turn calling on or off for the institute and choose which connected service counsellors dial through."},{"name":"Encrypted credential vault","description":"Provider API keys and secrets are stored encrypted; re-saving settings never wipes stored secrets, and each provider declares exactly the credential fields it needs."},{"name":"Number pool management","description":"Add phone numbers with nicknames, regions and preference order; enable or disable numbers, set a recommended number, and attach a default IVR menu per number — numbers auto-attach to the inbound call flow."},{"name":"Counsellor extension mapping","description":"Map each counsellor to their extension, optional dedicated caller-ID/DID and provider user ID so inbound calls reach the right person."},{"name":"Caller-ID and voicemail configuration","description":"Decide which number leads see when your team calls, plus a voicemail fallback number for unreachable moments."},{"name":"Balance visibility","description":"The provider wallet balance (e.g. Exotel) and Vacademy calling credits show at the top of Calling settings, so admins spot low credit before it interrupts a live call."},{"name":"Inbound setup guide","description":"A step-by-step in-app guide renders the exact copy-paste URLs and settings to configure in the provider's console."}]},{"id":"calling-reports","name":"Calling Reports & Heatmaps","tagline":"See when your team dials, connects and follows up","description":"The Reports Center includes dedicated calling analytics: daily dial, connect and talk-time trends, a per-counsellor breakdown with outcome counts, a day-of-week by hour heatmap showing when calls actually connect, and a follow-up aging view. Every report respects each viewer's team scope.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Daily calling series","description":"Day-by-day dials, connects and talk time over any date range, with a per-counsellor breakdown including outcome counts."},{"name":"Connect-time heatmap","description":"A day-of-week × hour-of-day grid of dials and connects (in the institute's timezone), revealing the golden hours to call."},{"name":"Follow-up aging report","description":"See how long overdue follow-ups have been waiting, so managers clear the backlog before leads go cold."},{"name":"Calls-per-day sales widget","description":"A calls-per-day widget on the sales dashboard keeps daily calling activity in front of the team."},{"name":"Role-scoped reporting","description":"Every report is automatically scoped: a counsellor sees their own numbers, a team head their team's, leadership the whole institute."}]},{"id":"off-platform-call-upload","name":"Off-Platform Call Upload","tagline":"Made the call on your own phone? Upload it","description":"Counsellors who call a lead from a personal phone or another system can upload the recording afterwards. The call joins the universal call record against the right lead — with direction, duration and time — and, if Call Intelligence is on, gets transcribed and analyzed exactly like a platform call.","roles":["Admin","Counsellor"],"platforms":["Admin Web"],"subFeatures":[{"name":"Recording upload dialog","description":"Upload an audio file against a lead with optional direction, duration, counterparty number and call time; the uploader becomes the call's counsellor unless another is chosen."},{"name":"Joins the universal call log","description":"Uploaded calls appear in the same call log, lead history and reports as provider calls — nothing lives in a side spreadsheet."},{"name":"Same AI analysis pipeline","description":"Uploaded recordings flow through the identical transcription, scoring and coaching analysis as live calls."}]},{"id":"per-minute-billing","name":"Per-Minute Call Billing & Credit Metering","tagline":"Transparent pay-per-minute billing from your credit wallet","description":"Calls carried on Vacademy's telephony bill by the minute against the institute's credit wallet, with separate meters for human voice minutes and AI conversation minutes, inbound and outbound. Rates can be tailored per institute, every charge is applied exactly once, and an automatic reconciliation sweep guarantees no call is missed or double-billed.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Four independent meters","description":"Outbound voice, inbound voice, outbound AI-conversation and inbound AI-conversation minutes are metered separately — an outbound AI call pays voice + AI, while an inbound call answered by a human pays voice only."},{"name":"Only Vacademy-carried calls billed","description":"Calls on the institute's own provider account (Exotel, Airtel) and uploaded recordings are never metered — only minutes on Vacademy-provided lines."},{"name":"Per-institute rate flexibility","description":"Standard per-minute credit rates with per-institute overrides per meter and a per-call minimum charge; calls are billed in half-minute pulses."},{"name":"Guaranteed exactly-once charging","description":"Every charge is applied exactly once, completed calls are stamped when billed, and a reconciliation job retries any charge lost to a transient failure."},{"name":"Channel-day rental support","description":"The billing model also supports per-channel per-day rental pricing for reserved concurrent-call capacity."},{"name":"Half-minute billing pulses","description":"Calls are billed in 30-second pulses at the same per-minute rate, so a five-second unanswered call no longer costs a full minute."},{"name":"Calls stop at zero credits","description":"AI and manual calls on Vacademy lines are blocked automatically once the institute's credits run out, so spend can never run past the wallet."}]}],"demo":{"intro":"Watch an admissions phone line run itself — from the team call log to a live AI agent call, the IVR menu behind it, and the coaching insights AI extracts from every conversation.","screens":[{"id":"call-log","device":"desktop","title":"Call Log","nav":["Dashboard","Leads","Call Log*","Automations","Reports","Settings"],"widgets":[{"type":"header","id":"log-head","title":"Call Log","subtitle":"All providers · Last 7 days","actions":["Export CSV","Filters"]},{"type":"stats","id":"log-kpis","items":[{"label":"Total calls","value":"1,284","delta":"+18% vs prev 7d"},{"label":"Connect rate","value":"71%"},{"label":"Talk time","value":"38h 12m"},{"label":"Missed inbound","value":"6","delta":"call back now"}]},{"type":"table","id":"log-table","columns":["Lead","Direction","Type","Counsellor / Agent","Duration","Outcome"],"rows":[["Ananya Sharma","Outbound",{"chip":"AI · Attempt 1","tone":"purple"},"Diya (AI Agent)","3:42",{"chip":"Interested","tone":"green"}],["Rohan Verma","Outbound","Human","Priya Nair","6:15",{"chip":"Demo booked","tone":"green"}],["+91 98••• ••210","Inbound",{"chip":"AI · Inbound","tone":"purple"},"Diya (AI Agent)","2:58",{"chip":"New lead created","tone":"blue"}],["Aarav Gupta","Outbound",{"chip":"AI · Attempt 2","tone":"purple"},"Diya (AI Agent)","0:00",{"chip":"Retry at 4 PM","tone":"orange"}],["Meera Iyer","Inbound","Human","Kabir Singh","4:03",{"chip":"Callback Fri 11 AM","tone":"orange"}]]}],"module":"crm"},{"id":"live-call","device":"desktop","title":"AI Call — Ananya Sharma","nav":["Dashboard","Leads","Call Log*","Automations","Reports","Settings"],"widgets":[{"type":"call","id":"ai-call","name":"Ananya Sharma","number":"+91 98765 43210","status":"Live","time":"01:47","lines":[{"from":"agent","text":"Namaste! Main Diya bol rahi hoon, Aakash Career Institute se. Aapne NEET 2027 Batch A ke liye enquiry ki thi?"},{"from":"user","text":"Haan, actually I wanted to know the fees and batch timing."},{"from":"agent","text":"Sure! Weekend batch Sat–Sun 9 AM, fee ₹85,000 per year with scholarship test option. Aap Class 11 mein hain?"},{"from":"user","text":"Yes, Class 11. Can I talk to a counsellor about the scholarship?"},{"from":"agent","text":"Bilkul — main aapko Priya ma'am se connect kar rahi hoon, ek second..."}]},{"type":"form","id":"agent-config","title":"Agent: Diya — Admissions","fields":[{"label":"Language","value":"Hinglish (auto-switch)","type":"select"},{"label":"Voice","value":"Kavya · 1.1x pace","type":"select"},{"label":"Extract answers","value":"Class, budget, timeline","type":"text"},{"label":"Handoff to counsellor","value":"on","type":"toggle"},{"label":"Max call length","value":"8 min","type":"select"}],"submit":"Save Agent"}],"module":"crm"},{"id":"ivr","device":"desktop","title":"Calling Settings — IVR Builder","nav":["Dashboard","Leads","Call Log","Automations","Reports","Settings*"],"widgets":[{"type":"header","id":"ivr-head","title":"IVR Menu: Admissions Line","subtitle":"Attached to +91 80471 22334 · Live","actions":["+ Add Step","Save Menu"]},{"type":"tree","id":"ivr-tree","nodes":[{"label":"Play: 'Welcome to Aakash Career Institute'","children":[{"label":"Press 1 — Admissions → ring Priya, Kabir"},{"label":"Press 2 — Fees & payments → ring Accounts desk"},{"label":"Press 3 — Talk to Diya (AI admissions assistant)"},{"label":"Press 9 — After hours → voicemail"}]}]},{"type":"form","id":"ivr-number","title":"Number settings","fields":[{"label":"Inbound number","value":"+91 80471 22334 (Admissions)","type":"select"},{"label":"Unknown caller → create lead","value":"on","type":"toggle"},{"label":"Record all calls","value":"on","type":"toggle"}],"submit":"Apply"}],"module":"crm"},{"id":"coaching","device":"desktop","title":"Team Call Intelligence","nav":["Dashboard","Leads","Call Log","Automations","Reports*","Settings"],"widgets":[{"type":"header","id":"coach-head","title":"Counsellor Coaching","subtitle":"Last 30 days · vs previous 30 days","actions":["7d","30d","90d"]},{"type":"list","id":"coach-list","items":[{"title":"Priya Nair","sub":"84 calls analyzed · Coach on: next step secured","right":"8.4 / 10","chip":"+0.6","tone":"green"},{"title":"Kabir Singh","sub":"71 calls analyzed · Coach on: objection handling","right":"7.1 / 10","chip":"+0.2","tone":"green"},{"title":"Sneha Kulkarni","sub":"63 calls analyzed · Coach on: needs discovery","right":"6.2 / 10","chip":"-0.4","tone":"red"},{"title":"Diya (AI Agent)","sub":"412 calls analyzed · 38% rated Interested","right":"7.8 / 10","chip":"+0.3","tone":"green"}]},{"type":"chart","id":"coach-chart","kind":"bars","label":"Top objections this month (mentions)","values":[46,38,27,19,11]}],"module":"crm"}],"steps":[{"screen":"call-log","target":null,"title":"Every call, one log","text":"Human and AI, inbound and outbound, across Exotel, Plivo, Airtel IQ or Vacademy's own telephony — the whole team's calling lands in one log, scoped by reporting line so managers see their team and counsellors see their own."},{"screen":"call-log","target":"log-kpis","title":"Know the line's pulse instantly","text":"Headline KPIs for any period — total calls, connect rate, talk time — plus worklist chips like Missed Inbound and Callbacks Due, so promised follow-ups actually happen."},{"screen":"call-log","target":"log-table","title":"Filter, replay, export","text":"Filter by counsellor, disposition, provider or call type, play any recording in-app, and export up to 25,000 rows to CSV or Excel. Phone numbers stay masked unless a staff member holds the view-numbers permission."},{"screen":"live-call","target":"ai-call","title":"An AI that phones leads in Hinglish","text":"New enquiries are dialled within about 60 seconds by Vacademy's AI voice agent, which converses naturally in Hindi, English or mixed Hinglish — and hands the live call to a human counsellor the moment the caller asks."},{"screen":"live-call","target":"agent-config","title":"Author your own agent personas","text":"Each named agent gets its own script, one of 37 Indian voices with pace control, the questions to extract (class, budget, timeline) and a call-length cap. Answers, outcome and a lead rating are written onto the lead record after every call."},{"screen":"ivr","target":"ivr-tree","title":"Build phone menus visually","text":"Design 'Press 1 for admissions' trees to any depth — spoken prompts, forward-to-team, voicemail, even a menu key that hands the caller to your AI agent — with no telecom vendor involved. Attach a menu to a number and it's live."},{"screen":"ivr","target":"ivr-number","title":"No inbound enquiry ever lost","text":"Unknown callers can auto-create a de-duplicated lead by phone number, known callers route back to the counsellor who last spoke to them, and recording plus India-compliance guardrails (DND scrubbing, 9 AM–9 PM window) are enforced per institute."},{"screen":"coaching","target":"coach-list","title":"Coach from evidence, not hunches","text":"Every recording is transcribed (Hindi, English, Hinglish) and AI-scored against your own rubric. Roll-ups show each counsellor's weakest skill and recurring coaching tips, with the actual calls one click away."},{"screen":"coaching","target":"coach-chart","title":"See what your market objects to","text":"Objections, sentiment and conversion likelihood are extracted from thousands of calls, with deltas against the previous period — so managers fix the script, not just the rep. Analysis is credit-metered with an on/off switch."}]}},{"id":"ai","name":"Vacademy AI","icon":"ai","color":"#9333EA","tagline":"AI that builds courses, coaches teachers and tutors learners","description":"Vacademy AI puts a full team of AI assistants inside your institute: course builders that turn a single prompt into publish-ready courses, copilots that convert every lecture into notes, quizzes and exam papers, and a branded 24/7 tutor for learners. Everything is governed from one place — choose the AI models that power each job, control exactly where AI appears, and see every credit spent down to the individual conversation.","features":[{"id":"ai-course-builder","name":"AI Course Builder","tagline":"From one prompt to a publish-ready course","description":"Describe the course you want and the AI drafts the whole thing — structure, lesson pages, diagrams, videos, quizzes and homework — ready to review and publish into your study library. Ground the entire course in your own reference PDFs and web pages so content reflects your actual syllabus, and fine-tune everything from chapter count to video voice before generating. What used to take a semester of production ships in an afternoon.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Prompt-based course creation","description":"Type what you want to teach (with clickable example prompts) and get a full course outline plus content. Optional course-goal and learning-outcome fields sharpen the result."},{"name":"Audience targeting","description":"Set learner age range, skill level and course language so difficulty and tone match your students."},{"name":"Reference material grounding","description":"Attach reference PDFs and website URLs (with built-in page scraping) so the AI writes from your actual material — including real figures pulled from your PDFs — instead of generic knowledge."},{"name":"Prerequisite files and links","description":"Add documents and URLs describing what learners should already know, so the course starts at the right level."},{"name":"Structure controls","description":"Choose the number of subjects, modules and chapters, slides per chapter, chapter length in minutes, and overall course depth on a slider."},{"name":"Content-type toggles","description":"Switch on diagrams, code snippets (with programming-language choice), practice problems, curated YouTube videos, AI-generated videos, AI slide decks, AI storybooks, quizzes, homework and worked solutions per course."},{"name":"AI model choice and bring-your-own keys","description":"Pick a specific AI model or leave it on Auto; optionally supply your own OpenAI or Gemini API keys so generation runs on your accounts."},{"name":"Cost preview and confirmation","description":"See the exact credit cost before you commit, with a confirmation dialog showing current usage."},{"name":"Automatic draft resume","description":"In-progress course drafts save automatically; resume or discard a saved draft next time you open the builder."},{"name":"Courses from a knowledge base","description":"Pick a knowledge base or curriculum textbook and choose to follow the book or adapt it, stay within the material or fill gaps, and cover every section or highlights — chapter counts follow the material."},{"name":"Ready for the AI teacher","description":"Courses built with AI can be prepared for Tutor Mode so learners are taught each page one-to-one by the AI teacher."}]},{"id":"ai-outline-editor","name":"AI Outline Editor & Copilot","tagline":"Review, rearrange and regenerate every AI page before publishing","description":"Every AI-drafted course lands in a split-view workspace: the full course hierarchy on one side, a live content editor on the other. Rearrange chapters and pages by drag and drop, inspect and refine the AI prompt behind every planned page, rewrite or regenerate anything you're not happy with, and watch the rest of the course generate in the background — then create the real course in one click.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"One-prompt course outlines","description":"Generate a structured outline of sessions and pages — objectives, topic explanations, quizzes, homework and solutions — from a plain course description."},{"name":"Interactive outline tree","description":"Browse the generated course as chapters and pages; rename, delete or regenerate any chapter or individual page inline."},{"name":"Drag-and-drop restructuring","description":"Reorder chapters and pages by dragging; the final course is created in exactly the order you arrange."},{"name":"Rich page-type palette","description":"Generated pages span learning objectives, topic pages, documents, PDFs, images, quizzes, assessments, homework, solutions, assignments, videos, AI videos, AI slide decks, AI storybooks, code-explainer videos, live code editors, notebooks and visual coding blocks."},{"name":"Per-page AI prompts","description":"Every planned page carries an editable generation prompt you can inspect and refine before content is created."},{"name":"In-place content editing","description":"Edit any page in a rich editor with auto-rendered flowchart diagrams, embedded YouTube players, images and media replacement."},{"name":"Per-page regeneration","description":"Regenerate a single page — or just its video or code section — with a fresh AI pass."},{"name":"Regenerate with feedback","description":"Give the AI corrective instructions and regenerate the outline without starting over."},{"name":"Background generation with progress","description":"Page content generates in the background with per-page and per-chapter progress indicators, so you keep editing while the rest fills in."},{"name":"Course metadata editing","description":"Adjust course title, description and other details before the course is created."},{"name":"One-click publish to study library","description":"Turn the approved draft into a real course with subjects, modules, chapters and pages in your study library."}]},{"id":"learner-ai-tutor","name":"Learner AI Tutor","tagline":"A 24/7 branded tutor that knows what each learner studies","description":"A built-in AI tutor rides along on every learner screen, aware of the course and lesson currently open. It explains concepts, summarizes lessons, generates practice quizzes with instant feedback, and runs full voice conversations — including AI-led mock interviews and oral tests in the learner's language. Admins design the tutor completely: its name, personality, hard rules, chat modes, voices and exactly which pages it appears on.","roles":["Learner","Admin"],"platforms":["Learner Web","Learner Mobile App","Learner Desktop App","Public Web","Admin Web"],"subFeatures":[{"name":"Context-aware chat","description":"The tutor knows the current lesson and offers one-tap quick actions like 'Explain this', 'Summarize', 'Quiz me', 'Hint' and 'Learning path'."},{"name":"Practice quizzes in chat","description":"Say 'I want to practice' and the tutor generates a timed quiz, grades the submission, and returns per-question feedback, explanations, a scorecard and study recommendations."},{"name":"Voice conversations","description":"Hands-free voice mode in three formats — voice doubt-solving, AI-led mock interviews and AI oral tests — with language selection and an animated voice avatar."},{"name":"Attachments and math input","description":"Learners attach images and files to questions and use a math toolbar for proper notation."},{"name":"Offline message queue","description":"Messages composed offline are queued and sent automatically when connectivity returns."},{"name":"Tutor persona designer","description":"Name the tutor, set its role (Tutor, Mentor, Guide), institute name, core instruction, hard-rules list, instruction-adherence level and creativity."},{"name":"Six chat mode toggles","description":"Enable or disable General Chat, Ask Doubt, Practice Quiz, Mock Interview, Voice Doubt and Oral Test modes for learners."},{"name":"Voice selection","description":"Choose the male and female voices the tutor speaks with in voice modes."},{"name":"Page visibility control","description":"Decide exactly where the tutor appears: Dashboard, All Courses, Course Details, Study Material — even logged-out catalogue pages."},{"name":"Branded launcher with nudges","description":"Upload your own assistant icon and title, let learners drag the launcher to either side, and set periodic nudge messages and a bounce animation to invite questions."},{"name":"Docked or popup chat","description":"Learners switch between a docked side panel and a centred popup, and the choice is remembered."},{"name":"Learner AI settings control","description":"Decide whether learners see the AI settings shortcut; it is hidden by default and learners can enable it on their own device."},{"name":"Reads the PDF on screen","description":"When a learner is on a PDF page, the tutor reads its actual text rather than just its title, so answers match what is in front of them."}]},{"id":"ai-teacher-tutor-mode","name":"AI Teacher (Tutor Mode)","tagline":"A one-to-one AI teacher for every course","description":"Turn any course into a one-to-one lesson: an AI teacher speaks each concept while the whiteboard draws itself, checks understanding after every idea, and re-teaches what a learner gets wrong. Admins prepare a course for teaching in one click with the credit cost shown up front, then choose the teacher's name, voice, pace, language and on-screen presence. Teacher insights reveal where each learner struggled and how attentive they were.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Prepare a course for teaching","description":"One click turns documents, PDFs, YouTube videos and AI videos into teaching plans; uploaded videos are transcribed and scanned PDFs read first, with the credit cost shown before anything runs."},{"name":"Teaching notes for videos and PDFs","description":"Add a short description of what a video or PDF covers; the teacher asks the learner to watch or read it, then checks those exact points."},{"name":"Live whiteboard lessons","description":"The board fills as the teacher speaks — every concept opens with its diagram or illustration, followed by worked examples, recaps and visual notes."},{"name":"Checks, re-teaching and weak-spot revisits","description":"After each concept the learner answers by voice or text; wrong answers get a fresh explanation, and weak concepts are revisited later in the course."},{"name":"Doubts mid-lesson","description":"Learners can interrupt with a question at any time; for courses built from a knowledge base, answers draw on that material before the lesson resumes."},{"name":"Teacher voice, pace and language","description":"Set the teacher's name, voice, speaking pace and strictness per course or institute-wide; lessons run in English or Hindi and learners can switch language mid-lesson."},{"name":"Teacher presence and custom avatars","description":"Show a teacher photo, or a lip-synced animated avatar for a small per-minute premium — pick from a gallery, request your own avatar from a photo, or use your own cloned voice."},{"name":"Whole-course navigation","description":"An outline rail shows every chapter, so learners jump anywhere and the teacher carries on across chapters; lessons run full screen or in a phone-friendly layout."},{"name":"Opt-in activeness score","description":"On laptops and desktops, learners can opt in to an on-device camera check that scores attention without streaming video; the teacher pauses when they step away."},{"name":"Teacher insights and exports","description":"See lessons taken, voice usage, drop-offs, weak concepts and average activeness per learner and course, with learner and concept CSV exports."}]},{"id":"kb-study-companions","name":"Student Study Companions","tagline":"Visual study buddies built from your own books","description":"Turn any knowledge base into a friendly study companion that teaches students topic by topic, sets practice questions and answers doubts — strictly from your material, with page citations. Lessons are visual cards built around the book's real figures and tables, and are prepared once and shared by every student to keep costs low. Admins choose the topics, personality, language and who gets each companion, then track progress by topic and by student.","roles":["Admin","Teacher","Learner"],"platforms":["Admin Web","Learner Web","Learner Mobile App"],"subFeatures":[{"name":"Companion designer","description":"Name the companion, pick an avatar, accent colour and personality, choose the chapters or subtopics it covers, and switch Learn, Practice and Ask modes on or off."},{"name":"Targeted assignment","description":"Give a companion to the whole institute, selected batches or individual students, with an optional date window and a daily question limit per student."},{"name":"Visual lessons from the book","description":"Each topic becomes a sequence of visual cards — concepts, the textbook's own figures, comparisons, worked examples, flashcards, quick checks and a recap."},{"name":"Practice sets","description":"Topic-wise multiple-choice practice with instant explanations for every answer."},{"name":"Ask doubts with citations","description":"Students ask questions and get answers only from the material, with page references and zoomable figures; off-topic or do-my-homework requests are politely declined."},{"name":"Read aloud and multiple languages","description":"Companions teach in English, Hindi or Kannada, with key English terms kept alongside, and can read lessons and answers aloud."},{"name":"Progress and resume","description":"A topic map with progress rings and a continue card lets students pick up exactly where they left off."},{"name":"Prepare lessons in advance","description":"Prepare lessons in batches with the credit cost and balance shown first; each lesson is paid for once and shared by all students."},{"name":"Learner progress insights","description":"See students started, topics completed, questions asked and average mastery, broken down by topic and by student, plus a student-view lesso
