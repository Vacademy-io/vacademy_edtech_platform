I","tagline":"Connect Vacademy to anything you build, buy or use","description":"Real-time webhooks for platform events and a REST API covering the platform's core entities let you connect Vacademy to your own systems. Pre-built connectors cover your WordPress website, lead-ad platforms and payment gateways — included with the platform, no enterprise upsell.","roles":["Admin"],"platforms":["API","Admin Web"],"subFeatures":[{"name":"Real-time webhooks","description":"Signed webhook events across the learner lifecycle — enrollment, payments, exams, certificates, leads and more — delivered to your endpoints as they happen."},{"name":"REST API coverage","description":"Programmatic access to courses, batches, learners, exams, payments, certificates and leads for your own integrations."},{"name":"Reliable delivery","description":"Webhook deliveries retry automatically on failure so transient outages on your side don't lose events."},{"name":"Native connectors","description":"Ready-made integrations for WordPress sites, Meta and Google lead ads into the CRM, and payment-gateway webhooks."},{"name":"External LMS connections","description":"Manage connections to external learning systems from a single settings screen, with optional custom fields mapped across each connection so records stay in sync."}]},{"id":"mcp-ai-connector","name":"AI Assistant Connector (MCP)","tagline":"Work with your institute from your favourite AI assistant","description":"Connect popular AI assistants and coding tools to your institute through a secure MCP server, so your team can ask questions about the institute and draft websites, blog posts, lead forms, automations and courses in plain language. Each person signs in with their own account and only ever sees what they can already see in the dashboard. Every change is saved as a draft or added alongside existing data — nothing goes live until an admin publishes it.","roles":["Admin","Teacher","Counsellor"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"One-switch enablement","description":"The server is off until an admin turns it on; the settings page then shows the server URL and step-by-step connection instructions."},{"name":"Personal sign-in and consent","description":"Each person connects with their own account and approves the connection, so access always matches their role in the institute."},{"name":"White-label aware","description":"Institutes on their own branded portals get an institute-specific server address, so sign-in shows their own brand instead of a generic one."},{"name":"Area-by-area permissions","description":"For each area — institute stats, website, blog, lead forms, automations and courses — choose off, view only or edit, with presets for view-only or everything."},{"name":"Role allow-list and per-role overrides","description":"Pick which staff roles may connect at all and grant extra capabilities to specific roles; learners and parents can never connect."},{"name":"Website and blog drafting","description":"Review site pages, audit them, compose or edit pages and blog posts — every change lands as a draft the admin reviews and publishes."},{"name":"Lead forms and automations","description":"Read lead campaigns and recent leads, create new campaigns and fields, and draft automations plus their email and WhatsApp templates."},{"name":"Course drafting","description":"Explore courses and their structure, create draft courses and slides, set drip rules on unpublished courses and create invites and payment plans."},{"name":"Client IDs for other apps","description":"Issue extra client IDs with their own redirect URLs for any other AI app your team uses."},{"name":"Active connections and revoke","description":"See every connected app with who connected it and when it was last used, and revoke any connection instantly."}]},{"id":"institute-profile-settings","name":"Institute Profile & Settings Engine","tagline":"Your identity and configuration, all in one place","description":"Maintain the institute's public profile — name, address, contact, website and type — plus branding assets like theme color and letterhead used across portals, certificates and invoices. A per-institute settings engine underneath lets you define reusable custom fields, customize role display names, and configure dozens of behavior settings across the product.","roles":["Admin"],"platforms":["Admin Web","Public Web","API"],"subFeatures":[{"name":"Institute details editing","description":"Update name, address, email, website and other profile fields; separate learner-portal and admin-portal URLs are stored per institute."},{"name":"Institute types","description":"Classify your organization as a college, school, online coaching or offline coaching institute."},{"name":"Theme & letterhead branding","description":"Set the institute theme color (including role-based multi-hue themes) that skins both portals, and upload a letterhead used on generated documents."},{"name":"Custom field library","description":"Create institute-wide custom fields (text or dropdown), see where each field is used before changing it, and rename fixed system fields."},{"name":"Role display settings","description":"Customize how each role name appears to your team."},{"name":"Settings catalog","description":"Dozens of setting groups — course, LMS, lead, doubt management, live session, AI calling, content protection, theme and more — configured per institute from one place."},{"name":"Public discovery & branding endpoints","description":"Public search across institutes powers discovery experiences, and branding resolves by subdomain to serve white-labeled public pages."}]},{"id":"cloud-file-storage-delivery","name":"Cloud File Storage & Secure Media Delivery","tagline":"Every file stored safely, delivered fast, under your control","description":"Every image, video, PDF, recording and document across the platform is stored securely in the cloud and delivered through smart links you control. Uploads go straight from the user's device to cloud storage via secure one-time links, so even very large lecture videos upload fast, and protected content is served through expiring links that can't be reused forever.","roles":["Admin","Teacher","Counsellor","Learner","Parent"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App","Engage Client","Public Web","API"],"subFeatures":[{"name":"Direct-to-cloud uploads","description":"Files upload straight from the user's device to cloud storage using secure, time-limited upload links — no size bottlenecks, with public-page flows accepting uploads from visitors who aren't logged in."},{"name":"Public and private storage tiers","description":"Open content like thumbnails and catalogue images lives in a fast public tier; sensitive files sit in a private tier reachable only via authorized links, and a private file can be promoted to public when you choose."},{"name":"Encrypted storage for sensitive recordings","description":"Sensitive media such as phone-call recordings is stored with encryption at rest and is only reachable via expiring authorized links."},{"name":"Permanent and expiring links","description":"Open content gets stable always-on links suitable for websites and emails; protected content is served through links that expire after a chosen number of days."},{"name":"Automatic file cataloguing","description":"Each upload records its name, type, size, dimensions and originating feature, so every file stays organized and traceable to its source — and can be looked up by what it belongs to."},{"name":"Smart caching for speed","description":"Delivery uses browser caching and change-detection so repeat views load instantly without re-downloading, while access rules stay intact."},{"name":"Instant links & bulk lookups","description":"Uploads return a ready-to-use viewing link immediately, and pages with lots of media resolve many file links in one request to stay fast."},{"name":"Safe deletion","description":"Files can be removed individually or in batches, with soft-delete protecting user-library files from accidental permanent loss."}]},{"id":"file-library-sharing","name":"File Library & Sharing","tagline":"The right files, shared with exactly the right people","description":"A central library of files, links and rich notes that can be shared with exactly the right audience — a single user, a batch, a role or the whole institute, each with view or edit rights. Learners get a dedicated My Files area listing every report, note and document shared with them, organized into browsable folders.","roles":["Admin","Teacher","Learner","Parent"],"platforms":["Admin Web","Learner Web","Learner Mobile App","Learner Desktop App","API"],"subFeatures":[{"name":"Multi-format entries","description":"Store uploaded files, external web links or rich notes; media is classified as video, audio, PDF, document, image or note."},{"name":"Fine-grained sharing","description":"Grant access at user, batch, role or institute level, with separate view and edit permissions per grant."},{"name":"Access review & editing","description":"Inspect who can see any file and update its access list at any time; withdrawn shares disappear from learner views automatically."},{"name":"Personal folders with icons","description":"Each user's files are organized into named folders with custom icons — certificates, reports, notes — browsable one folder at a time."},{"name":"Learner My Files area","description":"Learners see everything shared with them with type icons and shared dates: links open in a new tab, rich notes read in an in-app preview, and files download via secure links — ideal for report cards, forms and study packs."},{"name":"Email asset library","description":"Upload and browse images used inside email campaigns, kept separate from learning content."}]},{"id":"document-conversion-engine","name":"Smart Document Conversion Engine","tagline":"PDFs and docs become clean, editable web content","description":"Behind features like question import and AI content generation sits a conversion engine that turns PDFs and Word documents into clean web text. It tracks every conversion's status, hosts extracted images automatically, and tidies messy formatting so the result is ready to use.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"PDF and document to web text","description":"Documents are converted to rich web text through professional conversion services, preserving structure and content."},{"name":"Conversion status tracking","description":"Every conversion job records its progress and finished result, so long conversions can be checked and retrieved when ready."},{"name":"Embedded images auto-hosted","description":"Images buried inside documents are extracted, uploaded to cloud storage and swapped for fast-loading hosted links."},{"name":"Legacy image format rescue","description":"Old Windows metafile graphics (WMF/EMF) common in older question banks are converted to modern images that display everywhere."},{"name":"Formatting cleanup","description":"Redundant styling and clutter produced by word processors is stripped so converted content looks clean and consistent."}]},{"id":"background-task-tracker","name":"Background Task Tracker","tagline":"Watch long-running jobs finish without babysitting them","description":"Long-running jobs like AI content generation and document processing are tracked per institute with live statuses. Users see their institute's recent tasks, check progress messages, and pick up results — including generated files — the moment a job completes.","roles":["Admin","Teacher"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"Per-institute task history","description":"Each institute sees its own recent tasks with name, type, status and timestamps."},{"name":"Live status and messages","description":"Tasks report progress states and human-readable status messages while they run."},{"name":"Results with attached files","description":"Finished tasks deliver their output — structured results plus any generated file with a ready download link."},{"name":"Linked task chains","description":"Related jobs, like a re-run or follow-up step, stay linked so their history reads as one connected story."}]},{"id":"platform-data-migration","name":"Platform Data Migration","tagline":"Bring users, enrollments and payment history with you","description":"Move your existing business onto the platform without losing history. A general importer takes bulk users and enrollments complete with payment history, subscriptions, tags and custom fields, while specialized CSV pipelines migrate members from legacy CRMs with staging, validation and per-row result files — so billing continuity survives the cutover.","roles":["Admin"],"platforms":["API"],"subFeatures":[{"name":"Bulk user import","description":"Import users in bulk with per-item results and defaults, including custom fields and tags."},{"name":"Bulk enrollment import","description":"Import enrollments including one-time payments, payment history, subscriptions and gateway references, so billing continuity is preserved."},{"name":"Legacy CRM pipelines","description":"Staged CSV pipelines migrate individual and organization members across active, cancelled and expired segments, each returning a results file."},{"name":"Staging & validation","description":"Records land in staging with validation and status tracking before final migration."},{"name":"Migration status monitoring","description":"Check migration progress and per-record status throughout a cutover."}]},{"id":"platform-billing-pricing","name":"Transparent Platform Billing & Flat-Fee Pricing","tagline":"Flat pricing, no revenue share — keep what you collect","description":"Vacademy is sold on flat annual pricing with no revenue share, no learner caps hidden in the fine print, and no percentage of your fee collections. Everything your institute buys from Vacademy — plans and credit packs — runs through a clean billing pipeline with itemized, tax-compliant invoices and verified payment confirmation.","roles":["Admin"],"platforms":["Admin Web","Public Web","API"],"subFeatures":[{"name":"Flat-fee, no-revenue-share model","description":"A flat annual platform fee instead of a percentage of collections — institutes keep 100% of what they collect from learners."},{"name":"Included white-label add-ons","description":"Branded Android and iOS apps published on your developer accounts, payment-gateway integration and setup assistance are included in the plan rather than sold as upsells."},{"name":"Pay-per-use AI credits","description":"Core AI features are included, with metered AI usage billed through reviewable, controllable credits and a basic allowance included for normal academic use."},{"name":"Itemized platform invoices","description":"Each purchase produces an invoice with line items, tax breakup and totals tied to the exact payment record, with multi-currency price display for international buyers."},{"name":"Verified payment fulfillment","description":"Payments are confirmed via signed gateway callbacks, and support can manually fulfill a payment that verifiably succeeded but missed its callback."},{"name":"Full payment lifecycle audit","description":"Every platform payment tracks its complete lifecycle — created, paid, fulfilled, failed — for clean reconciliation."},{"name":"Data ownership & export","description":"Your institute owns its data outright, with full export capability."}]},{"id":"support-help-desk","name":"Support Help Desk with SLAs","tagline":"Built-in ticketing with response-time guarantees","description":"Raise support tickets right from your dashboard and chat with the support team in a threaded conversation with attachments. Tickets carry priority, category, status and a client-visible ETA, and each account sits on a support plan with defined response-time SLAs — up to a dedicated named engineer.","roles":["Admin"],"platforms":["Admin Web","API"],"subFeatures":[{"name":"In-portal ticket creation","description":"Raise tickets from the dashboard with a category (bug, question, billing, feature request, other) and priority."},{"name":"Threaded conversations with attachments","description":"Customer and support messages flow in one thread per ticket, with file attachments and system events recorded."},{"name":"Full ticket lifecycle","description":"Statuses run Open, In Progress, Waiting on Customer, Resolved and Closed, updatable by both sides."},{"name":"Client-visible ETA","description":"Support sets an expected-resolution time on each ticket that your team can see."},{"name":"Support plans & SLAs","description":"Tiered plans from standard support up to 24/7 coverage with fast major-incident response and a dedicated named engineer; SLA due-by times are computed automatically per ticket."},{"name":"On-behalf ticket logging","description":"Requests that arrive by email, WhatsApp or phone are logged by the support team, so every request is tracked in one place."},{"name":"Engineer assignment & board","description":"Tickets are assigned to named support engineers and managed on a Kanban-style board with an inbox, counts and filters."},{"name":"SLA breach alerts","description":"Automatic alerts fire when tickets approach or breach their first-response SLA."}]},{"id":"status-page-health-monitoring","name":"Public Status Page & Platform Health Monitoring","tagline":"Transparent uptime, monitored around the clock","description":"A public status page tells customers when something is wrong and when it's fixed, with severity-classified incidents and dated timeline updates through investigation, monitoring and resolution. Behind it, an operations dashboard continuously checks every service, database, cache and live-class server so problems surface before customers feel them.","roles":["Admin"],"platforms":["Public Web","Admin Web","API"],"subFeatures":[{"name":"Public incident feed","description":"Anyone can view current and past incidents on the status page without logging in."},{"name":"Severity levels","description":"Incidents are classified Minor, Major, Critical or Maintenance so customers gauge impact instantly."},{"name":"Incident lifecycle & timeline updates","description":"Statuses progress Investigating, Identified, Monitoring, Resolved — with dated updates posted under each incident building a full chronological record, including planned maintenance notices."},{"name":"Full-stack health dashboard","description":"Aggregated health of all backend services with quick and deep check modes, plus per-service response-time tracking to catch slowdowns early."},{"name":"Database & cache diagnostics","description":"Dedicated checks on databases and caches, including slow-query surfacing before it hurts users."},{"name":"Live-class server pool manager","description":"Monitor and manage the pool of live-classroom servers powering online classes."},{"name":"Accurate server time service","description":"A trusted universal time source with timezone validation keeps exam timers and schedules exact on every device."}]},{"id":"dashboard-widgets-broadcasts","name":"Dashboard Widgets & Broadcasts","tagline":"Onboarding trackers and announcements on every dashboard","description":"The platform team places live widgets on institute dashboards: an implementation tracker showing onboarding milestones with statuses and ETAs, and announcement cards for maintenance notices or launches. Widgets target one institute or broadcast to every account with a given tag, and institutes can comment and confirm milestones — a two-way channel during onboarding.","roles":["Admin"],"platforms":["Admin Web"],"subFeatures":[{"name":"Onboarding tracker widget","description":"A milestone checklist (Not Started / In Progress / Blocked / Done) with ETAs, so the institute always knows where its implementation stands; a ready-made template speeds setup."},{"name":"Announcement cards","description":"Severity-styled cards (Info / Warning / Critical) with optional image and call-to-action button for maintenance notices, feature launches or alerts."},{"name":"Two-way interaction","description":"Institute admins comment on widgets (even per milestone) and confirm milestones, with all interactions visible to the platform team."},{"name":"Targeted or broadcast delivery","description":"Send a widget to one institute, or broadcast to every institute carrying a given account tag."},{"name":"Draft, publish, archive lifecycle","description":"Widgets are drafted privately, published to dashboards, and archived when done — only published widgets appear to institutes."}]},{"id":"in-product-guides-roadmap","name":"In-Product Guides, Assist Dock & Roadmap","tagline":"Help and product news, right where you're working","description":"A floating assist dock in the admin portal offers page-aware tutorials, support access and product news without leaving your workflow. Guides are matched to the exact screen you're on, new walkthroughs are published centrally with no app update, and a 'What's new' panel keeps every institute up to date on the product roadmap.","roles":["Admin","Teacher"],"platforms":["Admin Web"],"subFeatures":[{"name":"Route-aware tutorials","description":"The Guides tab lists step-by-step tutorials relevant to the exact page — even the exact tab — you have open, viewed in-app."},{"name":"Assist and Issues tabs","description":"The same dock gives one-click access to assistance and to raising or tracking support tickets, keeping all help in one place."},{"name":"Centrally published guides","description":"New walkthrough guides are published by the platform team, targeted to specific screens, and appear for customers instantly — no software update, with full create/update/activate management."},{"name":"In-app roadmap viewer","description":"Read the latest published roadmap and release highlights in a rich formatted panel without leaving the dashboard."} function icon(k,s){return '<svg width="'+(s||22)+'" height="'+(s||22)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[k]||ICONS.plat)+'</svg>'}
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- derived counts ---------- */
const nFeat = DATA.pillars.reduce((s,p)=>s+p.features.length,0);
const nSub  = DATA.pillars.reduce((s,p)=>s+p.features.reduce((t,f)=>t+(f.subFeatures?.length||0),0),0);
const nDemo = DATA.pillars.filter(p=>p.demo).length;
document.getElementById('updated').textContent = 'Updated '+DATA.meta.updated;
document.getElementById('foot').innerHTML =
  esc(DATA.meta.name)+' Feature Catalog · '+DATA.pillars.length+' products · '+nFeat+' features · '+nSub+' capabilities · Updated '+esc(DATA.meta.updated)+
  '<br>Maintained alongside <code>vacademy-features.md</code> — see <code>build/README.md</code> to update both from one source.';

/* ---------- routing ---------- */
function go(h){ if(location.hash===h){render()} else {location.hash=h} }
window.addEventListener('hashchange', render);

function parseHash(){
  const h = location.hash.replace(/^#\/?/,'');
  if(!h) return {view:'home'};
  const parts = h.split('/').filter(Boolean);
  if(parts[0]==='p' && parts[1]){
    const p = DATA.pillars.find(x=>x.id===parts[1]);
    if(p) return {view:'pillar', p, fid:parts[2]||null};
  }
  return {view:'home'};
}

/* ---------- home ---------- */
function renderHome(){
  const cards = DATA.pillars.map(p=>{
    const preview = p.features.slice(0,4).map(f=>esc(f.name)).join(' · ');
    const caps = p.features.reduce((t,f)=>t+(f.subFeatures?.length||0),0);
    return '<div class="pcard" style="--pc:'+p.color+'">'
      +'<span class="kicker">'+esc(p.id)+' · '+p.features.length+' features</span>'
      +'<h3>'+esc(p.name)+'</h3>'
      +'<div class="tag">'+esc(p.tagline)+'</div>'
      +'<div class="prev">'+preview+'…</div>'
      +(p.demo?'<button class="demobtn" onclick="openDemo(\''+p.id+'\')">'
        +'<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5Z"/></svg>'
        +'Guided demo — experience it</button>':'')
      +'<div class="cnt"><span>'+caps+' capabilities</span>'
      +'<button class="go" onclick="go(\'#/p/'+p.id+'\')">Explore <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button></div>'
      +'</div>';
  }).join('');
  return '<div class="hero"><h1>'+DATA.meta.headline+'</h1>'
    +'<p>'+esc(DATA.meta.subhead)+'</p>'
    +'<div class="stats"><span class="stat"><b>'+DATA.pillars.length+'</b> products</span>'
    +'<span class="stat"><b>'+nFeat+'</b> features</span>'
    +'<span class="stat"><b>'+nSub+'</b> capabilities</span>'
    +(nDemo?'<span class="stat"><b>'+nDemo+'</b> guided demos</span>':'')
    +'</div></div>'
    +'<div class="grid">'+cards+'</div>'
    +'<div class="byline">Tip: press <b>/</b> anywhere to search every feature and capability.</div>';
}

/* ---------- pillar ---------- */
function featCard(p,f){
  const roles=(f.roles||[]).map(r=>'<span class="chip role">'+esc(r)+'</span>').join('');
  const plats=(f.platforms||[]).map(r=>'<span class="chip">'+esc(r)+'</span>').join('');
  const sfs=(f.subFeatures||[]).map((s,i)=>'<div class="sf" id="sf-'+f.id+'-'+i+'"><div class="sn">'+esc(s.name)+'</div><div class="sd">'+esc(s.description)+'</div></div>').join('');
  return '<article class="fcard" id="f-'+f.id+'" style="--pc:'+p.color+'">'
    +'<div class="fhead"><h2>'+esc(f.name)+'</h2><span class="ftag">'+esc(f.tagline||'')+'</span></div>'
    +'<p class="fdesc">'+esc(f.description)+'</p>'
    +'<div class="chips">'+roles+plats+'</div>'
    +((f.subFeatures&&f.subFeatures.length)?
      '<button class="sf-toggle" aria-expanded="false" onclick="toggleSf(this)">'
      +'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'
      +f.subFeatures.length+' capabilities</button><div class="sflist">'+sfs+'</div>':'')
    +'</article>';
}
function toggleSf(btn){
  const open = btn.getAttribute('aria-expanded')==='true';
  btn.setAttribute('aria-expanded', String(!open));
  btn.nextElementSibling.classList.toggle('open', !open);
}
function setAll(open){
  document.querySelectorAll('.sf-toggle').forEach(b=>{
    b.setAttribute('aria-expanded',String(open));
    b.nextElementSibling.classList.toggle('open',open);
  });
}
function renderPillar(p){
  const nav = p.features.map(f=>'<a href="#/p/'+p.id+'/'+f.id+'" data-f="'+f.id+'">'+esc(f.name)+'</a>').join('');
  const cards = p.features.map(f=>featCard(p,f)).join('');
  return '<div class="crumbs"><button onclick="go(\'#/\')">All products</button>'
    +'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>'
    +'<span>'+esc(p.name)+'</span></div>'
    +'<div class="pillar-head" style="--pc:'+p.color+'"><div class="picon">'+icon(p.icon,26)+'</div>'
    +'<div><span class="kicker" style="color:'+p.color+'">'+esc(p.id)+' · '+p.features.length+' features</span><h1>'+esc(p.name)+'</h1><div class="tag">'+esc(p.tagline)+'</div></div></div>'
    +'<p class="pillar-desc">'+esc(p.description)+'</p>'
    +'<div class="toolbar" style="--pc:'+p.color+'">'
    +(p.demo?'<button class="chipbtn solid" onclick="openDemo(\''+p.id+'\')">▶ Guided demo</button>':'')
    +'<button class="chipbtn" onclick="setAll(true)">Expand all</button>'
    +'<button class="chipbtn" onclick="setAll(false)">Collapse all</button>'
    +'<span style="font-size:12.5px;color:var(--ink-3)">'
    +p.features.reduce((t,f)=>t+(f.subFeatures?.length||0),0)+' capabilities</span></div>'
    +'<div class="pillar-body" style="--pc:'+p.color+'"><nav class="sidenav" id="snav">'+nav+'</nav><div>'+cards+'</div></div>';
}

/* ---------- render ---------- */
let scrollObs=null;
function render(){
  const r = parseHash();
  const app = document.getElementById('app');
  closeResults();
  if(scrollObs){scrollObs.disconnect();scrollObs=null}
  if(r.view==='home'){ app.innerHTML = renderHome(); window.scrollTo(0,0); document.title='Vacademy — Feature Catalog'; return; }
  app.innerHTML = renderPillar(r.p);
  document.title = r.p.name+' — Vacademy Feature Catalog';
  const links=[...document.querySelectorAll('#snav a')];
  scrollObs=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){
      links.forEach(l=>l.classList.toggle('on', l.dataset.f===e.target.id.slice(2)));
    }});
  },{rootMargin:'-80px 0px -70% 0px'});
  document.querySelectorAll('.fcard').forEach(c=>scrollObs.observe(c));
  if(r.fid){
    const el=document.getElementById('f-'+r.fid);
    if(el){
      const t=el.querySelector('.sf-toggle'); if(t){t.setAttribute('aria-expanded','true');t.nextElementSibling.classList.add('open')}
      requestAnimationFrame(()=>{el.scrollIntoView({block:'start'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1700)});
    }
  } else window.scrollTo(0,0);
}

  p.features.forEach(f=>{
    INDEX.push({kind:'feature',p,f,text:(f.name+' '+(f.tagline||'')+' '+f.description).toLowerCase()});
    (f.subFeatures||[]).forEach((s,i)=>INDEX.push({kind:'cap',p,f,s,i,text:(s.name+' '+s.description).toLowerCase()}));
  });
});
function hl(text,terms){
  let out=esc(text);
  terms.forEach(t=>{ if(!t)return;
    out=out.replace(new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');
  });
  return out;
}
function search(q){
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!terms.length) return [];
  const hits=INDEX.filter(e=>terms.every(t=>e.text.includes(t)));
  const rank={product:0,feature:1,cap:2};
  hits.sort((a,b)=>{
    const an=terms.every(t=>(a.kind==='cap'?a.s.name:a.kind==='feature'?a.f.name:a.p.name).toLowerCase().includes(t))?0:1;
    const bn=terms.every(t=>(b.kind==='cap'?b.s.name:b.kind==='feature'?b.f.name:b.p.name).toLowerCase().includes(t))?0:1;
    return (rank[a.kind]-rank[b.kind])||(an-bn);
  });
  return hits.slice(0,60);
}
const qEl=document.getElementById('q'), rEl=document.getElementById('results');
let activeIdx=-1, curHits=[];

function openHit(e){
  closeResults(); qEl.blur();
  if(e.kind==='product'){go('#/p/'+e.p.id);return}
  const target='#/p/'+e.p.id+'/'+e.f.id;
  if(location.hash===target){render()} else {location.hash=target}
  if(e.kind==='cap'){
    setTimeout(()=>{const el=document.getElementById('sf-'+e.f.id+'-'+e.i);
      if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1800)}},80);
  }
}
function renderResults(q){
  curHits=search(q);
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!q.trim()){closeResults();return}
  if(!curHits.length){rEl.innerHTML='<div class="rnone">No matches for “'+esc(q)+'”</div>';rEl.classList.add('open');return}
  const groups={product:'Products',feature:'Features',cap:'Capabilities'};
  let html='',last='';
  curHits.forEach((e,idx)=>{
    if(e.kind!==last){html+='<div class="rgroup">'+groups[e.kind]+'</div>';last=e.kind}
    const title=e.kind==='cap'?e.s.name:e.kind==='feature'?e.f.name:e.p.name;
    const path=e.kind==='cap'?(e.p.name+' › '+e.f.name):e.kind==='feature'?e.p.name:(e.p.features.length+' features');
    const desc=e.kind==='cap'?e.s.description:e.kind==='feature'?e.f.description:e.p.tagline;
    html+='<button class="ritem" data-i="'+idx+'" onclick="openHit(curHits['+idx+'])">'
      +'<div class="rt">'+hl(title,terms)+'</div><div class="rp">'+esc(path)+'</div>'
      +'<div class="rd">'+hl(desc,terms)+'</div></button>';
  });
  rEl.innerHTML=html;rEl.classList.add('open');activeIdx=-1;
}
qEl.addEventListener('input',()=>renderResults(qEl.value));
qEl.addEventListener('focus',()=>{if(qEl.value.trim())renderResults(qEl.value)});
qEl.addEventListener('keydown',e=>{
  const items=[...rEl.querySelectorAll('.ritem')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(!items.length)return;
    activeIdx=(activeIdx+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;
    items.forEach((it,i)=>it.classList.toggle('active',i===activeIdx));
    items[activeIdx].scrollIntoView({block:'nearest'});
  } else if(e.key==='Enter'){
    if(activeIdx>=0&&curHits[activeIdx])openHit(curHits[activeIdx]);
    else if(curHits.length)openHit(curHits[0]);
  } else if(e.key==='Escape'){qEl.value='';closeResults();qEl.blur()}
});

});

/* stat tiles are iconed/tinted by what they measure, as in the live dashboard */
/* deterministic pseudo-QR: the join links in the live-session list carry one */
function qr(seed){
  const h = Math.abs(hash32(String(seed) || 'x'));
  const N = 21, cells = [];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const corner = (x<7&&y<7)||(x>N-8&&y<7)||(x<7&&y>N-8);
    let on;
    if(corner){ const cx=x%(N-7), cy=y%(N-7); const dx=Math.min(cx,6-cx), dy=Math.min(cy,6-cy);
      const d=Math.min(dx,dy); on = d===0 || d===2; }
    else on = ((h >> ((x*7+y*13) % 31)) ^ (x*y+h)) % 3 === 0;
    if(on) cells.push('<rect x="'+x+'" y="'+y+'" width="1" height="1"/>');
  }
  return '<svg viewBox="0 0 '+N+' '+N+'" shape-rendering="crispEdges" aria-hidden="true">'
    +'<rect width="'+N+'" height="'+N+'" fill="#fff"/><g fill="#211B15">'+cells.join('')+'</g></svg>';
}

  return ['chart','i2'];
}

function renderWidget(w){
  if(w.cols){return '<div class="mrow c'+w.cols.length+'">'+w.cols.map(renderWidget).join('')+'</div>'}
  const fn = W[w.type];
  const inner = fn ? fn(w) : '<span style="color:var(--p-ink-3)">['+esc(w.type)+']</span>';
  const bare = (w.type==='header'||w.type==='hero'||w.type==='askbar'||w.type==='assistant'||w.type==='modal'||w.type==='session'||w.type==='segments'||w.type==='thread'||w.type==='stats'||w.type==='cards'||w.type==='wizard'||w.type==='tabs'||w.type==='filters'||w.type==='video'||w.type==='kanban');
  return '<div class="wg'+(bare?' bare':'')+'" '+(w.id?'data-wid="'+esc(w.id)+'"':'')+'>'+inner+'</div>';
}

/* ---- app shell chrome (module rail · sidebar · topbar · utility rail) ---- */
const MODULES=[{k:'crm',l:'CRM',i:'briefcase'},{k:'lms',l:'LMS',i:'cap'},{k:'ai',l:'AI',i:'sparkle'},{k:'recent',l:'Recent',i:'history'}];
const MODULES_BTM=[{k:'status',l:'Status',i:'pulse'},{k:'settings',l:'Settings',i:'gear'}];
const URAIL=[{l:'Guides',i:'book',b:'1'},{l:'Assist',i:'sparkle'},{l:'Issues',i:'question',b:'5',w:1},{l:'What\'s new',i:'rocket'},{l:'Explore',i:'compass'},{l:'Admin App',i:'mobile'}];
function guessModule(scr){
  if(scr.module) return scr.module;
  /* the rail highlights the module the ACTIVE nav item belongs to */
  const nav=(scr.nav||[]);
  const active=(nav.find(n=>n.endsWith('*'))||nav[0]||'').replace(/^-\s*/,'').replace(/\*$/,'').toLowerCase();
  if(/\bai\b|copilot|content studio|content creator|prompt|vsmart|storyboard/.test(active)) return 'ai';
  if(/course|librar|live class|live session|assessment|test|quiz|question|slide|chapter|subject|doubt|curricul|community/.test(active)) return 'lms';
  return 'crm';
}
function renderRail(mod){
  const item = m => '<span class="rm'+(m.k===mod?' on':'')+'" data-mod="'+m.k+'">'+ic(m.i,19)+'<span>'+m.l+'</span></span>';
  return '<div class="mock-rail"><span class="r-srch">'+ic('search',19)+'</span>'
    +MODULES.map(item).join('')
    +'<span class="r-sep"></span>'
    +'<span class="r-btm">'+MODULES_BTM.map(item).join('')+'</span></div>';
}
function renderSide(scr){
  const inst = scr.inst || 'Alpha Education';
  const raw = scr.nav||[];
  const items = raw.map(n=>{
    let s=n, sub=false, on=false, group=false;
    if(/^-\s*/.test(s)){sub=true;s=s.replace(/^-\s*/,'')}
    if(s.endsWith('*')){on=true;s=s.slice(0,-1)}
    if(s.endsWith('>')){group=true;s=s.slice(0,-1)}
    return {label:s.trim(),sub,on,group};
  });
  const nav = items.map((it,i)=>{
    const hasKids = !it.sub && (it.group || (items[i+1] && items[i+1].sub));
    return '<div class="ni'+(it.sub?' sub':'')+(it.on?' on':'')+'">'
      +(it.sub?'':ic(navIcon(it.label),16))
      +'<span class="nlabel">'+esc(it.label)+'</span>'
      +(hasKids?'<span class="nchev">'+ic('chev',13)+'</span>':'')+'</div>';
  }).join('');
  const initials = inst.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
  return '<div class="mock-side">'
    +'<div class="ms-head"><span class="ms-logo">'+esc(initials)+'</span><b>'+esc(inst)+'</b></div>'
    +'<div class="ms-nav">'+nav+'</div>'
    +'<div class="ms-foot">'+ic('question',16)+'Support<span class="dedi">Dedicated</span></div></div>';
}

  const inst = scr.inst || 'Alpha Education';
  const initials = inst.split(/\s+/).map(x=>x[0]).join('').slice(0,1).toUpperCase();
  return '<div class="mock-top"><span class="mt-panel">'+ic('panel',17)+'</span><span class="mt-div"></span>'
    +'<span class="mt-title">'+esc(scr.title||'')+'</span>'
    +'<span class="mt-right">'
    +'<span class="mt-credits">'+ic('sparkle',13,2)+'AI Credits: '+esc(scr.credits||'95.7')+' '+ic('chev',11,2.2)+'</span>'
    +'<span class="mt-ic">'+ic('grid',18)+'</span><span class="mt-ic">'+ic('bell',18)+'</span>'
    +'<span class="mt-switch">'+ic('cap',15)+'Switch to Learner'+ic('external',13)+'</span>'
    +'<span class="mt-av">'+esc(initials)+'</span></span></div>';
}
function renderURail(){
  return '<div class="mock-urail">'+URAIL.map(u=>'<span class="ur">'
    +(u.b?'<span class="badge'+(u.w?' warn':'')+'">'+u.b+'</span>':'')
    +ic(u.i,19)+'<span>'+esc(u.l)+'</span></span>').join('')+'</div>';
}
function renderScreen(scr){
  CUR_INST = scr.inst || 'Alpha Education';
  const widgets = scr.widgets.map(renderWidget).join('');
  if(scr.device==='phone'){
    const tabs=(scr.nav||[]).map(n=>{const on=n.endsWith('*');return '<span class="pt'+(on?' on':'')+'">'+esc(on?n.slice(0,-1):n)+'</span>'}).join('');
    return '<div class="phone"><div class="p-status"><span>9:41</span><span>••• ⌁ ▮</span></div>'
      +'<div class="p-body">'+widgets+'</div>'
      +(tabs?'<div class="p-tabs">'+tabs+'</div>':'')+'</div>';
  }
  const mod = guessModule(scr);
  return '<div class="mock m-'+mod+'">'+renderRail(mod)+renderSide(scr)
    +'<div class="mock-col">'+renderTop(scr)+'<div class="mock-main">'+widgets+'</div></div>'
    +renderURail()+'</div>';
}

let demoState=null;
function openDemo(pid){
  const p = DATA.pillars.find(x=>x.id===pid);
  if(!p||!p.demo) return;
  demoState={p, demo:p.demo, step:0, screenId:null};
  document.getElementById('demoKick').textContent='Guided demo';
  document.getElementById('demoTitle').textContent=p.name;
  document.getElementById('demoOv').classList.add('open');
  document.body.style.overflow='hidden';
  showStep(0);
}
function closeDemo(){
  demoState=null;
  document.getElementById('demoOv').classList.remove('open');
  document.body.style.overflow='';
}
function demoStep(d){
  if(!demoState)return;
  const n=demoState.step+d;
  if(n<0)return;
  if(n>=demoState.demo.steps.length){closeDemo();return}
  showStep(n);
}
function showStep(n){
  const {demo}=demoState;
  demoState.step=n;
  const st=demo.steps[n];
  if(st.screen!==demoState.screenId){
    const scr=demo.screens.find(s=>s.id===st.screen);
    document.getElementById('demoStage').innerHTML=scr?renderScreen(scr):'';
    demoState.screenId=st.screen;
  }
  document.querySelectorAll('#demoStage .wg.spot').forEach(el=>el.classList.remove('spot'));
  if(st.target){
    const el=document.querySelector('#demoStage [data-wid="'+CSS.escape(st.target)+'"]');
    if(el){el.classList.add('spot');el.scrollIntoView({block:'center',behavior:'smooth'})}
  }
  document.getElementById('stepKick').textContent='Step '+(n+1)+' of '+demo.steps.length;
  document.getElementById('stepTitle').textContent=st.title;
  document.getElementById('stepText').textContent=st.text;
  document.getElementById('stepDots').innerHTML=demo.steps.map((_,i)=>'<span class="dot'+(i===n?' on':'')+'"></span>').join('');
  document.getElementById('btnBack').disabled=(n===0);
  document.getElementById('btnNext').textContent=(n===demo.steps.length-1)?'Finish':'Next';
}
document.getElementById('demoOv').addEventListener('click',e=>{if(e.target.id==='demoOv')closeDemo()});

render();
</script>
