{{- if .Values.pgbouncer.enabled }}
{{- /*
  Guard: refuse to render the pgbouncer ConfigMap unless the DB connection
  values have been overridden (typically via a local values.secret.yaml).
  This prevents a broken deploy where pgbouncer would point at placeholder hosts.
*/ -}}
{{- $pgb := .Values.pgbouncer | default dict -}}
{{- range $key := list "dbHost" "dbReadHost" "dbPort" -}}
  {{- $val := index $pgb $key -}}
  {{- if not $val -}}
    {{- fail (printf "pgbouncer.%s is required. Set it in values.secret.yaml (see values.secret.example.yaml) and pass it with -f. The pgbouncer ConfigMap will NOT be applied without it." $key) -}}
  {{- end -}}
  {{- if hasPrefix "REPLACE_WITH_" (toString $val) -}}
    {{- fail (printf "pgbouncer.%s is still set to a placeholder (%q). Override it in values.secret.yaml and pass it with -f. The pgbouncer ConfigMap will NOT be applied with placeholder values." $key (toString $val)) -}}
  {{- end -}}
{{- end -}}
{{- /*
  This file is what runs in prod: keep it equal to the live ConfigMap
  (kubectl get cm pgbouncer-config). Synced from live 2026-11-13.
  Pushing a change here runs deploy-pgbouncer.yml, which applies it AND restarts
  pgbouncer straight away (every service loses its DB connections for a few
  seconds), so push off-hours. The pod mounts pgbouncer.ini with subPath, so a
  RELOAD never sees a ConfigMap edit; only a restart applies it.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: default
data:
  pgbouncer.ini: |
    [databases]
    ; Primary (read-write)
    admin_core_service   = host={{ .Values.pgbouncer.dbHost }} port={{ .Values.pgbouncer.dbPort }} dbname=admin_core_service pool_size=40 reserve_pool_size=15
    auth_service         = host={{ .Values.pgbouncer.dbHost }} port={{ .Values.pgbouncer.dbPort }} dbname=auth_service pool_size=20
    ; community_service also writes here (live session persistence) — higher pool needed
    assessment_service   = host={{ .Values.pgbouncer.dbHost }} port={{ .Values.pgbouncer.dbPort }} dbname=assessment_service pool_size=20
    community_service    = host={{ .Values.pgbouncer.dbHost }} port={{ .Values.pgbouncer.dbPort }} dbname=community_service pool_size=15
    media_service        = host={{ .Values.pgbouncer.dbHost }} port={{ .Values.pgbouncer.dbPort }} dbname=media_service pool_size=15
    notification_service = host={{ .Values.pgbouncer.dbHost }} port={{ .Values.pgbouncer.dbPort }} dbname=notification_service pool_size=15

    ; Read replicas
    admin_core_service_read   = host={{ .Values.pgbouncer.dbReadHost }} port={{ .Values.pgbouncer.dbPort }} dbname=admin_core_service pool_size=10 reserve_pool_size=5
    auth_service_read         = host={{ .Values.pgbouncer.dbReadHost }} port={{ .Values.pgbouncer.dbPort }} dbname=auth_service pool_size=5 reserve_pool_size=2
    assessment_service_read   = host={{ .Values.pgbouncer.dbReadHost }} port={{ .Values.pgbouncer.dbPort }} dbname=assessment_service pool_size=5 reserve_pool_size=2
    community_service_read    = host={{ .Values.pgbouncer.dbReadHost }} port={{ .Values.pgbouncer.dbPort }} dbname=community_service pool_size=5 reserve_pool_size=2
    media_service_read        = host={{ .Values.pgbouncer.dbReadHost }} port={{ .Values.pgbouncer.dbPort }} dbname=media_service pool_size=5 reserve_pool_size=2
    notification_service_read = host={{ .Values.pgbouncer.dbReadHost }} port={{ .Values.pgbouncer.dbPort }} dbname=notification_service pool_size=5 reserve_pool_size=2

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    pool_mode = transaction

    default_pool_size = 15
    min_pool_size = 2
    reserve_pool_size = 5
    max_client_conn = 300

    query_wait_timeout = 15
    server_idle_timeout = 300
    server_lifetime = 600
    server_connect_timeout = 15

    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt

    log_connections = 0
    log_disconnections = 0
    log_pooler_errors = 1

    admin_users = vacademy
    stats_users = vacademy

    server_reset_query = DISCARD ALL
    ignore_startup_parameters = extra_float_digits,options

    ; TLS for backend connections (required by Linode managed DB)
    server_tls_sslmode = require
{{- end }}
