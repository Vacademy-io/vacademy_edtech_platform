spring.application.name=media_service
## Database Connection
spring.datasource.url=${MEDIA_SERVICE_DB_URL}
spring.datasource.read.url=${MEDIA_SERVICE_READ_DB_URL:${MEDIA_SERVICE_DB_URL}}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=${DB_USERNAME}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
## AWS S3 Connection
aws.accessKey=${S3_AWS_ACCESS_KEY}
aws.secretKey=${S3_AWS_ACCESS_SECRET}
aws.region=${S3_AWS_REGION}
aws.bucket.name=${AWS_BUCKET_NAME}
aws.s3.public-bucket=${AWS_S3_PUBLIC_BUCKET}
## Security
application.my.username=${APP_USERNAME}
application.my.password=${APP_PASSWORD}
spring.mvc.dispatch-options-request=true
auth.server.baseurl=${AUTH_SERVER_BASE_URL}
spring.servlet.multipart.max-file-size=800MB
spring.servlet.multipart.max-request-size=810MB
logging.level.org.springframework.security=DEBUG
cloud.front.url=${CLOUD_FRONT_URL}
# CloudFront distribution fronting the PUBLIC media bucket. Blank = serve raw
# S3 URLs (rollback lever). Distinct from cloud.front.url, which some deploys
# repurpose as the media-service base URL.
cdn.public-base-url=${CDN_PUBLIC_BASE_URL:}
# Private CDN (signed URLs over the main/private bucket — recordings etc.).
# All three must be set to enable; otherwise S3 presigned URLs (rollback lever).
cdn.private-base-url=${CDN_PRIVATE_BASE_URL:}
cdn.private.key-pair-id=${CDN_PRIVATE_KEY_PAIR_ID:}
cdn.private.private-key-b64=${CDN_PRIVATE_KEY_B64:}
## Logging
org.springframework.boot.actuate.health.Logger=OFF
logging.level.org.springframework.boot.actuate.health=OFF
assessmentServerBaseUrl.server.baseurl=${ASSESSMENT_SERVER_BASE_URL}
gemini.api.key=${GEMINI_API_KEY}
youtube.api.key=${YOUTUBE_API_KEY}
unsplash.access.key=${UNSPLASH_ACCESS_KEY}


# This tells Flyway to accept an existing schema and create a baseline
spring.flyway.baseline-on-migrate=true

# This tells Flyway which version number to baseline to.
# It should match your first migration script (e.g., V1__Initial_schema.sql)
spring.flyway.baseline-version=1
spring.flyway.connect-retries=5
spring.flyway.connect-retries-interval=10
