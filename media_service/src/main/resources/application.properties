spring.application.name=media_service
server.port=8075

# When a multipart body is rejected (MaxUploadSizeExceededException), Tomcat has already
# committed the response while the client is still sending. Past max-swallow-size it resets
# the connection instead of draining the rest, so the browser sees a dropped connection and
# axios reports a bare "Network Error" -- the 413 and its reason are lost. 820MB matches the
# ingress proxy-body-size in vacademy_devops/vacademy-services/templates/ingress.yaml, which
# is the largest body that can reach us, so every rejection is now delivered intact.
server.tomcat.max-swallow-size=820MB
management.endpoints.web.base-path=/media-service
management.endpoints.web.path-mapping.health=actuator/health
springdoc.api-docs.path=/media-service/api-docs
springdoc.swagger-ui.path=/media-service/swagger-ui.html
spring.profiles.active=${environment}
spring.servlet.multipart.max-file-size=800MB
spring.servlet.multipart.max-request-size=810MB
spring.jackson.deserialization.fail_on_unknown_properties=false

# AI Evaluation API objects (eval-api/{institute_id}/...). Blank = the main PRIVATE bucket
# (aws.bucket.name). Set EVAL_API_S3_BUCKET to a dedicated private bucket that no public
# CloudFront distribution fronts if the public origin group fails over to the main bucket.
eval-api.s3.bucket=${EVAL_API_S3_BUCKET:}



# ============ HikariCP Connection Pool Configuration ============
# These settings are CRITICAL for preventing inconsistent API latency

# Maximum number of connections in the pool
spring.datasource.hikari.maximum-pool-size=5

# Minimum number of idle connections to maintain
spring.datasource.hikari.minimum-idle=1

# How long (ms) to wait for a connection from the pool
spring.datasource.hikari.connection-timeout=60000

# How long a connection can be idle before being retired
spring.datasource.hikari.idle-timeout=300000

# Maximum lifetime of a connection
spring.datasource.hikari.max-lifetime=600000

# Connection validation timeout
spring.datasource.hikari.validation-timeout=5000

# Keep connections alive
spring.datasource.hikari.keepalive-time=60000

# Log pool usage warnings
spring.datasource.hikari.leak-detection-threshold=60000

# Sentry Configuration
sentry.dsn=${SENTRY_DSN}
sentry.send-default-pii=true

# Performance Monitoring. File uploads/conversions: high span count per request
# but low request volume. 0.4 is ample for trends. Errors are captured
# independently of this rate.
sentry.traces-sample-rate=0.4
# Enable performance monitoring for all integrations
sentry.enable-tracing=true
# Database query monitoring
sentry.trace-propagation-targets=localhost,127.0.0.1
# Additional performance settings
sentry.in-app-includes=vacademy.io
