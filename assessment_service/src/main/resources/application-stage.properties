spring.application.name=assessment_service
## Database Connection
spring.datasource.url=${ASSESSMENT_SERVICE_DB_URL}
spring.datasource.read.url=${ASSESSMENT_SERVICE_READ_DB_URL:${ASSESSMENT_SERVICE_DB_URL}}
# Sized for 200-1000 concurrent test-takers; PgBouncer (transaction mode)
# multiplexes these onto its 20-connection server pool, so >20 client
# connections here only adds queuing at PgBouncer, not at Postgres.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
# Fail fast under overload instead of hanging students for 60s
# (overrides the 60s default in application.properties)
spring.datasource.hikari.connection-timeout=10000
spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=${DB_USERNAME}
## Security
application.my.username=${APP_USERNAME}
application.my.password=${APP_PASSWORD}
spring.mvc.dispatch-options-request=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# DEBUG here logged ~9 lines/second per pod in production (15,644 lines in 30 min
# during a live exam) for no operational value. WARN keeps genuine auth problems.
logging.level.org.springframework.security=WARN
cloud.front.url=${CLOUD_FRONT_URL}
## Logging
org.springframework.boot.actuate.health.Logger=OFF
logging.level.org.springframework.boot.actuate.health=OFF
## auth.server.baseurl=http://localhost:8071
auth.server.baseurl=${AUTH_SERVER_BASE_URL}
admin.core.service.baseurl=${ADMIN_CORE_SERVICE_BASE_URL}
notification.server.baseurl=${NOTIFICATION_SERVER_BASE_URL}
media.service.baseurl=${MEDIA_SERVICE_BASE_URL}
## notification scheduling time frame
scheduling.time.frame=${SCHEDULING_TIME_FRAME}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC



# This tells Flyway to accept an existing schema and create a baseline
spring.flyway.baseline-on-migrate=true

# This tells Flyway which version number to baseline to.
# It should match your first migration script (e.g., V1__Initial_schema.sql)
spring.flyway.baseline-version=1

# Allow out-of-order migrations and ignore missing ones
spring.flyway.out-of-order=true
spring.flyway.ignore-missing-migrations=true
spring.flyway.ignore-ignored-migrations=true
spring.flyway.validate-on-migrate=false
spring.flyway.connect-retries=5
spring.flyway.connect-retries-interval=10

# ============ JPA/Hibernate Performance Optimization ============
# Use READ_COMMITTED isolation (fastest for OLTP)
spring.jpa.properties.hibernate.connection.isolation=2

# Batch operations (critical for bulk inserts/updates)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Fetch size (reduces round trips for large result sets)
spring.jpa.properties.hibernate.jdbc.fetch_size=100

# Statement caching (reuse prepared statements)
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.generate_statistics=false

# Query optimization
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
# Set to false to avoid runtime exceptions; monitor logs for pagination warnings instead
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=false

# Connection release mode (release after transaction for pooling efficiency)
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

openrouter.api.key=${OPENROUTER_API_KEY}

# Bulk Assessment Report Export (ZIP)
assessment.report-export.batch-size=10
assessment.report-export.batch-pause-ms=300
assessment.report-export.max-attempts=150
assessment.report-export.stale-job-minutes=20
assessment.report-export.max-retry=2
assessment.report-export.assembly-timeout-seconds=180
# AI copy-check queue. The poller drains PENDING evaluations (bulk uploads and
# opt-in auto-evaluation on submit) under a global in-flight cap; the sweeper
# re-queues copies whose worker went silent (an ai-service redeploy) instead of
# failing them. One ai-service pod + one render-worker = about 3 copies at once.
assessment.ai-evaluation.poller-enabled=true
assessment.ai-evaluation.max-in-flight=3
assessment.ai-evaluation.poller-batch-size=3
assessment.ai-evaluation.stale-timeout-minutes=20
assessment.ai-evaluation.max-requeues=2
