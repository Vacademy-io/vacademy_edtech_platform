spring.application.name=assessment_service
server.port=8074
management.endpoints.web.base-path=/assessment-service
management.endpoints.web.path-mapping.health=actuator/health
springdoc.api-docs.path=/assessment-service/api-docs
springdoc.swagger-ui.path=/assessment-service/swagger-ui.html
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}


# ============ HikariCP Connection Pool Configuration ============
# These settings are CRITICAL for preventing inconsistent API latency

# Maximum number of connections in the pool
spring.datasource.hikari.maximum-pool-size=5

# Minimum number of idle connections to maintain
spring.datasource.hikari.minimum-idle=1

# How long (ms) to wait for a connection from the pool
spring.datasource.hikari.connection-timeout=60000

# How long a connection can be idle before being retired
spring.datasource.hikari.idle-timeout=300000

# Maximum lifetime of a connection
spring.datasource.hikari.max-lifetime=600000

# Connection validation timeout
spring.datasource.hikari.validation-timeout=5000

# Keep connections alive
spring.datasource.hikari.keepalive-time=60000

# Log pool usage warnings
spring.datasource.hikari.leak-detection-threshold=60000

# Sentry Configuration
sentry.dsn=${SENTRY_DSN}
# Off: with PII on, the SDK attaches request headers (Authorization JWT, cookies)
# and the user IP to events. No code in this service relies on it.
sentry.send-default-pii=false
# Performance Monitoring. Heavy per-request span count (many DB queries +
# ai_service calls); kept low so exam-window bursts (200-1000 concurrent
# test-takers) don't pay tracing overhead on every request. Errors are
# captured independently of this rate.
sentry.traces-sample-rate=0.1
# Enable performance monitoring for all integrations
sentry.enable-tracing=true
# Database query monitoring
sentry.trace-propagation-targets=localhost,127.0.0.1
# Additional performance settings
sentry.in-app-includes=vacademy.io

# ============ Bulk Assessment Report Export (ZIP) ============
# Tunable without a deploy: batch size / cap depend on per-render wall-clock
# cost, which is environment-dependent (font rendering, network egress).
# See docs/ASSESSMENT_BULK_REPORT_EXPORT_PLAN.md §8.
assessment.report-export.batch-size=10
assessment.report-export.batch-pause-ms=300
assessment.report-export.max-attempts=150
assessment.report-export.stale-job-minutes=20
assessment.report-export.max-retry=2
assessment.report-export.assembly-timeout-seconds=180

# ============ AI Evaluation partner API (docs/AI_EVALUATION_PUBLIC_API.md) ============
# Off until super-admin has enabled the pilot institute (deploy order step 6); while off
# every /assessment-service/open/evaluation/v1/** call answers 404. Flip per deployment with
# the env var ASSESSMENT_OPENAPI_ENABLED=true (env beats this file).
assessment.open-api.enabled=false
# Replicas sharing the in-memory per-key/per-institute rate limits (each pod enforces 1/N).
assessment.open-api.pods=2
# Key verify call to admin_core (spec 6.4).
assessment.open-api.verify.connect-timeout-ms=500
assessment.open-api.verify.read-timeout-ms=1500
# Daily "N copies graded, M need review" bell per API exam (UTC; 12:30 UTC = 18:00 IST).
assessment.open-api.digest-cron=0 30 12 * * *
