# Nginx server config for the admin dashboard container.
# Copied to /etc/nginx/conf.d/default.conf by the Dockerfile (the stock
# nginx:alpine /etc/nginx/nginx.conf includes it inside its http block).
#
# Caching contract:
#   - index.html must NEVER be cached: it references content-hashed chunk
#     filenames that stop existing after every deploy. A stale copy makes the
#     browser request dead chunks, nginx answers with an HTML 404 page, and
#     Chrome rejects it as a module script ("MIME type text/html" white screen).
#   - /assets/* filenames are content-hashed by Vite -> cache forever.
#   - Everything else static (public/ files like /styles.css, favicons, fonts)
#     is UNHASHED and can change under the same URL on deploy -> short cache.
#   - /config/runtime-config.js is rewritten at container start -> no cache.
#
# NOTE on add_header: directives are inherited from the server level ONLY by
# location blocks that declare no add_header of their own. Every block below
# that sets Cache-Control must therefore repeat all four security headers.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # SPA shell: always revalidate (see caching contract above). SPA routes
    # (e.g. /dashboard) end up here too via the try_files internal redirect.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Written by docker-entrypoint.sh at container start (window.__BACKEND_URL__);
    # mutable under a fixed URL, must never be cached as a static asset.
    location = /config/runtime-config.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite build output: content-hashed filenames, safe to cache forever.
    # ^~ prevents the extension regex below from overriding this block.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Unhashed static files (public/ dir): cache briefly, then revalidate.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # App Links / Universal Links verification files (public/.well-known/). The
    # Apple file has no extension, so name its type; never fall back to index.html.
    location ^~ /.well-known/ {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
