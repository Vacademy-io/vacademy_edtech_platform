import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// --- White-label admin flavors (data-driven) --------------------------------
// Every white-label admin app is one entry in mobile-flavors.json. We read it
// here and generate a matching Android product flavor per entry, mirroring the
// learner app's per-institute flavors. Adding an institute is a JSON edit + a
// GoogleServiceConfigs/<key>/ folder — no changes to this file. The manifest key
// is a kebab-case slug (also the GoogleServiceConfigs folder name); Gradle flavor
// ids can't contain hyphens, so it's mapped to camelCase (vacademy-admin ->
// vacademyAdmin). Keys starting with "_" (e.g. "_comment") are ignored.
def flavorSpecs = new JsonSlurper().parse(file("mobile-flavors.json"))
    .findAll { key, cfg -> !key.startsWith('_') }
    .collect { key, cfg ->
        def parts = (key.split('[-_]') as List)
        [
            key          : key,
            flavorName   : parts.head() + parts.tail().collect { it.capitalize() }.join(),
            applicationId: cfg.applicationId,
            appName      : cfg.appName,
            deepLinkHost : cfg.deepLinkHost,
            // Optional: a separate store listing starts its own version line
            // (Evalezy 1.0.0 / code 1) instead of inheriting defaultConfig's.
            versionCode  : cfg.versionCode,
            versionName  : cfg.versionName,
            // Classroom panel app (optional; absent → admin behaviour). panelMode
            // drives R.bool.panel_mode (WebView gate, immersive, keep-screen-on,
            // PanelDevice plugin in MainActivity); minWebViewMajor drives
            // R.integer.panel_min_webview_major (must equal PANEL_MIN_CHROME in
            // src/panel/config.ts and MIN in panel.html).
            panelMode      : cfg.panelMode == true,
            minWebViewMajor: (cfg.minWebViewMajor ?: 0) as int,
        ]
    }

// --- Release signing (upload key) -------------------------------------------
// Reads android/keystore.properties (git-ignored: storeFile/storePassword/
// keyAlias/keyPassword). Absent on machines without the secret → release falls
// back to the debug signing config so the build never hard-fails.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = "io.vacademy.admin.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // applicationId is set per product flavor below (one per white-label app).
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    // One product flavor per white-label admin app (generated from the manifest).
    flavorDimensions "client"
    productFlavors {
        flavorSpecs.each { spec ->
            create(spec.flavorName) {
                dimension "client"
                applicationId spec.applicationId
                // app_name + title_activity_main are generated here per flavor, so
                // they are NOT in src/main/res/values/strings.xml (a duplicate there
                // would fail the resource merge).
                resValue "string", "app_name", spec.appName
                resValue "string", "title_activity_main", spec.appName
                manifestPlaceholders.DEEP_LINK_HOST = spec.deepLinkHost
                if (spec.versionCode) versionCode spec.versionCode as int
                if (spec.versionName) versionName spec.versionName
                // Generated for EVERY flavor so the shared MainActivity can read
                // them; flavors without panelMode get false / 0 (admin unchanged).
                resValue "bool", "panel_mode", spec.panelMode ? "true" : "false"
                resValue "integer", "panel_min_webview_major", "${spec.minWebViewMajor}"
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase Cloud Messaging for push notifications (matches the learner app).
    // The @capacitor-firebase/messaging plugin needs these native libs present.
    implementation platform('com.google.firebase:firebase-bom:33.2.0')
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'

// --- Per-flavor Firebase config (data-driven) -------------------------------
// Paste each app's real google-services.json (from the Firebase console) into
//   android/app/GoogleServiceConfigs/<key>/google-services.json
// At configure time we copy it into that flavor's source set
//   android/app/src/<flavor>/google-services.json
// so the google-services plugin resolves it per flavor automatically — the same
// per-flavor model the learner app uses. The copied src/<flavor>/google-services.json
// is git-ignored (generated); GoogleServiceConfigs/<key>/ is the source of truth.
flavorSpecs.each { spec ->
    def registrySrc = file("GoogleServiceConfigs/${spec.key}/google-services.json")
    if (registrySrc.exists()) {
        copy {
            from registrySrc
            into file("src/${spec.flavorName}")
        }
    } else {
        logger.warn("No google-services.json for flavor '${spec.key}' at ${registrySrc} — " +
            "push notifications will be disabled for that build.")
    }
}
apply plugin: 'com.google.gms.google-services'
// A flavor whose Firebase app is not registered yet (no google-services.json)
// still builds — without push — instead of failing processXxxGoogleServices.
googleServices {
    missingGoogleServicesStrategy = com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy.WARN
}

// --- Synced-assets guard -----------------------------------------------------
// `cap sync android` writes ONE flavor's web bundle + capacitor.config.json into
// the SHARED main source set (src/main/assets), so the last sync wins for every
// Gradle flavor. Fail any build whose synced appId differs from the variant's
// applicationId, so the admin APK can never ship the classroom bundle (or the
// reverse). Missing config → warning only (fresh checkout before any sync).
// Strict only when the requested Gradle tasks NAME the variant's flavor
// (assembleVacademyClassroomDebug, cap run --flavor=…, Android Studio's selected
// variant). Flavorless aggregate tasks (assembleDebug, build, lint, test, and the
// unflavored `cap run android`) build every flavor, and only the synced one can
// match, so for the others they WARN instead of failing (review finding REG-2).
// Those aggregate tasks therefore verify only the synced flavor's APK.
android.applicationVariants.all { v ->
    def guard = tasks.register("verify${v.name.capitalize()}CapConfig") {
        group = 'verification'
        description = "Checks that the synced capacitor.config.json belongs to ${v.applicationId}."
        def configFile = file('src/main/assets/capacitor.config.json')
        def expectedId = v.applicationId
        def variantName = v.name
        def flavorKey = (v.flavorName ?: '').toLowerCase()
        def requested = flavorKey && gradle.startParameter.taskNames.any { it.toLowerCase().contains(flavorKey) }
        doLast {
            if (!configFile.exists()) {
                logger.warn("capacitor.config.json missing — run cap sync for the ${variantName} flavor")
                return
            }
            def syncedId = new JsonSlurper().parse(configFile).appId
            if (syncedId != expectedId) {
                def message = "Synced web assets are for ${syncedId}, not ${expectedId}. " +
                    "Run VITE_CAP_FLAVOR=<flavor> cap sync android first."
                if (requested) throw new GradleException(message)
                logger.warn("WARNING: ${variantName}: ${message} (not failing: this flavor was not " +
                    "requested by name, so its APK must not be shipped from this build)")
                return
            }
            logger.lifecycle("Synced capacitor.config.json appId ${syncedId} matches ${variantName}.")
        }
    }
    v.preBuildProvider.configure { dependsOn guard }
}
