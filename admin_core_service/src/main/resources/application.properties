spring.application.name=admin_core_service
server.port=8072

# When a multipart body is rejected (MaxUploadSizeExceededException), Tomcat has already
# committed the response while the client is still sending. Past max-swallow-size it resets
# the connection instead of draining the rest, so the browser sees a dropped connection and
# axios reports a bare "Network Error" -- the 413 and its reason are lost. 820MB matches the
# ingress proxy-body-size in vacademy_devops/vacademy-services/templates/ingress.yaml, which
# is the largest body that can reach us, so every rejection is now delivered intact.
server.tomcat.max-swallow-size=820MB
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
management.endpoints.web.base-path=/admin-core-service
management.endpoints.web.path-mapping.health=actuator/health
springdoc.api-docs.path=/admin_core_service/api-docs
springdoc.swagger-ui.path=/admin_core_service/swagger-ui.html
spring.profiles.active=stage
springdoc.api-docs.path=/admin-core-service/api-docs
springdoc.swagger-ui.path=/admin-core-service/swagger-ui.html
spring.profiles.active=${environment}


# ============ HikariCP Connection Pool Configuration ============
# These settings are CRITICAL for preventing inconsistent API latency

# Maximum number of connections in the pool
# Recommended: (2 * CPU_cores) + effective_spindle_count
# For 2 CPU pods with SSD: ~20-30 connections
spring.datasource.hikari.maximum-pool-size=8

# Minimum number of idle connections to maintain
# Helps prevent cold connection delays
spring.datasource.hikari.minimum-idle=2

# How long (ms) to wait for a connection from the pool
# 60 seconds is reasonable - fail fast rather than hang
spring.datasource.hikari.connection-timeout=60000

# How long a connection can be idle before being retired
spring.datasource.hikari.idle-timeout=300000

# Maximum lifetime of a connection (should be less than DB's wait_timeout)
spring.datasource.hikari.max-lifetime=600000

# Connection validation timeout
spring.datasource.hikari.validation-timeout=5000

# Keep connections alive (useful for firewalls/proxies that kill idle connections)
spring.datasource.hikari.keepalive-time=60000

# Log pool usage warnings
spring.datasource.hikari.leak-detection-threshold=60000

# Sentry Configuration
sentry.dsn=${SENTRY_DSN}
sentry.send-default-pii=true
sentry.logs.enabled=true
# Performance Monitoring. Lower-traffic admin operations; 0.5 keeps good fidelity
# at half the span cost. Errors are captured independently of this rate.
sentry.traces-sample-rate=0.5

# Database query monitoring
sentry.trace-propagation-targets=localhost,127.0.0.1
# Additional performance settings
sentry.in-app-includes=vacademy.io

# ============ White-Label / Cloudflare Configuration ============
# Set these env variables in your deployment environment:
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ZONE_ID
cloudflare.api.token=${CLOUDFLARE_API_TOKEN:}
cloudflare.zone.id=${CLOUDFLARE_ZONE_ID:}
cloudflare.learner.target=${CLOUDFLARE_LEARNER_TARGET:learner.vacademy.io}
cloudflare.admin.target=${CLOUDFLARE_ADMIN_TARGET:dash.vacademy.io}
cloudflare.teacher.target=${CLOUDFLARE_TEACHER_TARGET:teacher.vacademy.io}
vacademy.base.domain=${VACADEMY_BASE_DOMAIN:vacademy.io}
# Cloudflare Pages custom-domain provisioning. Required so a newly white-labeled
# host is actually SERVED by the SPA Pages project (a DNS CNAME alone is not
# enough — Pages only serves hostnames registered as custom domains on the
# project). API token must additionally carry the Pages:Edit scope.
# The <project> names are the Cloudflare Pages project names (i.e. <project>.pages.dev).
cloudflare.account.id=${CLOUDFLARE_ACCOUNT_ID:}
cloudflare.learner.pages-project=${CLOUDFLARE_LEARNER_PAGES_PROJECT:}
cloudflare.admin.pages-project=${CLOUDFLARE_ADMIN_PAGES_PROJECT:}

# ============ Ad Platform Integration (Meta Lead Ads + Google Lead Forms) ============
# Meta Developer App credentials
meta.app.id=${META_APP_ID:}
meta.app.secret=${META_APP_SECRET:}

# Meta webhook verify token — set a strong random string, same value registered in Meta App Dashboard
meta.webhook.verify.token=${META_WEBHOOK_VERIFY_TOKEN:}

# OAuth redirect URI — must match the URI registered in Meta App > Facebook Login > Valid OAuth Redirect URIs
meta.oauth.redirect.uri=${META_OAUTH_REDIRECT_URI:https://backend-stage.vacademy.io/admin-core-service/v1/oauth/meta/callback}

# Facebook Login for Business Configuration ID. When set, the OAuth dialog uses this
# configuration (which defines the requested permissions + the Page-asset selection
# step) instead of a raw scope list. Required for regular (non-app-role) users to
# grant Page access AND for the app to enumerate business-owned Pages (via the token's
# granular_scopes). Create it under: Meta App > Facebook Login for Business >
# Configurations. Empty = legacy scope-based flow.
meta.login.config.id=${META_LOGIN_CONFIG_ID:}
# Master switch for the config-based (Path 2 / Login for Business) flow. Set false to
# revert to the classic scope flow (Path 1) WITHOUT removing the config id above —
# e.g. while pages_manage_ads App Review is pending. Flip back to true to re-enable
# Path 2. Default true (config used whenever config.id is present).
meta.login.config.enabled=${META_LOGIN_CONFIG_ENABLED:true}

# After Meta OAuth callback succeeds, the browser is redirected here with ?session_key=UUID
# Set to the admin dashboard integrations page path
# The callback redirects browser here with ?session_key=UUID appended.
# Default points to the Settings → Ad Integrations tab.
meta.oauth.frontend.callback.url=${META_OAUTH_FRONTEND_CALLBACK_URL:https://dash.vacademy.io/settings?selectedTab=integrations}

# White-label custom domains: the callback sends the browser back to the SAME
# origin that started OAuth (captured at /initiate), so clients on their own domain
# don't get bounced to dash.vacademy.io and lose their session. The origin is
# validated against (1) the institute's hosts in institute_domain_routing, (2) the
# default callback host, and (3) these comma-separated suffixes. Anything else
# falls back to the default callback URL (no open-redirect, no regression).
meta.oauth.allowed.frontend.origin.suffixes=${META_OAUTH_ALLOWED_FRONTEND_ORIGIN_SUFFIXES:.vacademy.io}

# Passive connector health monitor (MetaConnectorMonitorJob): daily sweep that
# raises a Sentry WARNING (→ Slack/email) for any Meta connector not delivering
# leads (e.g. page subscribe failed because the connecting account lacks Full
# control). Cron: second minute hour day-of-month month day-of-week.
meta.connector.monitor.enabled=${META_CONNECTOR_MONITOR_ENABLED:false}
meta.connector.monitor.cron=${META_CONNECTOR_MONITOR_CRON:0 30 2 * * ?}

# AES-256-GCM key for encrypting OAuth tokens at rest.
# Generate: openssl rand -base64 32
# Store as GitHub Actions secret OAUTH_TOKEN_ENCRYPTION_KEY
oauth.token.encryption.key=${OAUTH_TOKEN_ENCRYPTION_KEY:}

# Meta token refresh job cron (default: daily at 02:00 UTC)
meta.token.refresh.cron=${META_TOKEN_REFRESH_CRON:0 0 2 * * ?}

# ── Meta Lead POLLING (MetaLeadPollingJob) ──────────────────────────────────
# PULL fallback for the webhook PUSH. Keeps delivering leads for pages where Meta
# blocks realtime (CRM access revoked in Lead Access Manager) — polling authorizes
# off the stored Page token, not the CRM push assignment. Reuses the webhook's
# ingest pipeline, so it dedups safely alongside realtime. Enabled by default so
# it backstops every Meta connector; per-connector opt-out via polling_enabled.
meta.lead.polling.enabled=${META_LEAD_POLLING_ENABLED:true}
# Every 10 minutes. Drop to '0 */5 * * * ?' for faster follow-up (rate limits are
# nowhere near a concern: 200 * 24 * (leads in last 90d) calls/page/day).
meta.lead.polling.cron=${META_LEAD_POLLING_CRON:0 */10 * * * ?}
# Re-scan window subtracted from the cursor so boundary/clock-skew leads aren't missed.
meta.lead.polling.overlap.minutes=${META_LEAD_POLLING_OVERLAP_MINUTES:5}
# First-run lookback for a never-polled connector — going-forward capture, NOT a
# 90-day history import (which would mass-fire follow-up workflows). Use the manual
# per-connector poll endpoint to backfill real history.
meta.lead.polling.initial.lookback.minutes=${META_LEAD_POLLING_INITIAL_LOOKBACK_MINUTES:60}
# Hard ceiling on how far back ANY recurring poll looks, even with a stale cursor (a
# paused/re-activated connector weeks behind). Bounds the window so it always drains
# within the page cap and can't trigger a mass catch-up + workflow storm; longer gaps
# are recovered via the manual /poll backfill. Default 6h.
meta.lead.polling.max.lookback.minutes=${META_LEAD_POLLING_MAX_LOOKBACK_MINUTES:360}
# Max paging.next follows per connector per scheduled poll (×100 leads/page); the rest
# arrive next tick. Sized so a clamped window (<= max.lookback) drains in one run.
meta.lead.polling.max.pages=${META_LEAD_POLLING_MAX_PAGES:50}

# ============ Zoom "General app" (Connect-with-Zoom OAuth + Meeting SDK) ============
# ONE app's Client ID + Secret serve BOTH the OAuth handshake and SDK signing — set just these
# two. (Connect-with-Zoom only returns each institute's per-user refresh token, stored per
# account; the app's own client id/secret can't come from OAuth and must be configured here.)
# Required Zoom app scopes: meeting:write, user:read, recording:read (user-managed → userId=me).
zoom.app.client-id=${ZOOM_APP_CLIENT_ID:}
zoom.app.client-secret=${ZOOM_APP_CLIENT_SECRET:}

# OAuth redirect URI — MUST match the value registered in the Zoom app (OAuth Redirect URL +
# allow-list). Defaults are fine for stage; override per environment.
zoom.oauth.redirect.uri=${ZOOM_OAUTH_REDIRECT_URI:https://backend-stage.vacademy.io/admin-core-service/live-sessions/provider/zoom/oauth/callback}
# Where the browser lands after the callback (admin Settings → Live Session).
zoom.oauth.frontend.callback.url=${ZOOM_OAUTH_FRONTEND_CALLBACK_URL:https://dash.vacademy.io/settings}

# OPTIONAL: only set these to point SDK signing at a DIFFERENT app than zoom.app.* (rare).
# Resolution order for SDK signing: per-account SDK creds → zoom.sdk.* → zoom.app.*.
zoom.sdk.client-id=${ZOOM_SDK_CLIENT_ID:}
zoom.sdk.client-secret=${ZOOM_SDK_CLIENT_SECRET:}
# Host-only / same-account caveat for platform SDK signing: see docs/zoomintegration/zoom-onboarding-design.md

# ============ Google Workspace (Connect Google Workspace OAuth + Meet REST API) ============
# ONE shared Google Cloud OAuth app (Web application) serves every institute via per-tenant
# OAuth — set the client id/secret here. Each institute's per-user refresh token is stored per
# connected account (AES-encrypted). Sensitive scopes: meetings.space.created,
# meetings.space.readonly (+ openid email to read the organizer's address). Setup steps:
# docs/googlemeetintegration/google-cloud-setup.md.
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}

# Cashfree SecureID (Verification Suite) — platform-level creds for the DigiLocker KYC step
# in open sub-org registration. Secret also keys the incoming KYC webhook signature.
cashfree.secureid.client-id=${CASHFREE_SECUREID_CLIENT_ID:}
cashfree.secureid.client-secret=${CASHFREE_SECUREID_CLIENT_SECRET:}
cashfree.secureid.base-url=${CASHFREE_SECUREID_BASE_URL:https://api.cashfree.com/verification}
# OAuth redirect URI — MUST exactly match a redirect URI registered on the OAuth client.
# Local dev: override with http://localhost:8072/admin-core-service/live-sessions/provider/google/oauth/callback
google.oauth.redirect.uri=${GOOGLE_OAUTH_REDIRECT_URI:https://backend-stage.vacademy.io/admin-core-service/live-sessions/provider/google/oauth/callback}
# Where the browser lands after the callback (admin Settings → Live Session).
google.oauth.frontend.callback.url=${GOOGLE_OAUTH_FRONTEND_CALLBACK_URL:https://dash.vacademy.io/settings}
# Space-separated OAuth scopes requested at consent.
google.oauth.scopes=${GOOGLE_OAUTH_SCOPES:openid email https://www.googleapis.com/auth/meetings.space.created https://www.googleapis.com/auth/meetings.space.readonly https://www.googleapis.com/auth/calendar.events}
# Phase 4 — recording polling (source of truth). Hourly at :27 to avoid colliding with Zoom/BBB jobs.
google.recording.sync.cron=${GOOGLE_RECORDING_SYNC_CRON:0 27 * * * ?}
# OPTIONAL push-notification layer (latency optimization over polling). Set a Cloud Pub/Sub topic
# (projects/PROJECT/topics/TOPIC) to have Meet recording/conference events pushed to
# /…/meeting/google-meet-callback. Blank ⇒ Events API off, hourly poll only. Requires a Pub/Sub
# push subscription + the Workspace Events service agent granted Pub/Sub Publisher on the topic.
google.events.pubsub-topic=${GOOGLE_EVENTS_PUBSUB_TOPIC:}
# Optional shared secret appended to the Pub/Sub push URL as ?token=… (defense-in-depth).
google.events.push-token=${GOOGLE_EVENTS_PUSH_TOKEN:}

# ── Airtel IQ (Vonage VBC) CCR/CDR → S3 import ──────────────────────────────
# Airtel exports recordings (Rec/<uuid>.mp3 + _metadata.csv) and per-call CDRs
# (Cdr/<uuid>.json) to an S3 bucket we own. The importer (scheduler → staging
# table airtel_call_import) is OFF by default — enable per-env once the bucket
# is live. Creds: explicit keys, else the deployment's default chain (s3admin).
telephony.airtel.s3.enabled=${TELEPHONY_AIRTEL_S3_ENABLED:true}
telephony.airtel.s3.bucket=${TELEPHONY_AIRTEL_S3_BUCKET:vacademy-airtel-ccr}
telephony.airtel.s3.region=${TELEPHONY_AIRTEL_S3_REGION:us-east-1}
telephony.airtel.s3.access-key=${TELEPHONY_AIRTEL_S3_ACCESS_KEY:}
telephony.airtel.s3.secret-key=${TELEPHONY_AIRTEL_S3_SECRET_KEY:}
telephony.airtel.s3.lookback-days=${TELEPHONY_AIRTEL_S3_LOOKBACK_DAYS:2}
telephony.airtel.import.poll-ms=${TELEPHONY_AIRTEL_IMPORT_POLL_MS:120000}
telephony.airtel.import.initial-delay-ms=${TELEPHONY_AIRTEL_IMPORT_INITIAL_DELAY_MS:60000}
telephony.airtel.import.max-per-run=${TELEPHONY_AIRTEL_IMPORT_MAX_PER_RUN:500}
spring.task.scheduling.pool.size=4
# ── AI call queue ────────────────────────────────────────────────────────────
# Every AI dial (workflow node, bulk campaign, manual click) is queued in
# ai_call_queue and placed by AiCallQueueDrainJob, which is the only dialler and
# therefore the only place the fleet-wide concurrency limit has to be enforced.
#
# HOW MANY calls may run at once is NOT set here — it is the sum of
# ai_voice_box.max_concurrent, managed at runtime through
# /admin-core-service/super-admin/v1/ai-queue/capacity so adding a box needs no
# redeploy. The rest of the knobs live in app_config for the same reason.
#
# false = ROLLBACK to the pre-queue behaviour: the CALL_AI node's in-memory paced
# executor, the bulk campaign's per-campaign sliding window, and a synchronous
# manual click. That path has no fleet-wide limit; it exists to get out of trouble,
# not as a supported mode.
telephony.ai.queue.enabled=${TELEPHONY_AI_QUEUE_ENABLED:true}
# How often the drainer looks for a free line. Cheap: the candidate query is bounded
# by (lanes with work x fleet capacity) rows however deep the queue is.
telephony.ai.queue.drain-delay-ms=${TELEPHONY_AI_QUEUE_DRAIN_MS:2000}
# How often each voice box is asked /voice-bot-service/health. A box that stops
# answering is marked DOWN and its slots leave the fleet until it recovers.
telephony.ai.queue.health-poll-ms=${TELEPHONY_AI_QUEUE_HEALTH_MS:30000}

# Vacademy AI Agent — public HTTPS base of the dedicated voice-bot service
# (ap-south-1). Empty = the VACADEMY_AI provider refuses to dial with a clear
# error. The bot authenticates back via InternalAuthFilter (client_secret_key
# row 'voice_bot_service') and posts reports to /webhook/ai-voice/VACADEMY_AI.
telephony.vacademy-ai.bot-base-url=${VOICE_BOT_BASE_URL:}
# Shared secret for the voice bot's INTERNAL routes (currently only the speech-cache
# warm). Same value the bot already holds as VOICE_BOT_CLIENT_SECRET. Blank is a
# supported state: AiAgentSpeechWarmer simply does not warm, and calls learn their
# fixed lines from the first call instead — nothing else is affected.
telephony.vacademy-ai.client-secret=${VOICE_BOT_CLIENT_SECRET:}
# Base that serves IVR prompt audio (/tts/{sha1}.mp3) to Plivo AND that the prompt
# warmer pre-synthesizes into. MUST be a single instance with a persistent cache:
# the clean play URL only serves a pre-warmed file (404 otherwise), so if warm and
# playback are load-balanced to different replicas with per-pod caches the caller
# hears silence. Defaults to the single-instance voice-bot (VOICE_BOT_BASE_URL, the
# same box the AI agent runs on with a durable tts_cache volume); do NOT point this
# at a multi-replica deployment without a shared cache. Falls back to callback-base
# only if neither is set.
telephony.ivr.tts-base-url=${IVR_TTS_BASE_URL:${VOICE_BOT_BASE_URL:}}

# ---------------------------------------------------------------------------
# Live activity feed (User Live Events)
# ---------------------------------------------------------------------------
live-activity.enabled=true

# Signing key for the SSE stream token. Falls back to deriving one from the shared JWT
# secret so tokens minted on one replica verify on another with no config. Set this.
live-activity.token-secret=${LIVE_ACTIVITY_TOKEN_SECRET:}

# Set explicitly rather than left to code defaults -- the telephony equivalents
# (telephony.sse.keepalive-seconds / max-stream-seconds) appear in no properties file, so
# their :15 / :600 fallbacks are silently what runs in production.
live-activity.sse.keepalive-seconds=15
live-activity.sse.max-stream-seconds=1800
live-activity.sse.token-ttl-seconds=60

live-activity.backfill.size=100

# Cross-replica delivery. The replica that produces an event publishes to its own
# subscribers immediately; this is only how OTHER replicas find out. It ticks solely while
# that replica has someone watching, so a closed feed costs zero queries.
live-activity.poll.interval-millis=300
live-activity.poll.overlap-millis=2000

# Retention: 90d default with per-category overrides. Call transitions dominate volume and
# go stale fastest; payments and enrolments are the rows worth keeping.
live-activity.retention.days=90
live-activity.retention.batch-size=5000
live-activity.retention.days-by-category.CALL=7
live-activity.retention.days-by-category.COUNSELLOR=30
telephony.billing.pulse-seconds=${TELEPHONY_BILLING_PULSE_SECONDS:30}
