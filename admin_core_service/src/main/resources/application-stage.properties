spring.application.name=admin_core_service
## Database Connection
spring.datasource.url=${ADMIN_CORE_SERVICE_DB_URL}
spring.datasource.read.url=${ADMIN_CORE_SERVICE_READ_DB_URL:${ADMIN_CORE_SERVICE_DB_URL}}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=${DB_USERNAME}
# Write pool. Sized against the pgbouncer-side limit, NOT picked freely: pgbouncer
# gives admin_core_service pool_size=40, and the deployment runs 4 replicas, so
# 4 x 10 = 40 lands exactly on that ceiling. Raising this past 10 without also
# raising pgbouncer just moves the queue one layer down and starves the reserve.
#
# It was 5, which is what froze the dashboard: Tomcat defaults to 200 request
# threads, so 200 threads contended for 5 connections and each one blocked up to
# hikari.connection-timeout (60s, set in application.properties) waiting for one.
# A single dashboard load fires ~165 requests and saturated the pool on its own --
# the browser showed every request as "Pending" because the threads were parked in
# Hikari's queue and no response was ever written.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# Read pool is left at the Hikari default (10) on purpose: pgbouncer only allows
# admin_core_service_read pool_size=5, so raising this needs a pgbouncer change
# (and a pgbouncer restart) to have any effect.
## Security
application.my.username=${APP_USERNAME}
application.my.password=${APP_PASSWORD}
spring.mvc.dispatch-options-request=true
## auth.server.baseurl=http://localhost:8071
auth.server.baseurl=${AUTH_SERVER_BASE_URL}
notification.server.baseurl=${NOTIFICATION_SERVER_BASE_URL}
media.server.baseurl=${MEDIA_SERVER_BASE_URL}
media.service.baseurl=${MEDIA_SERVER_BASE_URL}
assessment.server.baseurl=${ASSESSMENT_SERVER_BASE_URL:https://backend-stage.vacademy.io}
community.server.baseurl=${COMMUNITY_SERVICE_BASE_URL:http://community-service:8073}
# SCORM zips routinely exceed 10MB. Keep in sync with the ingress proxy-body-size
# (820m) in vacademy_devops/vacademy-services/templates/ingress.yaml and with
# MAX_SCORM_BYTES in the admin dashboard -- nginx must admit at least what Spring
# accepts, or the rejection comes from nginx with no CORS headers and the browser
# only ever sees "Network Error". max-request-size carries the multipart envelope.
spring.servlet.multipart.max-file-size=800MB
spring.servlet.multipart.max-request-size=810MB
logging.level.org.springframework.security=DEBUG
cloud.front.url=${CLOUD_FRONT_URL}
## Logging
org.springframework.boot.actuate.health.Logger=OFF
logging.level.org.springframework.boot.actuate.health=OFF
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR


# This tells Flyway to accept an existing schema and create a baseline
spring.flyway.baseline-on-migrate=true

# This tells Flyway which version number to baseline to.
# It should match your first migration script (e.g., V1__Initial_schema.sql)
spring.flyway.baseline-version=1

# Allow out-of-order migrations and ignore missing ones
spring.flyway.out-of-order=true
spring.flyway.ignore-missing-migrations=true
spring.flyway.ignore-ignored-migrations=true
spring.flyway.validate-on-migrate=false
spring.flyway.connect-retries=5
spring.flyway.connect-retries-interval=10
default.learner.portal.url=https://learner.vacademy.io
default.learner.portal.enroll_invite_path=/learner-invitation-response
default.learner.portal.coupon_path=/coupon

# ============ JPA/Hibernate Performance Optimization ============
# Use READ_COMMITTED isolation (fastest for OLTP)
spring.jpa.properties.hibernate.connection.isolation=2

# Batch operations (critical for bulk inserts/updates)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Fetch size (reduces round trips for large result sets)
spring.jpa.properties.hibernate.jdbc.fetch_size=100

# Statement caching (reuse prepared statements)
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.generate_statistics=false

# Query optimization
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
# Set to false to avoid runtime exceptions; monitor logs for pagination warnings instead
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=false

# Connection release mode (release after transaction for pooling efficiency)
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

# ============ PostgreSQL-specific JDBC Optimizations ============
# Add to JDBC URL for better performance
# ?reWriteBatchedInserts=true&prepareThreshold=5&ApplicationName=admin_core_service

openrouter.api.key=${OPENROUTER_API_KEY}
# Direct gateway for models routed to it by the llm.model_routes platform setting (empty = OpenRouter only)
isoquant.api.key=${ISOQUANT_API_KEY:}

# Embedding Service Configuration
embedding.storage.path=${EMBEDDING_STORAGE_PATH:./embeddings}
api.docs.path=${API_DOCS_PATH:admin_core_service/admin_apis.md}

# Agent Configuration
tool.executor.base-url=${ADMIN_CORE_SERVICE_BASE_URL:http://localhost}

# Public backend URL for external callbacks (BBB server -> backend)
bbb.callback.base-url=${BBB_CALLBACK_BASE_URL:${ADMIN_CORE_SERVICE_BASE_URL:http://localhost}}



# AI Service URL for credit system
ai.service.url=${AI_SERVICE_BASE_URL:http://ai-service:8077}
# ai.service.url=${AI_SERVICE_BASE_URL:https://backend-stage.vacademy.io}
ai.service.internal-token=${AI_SERVICE_INTERNAL_TOKEN:}
# Public backend URL the transcription worker calls back into (must be reachable from ai-service)
transcription.callback.base-url=${TRANSCRIPTION_CALLBACK_BASE_URL:${ADMIN_CORE_SERVICE_BASE_URL:https://backend-stage.vacademy.io}}
transcription.callback.secret=${TRANSCRIPTION_CALLBACK_SECRET:}
# Watchdog reconciles rows whose worker callback was lost (network blip, worker
# restart, etc.). Polls ai-service status endpoint for stuck RUNNING rows.
transcription.reconciliation.enabled=${TRANSCRIPTION_RECONCILIATION_ENABLED:true}
transcription.reconciliation.poll-interval-ms=${TRANSCRIPTION_RECONCILIATION_POLL_INTERVAL_MS:300000}
transcription.reconciliation.initial-delay-ms=${TRANSCRIPTION_RECONCILIATION_INITIAL_DELAY_MS:60000}
transcription.reconciliation.stale-after-minutes=${TRANSCRIPTION_RECONCILIATION_STALE_MIN:15}
transcription.reconciliation.give-up-after-hours=${TRANSCRIPTION_RECONCILIATION_GIVE_UP_HOURS:6}

# ============ White-Label / Cloudflare Configuration ============
cloudflare.api.token=${CLOUDFLARE_API_TOKEN}
cloudflare.zone.id=${CLOUDFLARE_ZONE_ID}
cloudflare.learner.target=${CLOUDFLARE_LEARNER_TARGET:learner.vacademy.io}
cloudflare.admin.target=${CLOUDFLARE_ADMIN_TARGET:dash.vacademy.io}
cloudflare.teacher.target=${CLOUDFLARE_TEACHER_TARGET:teacher.vacademy.io}
vacademy.base.domain=${VACADEMY_BASE_DOMAIN:vacademy.io}
# Cloudflare Pages custom-domain provisioning (see application.properties for notes).
# API token must additionally carry the Pages:Edit scope.
cloudflare.account.id=${CLOUDFLARE_ACCOUNT_ID:}
cloudflare.learner.pages-project=${CLOUDFLARE_LEARNER_PAGES_PROJECT:}
cloudflare.admin.pages-project=${CLOUDFLARE_ADMIN_PAGES_PROJECT:}
# Telephony — public base URL Exotel can POST status callbacks to.
# Public webhook base — Exotel hits this for inbound flow URL + status callbacks.
# Must NOT have a leading space; Spring property reading preserves whitespace
# and downstream URL concat ends up with " https://..." which Exotel rejects.
telephony.webhook.callback-base=https://backend-stage.vacademy.io


