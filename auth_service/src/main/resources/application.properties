spring.application.name=auth_service
server.port=8071
management.endpoints.web.base-path=/auth-service
management.endpoints.web.path-mapping.health=actuator/health
springdoc.api-docs.path=/auth_service/api-docs
springdoc.swagger-ui.path=/auth_service/swagger-ui.html
spring.profiles.active=${environment}
springdoc.api-docs.path=/auth-service/api-docs
springdoc.swagger-ui.path=/auth-service/swagger-ui.html
spring.profiles.active=${environment}

# ============ HikariCP Connection Pool Configuration ============
# These settings are CRITICAL for preventing inconsistent API latency

# Maximum number of connections in the pool
# Auth service typically has lighter load, 15 should be enough
spring.datasource.hikari.maximum-pool-size=5

# Minimum number of idle connections to maintain
spring.datasource.hikari.minimum-idle=1

# How long (ms) to wait for a connection from the pool
# 60 seconds is reasonable - fail fast rather than hang
spring.datasource.hikari.connection-timeout=60000

# How long a connection can be idle before being retired
spring.datasource.hikari.idle-timeout=300000

# Maximum lifetime of a connection (should be less than DB's wait_timeout)
spring.datasource.hikari.max-lifetime=600000

# Connection validation timeout
spring.datasource.hikari.validation-timeout=5000

# Keep connections alive (useful for firewalls/proxies that kill idle connections)
spring.datasource.hikari.keepalive-time=60000

# Log pool usage warnings
spring.datasource.hikari.leak-detection-threshold=60000

# Sentry Configuration
sentry.dsn=${SENTRY_DSN}
sentry.send-default-pii=true

# Performance Monitoring. Auth validates tokens on nearly every platform request,
# so it is the single biggest span generator. 0.25 keeps statistically useful
# tracing at ~25% of the span cost. Errors are captured independently of this.
sentry.traces-sample-rate=0.25
# Enable performance monitoring for all integrations
sentry.enable-tracing=true
# Database query monitoring
sentry.trace-propagation-targets=localhost,127.0.0.1
# Additional performance settings
sentry.in-app-includes=vacademy.io

# ============ TRUSTED LOGIN (EMERGENCY) ============
# ⚠️ TEMPORARY: Enable only when SES email service is down
# TODO: Remove this configuration once email service is restored
# Security: Set to false (default) in production unless emergency
security.trusted-login.enabled=true

# ============ WHITE-LABEL OAUTH CLIENTS ============
# Encrypts institute_oauth_client secrets (a brand's own Google client, so Google's sign-in screen
# shows the brand's name). Same key as admin-core's OAuth tokens. Unset = feature off, every login
# uses the platform client above.
institute.oauth.client.encryption-key=${OAUTH_TOKEN_ENCRYPTION_KEY:}

# ============ VIMOTION INVITE-ONLY SIGNUP ============
# When true, /vim/onboarding requires a valid invite code at Step 0 before OTP.
# Flip without redeploying the FE — the wizard polls /v1/vimotion/config.
vimotion.invite-only.enabled=${VIMOTION_INVITE_ONLY:false}
# Position bump in the waitlist when a referee joins via someone's referral
# code (effective_position = position - referral_count * bump).
vimotion.waitlist.bump-per-referral=${VIMOTION_WAITLIST_BUMP:5}
# Institute id used as the sender context when emailing waitlist invitees.
# Pre-signup users have no institute yet — this lets the notification_service
# pick the right SMTP/from-address config for vimotion-branded mail.
vimotion.platform-institute-id=${VIMOTION_PLATFORM_INSTITUTE_ID:}
# Public origin used when constructing redemption deep-links in invite emails
# (e.g. https://app.vimotion.ai/vim/onboarding?code=…).
vimotion.public-app-url=${VIMOTION_PUBLIC_APP_URL:https://app.vimotion.ai}
